    </div><div class="pie-form"><div></div><div class="der"><button class="btn btn-verde" onclick="accionIni()">Registrar carga inicial</button></div></div></div>`
    + `<div class="panel"><div class="panel-h">Cargas iniciales registradas</div><div class="panel-b">${grid('gIni', colsKardex(false), DB.movs.filter(m => m.tipo === 'INI').slice().reverse(), { pag: 15 })}</div></div>`;
  let elegido = null;
  bindAC('iniIt', q => { q = q.toLowerCase(); return q.length < 2 ? [] : DB.catalogo.filter(i => (i.cod + ' ' + i.desc + ' ' + i.serial).toLowerCase().includes(q)).slice(0, 20).map(i => ({ val: i, html: `<b>${esc(i.cod)}</b> · ${esc(i.desc)}<small>${esc(i.serial || '')}</small>` })); },
    i => { elegido = i; window.__iniItem = i; $('iniSel').value = `${i.cod} · ${i.desc}${i.serial ? ' · ' + i.serial : ''}`; $('iniIt').value = ''; if (i.serial) $('iniCant').value = 1; });
}
function accionIni() {
  run(() => { const it = window.__iniItem; if (!it) throw new Error('Seleccione un ítem.'); const alm = $('iniAlm').value, cant = Number($('iniCant').value);
    if (it.serial && (cant !== 1 || DB.almacenes.some(a => DB.exi[a.c] && DB.exi[a.c][it.id] && totalExi(DB.exi[a.c][it.id]) > 0))) throw new Error('El ítem con serial ya tiene existencia o la cantidad no es 1.');
    cargaInicial(alm, it.id, cant, $('iniEst').value === '1'); bit('CARGA INICIAL', `${alm} · ${it.cod} x${cant}`); guardar(); toast('Carga inicial registrada.', 'ok'); window.__iniItem = null; refrescar(); });
}
VISTAS.aConf = () => {
  $('area').innerHTML = cab('Configuración', 'Datos que aparecen en el encabezado de los vales y plazo de aceptación de transferencias.')
    + `<div class="form-reg"><div class="f3">${campo('Razón social', `<input id="cfE" value="${esc(DB.config.empresa)}">`)}${campo('Dirección', `<input id="cfD" value="${esc(DB.config.direccion)}">`)}${campo('RIF', `<input id="cfR" value="${esc(DB.config.rif)}">`)}
      ${campo('Plazo para aceptar transferencias (horas)', `<input id="cfP" type="number" min="1" value="${DB.config.plazoHoras}">`)}${campo('Alertar cuando falten (minutos)', `<input id="cfA" type="number" min="5" value="${alertaMin()}">`)}</div>
      <div class="pie-form"><div class="totales">El nuevo plazo aplica a las transferencias creadas desde este momento.</div><div class="der"><button class="btn btn-verde" onclick="run(()=>{const p=Number($('cfP').value);if(!(p>0))throw new Error('Plazo inválido.');Object.assign(DB.config,{empresa:$('cfE').value.trim(),direccion:$('cfD').value.trim(),rif:$('cfR').value.trim(),plazoHoras:p,alertaMin:Math.max(5,Number($('cfA').value)||30)});bit('CONFIGURACIÓN MODIFICADA','');guardar();toast('Configuración guardada.','ok')})">Guardar</button></div></div></div>`;
};
VISTAS.aBit = () => {
  $('area').innerHTML = cab('Bitácora', 'Registro de accesos y acciones críticas.', botonesExport('gBit', 'Bitácora'))
    + `<div class="fila-filtros">${buscador('gBit')}</div>` + grid('gBit', [{ t: 'Fecha y hora', v: r => fFH(r.fecha), s: r => r.fecha }, { t: 'Usuario', k: 'usr' }, { t: 'Acción', k: 'acc' }, { t: 'Detalle', k: 'det' }], DB.bit.slice().reverse(), { pag: 25 });
};
VISTAS.aResp = () => {
  $('area').innerHTML = cab('Respaldos y demostración', 'En la versión definitiva el respaldo de la base de datos es automático y diario.')
    + `<div class="panel"><div class="panel-b"><div class="barra-btn" style="justify-content:flex-start;box-shadow:none">
      <button class="btn-sip" onclick="descargarRespaldo()">Respaldar ahora (descargar)</button>
      <button class="btn-sip" onclick="restaurarRespaldo()">Restaurar un respaldo</button>
      <button class="btn-sip" onclick="confirmar('Se borrarán todos los datos de esta demostración y se cargarán de nuevo los datos de ejemplo. ¿Continuar?',()=>{try{localStorage.removeItem(LS_KEY)}catch(e){};DB=semilla();guardar();cerrarSesion();toast('Demostración restablecida.','ok')},'Restablecer')">Restablecer datos de demostración</button>
    </div></div></div>`;
};
function descargarRespaldo() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)], { type: 'application/json' })); a.download = 'respaldo_trazabilidad_' + hoy() + '.json'; a.click(); bit('RESPALDO DESCARGADO', ''); guardar(); }
function restaurarRespaldo() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
  inp.onchange = () => { const rd = new FileReader(); rd.onload = e => run(() => { const d = JSON.parse(e.target.result); if (!d.vales || !d.usuarios) throw new Error('El archivo no es un respaldo válido.'); confirmar('Se reemplazarán todos los datos actuales por los del respaldo. ¿Continuar?', () => { DB = d; guardar(); cerrarSesion(); toast('Respaldo restaurado.', 'ok'); }, 'Restaurar'); }); rd.readAsText(inp.files[0]); };
  inp.click();
}

/* =====================================================================
   IMPRESIÓN DEL VALE (todos los movimientos)
   ===================================================================== */
function imprimirVale(n) {
  if (!n) return toast('El vale aún no tiene número asignado.', 'err');
  const v = valeDe(n); if (!v) return toast('Vale no encontrado.', 'err');
  const t = v.tipo, esTrf = t === 'TRF', esEnt = t === 'ENT';

  if (!puedeImprimir()) return toast('La impresión del vale corresponde al personal del almacén. El supervisor solo aprueba.', 'err');

  const reimpresion = (v.impresiones || 0) > 0;
  v.impresiones = (v.impresiones || 0) + 1;
  bit(reimpresion ? 'REIMPRESIÓN DE VALE' : 'IMPRESIÓN DE VALE', n); guardar();

  const izq = esEnt
    ? `<div><b>Realizado por:</b> ${esc(v.realizadoPor.nombre)}</div><div><b>Cédula:</b> ${esc(v.realizadoPor.cedula)}</div><div><b>Cargo:</b> ${esc(v.realizadoPor.cargo)}</div>`
    : esTrf
    ? `<div><b>Realizado por:</b> ${esc(v.realizadoPor.nombre)} (${esc(v.realizadoPor.cargo)})</div><div><b>Despachado por:</b> ${esc(v.despacha || v.realizadoPor.nombre)}</div>${v.resp ? `<div><b>Responsable / Custodio:</b> ${esc(v.resp.nombre)} (C.I. ${esc(v.resp.cedula)})</div><div><b>Cargo:</b> ${esc(v.resp.cargo)}</div>` : ''}`
    : `<div><b>Responsable:</b> ${esc(v.resp ? v.resp.nombre : '')}</div><div><b>Cédula:</b> ${esc(v.resp ? v.resp.cedula : '')}</div><div><b>Cargo / Supervisor:</b> ${esc(v.resp ? v.resp.cargo : '')} / ${esc(v.sup)}</div><div><b>Cuenta Auxiliar:</b> ${esc(v.cuenta)}</div>`;

  const der = esEnt
    ? `<div><b>Almacén:</b> ${esc(almNombre(v.origen).replace('Almacén ', '').toUpperCase())}</div>`
    : esTrf
    ? `<div><b>Origen → Destino:</b> ${esc(almNombre(v.origen).replace('Almacén ', '').toUpperCase())} → ${esc(almNombre(v.destino).replace('Almacén ', '').toUpperCase())}</div>${v.proyecto ? `<div><b>Proyecto / OT:</b> ${esc(v.proyecto)}</div>` : ''}${v.cuenta ? `<div><b>Cuenta auxiliar:</b> ${esc(v.cuenta)}</div>` : ''}${v.sup ? `<div><b>Supervisor autoriza:</b> ${esc(v.sup)}</div>` : ''}<div><b>Estatus de recepción:</b> ${esc(v.estatus)}</div>${v.procesadoEn ? `<div><b>Procesada por:</b> ${esc(v.procesadoPor.nombre)} · ${fFH(v.procesadoEn)}</div>` : `<div><b>Plazo para aceptar:</b> hasta ${fFH(v.vence)}</div>`}</div>`
    : `<div><b>Proyecto / OT:</b> ${esc(v.proyecto)}</div><div><b>Origen → Destino:</b> ${esc(almNombre(v.origen).replace('Almacén ', '').toUpperCase())} → ${esc(almNombre(v.destino).replace('Almacén ', '').toUpperCase())}</div><div><b>Tipo A / Aprobación:</b> ${v.lineas.some(l => item(l.id).tipoA) ? 'SI · N° ' + esc(v.aprobGer || '—') : 'NO'}</div>${v.ref ? `<div><b>Vale de referencia:</b> ${esc(v.ref)}</div>` : ''}`;

  let extra = '';
  if (t === 'PRH') extra = `<b>Fecha requerida:</b> ${fF(v.fechaReq)} &nbsp;·&nbsp; <b>Fecha de devolución:</b> ${fF(v.fechaDev)}${v.extensiones ? ` &nbsp;·&nbsp; <b>Extensiones:</b> ${v.extensiones}` : ''}`;
  if (t === 'ASI') extra = `<b>Fecha de asignación:</b> ${fF(v.fechaAsig)} &nbsp;·&nbsp; <b>Tipo de asignación:</b> tiempo indefinido${v.lineas.some(l => l.consumo) ? ' &nbsp;·&nbsp; El EPP se entrega como dotación' : ''}`;
  if (t === 'DEV') extra = `<b>Vale de referencia:</b> ${esc(v.ref)} &nbsp;·&nbsp; <b>Recibido por:</b> ${esc(v.extra.recibe)}`;
  if (t === 'DAN') extra = `<b>Descripción del daño:</b> ${esc(v.extra.detalle)}<br><b>¿Mal uso o negligencia?:</b> ${esc(v.extra.malUso)} &nbsp;·&nbsp; <b>Dictamen:</b> ${esc(v.extra.dictamen)}`;
  if (t === 'EXT') extra = `<b>Descripción de la incidencia:</b> ${esc(v.extra.detalle)}`;
  if (t === 'PLZ') extra = `<b>Vale de referencia:</b> ${esc(v.ref)} &nbsp;·&nbsp; <b>Fecha anterior:</b> ${fF(v.extra.anterior)} &nbsp;·&nbsp; <b>Nueva fecha:</b> ${fF(v.extra.nueva)}${v.extra.motivo ? '<br><b>Motivo:</b> ' + esc(v.extra.motivo) : ''}`;
  if (v.obs) extra += (extra ? '<br>' : '') + `<b>Observación:</b> ${esc(v.obs)}`;

  const firmas = esEnt ? [['Entrega', 'Firma', ''], ['Recibe (almacenista)', 'Firma y Sello', v.realizadoPor.nombre], ['Supervisor', 'Firma y Sello', '']]
    : esTrf
    ? [['Despacha (' + almNombre(v.origen).replace('Almacén ', '') + ')', 'Firma y Sello', v.despacha || v.realizadoPor.nombre], ['Recibe (' + almNombre(v.destino).replace('Almacén ', '') + ')', 'Firma y Sello', v.estatus === 'RECIBIDA' ? v.procesadoPor.nombre : ''], ['Supervisor Autoriza', 'Firma y Sello', v.sup || '']]
    : [['Responsable / Recibe', 'Firma y Cédula', ''], ['Almacenista / Despacha', 'Firma y Sello', ''], ['Supervisor Autoriza', 'Firma y Sello', v.aprobadoPor ? v.aprobadoPor.nombre : '']];

  const totPiezasNormal = (v.lineas || []).reduce((a, l) => a + (l.cant || 1), 0);

  const tablaHtml = `<table class="vale-items">
        <thead>
          <tr>
            <th>Código</th><th>Descripción</th><th>Marca / Modelo</th><th>Serial</th><th>Categoría</th><th>Condición</th><th class="c">Cantidad</th>
          </tr>
        </thead>
        <tbody>
          ${v.lineas.map(l => `<tr>
            <td>${esc(l.cod)}</td>
            <td><b>${esc(l.desc)}</b></td>
            <td>${esc(l.marca || '—')} / ${esc(l.modelo || '—')}</td>
            <td>${esc(l.serial || '—')}</td>
            <td>${esc(l.cat || '—')}</td>
            <td>${esc(l.cond || 'ÓPTIMO')}</td>
            <td class="c"><b>${l.cant || 1}</b></td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr style="font-weight:800;background:#F8FAFC">
            <td colspan="6" style="text-align:right">Total de piezas:</td>
            <td class="c"><b>${totPiezasNormal}</b></td>
          </tr>
        </tfoot>
      </table>`;

  $('hojaImpresion').innerHTML = `
    <div class="vale-enc">
      <img src="${LOGO}" alt="TIMACA">
      <div class="vale-emp"><b>${esc(DB.config.empresa)}</b>${esc(DB.config.direccion)}<br>${esc(DB.config.rif)}</div>
      <div class="vale-tit"><div class="t">${esc(TIPOS[t].titulo)}</div>Fecha: ${fF(v.fecha)}<br><span class="n">N° Vale: ${esc(v.num)}</span></div>
    </div>
    <div class="vale-datos"><div>${izq}</div><div>${der}</div></div>
    ${tablaHtml}
    ${extra ? `<div class="vale-extra">${extra}</div>` : ''}
    <div class="vale-firmas">${firmas.map(f => `<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span>${f[2] ? `<span class="nom">${esc(f[2])}</span>` : ''}</div>`).join('')}</div>`;
  abrirImpresion();
}

/* =====================================================================
   AYUDA
   ===================================================================== */
function ayuda(k) {
  const t = {
    sol: 'Las solicitudes aplican solo a préstamos (tiempo definido, con fecha de devolución) y asignaciones (tiempo indefinido). Cree la solicitud, cargue el material y presione "Finalizar registro / movimiento". Mientras esté NO FINALIZADA puede editarla o eliminarla. Una vez finalizada, pasa a la bandeja del supervisor del almacén, quien la aprueba (verde) o la anula (rojo). Al aprobarse se genera el vale PRH- o ASI- para imprimir y firmar.',
    aprobar: 'Solo los supervisores con permiso de aprobación en este almacén pueden aceptar o anular. Nadie puede aprobar una solicitud que generó. Si la solicitud contiene ítems Tipo A, se pide el número de aprobación de Gerencia. Al aceptar, se descuentan las existencias y se genera el vale.',
    trf: `Central transfiere a los satélites y los satélites solo transfieren a Central (por ejemplo, para devolver cilindros vacíos). La transferencia no requiere aprobación: el material sale del almacén origen y queda pendiente de recepción. El almacén destino tiene ${DB.config.plazoHoras} horas para aceptarla o rechazarla con un motivo. Si no responde a tiempo, la transferencia vence y el material regresa automáticamente al almacén origen.`
  }[k];
  abrirModal('Ayuda', `<p class="ayuda-txt">${esc(t)}</p>`);
}

/* =====================================================================
   INICIO
   ===================================================================== */
function iniciar() {
  try {
    document.querySelectorAll('img[data-logo]').forEach(i => {
      if (!i.src || i.src.endsWith('/')) i.src = '/timaca-logo.png';
      i.onerror = () => { if (typeof LOGO !== 'undefined') i.src = LOGO; };
    });
  } catch (e) { }
  try { cargarDatos(); } catch (e) { console.error('Error cargarDatos:', e); }
  try { procesarVencimientos(); } catch (e) { console.error('Error procesarVencimientos:', e); }
  try { pintarUsuariosDemo(); } catch (e) { console.error('Error pintarUsuariosDemo:', e); }
  try { actualizarCampanaNotif(); } catch (e) { }
  // Revisión periódica de vencimientos (en el servidor: APScheduler)
  try { setInterval(tickCronos, 1000); } catch (e) { }
  try { setInterval(() => { if (procesarVencimientos() && S.u) { toast('Una transferencia venció y su material regresó al almacén de origen.'); pintarMenu(); } }, 60000); } catch (e) { }
  try { document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('vistaImpresion').style.display === 'block') cerrarImpresion(); else cerrarModal(); } }); } catch (e) { }
}
iniciar();

</script>
