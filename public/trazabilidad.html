const COL = { navy: '#020C54', azul: '#2563EB', verde: '#16A34A', ambar: '#D97706', rojo: '#DC2626', naranja: '#EA580C', morado: '#7C3AED', cian: '#0891B2', gris: '#94A3B8', rosa: '#DB2777', celeste: '#0284C7' };
const COL_TIPO = { PRH: COL.ambar, ASI: COL.azul, TRF: COL.navy, DEV: COL.verde, DAN: COL.rojo, EXT: COL.morado, PLZ: COL.cian, ENT: COL.celeste };
function niceMax(m) { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); const f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function corto(v) { const a = Math.abs(v); return a >= 1e6 ? num(v / 1e6, 1) + ' M' : a >= 1e4 ? num(v / 1e3, 0) + ' k' : a >= 1e3 ? num(v / 1e3, 1) + ' k' : num(v, v % 1 ? 1 : 0); }
function etiquetaSVG(t, x, y, max) {
  const pal = String(t).split(' '); const l1 = [], l2 = [];
  pal.forEach(p => ((l1.join(' ') + ' ' + p).trim().length <= (max || 12) && !l2.length ? l1 : l2).push(p));
  let s2 = l2.join(' '); if (s2.length > (max || 12) + 2) s2 = s2.slice(0, (max || 12)) + '…';
  return `<text x="${x}" y="${y}" text-anchor="middle" class="g-lbl"><tspan x="${x}" dy="0">${esc(l1.join(' '))}</tspan>${s2 ? `<tspan x="${x}" dy="15">${esc(s2)}</tspan>` : ''}</text>`;
}
/* Dona: datos = [{l, v, c}] */
function gDonut(datos, centro, sub, fmt) {
  fmt = fmt || (v => num(v));
  const tot = datos.reduce((a, d) => a + d.v, 0), R = 70, C = 2 * Math.PI * R; let acc = 0;
  const arcos = tot ? datos.filter(d => d.v > 0).map(d => {
    const len = d.v / tot * C;
    const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${d.c}" stroke-width="28" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></circle>`;
    acc += len; return s;
  }).join('') : `<circle r="${R}" cx="100" cy="100" fill="none" stroke="#E2E8F0" stroke-width="28"/>`;
  const c1 = String(centro);
  return `<div class="g-donut-wrap"><svg viewBox="0 0 200 200" class="g-donut" role="img" aria-label="${esc(sub)}">${arcos}
      <text x="100" y="${c1.length > 8 ? 101 : 104}" text-anchor="middle" class="g-c1 ${c1.length > 8 ? 'chico' : ''}">${esc(c1)}</text><text x="100" y="${c1.length > 8 ? 120 : 124}" text-anchor="middle" class="g-c2">${esc(sub)}</text></svg>
    <div class="g-leyenda">${datos.map(d => `<div class="g-ley"><span class="g-sw" style="background:${d.c}"></span><span>${esc(d.l)}</span><b>${esc(fmt(d.v))}</b><span class="g-pc">${tot ? num(d.v / tot * 100, 1) : '0'} %</span></div>`).join('')}</div></div>`;
}
/* Barras verticales: series = [{n, c | cs:[...], vals:[...]}] */
function gBarras(labels, series, fmt, alto) {
  fmt = fmt || (v => num(v));
  const W = 640, H = alto || 260, pl = 52, pr = 8, pt = 24, pb = 50;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.vals)));
  const ah = H - pt - pb, cw = (W - pl - pr) / Math.max(1, labels.length);
  const bw = Math.min(54, (cw * 0.72) / series.length);
  let g = ''; const nd = Number.isInteger(max) && max <= 5 ? max : 4;
  for (let i = 0; i <= nd; i++) { const v = max * i / nd, y = pt + ah - ah * i / nd; g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="g-ax">${corto(v)}</text>`; }
  labels.forEach((lab, i) => {
    const x0 = pl + i * cw + (cw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.vals[i] || 0, h = v / max * ah, x = x0 + j * bw, y = pt + ah - h, color = s.cs ? s.cs[i] : s.c;
      g += `<rect class="g-bar" x="${x + 2}" y="${y}" width="${bw - 4}" height="${Math.max(h, v ? 2 : 0)}" rx="4" fill="${color}"><title>${esc(lab)} · ${esc(s.n || '')}: ${esc(fmt(v))}</title></rect>`;
      if (series.length <= 2) g += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" class="g-val">${esc(corto(v))}</text>`;
    });
    g += etiquetaSVG(lab, pl + i * cw + cw / 2, pt + ah + 19, Math.max(6, Math.floor(cw / 8.5)));
  });
  const leg = series.length > 1 ? `<div class="g-leg">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="g-svg" role="img">${g}<line x1="${pl}" x2="${W - pr}" y1="${pt + ah}" y2="${pt + ah}" stroke="#CBD5E1"/></svg>${leg}`;
}
/* Líneas: series = [{n, c, vals}] */
function gLinea(labels, series, alto) {
  const W = 640, H = alto || 260, pl = 44, pr = 16, pt = 18, pb = 36;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.vals)));
  const ah = H - pt - pb, step = (W - pl - pr) / Math.max(1, labels.length - 1);
  const X = i => pl + i * step, Y = v => pt + ah - v / max * ah;
  let g = ''; const nd = Number.isInteger(max) && max <= 5 ? max : 4;
  for (let i = 0; i <= nd; i++) { const v = max * i / nd, y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="g-ax">${corto(v)}</text>`; }
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" class="g-lbl">${esc(l)}</text>`);
  series.forEach((s, k) => {
    const pts = s.vals.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    if (k === 0) g += `<polygon points="${X(0)},${pt + ah} ${pts} ${X(s.vals.length - 1)},${pt + ah}" fill="${s.c}" opacity=".08"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="#fff" stroke="${s.c}" stroke-width="2.5"><title>${esc(s.n)} · ${esc(labels[i])}: ${num(v)}</title></circle>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="g-svg" role="img">${g}</svg><div class="g-leg">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;
}
/* Barras horizontales: datos = [{l, v, c}] */
function gBarrasH(datos, fmt) {
  fmt = fmt || (v => num(v)); const max = Math.max(1, ...datos.map(d => d.v));
  if (!datos.length) return '<div class="g-vacio">Sin datos para el período.</div>';
  return `<div class="barras">${datos.map(d => `<div class="b-fila"><span title="${esc(d.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.l)}</span><div class="b-pista"><div class="b-relleno" style="width:${d.v / max * 100}%;background:${d.c || COL.navy}"></div></div><span class="b-val">${esc(fmt(d.v))}</span></div>`).join('')}</div>`;
}
const panelG = (tit, cuerpo, sub) => `<div class="panel"><div class="panel-h">${esc(tit)}${sub ? `<small>${sub}</small>` : ''}</div><div class="panel-b">${cuerpo}</div></div>`;
const cardC = (l, n, cls, sub) => `<div class="card ${cls || ''}"><div class="c-lbl">${l}</div><div class="c-num">${n}</div>${sub ? `<div class="c-sub">${sub}</div>` : ''}</div>`;

/* =====================================================================
   DASHBOARD DEL ALMACÉN (solo cantidades, sin montos)
   ===================================================================== */
function sumaExi(alms, mod) {
  const t = { disp: 0, prest: 0, asig: 0, dan: 0, rep: 0, ext: 0, vacio: 0, pend: 0, baja: 0, entregado: 0 };
  alms.forEach(a => Object.entries(DB.exi[a] || {}).forEach(([id, e]) => {
    const it = item(+id); if (!it || (mod && it.mod !== mod)) return;
    Object.keys(t).forEach(k => t[k] += e[k] || 0);
  }));
  return t;
}
function prestamosVencidos(alms) {
  return DB.vales.filter(v => v.tipo === 'PRH' && alms.includes(v.origen) && saldoVale(v) > 0 && v.fechaDev < hoy())
    .map(v => ({ v, dias: diasEntre(v.fechaDev, hoy()) })).sort((a, b) => b.dias - a.dias);
}
function entregasEPP(alms) {
  const r = [];
  DB.vales.filter(v => v.tipo === 'ASI' && alms.includes(v.origen)).forEach(v => v.lineas.filter(l => l.consumo).forEach(l => {
    const it = item(l.id); const repo = sumarDias(fechaLocal(new Date(v.fecha)), it.vida || 0);
    r.push({ vale: v.num, alm: v.origen, fecha: v.fecha, cedula: v.resp.cedula, nombre: v.resp.nombre, cargo: v.resp.cargo, id: l.id, cod: l.cod, desc: l.desc, talla: it.talla, cant: l.cant, vida: it.vida, repo, costo: it.costo });
  }));
  // Solo la última entrega por trabajador e ítem define la reposición
  const ult = {}; r.forEach(x => { const k = x.cedula + '|' + x.cod; if (!ult[k] || ult[k].fecha < x.fecha) ult[k] = x; });
  r.forEach(x => { x.ultima = ult[x.cedula + '|' + x.cod] === x; const d = diasEntre(hoy(), x.repo); x.estado = !x.ultima ? 'REEMPLAZADA' : d < 0 ? 'VENCIDA' : d <= 15 ? 'PRÓXIMA' : 'VIGENTE'; x.diasRepo = d; });
  return r;
}
VISTAS.dash = p => {
  const mod = (p && p.mod) || '';
  const c = S.ctx, t = sumaExi([c], mod);
  const total = t.disp + t.prest + t.asig + t.dan + t.rep + t.ext + t.vacio;
  const pendAprob = DB.solicitudes.filter(s => s.origen === c && s.estatus === 'FINALIZADO').length;
  const venc = prestamosVencidos([c]);
  const epp = entregasEPP([c]).filter(x => x.ultima && (x.estado === 'VENCIDA' || x.estado === 'PRÓXIMA'));
  const porAceptar = DB.vales.filter(v => v.tipo === 'TRF' && v.destino === c && v.estatus === 'PENDIENTE DE RECEPCIÓN').sort((a, b) => a.vence.localeCompare(b.vence));
  const envPend = DB.vales.filter(v => v.tipo === 'TRF' && v.origen === c && v.estatus === 'PENDIENTE DE RECEPCIÓN');
  const envRiesgo = envPend.filter(v => (new Date(v.vence) - ahora()) < 2 * 3600000);
  const hace7 = new Date(ahora().getTime() - 7 * 86400000).toISOString();
  const envMal = DB.vales.filter(v => v.tipo === 'TRF' && v.origen === c && (v.estatus === 'RECHAZADA' || v.estatus === 'VENCIDA') && v.procesadoEn >= hace7);
  const vacios = sumaExi([c], 'CILINDRO').vacio;
  const aviso = (n, txt, dest, cls) => `<div class="aviso ${cls || ''}" onclick="ir('${dest[0]}',${dest[1] ? JSON.stringify(dest[1]).replace(/"/g, "'") : 'null'})"><div class="a-num">${n}</div><div class="a-txt">${txt}</div></div>`;
  
  const avisos = [
    aviso(pendAprob, 'Solicitudes pendientes de aprobación', ['aprobar'], pendAprob ? '' : 'verde'),
    aviso(venc.length, venc.length ? `Préstamos vencidos · máximo ${venc[0].dias} día(s) de atraso` : 'Préstamos vencidos', ['cVenc'], venc.length ? 'rojo' : 'verde'),
    aviso(epp.length, 'EPP con reposición vencida o próxima (15 días)', ['cEpp', { f: 'ALERTA' }], epp.length ? 'naranja' : 'verde'),
    aviso(porAceptar.length, porAceptar.length ? `Transferencias por aceptar · la más próxima vence en ${cronoHTML(porAceptar[0])}` : 'Transferencias por aceptar', ['trfRec'], porAceptar.length ? 'naranja' : 'verde'),
    aviso(envPend.length, `Transferencias enviadas pendientes · ${envRiesgo.length} vencen en menos de 2 horas`, ['trfEnv', { est: 'PENDIENTE DE RECEPCIÓN' }], envRiesgo.length ? 'rojo' : ''),
    aviso(envMal.length, 'Transferencias enviadas rechazadas o vencidas (últimos 7 días)', ['trfEnv'], envMal.length ? 'rojo' : 'verde'),
    vacios ? aviso(vacios, c === 'CENTRAL' ? 'Cilindros vacíos en Central' : 'Cilindros vacíos por transferir a Central', ['cCil'], 'naranja') : ''
  ].join('');
  // Movimientos de los últimos 30 días por tipo (documentos)
  const desde = new Date(ahora().getTime() - 30 * 86400000).toISOString();
  const docs = {}; DB.movs.filter(m => (m.origen === c || m.destino === c) && m.fecha >= desde && m.tipo !== 'INI' && (!mod || m.mod === mod))
    .forEach(m => { docs[m.tipo] = docs[m.tipo] || new Set(); docs[m.tipo].add(m.doc); });
  const tiposMov = ['PRH', 'ASI', 'TRF', 'ENT', 'DEV', 'DAN', 'EXT', 'PLZ'];
  const dona = gDonut([
    { l: 'Disponible', v: t.disp, c: COL.verde }, { l: 'Cilindros vacíos', v: t.vacio, c: COL.cian }, { l: 'En préstamo', v: t.prest, c: COL.ambar },
    { l: 'Asignado', v: t.asig, c: COL.azul }, { l: 'Dañado', v: t.dan, c: COL.rojo }, { l: 'En taller', v: t.rep, c: COL.naranja }, { l: 'Extraviado', v: t.ext, c: COL.morado }
  ].filter(d => d.v > 0 || ['Disponible', 'En préstamo', 'Asignado'].includes(d.l)), num(total), 'ítems en total');
  const corto = { PRH: 'Préstamo', ASI: 'Asignación', TRF: 'Transferencia', ENT: 'Entrada', DEV: 'Devolución', DAN: 'Daño', EXT: 'Robo / extravío', PLZ: 'Ext. plazo' };
  const barrasMov = gBarras(tiposMov.map(k => corto[k]), [{ n: 'Documentos', cs: tiposMov.map(k => COL_TIPO[k]), vals: tiposMov.map(k => docs[k] ? docs[k].size : 0) }]);
  const mods = Object.keys(MODULOS).filter(m => !mod || m === mod);
  const porMod = mods.map(m => sumaExi([c], m));
  const barrasMod = gBarras(mods.map(m => MODULOS[m]), [
    { n: 'Disponible', c: COL.verde, vals: porMod.map(x => x.disp + x.vacio) },
    { n: 'Fuera (préstamo + asignado)', c: COL.ambar, vals: porMod.map(x => x.prest + x.asig) },
    { n: 'Dañado / extraviado', c: COL.rojo, vals: porMod.map(x => x.dan + x.rep + x.ext) }], null, 230);
  $('area').innerHTML = cab('Dashboard operativo', 'Existencias y gestión de ' + esc(almNombre(c)) + ' en tiempo real · actualizado ' + fFH(nowISO()) + '.',
    `<div class="campo" style="margin:0"><select onchange="ir('dash',{mod:this.value})"><option value="">Todos los módulos</option>${opciones(Object.entries(MODULOS), mod)}</select></div><button class="btn btn-navy" onclick="refrescar()">🔄 Actualizar</button>`)
    + `<div class="cards">${cardC('Total de ítems', num(total), '', 'Bajo responsabilidad del almacén')}${cardC('Disponibles', num(t.disp + t.vacio), 'verde', t.vacio ? `${num(t.vacio)} cilindros vacíos` : 'Listos para despachar')}${cardC('En préstamo', num(t.prest), 'ambar', 'Fuera del almacén')}${cardC('Asignados', num(t.asig), 'azul', 'Custodia personal')}${cardC('Dañados', num(t.dan + t.rep), 'rojo', t.rep ? `${num(t.rep)} en taller` : '')}${cardC('Extraviados', num(t.ext), 'morado', 'En investigación')}</div>
    <div class="avisos">${avisos}</div>
    <div class="dos-col">${panelG('Distribución de existencias por estado', dona)}${panelG('Movimientos por tipo', barrasMov, 'Documentos de los últimos 30 días')}</div>
    <div class="dos-col">${panelG('Existencias por módulo', barrasMod)}
      <div class="panel"><div class="panel-h">Préstamos más atrasados<small>Top 10</small></div><div class="panel-b">
        ${grid('gAtr', [{ t: 'Vale', v: r => r.v.num }, { t: 'Responsable', v: r => r.v.resp.nombre }, { t: 'Supervisor', v: r => r.v.sup }, { t: 'Devolución', v: r => fF(r.v.fechaDev) }, { t: 'Atraso', v: r => r.dias + ' días', s: r => r.dias, td: 'col-dan' }],
          venc.slice(0, 10), { onSel: r => ir('doc', { num: r.v.num, back: 'dash' }), sinPie: true, vacio: 'No hay préstamos vencidos. ¡Todo al día!' })}
      </div></div></div>`;
};

/* =====================================================================
   CATÁLOGO DEL ALMACÉN (totales horizontales y verticales, sin montos)
   ===================================================================== */
VISTAS.cCatAlm = p => {
  p = p || {}; const mod = p.mod || '', cat = p.cat || '', est = p.est || '', todos = !!p.todos;
  let rows = Object.entries(DB.exi[S.ctx] || {}).map(([id, e]) => Object.assign({ it: item(+id) }, e)).filter(r => r.it && (!mod || r.it.mod === mod) && (!cat || r.it.cat === cat));
  rows.forEach(r => { r.total = r.disp + r.vacio + r.prest + r.asig + r.dan + r.rep + r.ext; r.estado = estadoCatalogo(r, r.it); });
  if (!todos) rows = rows.filter(r => r.total > 0);
  if (est) rows = rows.filter(r => r.estado === est);
  rows.sort((a, b) => a.it.cod.localeCompare(b.it.cod) || (a.it.serial || '').localeCompare(b.it.serial || ''));
  const hayCil = rows.some(r => r.it.mod === 'CILINDRO');
  const cols = [{ t: 'Código', v: r => r.it.cod, f: r => `<b>${esc(r.it.cod)}</b>` }, { t: 'Descripción', v: r => r.it.desc, td: 'wrap' }, { t: 'Marca / Modelo', v: r => `${r.it.marca} / ${r.it.modelo}`, td: 'wrap' }, { t: 'Serial', v: r => r.it.serial || '' },
    { t: 'Categoría', v: r => r.it.cat, td: 'wrap' }, { t: 'Unidad', v: r => r.it.umb, cls: 'cen' }, { t: 'Estado', v: r => r.estado, f: r => estB(r.estado) },
    { t: 'Disponibles', k: 'disp', cls: 'cen', td: 'col-disp', sum: true },
    ].concat(hayCil ? [{ t: 'Vacíos', k: 'vacio', cls: 'cen', td: 'col-vac', sum: true }] : []).concat([
    { t: 'Prestados', k: 'prest', cls: 'cen', td: 'col-prest', sum: true }, { t: 'Asignados', k: 'asig', cls: 'cen', td: 'col-asig', sum: true }, { t: 'Dañados', k: 'dan', cls: 'cen', td: 'col-dan', sum: true },
    { t: 'En taller', k: 'rep', cls: 'cen', td: 'col-tall', sum: true }, { t: 'Extraviados', k: 'ext', cls: 'cen', td: 'col-ext', sum: true }, { t: 'Total', k: 'total', cls: 'cen', td: 'col-total', sum: true }]);
  const rec = `ir('cCatAlm',{mod:$('caMod').value,cat:$('caCat').value,est:$('caEst').value,todos:$('caTod').checked})`;
  const pendRec = DB.vales.filter(v => v.tipo === 'TRF' && v.destino === S.ctx && v.estatus === 'PENDIENTE DE RECEPCIÓN').length;
  $('area').innerHTML = cab('📦 Catálogo del almacén', 'Existencia de cada ítem por estado. El total suma cada fila y cada columna. Lo recibido por transferencia se agrega automáticamente al aceptarla.',
    `${botonesExport('gCatA', 'Catálogo ' + almNombre(S.ctx))} <button class="btn btn-navy btn-mini" onclick="ir('ent')">➕ Entrada de ítems</button>`)
    + (pendRec ? `<div class="franja-est naranja"><span>Tiene <b>${pendRec}</b> transferencia(s) por aceptar. Su material se sumará al catálogo al aceptarlas.</span><button class="btn btn-navy btn-mini" onclick="ir('trfRec')">Ver transferencias recibidas</button></div>` : '')
    + `<div class="fila-filtros">${campo('Módulo', `<select id="caMod" onchange="${rec}"><option value="">Todos</option>${opciones(Object.entries(MODULOS), mod)}</select>`)}
      ${campo('Categoría', `<select id="caCat" onchange="${rec}"><option value="">Todas</option>${opciones(CATEGORIAS_OFICIALES, cat)}</select>`)}
      ${campo('Estado', `<select id="caEst" onchange="${rec}"><option value="">Todos</option>${opciones(['DISPONIBLE', 'VACÍO', 'SIN DISPONIBILIDAD', 'FUERA DE SERVICIO', 'SIN EXISTENCIA'], est)}</select>`)}
      <label style="font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;padding-bottom:9px"><input type="checkbox" id="caTod" ${todos ? 'checked' : ''} onchange="${rec}"> Incluir ítems sin existencia</label>
      ${buscador('gCatA', 'Buscar código, descripción, marca, serial…')}</div>`
    + grid('gCatA', cols, rows, { pag: 50, totales: true, compacto: true, onSel: r => { $('caKdx').disabled = false; $('caTit').textContent = `${r.it.cod} · ${r.it.desc} · ${r.it.marca} / ${r.it.modelo}${r.it.serial ? ' · ' + r.it.serial : ''}`; }, vacio: 'No hay ítems con existencia en este almacén.' })
    + `<div class="sel-strip"><span class="lbl">Ítem seleccionado</span><span class="box" id="caTit" style="flex:1"></span></div>
    <div class="barra-btn"><button class="btn-sip" onclick="ir('ent')">➕ Entrada de ítems</button><button class="btn-sip" id="caKdx" disabled onclick="const r=selDe('gCatA');ir('cKardex',{q:r.it.serial||r.it.cod})">📜 Ver kardex del ítem</button></div>
    <p class="ayuda-txt" style="margin-top:10px"><b>Estado:</b> Disponible = hay unidades para despachar · Sin disponibilidad = todas están prestadas o asignadas · Vacío = cilindros vacíos para transferir o devolver · Fuera de servicio = solo quedan dañadas, en taller o extraviadas. Los totales suman todas las páginas.</p>`;
};
VISTAS.cExist = p => VISTAS.cCatAlm(p);

/* =====================================================================
   CONSULTAS DEL ALMACÉN (sin montos)
   ===================================================================== */
VISTAS.cExistAnterior = p => {
  const mod = (p && p.mod) || '';
  const rows = Object.entries(DB.exi[S.ctx] || {}).map(([id, e]) => Object.assign({ it: item(+id) }, e)).filter(r => r.it && (!mod || r.it.mod === mod) && (totalExi(r) - r.pend) > 0);
  const cols = [{ t: 'Código', v: r => r.it.cod }, { t: 'Descripción', v: r => r.it.desc }, { t: 'Marca / Modelo', v: r => `${r.it.marca} / ${r.it.modelo}` }, { t: 'Serial', v: r => r.it.serial || '' },
    { t: 'Módulo', v: r => r.it.mod, f: r => chipMod(r.it.mod) }, { t: 'Categoría', v: r => r.it.cat }, { t: 'UMB', v: r => r.it.umb },
    { t: 'Disponible', k: 'disp', cls: 'cen', td: 'col-disp' }, { t: 'Vacíos', k: 'vacio', cls: 'cen', td: 'col-vac' }, { t: 'En préstamo', k: 'prest', cls: 'cen', td: 'col-prest' }, { t: 'Asignados', k: 'asig', cls: 'cen', td: 'col-asig' },
    { t: 'Dañados', k: 'dan', cls: 'cen', td: 'col-dan' }, { t: 'En taller', k: 'rep', cls: 'cen', td: 'col-tall' }, { t: 'Extraviados', k: 'ext', cls: 'cen', td: 'col-ext' }, { t: 'Total', v: r => totalExi(r) - r.pend, cls: 'cen', td: 'col-total' }];
  $('area').innerHTML = cab('Existencias del almacén', 'Catálogo de ' + esc(almNombre(S.ctx)) + ' con su existencia por estado.', botonesExport('gEx', 'Existencias ' + almNombre(S.ctx)))
    + `<div class="fila-filtros">${campo('Módulo', `<select onchange="ir('cExist',{mod:this.value})"><option value="">Todos</option>${opciones(Object.entries(MODULOS), mod)}</select>`)}${buscador('gEx')}</div>`
    + grid('gEx', cols, rows, { pag: 20, onSel: r => ir('cKardex', { q: r.it.serial || r.it.cod }) }) + '<p class="ayuda-txt" style="margin-top:8px">Haga clic en un ítem para ver su kardex.</p>';
};
function vistaPrestamos(tit, sub, tipo, estado, id) {
  let rows = DB.vales.filter(v => v.origen === S.ctx && (tipo ? v.tipo === tipo : (v.tipo === 'PRH' || v.tipo === 'ASI')));
  rows = rows.map(v => ({ v, est: estadoVale(v) }));
  if (estado === 'ABIERTOS') rows = rows.filter(r => ['VIGENTE', 'VENCIDO', 'DEVOLUCIÓN PARCIAL'].includes(r.est));
  else if (estado) rows = rows.filter(r => r.est === estado);
  rows.sort((a, b) => b.v.fecha.localeCompare(a.v.fecha));
  const cols = [
    { t: 'N° de vale', v: r => r.v.num },
    { t: 'Tipo de movimiento', v: r => `${r.v.tipo} - ${TIPOS[r.v.tipo].n}` },
    { t: 'Fecha y hora', v: r => fFH(r.v.fecha), s: r => r.v.fecha },
    { t: 'Cuenta auxiliar', v: r => r.v.cuenta || '—' },
    { t: 'Descripción del proyecto', v: r => r.v.proyecto || '—' },
    { t: 'Responsable', v: r => r.v.resp ? r.v.resp.nombre : '—' },
    { t: 'Cédula', v: r => r.v.resp ? r.v.resp.cedula : '—' },
    { t: 'Cargo', v: r => r.v.resp ? r.v.resp.cargo : '—' },
    { t: 'Supervisor', v: r => r.v.sup || '—' },
    { t: 'Fecha de devolución', v: r => r.v.fechaDev ? fF(r.v.fechaDev) : (r.v.tipo === 'ASI' ? 'Indefinida' : '—'), s: r => r.v.fechaDev || '9999' },
    { t: 'Días de atraso', v: r => r.v.tipo === 'PRH' && r.est === 'VENCIDO' ? diasEntre(r.v.fechaDev, hoy()) : 0, cls: 'cen', td: 'col-dan' },
    { t: 'Extensiones', v: r => r.v.extensiones || 0, cls: 'cen' },
    { t: 'Saldo', v: r => saldoVale(r.v), cls: 'cen', td: 'col-prest' },
    { t: 'Estado', v: r => r.est, f: r => estB(r.est) }
  ];
  $('area').innerHTML = cab(tit, sub, botonesExport('gPr', tit + ' ' + almNombre(S.ctx)))
    + `<div class="fila-filtros">${id === 'cAsig' ? '' : campo('Tipo', `<select onchange="ir('${id}',{tipo:this.value,est:'${estado}'})"><option value="">Préstamos y asignaciones</option>${opciones([['PRH', 'Préstamos'], ['ASI', 'Asignaciones']], tipo)}</select>`)}
      ${campo('Estado', `<select onchange="ir('${id}',{tipo:'${tipo}',est:this.value})">${opciones([['ABIERTOS', 'Con saldo pendiente'], ['VIGENTE', 'Vigentes'], ['VENCIDO', 'Vencidos'], ['DEVOLUCIÓN PARCIAL', 'Devolución parcial'], ['CERRADO', 'Cerrados'], ['ENTREGADO', 'EPP entregado'], ['', 'Todos']], estado)}</select>`)}${buscador('gPr', 'Buscar responsable, cédula, código, proyecto…')}</div>`
    + grid('gPr', cols, rows, { pag: 15, onSel: r => tiraPr(r.v) })
    + `<div class="sel-strip"><span class="lbl">Vale seleccionado</span><span class="box" id="tpNum"></span><span class="box" id="tpInfo" style="flex:1"></span></div>
    <div class="barra-btn"><button class="btn-sip" id="pVer" disabled onclick="ir('doc',{num:selDe('gPr').v.num,back:'${id}'})">Visualizar vale</button>
      <button class="btn-sip" id="pImp" ${puedeImprimir() ? '' : 'style="display:none"'} disabled onclick="imprimirVale(selDe('gPr').v.num)">Imprimir vale</button>
      <button class="btn-sip" id="pDev" disabled onclick="ir('dev',{vale:selDe('gPr').v.num})">Registrar devolución</button>
      <button class="btn-sip" id="pPlz" disabled onclick="ir('plz',{vale:selDe('gPr').v.num})">Extender plazo</button></div>`;
}
function tiraPr(v) { $('tpNum').textContent = v.num; $('tpInfo').textContent = `${v.resp ? v.resp.nombre : ''} · ${v.proyecto || ''}`; $('pVer').disabled = false; $('pImp').disabled = false; $('pDev').disabled = saldoVale(v) === 0; $('pPlz').disabled = !(v.tipo === 'PRH' && saldoVale(v) > 0); }
VISTAS.cPrest = p => vistaPrestamos('Préstamos vigentes', 'Préstamos y asignaciones con saldo pendiente de devolución.', p ? p.tipo ?? 'PRH' : 'PRH', p ? p.est ?? 'ABIERTOS' : 'ABIERTOS', 'cPrest');
VISTAS.cVenc = p => vistaPrestamos('Préstamos vencidos', 'Préstamos con fecha de devolución vencida y saldo pendiente.', 'PRH', p ? p.est ?? 'VENCIDO' : 'VENCIDO', 'cVenc');
VISTAS.cAsig = p => vistaPrestamos('Asignaciones por persona', 'Herramientas asignadas y EPP entregado por trabajador.', 'ASI', p ? p.est ?? '' : '', 'cAsig');

VISTAS.cIncid = p => {
  const f = (p && p.f) || 'ABIERTAS';
  let rows = DB.incid.filter(i => i.alm === S.ctx);
  if (f === 'ABIERTAS') rows = rows.filter(i => ['DAÑADO', 'EN TALLER', 'EN INVESTIGACIÓN'].includes(i.estado));
  else if (f !== 'TODAS') rows = rows.filter(i => i.tipo === f);
  rows.sort((a, b) => b.fecha.localeCompare(a.fecha));
  const cols = [{ t: 'Documento', k: 'valeRef' }, { t: 'Tipo', v: r => TIPOS[r.tipo].n }, { t: 'Fecha', v: r => fF(r.fecha), s: r => r.fecha }, { t: 'Código', k: 'cod' }, { t: 'Descripción', k: 'desc' }, { t: 'Serial', k: 'serial' },
    { t: 'Cant.', k: 'cant', cls: 'num' }, { t: 'Responsable', v: r => r.resp || '' }, { t: 'Mal uso', v: r => r.tipo === 'DAN' ? (r.malUso || 'NO') : '' }, { t: 'Tipo A', v: r => r.tipoA ? 'SI' : 'NO' },
    { t: 'Detalle', v: r => r.detalle || '' }, { t: 'Estado', k: 'estado', f: r => estB(r.estado) }];
  $('area').innerHTML = cab('Dañados y extraviados', 'Seguimiento de daños (evaluación, envío a taller o baja) y de robos o extravíos (investigación, hallazgo o baja).',
    `${botonesExport('gInc', 'Dañados y extraviados ' + almNombre(S.ctx))} <button class="btn btn-navy btn-mini" onclick="ir('mov',{tipo:'DAN'})">Reportar daño</button> <button class="btn btn-navy btn-mini" onclick="ir('mov',{tipo:'EXT'})">Reportar robo / extravío</button>`)
    + `<div class="fila-filtros">${campo('Mostrar', `<select onchange="ir('cIncid',{f:this.value})">${opciones([['ABIERTAS', 'Casos abiertos'], ['DAN', 'Daños'], ['EXT', 'Robos / extravíos'], ['TODAS', 'Todos']], f)}</select>`)}${buscador('gInc')}</div>`
    + grid('gInc', cols, rows, { pag: 15, onSel: r => tiraInc(r) })
    + `<div class="sel-strip"><span class="lbl">Caso seleccionado</span><span class="box" id="tiNum"></span><span class="box" id="tiInfo" style="flex:1"></span></div>
    <div class="barra-btn">
      <button class="btn-sip" id="iRep" disabled onclick="accInc('REPARABLE')">Enviar a taller</button>
      <button class="btn-sip" id="iOk" disabled onclick="accInc('REPARADO')">Retorno de taller</button>
      <button class="btn-sip" id="iHal" disabled onclick="accInc('RECUPERADO')">Registrar hallazgo</button>
      <button class="btn-sip" id="iBaja" disabled onclick="accInc('BAJA')">Dar de baja</button>
      <button class="btn-sip" id="iVer" disabled onclick="ir('doc',{num:selDe('gInc').valeRef,back:'cIncid'})">Visualizar reporte</button>
    </div>`;
};
function tiraInc(r) {
  $('tiNum').textContent = r.valeRef; $('tiInfo').textContent = `${r.cod} · ${r.desc} · ${r.estado}`;
  $('iRep').disabled = r.estado !== 'DAÑADO'; $('iOk').disabled = r.estado !== 'EN TALLER'; $('iHal').disabled = r.estado !== 'EN INVESTIGACIÓN';
  $('iBaja').disabled = !['DAÑADO', 'EN TALLER', 'EN INVESTIGACIÓN'].includes(r.estado); $('iVer').disabled = false;
}
function accInc(a) {
  const r = selDe('gInc');
  const txt = { REPARABLE: 'Enviar a taller (pasa a taller)', REPARADO: 'Retorno de taller (vuelve a disponible)', RECUPERADO: 'Registrar hallazgo (vuelve a disponible)', BAJA: r.tipo === 'EXT' ? 'Cerrar investigación sin hallazgo y dar de baja' : 'Dar de baja (no reparable)' }[a];
  pedirTexto(txt, 'Nota (opcional)', v => { accionIncidencia(r.n, a, v); toast('Caso actualizado.', 'ok'); refrescar(); }, 'Confirmar');
}

VISTAS.cVales = p => {
  p = p || {};
  const tipo = p.tipo || '';
  const mod = p.mod || '';
  const cat = p.cat || '';
  const alm = p.alm || '';
  const proy = p.proy || '';
  const vale = p.vale || '';
  const desde = p.desde || '';
  const hasta = p.hasta || '';

  const getValeMods = v => {
    const mods = new Set();
    (v.lineas || []).forEach(l => {
      const it = item(l.id);
      if (it && it.mod) mods.add(it.mod);
      else if (l.mod) mods.add(l.mod);
    });
    if (mods.size) return [...mods];
    if (v.ref) {
      const orig = valeDe(v.ref);
      if (orig) {
        (orig.lineas || []).forEach(l => {
          const it = item(l.id);
          if (it && it.mod) mods.add(it.mod);
        });
      }
    }
    return mods.size ? [...mods] : ['HERRAMIENTA'];
  };

  const getValeCats = v => {
    const cats = new Set();
    (v.lineas || []).forEach(l => {
      const it = item(l.id);
      if (it && it.cat) cats.add(it.cat);
      else if (l.cat) cats.add(l.cat);
    });
    if (cats.size) return [...cats];
    if (v.ref) {
      const orig = valeDe(v.ref);
      if (orig) {
        (orig.lineas || []).forEach(l => {
          const it = item(l.id);
          if (it && it.cat) cats.add(it.cat);
        });
      }
    }
    return [...cats];
  };

  const getStatusVale = v => {
    const mods = getValeMods(v);
    if (mods.includes('CILINDRO')) {
      if (v.tipo === 'DEV') return 'DISPONIBLE';
      if (['PRH', 'ASI'].includes(v.tipo)) {
        return saldoVale(v) > 0 ? 'NO DISPONIBLE' : 'DISPONIBLE';
      }
      if (v.tipo === 'TRF') {
        return v.estatus === 'RECIBIDA' ? 'DISPONIBLE' : 'NO DISPONIBLE';
      }
      if (['DAN', 'EXT'].includes(v.tipo)) return 'NO DISPONIBLE';
      if (v.tipo === 'ENT') return 'DISPONIBLE';
    }
    return estadoVale(v);
  };

  const badgeStatus = v => {
    const st = getStatusVale(v);
    if (st === 'DISPONIBLE') return '<span class="est est-verde" style="font-weight:700">DISPONIBLE</span>';
    if (st === 'NO DISPONIBLE') return '<span class="est est-rojo" style="font-weight:700">NO DISPONIBLE</span>';
    return estB(st);
  };

  let rows = DB.vales.filter(v => {
    // Almacén destino (filtrar exclusivamente por el almacén destino del vale)
    if (alm && alm !== 'TODOS') {
      if (v.destino !== alm) return false;
    }
    // N° de vale concreto
    if (vale) {
      if (!(v.num || '').toUpperCase().includes(vale.toUpperCase().trim())) return false;
    }
    if (tipo && v.tipo !== tipo) return false;
    if (mod && !getValeMods(v).includes(mod)) return false;
    if (cat && !getValeCats(v).includes(cat)) return false;
    if (proy) {
      const matchCta = (v.cuenta || '').toUpperCase().includes(proy.toUpperCase());
      const matchP = (v.proyecto || '').toUpperCase().includes(proy.toUpperCase());
      if (!matchCta && !matchP) return false;
    }
    const fStr = (v.fecha || '').slice(0, 10);
    if (desde && fStr < desde) return false;
    if (hasta && fStr > hasta) return false;
    return true;
  }).sort((a, b) => b.fecha.localeCompare(a.fecha));

  const cols = [
    { t: 'N° de Vale', k: 'num', f: r => `<b>${esc(r.num)}</b>` },
    { t: 'Tipo', v: r => TIPOS[r.tipo] ? TIPOS[r.tipo].n : r.tipo },
    { t: 'Módulo', v: r => getValeMods(r).map(m => MODULOS[m] || m).join(', '), f: r => getValeMods(r).map(m => `<span class="chip-mod m-${m}" style="font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700">${esc(MODULOS[m] || m)}</span>`).join(' ') },
    { t: 'Fecha', v: r => fFH(r.fecha), s: r => r.fecha },
    { t: 'Origen', v: r => almNombre(r.origen).replace('Almacén ', '') },
    { t: 'Destino', v: r => almNombre(r.destino).replace('Almacén ', '') },
    { t: 'Cuenta Auxiliar', v: r => r.cuenta || '—', f: r => r.cuenta ? `<span class="est est-azul" style="font-family:monospace;font-weight:700">${esc(r.cuenta)}</span>` : '—' },
    { t: 'Proyecto', v: r => r.proyecto || '—', td: 'wrap' },
    { t: 'Despachado por', v: r => r.despacha || (r.realizadoPor ? (r.realizadoPor.nombre || r.realizadoPor) : '—') },
    { t: 'N° de Referencia', v: r => r.ref || r.solicitud || '—' },
    { t: 'Cantidad', v: r => (r.lineas || []).reduce((a, l) => a + (Number(l.cant) || 1), 0), cls: 'num' },
    { t: 'Códigos / Ítems', v: r => (r.lineas || []).map(l => l.serial ? `${l.cod} (${l.serial})` : l.cod).join(', ') || '—', td: 'wrap' },
    { t: 'Responsable', v: r => r.resp ? (r.resp.nombre || r.resp) : '—' },
    { t: 'Cédula', v: r => (r.resp && r.resp.cedula) ? r.resp.cedula : '—' },
    { t: 'Cargo', v: r => (r.resp && r.resp.cargo) ? r.resp.cargo : '—' },
    { t: 'Supervisor', v: r => r.sup || r.supervisor || '—' },
    { t: 'N° de Salida TIMACA', v: r => r.salidaTimaca || r.numSalida || '—' },
    { t: 'Cant. Retornada', v: r => r.tipo === 'DEV' ? (r.lineas || []).reduce((a, l) => a + (Number(l.cant) || 0), 0) : ['PRH', 'ASI'].includes(r.tipo) ? ((r.lineas || []).reduce((a, l) => a + (Number(l.dev) || 0), 0) || '—') : '—', cls: 'num' },
    { t: 'Saldo por Devolver', v: r => ['PRH', 'ASI'].includes(r.tipo) ? saldoVale(r) : '—', cls: 'num' },
    { t: 'Condición de Retorno', v: r => { const conds = (r.lineas || []).map(l => l.condicion || l.cond || l.condRet).filter(Boolean); return conds.length ? [...new Set(conds)].join(', ') : (r.tipo === 'DEV' ? 'ÓPTIMO' : '—'); } },
    { t: 'Días de Atraso', v: r => (r.tipo === 'PRH' && r.fechaDev && r.fechaDev < hoy() && saldoVale(r) > 0) ? diasEntre(r.fechaDev, hoy()) : 0, cls: 'num', f: r => { const d = (r.tipo === 'PRH' && r.fechaDev && r.fechaDev < hoy() && saldoVale(r) > 0) ? diasEntre(r.fechaDev, hoy()) : 0; return d > 0 ? `<span style="color:#dc2626;font-weight:700">${d} días</span>` : '<span style="color:#6b7280">0</span>'; } },
    { t: 'Status', v: r => getStatusVale(r), f: r => badgeStatus(r) },
    { t: 'Observaciones', v: r => r.obs || r.observaciones || '—', td: 'wrap' }
  ];

  const recargar = `ir('cVales',{tipo:$('vTipo').value,mod:$('vMod').value,cat:$('vCat').value,alm:$('vAlm').value,proy:$('vProy').value,vale:$('vVale').value,desde:$('vDesde').value,hasta:$('vHasta').value})`;

  $('area').innerHTML = cab('Vales emitidos (Trazabilidad integral)', 'Todos los vales y movimientos (Herramientas, Cilindros y EPP). Filtrado por destino, N° de vale, movimiento, módulo, categoría, proyecto y fechas.', botonesExport('gVal', 'Vales emitidos ' + (alm && alm !== 'TODOS' ? ('Destino ' + almNombre(alm)) : 'Todos los destinos')))
    + `<div class="fila-filtros" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
        ${campo('N° de Vale', `<input id="vVale" value="${esc(vale)}" placeholder="Ej. PRH-000001" style="max-width:130px" onkeydown="if(event.key==='Enter')${recargar}" onchange="${recargar}">`)}
        ${campo('Almacén destino', `<select id="vAlm" onchange="${recargar}"><option value="TODOS" ${alm === 'TODOS' || !alm ? 'selected' : ''}>Todos los destinos</option>${opciones(DB.almacenes.map(a => [a.c, a.n.replace('Almacén ', '')]), alm)}</select>`)}
        ${campo('Tipo de movimiento', `<select id="vTipo" onchange="${recargar}"><option value="">Todos los movimientos</option>${opciones(['PRH', 'ASI', 'TRF', 'DEV', 'ENT', 'DAN', 'EXT', 'PLZ'].map(k => [k, k + ' - ' + (TIPOS[k] ? TIPOS[k].n : k)]), tipo)}</select>`)}
        ${campo('Módulo', `<select id="vMod" onchange="${recargar}"><option value="">Todos los módulos</option>${opciones([['HERRAMIENTA', '🔧 Herramientas'], ['CILINDRO', '🧪 Cilindros y gases'], ['EPP', '🦺 EPP y Dotación']], mod)}</select>`)}
        ${campo('Categoría', `<select id="vCat" onchange="${recargar}"><option value="">Todas las categorías</option>${opciones(CATEGORIAS_OFICIALES, cat)}</select>`)}
        ${campo('Proyecto / Cuenta', `<select id="vProy" onchange="${recargar}"><option value="">Todos los proyectos</option>${opciones(DB.proyectos.map(p => [p.cuenta, `${p.cuenta} · ${(p.nombre.length > 25 ? p.nombre.slice(0, 25) + '…' : p.nombre)}`]), proy)}</select>`)}
        ${campo('Desde', `<input type="date" id="vDesde" value="${esc(desde)}" onchange="${recargar}">`)}
        ${campo('Hasta', `<input type="date" id="vHasta" value="${esc(hasta)}" onchange="${recargar}">`)}
        ${(tipo || mod || cat || (alm && alm !== 'TODOS') || proy || vale || desde || hasta) ? `<button class="btn btn-claro" onclick="ir('cVales')" style="align-self:flex-end">✖ Limpiar</button>` : ''}
        ${buscador('gVal', 'Buscar código, serial, cédula, responsable, vale…')}
      </div>`
    + grid('gVal', cols, rows, { pag: 20, onSel: r => { $('vVer').disabled = false; $('vImp').disabled = false; } })
    + `<div class="barra-btn"><button class="btn-sip" id="vVer" disabled onclick="ir('doc',{num:selDe('gVal').num,back:'cVales'})">Visualizar</button><button class="btn-sip" id="vImp" ${puedeImprimir() ? '' : 'style="display:none"'} disabled onclick="imprimirVale(selDe('gVal').num)">Imprimir vale</button></div>`;
};
const colsKardex = maestro => [{ t: 'Fecha y hora', v: r => fFH(r.fecha), s: r => r.fecha }, { t: 'Documento', k: 'doc' }, { t: 'Movimiento', v: r => TIPOS[r.tipo] ? TIPOS[r.tipo].n : r.tipo }, { t: 'Código', k: 'cod' }, { t: 'Descripción', k: 'desc' }, { t: 'Serial', k: 'serial' },
  { t: 'Cant.', k: 'cant', cls: 'num' }, { t: 'Origen', v: r => almNombre(r.origen) }, { t: 'Destino', v: r => almNombre(r.destino) }, { t: 'Estado anterior', k: 'estAnt' }, { t: 'Estado nuevo', k: 'estNue' },
  { t: 'Responsable', k: 'resp' }, { t: 'Usuario', k: 'usr' }, { t: 'Observación', k: 'obs' }].concat(maestro ? [{ t: 'Valor USD', v: r => +(r.cant * (item(r.id).costo || 0)).toFixed(2), cls: 'num' }] : []);
VISTAS.cKardex = p => {
  const q = ((p && p.q) || '').trim().toUpperCase();
  let rows = DB.movs.filter(m => m.origen === S.ctx || m.destino === S.ctx);
  if (q) rows = rows.filter(m => (m.cod || '').toUpperCase() === q || (m.serial || '').toUpperCase() === q || (m.doc || '').toUpperCase() === q );
  rows = rows.slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || b.n - a.n);
  $('area').innerHTML = cab('Kardex por código', 'Historial permanente de movimientos del almacén. Ningún registro se borra.', botonesExport('gKdx', 'Kardex ' + (q || almNombre(S.ctx))))

const mfAlms = () => MF.alm ? [MF.alm] : DB.almacenes.map(a => a.c);

    <button class="btn btn-claro" onclick="refrescar()">Actualizar datos</button><span class="ayuda-txt">Última actualización: ${fFH(nowISO())}</span>
  </div></div></div>`;
}
function valorExi(alms, mod) {
  const v = { total: 0, almacen: 0, fuera: 0, dan: 0, ext: 0 };
  alms.forEach(a => Object.entries(DB.exi[a] || {}).forEach(([id, e]) => {
    const it = item(+id); if (!it || (mod && it.mod !== mod)) return; const c = it.costo || 0;
    v.total += totalExi(e) * c; v.almacen += (e.disp + e.vacio) * c; v.fuera += (e.prest + e.asig) * c; v.dan += (e.dan + e.rep) * c; v.ext += e.ext * c;
  }));
  return v;
}
const movsFiltro = (d, h) => DB.movs.filter(m => m.tipo !== 'INI' && enRango(m.fecha, d, h) && (!MF.mod || m.mod === MF.mod) && (!MF.alm || m.origen === MF.alm || m.destino === MF.alm));
const valorMov = m => m.cant * ((item(m.id) || {}).costo || 0);

/* ---------- KPI ---------- */
function kpis(d, h) {
  const alms = mfAlms(), modOk = l => !MF.mod || l.mod === MF.mod;
  const prh = DB.vales.filter(v => v.tipo === 'PRH' && alms.includes(v.origen));
  const vig = prh.filter(v => saldoVale(v) > 0), venc = vig.filter(v => v.fechaDev < hoy());
  const solP = DB.solicitudes.filter(s => alms.includes(s.origen) && s.procesadoEn && enRango(s.procesadoEn, d, h));
  const apr = solP.filter(s => s.estatus === 'APROBADO');
  const tAprob = apr.length ? apr.reduce((a, s) => a + horasEntre(s.finalizadaEn, s.procesadoEn), 0) / apr.length : null;
  const anul = solP.filter(s => s.estatus === 'ANULADO').length;
  const movs = DB.movs.filter(m => alms.includes(m.origen) && enRango(m.fecha, d, h) && (!MF.mod || m.mod === MF.mod));
  const prestado = movs.filter(m => m.tipo === 'PRH').reduce((a, m) => a + m.cant, 0);
  const inc = DB.incid.filter(i => alms.includes(i.alm) && enRango(i.fecha, d, h) && (!MF.mod || item(i.id).mod === MF.mod));
  const danos = inc.filter(i => i.tipo === 'DAN'), perd = inc.filter(i => i.tipo === 'EXT');
  const val = arr => arr.reduce((a, i) => a + i.cant * item(i.id).costo, 0);
  const extCerr = DB.incid.filter(i => i.tipo === 'EXT' && alms.includes(i.alm) && ['RECUPERADO', 'BAJA'].includes(i.estado) && enRango(i.hist[i.hist.length - 1].fecha, d, h));
  const trf = DB.vales.filter(v => v.tipo === 'TRF' && (alms.includes(v.origen) || alms.includes(v.destino)) && enRango(v.fecha, d, h));
  const trfR = trf.filter(v => v.estatus === 'RECIBIDA');
  const tAcep = trfR.length ? trfR.reduce((a, v) => a + horasEntre(v.fecha, v.procesadoEn), 0) / trfR.length : null;
  const trfCerr = trf.filter(v => v.estatus !== 'PENDIENTE DE RECEPCIÓN');
  const epp = entregasEPP(alms).filter(x => enRango(x.fecha, d, h));
  const eppVenc = entregasEPP(alms).filter(x => x.ultima && x.estado === 'VENCIDA');
  return {
    vencPct: vig.length ? venc.length / vig.length * 100 : 0, atraso: venc.length ? venc.reduce((a, v) => a + diasEntre(v.fechaDev, hoy()), 0) / venc.length : 0,
    tAprob, anulPct: solP.length ? anul / solP.length * 100 : 0, danoIdx: prestado ? danos.reduce((a, i) => a + i.cant, 0) / prestado * 100 : 0, danoVal: val(danos),
    perdIdx: prestado ? perd.reduce((a, i) => a + i.cant, 0) / prestado * 100 : 0, perdVal: val(perd),
    malUsoPct: danos.length ? danos.filter(i => i.malUso === 'SI').length / danos.length * 100 : 0,
    recupPct: extCerr.length ? extCerr.filter(i => i.estado === 'RECUPERADO').length / extCerr.length * 100 : null,
    tAcep, rechPct: trfCerr.length ? trfCerr.filter(v => v.estatus === 'RECHAZADA').length / trfCerr.length * 100 : 0, vencTrfPct: trfCerr.length ? trfCerr.filter(v => v.estatus === 'VENCIDA').length / trfCerr.length * 100 : 0,
    eppCant: epp.reduce((a, x) => a + x.cant, 0), eppVal: epp.reduce((a, x) => a + x.cant * x.costo, 0), eppVenc: new Set(eppVenc.map(x => x.cedula)).size,
    prestado, nTrf: trf.length
  };
}
VISTAS.mKpi = () => {
  mfIni();
  const dias = diasEntre(MF.desde, MF.hasta) + 1;
  const A = kpis(MF.desde, MF.hasta), B = kpis(sumarDias(MF.desde, -dias), sumarDias(MF.desde, -1));
  const k = (t, v, fmt, prev, mejorBaja, expl) => {
    let comp = '<span class="k-c neutro">Sin comparación (indicador del estado actual)</span>';
    if (prev !== undefined && v != null && prev != null) { const dif = v - prev; comp = Math.abs(dif) < 0.0001 ? '<span class="k-c neutro">Igual al período anterior</span>' : `<span class="k-c ${(dif > 0) === mejorBaja ? 'sube' : 'baja'}">${dif > 0 ? '▲' : '▼'} ${fmt(Math.abs(dif))} vs. período anterior (${fmt(prev)})</span>`; }
    return `<div class="kpi"><div class="k-t">${t}</div><div class="k-v">${v == null ? 'Sin datos' : fmt(v)}</div>${comp}<div class="k-e">${expl}</div></div>`;
  };
  const pct = x => num(x, 1) + ' %', hrs = x => num(x, 1) + ' h', dd = x => num(x, 1) + ' días', u = x => usd(x), n0 = x => num(x);
  // Top rotación y sin movimiento
  const alms = mfAlms();
  const rot = {}; DB.movs.filter(m => (m.tipo === 'PRH' || m.tipo === 'ASI') && alms.includes(m.origen) && enRango(m.fecha, MF.desde, MF.hasta) && (!MF.mod || m.mod === MF.mod)).forEach(m => { rot[m.cod] = rot[m.cod] || { cod: m.cod, desc: m.desc, n: 0 }; rot[m.cod].n += m.cant; });
  const top = Object.values(rot).sort((a, b) => b.n - a.n).slice(0, 5);
  const lim = new Date(ahora().getTime() - 90 * 86400000).toISOString();
  const conMov = new Set(DB.movs.filter(m => m.tipo !== 'INI' && m.fecha >= lim).map(m => m.id));
  const sinMov = DB.catalogo.filter(it => (!MF.mod || it.mod === MF.mod) && !conMov.has(it.id) && alms.some(a => DB.exi[a] && DB.exi[a][it.id] && totalExi(DB.exi[a][it.id]) > 0));
  // Tendencia mensual (6 meses)
  const meses = []; for (let i = 5; i >= 0; i--) { const d = ahora(); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(fechaLocal(d).slice(0, 7)); }
  const porMes = meses.map(m => { const ms = DB.movs.filter(x => x.tipo !== 'INI' && alms.includes(x.origen) && fechaLocal(new Date(x.fecha)).slice(0, 7) === m && (!MF.mod || x.mod === MF.mod));
    const porTipo = {}; ms.forEach(x => { porTipo[x.tipo] = porTipo[x.tipo] || new Set(); porTipo[x.tipo].add(x.doc); }); Object.keys(porTipo).forEach(k => porTipo[k] = porTipo[k].size);
    return { m, porTipo, docs: new Set(ms.map(x => x.doc)).size, salida: ms.filter(x => x.tipo === 'PRH' || x.tipo === 'ASI').reduce((a, x) => a + valorMov(x), 0) }; });
    const nomMes = m => ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'][+m.slice(5) - 1] + ' ' + m.slice(2, 4);
  $('area').innerHTML = cab('📈 Indicadores (KPI)', `Período ${fF(MF.desde)} al ${fF(MF.hasta)}, comparado con los ${dias} días anteriores.`) + filtrosMaestro('mKpi')
    + `<div class="kpis">
      ${k('Préstamos vencidos', A.vencPct, pct, undefined, true, 'Préstamos con fecha de devolución vencida ÷ préstamos con saldo pendiente.')}
      ${k('Promedio de días de atraso', A.atraso, dd, undefined, true, 'Promedio de días transcurridos desde la fecha de devolución en los préstamos vencidos.')}
      ${k('Tiempo promedio de aprobación', A.tAprob, hrs, B.tAprob, true, 'Horas entre la finalización de la solicitud y su aprobación por el supervisor.')}
      ${k('Tasa de anulación', A.anulPct, pct, B.anulPct, true, 'Solicitudes anuladas ÷ solicitudes procesadas en el período.')}
      ${k('Índice de daño', A.danoIdx, pct, B.danoIdx, true, `Unidades dañadas ÷ unidades prestadas en el período (${num(A.prestado)}). Valor: ${usd(A.danoVal)}.`)}
      ${k('Índice de pérdida', A.perdIdx, pct, B.perdIdx, true, `Unidades extraviadas ÷ unidades prestadas en el período. Valor: ${usd(A.perdVal)}.`)}
      ${k('Daños por mal uso o negligencia', A.malUsoPct, pct, B.malUsoPct, true, 'Daños marcados como mal uso ÷ total de daños registrados.')}
      ${k('Recuperación de extraviados', A.recupPct, pct, B.recupPct, false, 'Casos cerrados con hallazgo ÷ casos de extravío cerrados en el período.')}
      ${k('Tiempo promedio de aceptación de transferencias', A.tAcep, hrs, B.tAcep, true, 'Horas entre el envío y la aceptación en el almacén destino.')}
      ${k('Transferencias rechazadas', A.rechPct, pct, B.rechPct, true, `Rechazadas ÷ transferencias procesadas (${A.nTrf} creadas en el período).`)}
      ${k('Transferencias vencidas', A.vencTrfPct, pct, B.vencTrfPct, true, `Vencidas sin respuesta en ${DB.config.plazoHoras} h ÷ transferencias procesadas.`)}
      ${k('EPP entregado', A.eppCant, n0, B.eppCant, false, `Unidades de EPP entregadas como dotación. Valor: ${usd(A.eppVal)}.`)}
      ${k('Trabajadores con EPP vencido', A.eppVenc, n0, undefined, true, 'Trabajadores cuya última entrega de algún EPP superó su vida útil.')}
    </div>

      ${panelG('Valor despachado en préstamos y asignaciones', gBarras(porMes.map(x => nomMes(x.m)), [{ n: 'USD', c: COL.verde, vals: porMes.map(x => +x.salida.toFixed(2)) }], usd), 'USD por mes')}
      ${panelG('Herramientas más solicitadas del período', gBarrasH(top.map((x, i) => ({ l: x.cod + ' · ' + x.desc, v: x.n, c: [COL.navy, COL.azul, COL.celeste, COL.cian, COL.verde][i] }))), 'Unidades')}
      <div class="panel"><div class="panel-h">Sin movimiento en los últimos 90 días<small>${sinMov.length} ítems · ${usd(sinMov.reduce((a, r) => a + r.costo, 0))}</small></div><div class="panel-b">${grid('gSinMov', [{ t: 'Código', k: 'cod' }, { t: 'Descripción', k: 'desc' }, { t: 'Serial', k: 'serial' }, { t: 'Valor USD', v: r => usd(r.costo), td: 'col-usd' }], sinMov, { sinPie: true, alto: 280 })}</div></div>
    </div>`;
};

function detalleAlmMaestro(c) {

/* ---------- Trazabilidad ---------- */
VISTAS.mTraz = p => {
  const q = ((p && p.q) || '').trim(); const Q = q.toUpperCase();
  let res = '';
  if (q) {
    const items = DB.catalogo.filter(it => it.cod.toUpperCase() === Q || (it.serial || '').toUpperCase() === Q);
    const persona = DB.personal.find(x => x.cedula.toUpperCase() === Q || x.cedula.replace(/\D/g, '') === Q.replace(/\D/g, '') && Q.replace(/\D/g, '').length > 5);
    const doc = Q.startsWith('SOL-') ? solDe(Q) : valeDe(Q);

    if (items.length) {
      const ids = new Set(items.map(i => i.id));
      const movs = DB.movs.filter(m => ids.has(m.id)).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.n - b.n);
      const ubic = items.map(it => DB.almacenes.map(a => { const e = DB.exi[a.c] && DB.exi[a.c][it.id]; if (!e) return ''; const parts = [['disp', 'disponible'], ['vacio', 'vacío'], ['prest', 'en préstamo'], ['asig', 'asignado'], ['dan', 'dañado'], ['rep', 'en taller'], ['ext', 'extraviado'], ['pend', 'pendiente de recepción']].filter(([k]) => e[k] > 0).map(([k, t]) => `${e[k]} ${t}`); return parts.length ? `<b>${esc(a.n)}</b>: ${parts.join(', ')}` : ''; }).filter(Boolean).join(' · ')).join('<br>');
      res = `<div class="panel"><div class="panel-h">${esc(items[0].cod)} · ${esc(items[0].desc)}${items.length === 1 && items[0].serial ? ' · Serial ' + esc(items[0].serial) : ''}<span>Valor unitario ${usd(items[0].costo)}</span></div>
        <div class="panel-b">
          <p class="ayuda-txt"><b>Ubicación y estado actual:</b><br>${ubic || 'Sin existencia'}</p>
        </div></div>
        <div class="panel"><div class="panel-h">Línea de tiempo (${movs.length} movimientos)</div><div class="panel-b"><div class="timeline">${movs.map(m => `<div class="tl-ev ${m.tipo === 'DAN' || m.tipo === 'EXT' ? 'rojo' : m.tipo === 'DEV' ? 'verde' : ''}"><div class="tl-t">${esc(m.doc)} · ${esc(TIPOS[m.tipo] ? TIPOS[m.tipo].n : m.tipo)} · ${m.cant} ${esc(item(m.id).umb)}${items.length > 1 ? ' · ' + esc(m.serial || '') : ''}</div><div class="tl-d">${fFH(m.fecha)} · ${esc(almNombre(m.origen))}${m.destino !== m.origen ? ' → ' + esc(almNombre(m.destino)) : ''} · ${esc(m.estAnt || '—')} → ${esc(m.estNue)} · Responsable: ${esc(m.resp || '')} · Registró: ${esc(m.usr)} · ${usd(valorMov(m))}</div></div>`).join('')}</div></div></div>`;
    } else if (persona) {
      const vs = DB.vales.filter(v => v.resp && v.resp.cedula === persona.cedula);
      const tiene = vs.filter(v => (v.tipo === 'PRH' || v.tipo === 'ASI') && saldoVale(v) > 0).flatMap(v => v.lineas.filter(l => saldoLinea(l) > 0).map(l => ({ v, l })));
      const inc = DB.incid.filter(i => vs.some(v => v.num === i.valeRef) || (i.resp === persona.nombre));
      const epp = entregasEPP(DB.almacenes.map(a => a.c)).filter(x => x.cedula === persona.cedula);
      res = `<div class="panel"><div class="panel-h">${esc(persona.nombre)} · ${esc(persona.cedula)} · ${esc(persona.cargo)} · ${esc(persona.depto)}<span>Valor en su poder: ${usd(tiene.reduce((a, x) => a + saldoLinea(x.l) * item(x.l.id).costo, 0))}</span></div><div class="panel-b">
        <p class="ayuda-txt" style="margin-bottom:6px"><b>En su poder hoy</b></p>${grid('gTzT', [{ t: 'Vale', v: x => x.v.num }, { t: 'Tipo', v: x => TIPOS[x.v.tipo].n }, { t: 'Almacén', v: x => almNombre(x.v.origen) }, { t: 'Código', v: x => x.l.cod }, { t: 'Descripción', v: x => x.l.desc }, { t: 'Serial', v: x => x.l.serial }, { t: 'Saldo', v: x => saldoLinea(x.l), cls: 'num' }, { t: 'Devolución', v: x => x.v.fechaDev ? fF(x.v.fechaDev) : 'Indefinida' }, { t: 'Estado', v: x => estadoVale(x.v), f: x => estB(estadoVale(x.v)) }], tiene, { sinPie: true, vacio: 'No tiene material pendiente.', onSel: x => ir('doc', { num: x.v.num, back: 'mTraz' }) })}
        <p class="ayuda-txt" style="margin:12px 0 6px"><b>Historial de vales</b></p>${grid('gTzH', [{ t: 'Vale', k: 'num' }, { t: 'Tipo', v: v => TIPOS[v.tipo].n }, { t: 'Fecha', v: v => fF(v.fecha), s: v => v.fecha }, { t: 'Almacén', v: v => almNombre(v.origen) }, { t: 'Proyecto', k: 'proyecto' }, { t: 'Estado', v: v => estadoVale(v) }], vs.slice().reverse(), { sinPie: true, onSel: v => ir('doc', { num: v.num, back: 'mTraz' }) })}
        <p class="ayuda-txt" style="margin:12px 0 6px"><b>Daños y extravíos asociados</b></p>${grid('gTzI', [{ t: 'Documento', k: 'valeRef' }, { t: 'Tipo', v: i => TIPOS[i.tipo].n }, { t: 'Código', k: 'cod' }, { t: 'Estado', k: 'estado' }, { t: 'Valor USD', v: i => usd(i.cant * item(i.id).costo) }], inc, { sinPie: true, vacio: 'Sin casos.' })}
        <p class="ayuda-txt" style="margin:12px 0 6px"><b>Historial de EPP</b></p>${grid('gTzE', [{ t: 'EPP', k: 'desc' }, { t: 'Talla', k: 'talla' }, { t: 'Entrega', v: x => fF(x.fecha) }, { t: 'Reposición', v: x => fF(x.repo) }, { t: 'Estado', k: 'estado' }], epp, { sinPie: true, vacio: 'Sin entregas de EPP.' })}
      </div></div>`;
    } else if (doc) {
      const rel = DB.vales.filter(v => v.ref === doc.num || v.solicitud === doc.num || (doc.ref && v.num === doc.ref) || (doc.vale && v.num === doc.vale) || (doc.solicitud && v.num === doc.solicitud));
      const sol = doc.solicitud ? solDe(doc.solicitud) : null;
      res = `<div class="panel"><div class="panel-h">${esc(doc.num)} · ${esc(TIPOS[doc.tipo].n)}<button class="btn btn-claro btn-mini" onclick="ir('doc',{num:'${doc.num}',back:'mTraz'})">Ver documento completo</button></div><div class="panel-b">
        <p class="ayuda-txt">${esc(almNombre(doc.origen))} → ${esc(almNombre(doc.destino))} · ${fFH(doc.fecha)} · ${doc.resp ? 'Responsable: ' + esc(doc.resp.nombre) + ' · ' : ''}Valor: ${usd(doc.lineas.reduce((a, l) => a + l.cant * item(l.id).costo, 0))}</p>
        <p class="ayuda-txt" style="margin:12px 0 6px"><b>Documentos relacionados</b></p>
        ${grid('gTzR', [{ t: 'Documento', k: 'num' }, { t: 'Tipo', v: v => TIPOS[v.tipo].n }, { t: 'Fecha', v: v => fFH(v.fecha), s: v => v.fecha }, { t: 'Estado', v: v => v.estatus || estadoVale(v) }], (sol ? [sol] : []).concat(rel), { sinPie: true, vacio: 'Sin documentos relacionados.', onSel: v => ir('mTraz', { q: v.num }) })}
      </div></div>`;
    } else res = `<div class="franja-est gris"><span>No se encontró ningún código, serial, cédula o documento que coincida con "${esc(q)}".</span></div>`;
  }
  $('area').innerHTML = cab('Trazabilidad', 'Busque por código, serial, cédula o documento (SOL-, TRF-, PRH-, ASI-).')
    + `<div class="fila-filtros">${campo('Buscar', `<input id="tzq" style="min-width:320px" value="${esc(q)}" placeholder="Ej. HE000101, V-25.859.699 o TRF-0000001" onkeydown="if(event.key==='Enter')ir('mTraz',{q:this.value})">`)}<button class="btn btn-navy" onclick="ir('mTraz',{q:$('tzq').value})">Buscar</button></div>
    <p class="ayuda-txt" style="margin-bottom:12px">Ejemplos: <a href="#" onclick="ir('mTraz',{q:'HE000101'});return false">HE000101</a> (herramienta) · <a href="#" onclick="ir('mTraz',{q:'V-25.859.699'});return false">V-25.859.699</a> (responsable)</p>` + res;
};

/* ---------- Alertas ---------- */
function listaAlertas() {
  const a = [];
  
  prestamosVencidos(DB.almacenes.map(x => x.c)).forEach(({ v, dias }) => a.push({ p: dias > 7 ? 1 : 2, tipo: 'Préstamo vencido', alm: v.origen, det: `${v.num} · ${v.resp.nombre} · ${dias} día(s) de atraso`, doc: v.num, valor: saldoVale(v) && v.lineas.reduce((x, l) => x + saldoLinea(l) * item(l.id).costo, 0) }));
  DB.solicitudes.filter(s => s.estatus === 'FINALIZADO' && horasEntre(s.finalizadaEn, nowISO()) > 48).forEach(s => a.push({ p: 2, tipo: 'Solicitud sin aprobar (> 48 h)', alm: s.origen, det: `${s.num} · finalizada ${fFH(s.finalizadaEn)}`, doc: s.num, valor: s.lineas.reduce((x, l) => x + l.cant * item(l.id).costo, 0) }));
  DB.vales.filter(v => v.tipo === 'TRF' && v.estatus === 'PENDIENTE DE RECEPCIÓN' && (new Date(v.vence) - ahora()) < 2 * 3600000).forEach(v => a.push({ p: 1, tipo: 'Transferencia próxima a vencer', alm: v.destino, det: `${v.num} · ${almNombre(v.origen)} → ${almNombre(v.destino)} · ${restante(v.vence)}`, doc: v.num, valor: v.lineas.reduce((x, l) => x + l.cant * item(l.id).costo, 0) }));
  DB.incid.filter(i => i.estado === 'EN INVESTIGACIÓN').forEach(i => a.push({ p: i.tipoA ? 1 : 2, tipo: 'Extravío en investigación' + (i.tipoA ? ' (Tipo A)' : ''), alm: i.alm, det: `${i.valeRef} · ${i.cod} ${i.desc}`, doc: i.valeRef, valor: i.cant * item(i.id).costo }));
  DB.incid.filter(i => i.tipo === 'DAN' && i.malUso === 'SI' && i.estado !== 'BAJA').forEach(i => a.push({ p: 2, tipo: 'Daño por mal uso (notificar a RRHH)', alm: i.alm, det: `${i.valeRef} · ${i.cod}`, doc: i.valeRef, valor: i.cant * item(i.id).costo }));
  Object.entries(DB.exi).forEach(([alm, o]) => Object.entries(o).forEach(([id, e]) => { if (Object.values(e).some(x => x < 0)) a.push({ p: 1, tipo: 'Existencia negativa o inconsistente', alm, det: item(+id).cod + ' ' + item(+id).desc, doc: '', valor: 0 }); }));
  DB.catalogo.filter(it => !(it.costo > 0)).forEach(it => a.push({ p: 3, tipo: 'Ítem sin costo registrado', alm: '', det: `${it.cod} ${it.desc} ${it.serial || ''}`, doc: '', valor: 0 }));
  entregasEPP(DB.almacenes.map(x => x.c)).filter(x => x.ultima && x.estado === 'VENCIDA').forEach(x => a.push({ p: 3, tipo: 'EPP con reposición vencida', alm: x.alm, det: `${x.nombre} · ${x.desc} · venció ${fF(x.repo)}`, doc: x.vale, valor: x.cant * x.costo }));
  return a.sort((x, y) => x.p - y.p);
}
function contarAlertas() { return listaAlertas().filter(a => a.p === 1).length; }
VISTAS.mAlert = () => {
  const rows = listaAlertas();
  $('area').innerHTML = cab('Alertas', 'Situaciones que requieren atención, ordenadas por prioridad.', botonesExport('gAl', 'Alertas'))
    + grid('gAl', [{ t: 'Prioridad', v: r => ['', 'Alta', 'Media', 'Baja'][r.p], s: r => r.p, f: r => `<span class="est est-${['', 'rojo', 'naranja', 'gris'][r.p]}">${['', 'Alta', 'Media', 'Baja'][r.p]}</span>` }, { t: 'Alerta', k: 'tipo' }, { t: 'Almacén', v: r => r.alm ? almNombre(r.alm) : 'Catálogo' }, { t: 'Detalle', k: 'det' }, { t: 'Valor USD', v: r => +(r.valor || 0).toFixed(2), f: r => r.valor ? usd(r.valor) : '', cls: 'num' }],

};

/* =====================================================================
   CRONÓMETRO DE TRANSFERENCIAS Y ALERTA DE VENCIMIENTO
   ===================================================================== */
const alertaMin = () => Number(DB.config.alertaMin) || 30;
function fmtCrono(ms) { if (ms <= 0) return '00:00:00'; const t = Math.floor(ms / 1000); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`; }
function claseCrono(ms) { return ms <= alertaMin() * 60000 ? 'rojo' : ms <= 2 * 3600000 ? 'ambar' : 'verde'; }
/* Reloj en vivo: <span class="crono"> se actualiza cada segundo */
function cronoHTML(v, grande) {
  const ms = new Date(v.vence) - ahora();
  return `<span class="crono ${claseCrono(ms)} ${grande ? 'grande' : ''}" data-vence="${v.vence}" data-ini="${v.fecha}">⏱ ${fmtCrono(ms)}</span>`;
}
const S_ALERTA = { avisados: new Set(), ocultos: new Set() };
function pendientesPorAceptar() {
  if (!S.u || enMaestro() || !puede('recibir', S.ctx)) return [];
  return DB.vales.filter(v => v.tipo === 'TRF' && v.destino === S.ctx && v.estatus === 'PENDIENTE DE RECEPCIÓN').sort((a, b) => a.vence.localeCompare(b.vence));
}
function tickCronos() {
  if (!S.u) return;
  let vencio = false;
  document.querySelectorAll('.crono').forEach(el => {
    const ms = new Date(el.dataset.vence) - ahora();
    if (ms <= 0) vencio = true;
    el.textContent = ms > 0 ? '⏱ ' + fmtCrono(ms) : '⏱ Vencida';
    el.className = `crono ${claseCrono(ms)}${el.classList.contains('grande') ? ' grande' : ''}`;
  });
  document.querySelectorAll('.crono-barra i').forEach(el => {
    const ini = new Date(el.dataset.ini), fin = new Date(el.dataset.vence);
    const pct = Math.max(0, Math.min(100, (fin - ahora()) / (fin - ini) * 100));
    el.style.width = pct + '%'; el.style.background = pct * (fin - ini) / 100 <= alertaMin() * 60000 ? 'var(--rojo)' : pct < 25 ? 'var(--ambar)' : 'var(--verde)';
  });
  if (vencio && procesarVencimientos()) { toast('Una transferencia venció sin ser aceptada y su material regresó al almacén de origen.', 'err'); pintarMenu(); refrescar(); }
  pintarBannerAlerta();
}
/* Aviso cuando quedan pocos minutos para aceptar */
function pintarBannerAlerta() {
  const caja = $('bannerTrf'); if (!caja) return;
  const enPantalla = S.vista === 'doc' && S.param ? S.param.num : null;
  const urg = pendientesPorAceptar().filter(v => (new Date(v.vence) - ahora()) <= alertaMin() * 60000 && !S_ALERTA.ocultos.has(v.num) && v.num !== enPantalla);
  if (!urg.length) { caja.style.display = 'none'; caja.innerHTML = ''; return; }
  const firma = urg.map(v => v.num).join('|');
  if (caja.dataset.firma !== firma) {
    caja.dataset.firma = firma;
    caja.innerHTML = `<div class="bt-h">⚠️ ¡Le queda poco tiempo para aceptar!<button onclick="urgOcultar()" title="Ocultar">×</button></div>` + urg.map(v => `<div class="bt-it">
      <div><b>${v.num}</b> desde ${esc(almNombre(v.origen))} · ${v.lineas.reduce((a, l) => a + l.cant, 0)} unidades</div>
      <div class="bt-crono">${cronoHTML(v, true)}</div>
      <div class="bt-txt">Si no la acepta o rechaza antes de que el reloj llegue a 00:00:00, la transferencia vencerá: se desincorporará de ${esc(almNombre(v.destino))} y el material regresará a ${esc(almNombre(v.origen))}.</div>
      <button class="btn btn-navy btn-mini" onclick="ir('doc',{num:'${v.num}',back:'trfRec'})">Ver y aceptar ahora</button></div>`).join('');
  }
  caja.style.display = 'block';
  // Ventana emergente una sola vez por transferencia al cruzar el umbral
  const nueva = urg.find(v => !S_ALERTA.avisados.has(v.num));
  if (!caja.innerHTML) return;
  if (nueva && $('modalFondo').style.display !== 'flex' && $('vistaImpresion').style.display !== 'block') {
    urg.forEach(v => S_ALERTA.avisados.add(v.num));
    abrirModal('⚠️ Transferencia por vencer', `<div class="franja-est rojo" style="justify-content:center">${cronoHTML(nueva, true)}</div>
      <p class="ayuda-txt">A la transferencia <b>${nueva.num}</b> enviada por <b>${esc(almNombre(nueva.origen))}</b> le quedan menos de <b>${alertaMin()} minutos</b> para ser aceptada.</p>
      <p class="ayuda-txt" style="margin-top:8px">Si no la acepta o rechaza a tiempo, <b>vencerá automáticamente</b>: el material no ingresará a su catálogo y regresará a ${esc(almNombre(nueva.origen))}, que tendrá que enviarla de nuevo.</p>`,
      [{ t: 'Recordarme después', cls: 'btn-claro', fn: cerrarModal }, { t: 'Ver y aceptar ahora', cls: 'btn-verde', fn: () => { cerrarModal(); ir('doc', { num: nueva.num, back: 'trfRec' }); } }]);
  }
}
function urgOcultar() { pendientesPorAceptar().forEach(v => S_ALERTA.ocultos.add(v.num)); $('bannerTrf').style.display = 'none'; }

      let ced = $('mpCed').value.trim();
      const cargo = $('mpCargo').value.trim();
      const esResp = $('mpRolResp').checked;
      const esSup = $('mpRolSup').checked;

        depto: almsSel[0] || 'CENTRAL',

function importarPersonalExcel() {
  leerArchivoTabla(filas => {
    const nuevos = [], act = [], err = [];

    filas.forEach((f, i) => {
      const g = (...ks) => { for (const k of ks) if (f[k] != null && String(f[k]).trim()) return String(f[k]).trim(); return ''; };
      const nombre = g('Nombre', 'NOMBRE', 'Nombre completo');
      let cedula = g('Cédula', 'Cedula', 'CEDULA', 'CI');
      const cargo = g('Cargo', 'CARGO');
      const rolStr = g('Rol', 'ROL', 'Tipo', 'TIPO').toUpperCase();
      const almStr = g('Almacenes', 'ALMACENES', 'Almacén', 'ALMACEN', 'Departamento');
      const modStr = g('Módulo', 'MODULO', 'Modulo').toUpperCase() || 'TODOS';
      const estStr = g('Estado', 'ESTADO').toUpperCase();

      if (!nombre) return err.push(`Fila ${i + 2}: falta Nombre`);
      if (!cargo) return err.push(`Fila ${i + 2}: falta Cargo para ${nombre}`);

      cedula = cedula ? formatCedula(cedula) : 'S/C';

      const tipo = [];
      if (rolStr.includes('RESP') || rolStr.includes('AMB')) tipo.push('RESPONSABLE');
      if (rolStr.includes('SUP') || rolStr.includes('AMB')) tipo.push('SUPERVISOR');
      if (!tipo.length) tipo.push('RESPONSABLE');

      let almacenes = [];
      if (almStr) {
        almacenes = almStr.split(/[,;\/]+/).map(a => a.trim().toUpperCase()).filter(Boolean);
      }
      if (!almacenes.length) almacenes = ['CENTRAL'];
      almacenes = almacenes.map(a => {
        const found = DB.almacenes.find(x => normTexto(x.c) === normTexto(a) || normTexto(x.n).includes(normTexto(a)));
        return found ? found.c : a;
      });

      const activo = estStr !== 'INACTIVO';

      const registro = {
        nombre,
        cedula,
        cargo,
        depto: almacenes[0] || 'CENTRAL',
        tipo,
        almacenes,
        modulo: modStr || 'TODOS',
        activo
      };

      const dig = digitosCI(cedula);
      const ex = DB.personal.find(p => (dig.length >= 5 && p.cedula && digitosCI(p.cedula) === dig) || normTexto(p.nombre) === normTexto(nombre));
      if (ex) {
        act.push({ nuevo: registro, actual: ex });
      } else {
        nuevos.push(registro);
      }
    });

    abrirModal('Vista previa de importación de Personal', `
      <p class="ayuda-txt">
        Nuevos a ingresar: <b>${nuevos.length}</b> · Ya existentes (coincidencia por CI o nombre): <b>${act.length}</b>
        ${err.length ? '<br><b style="color:var(--rojo)">Errores u omisiones:</b><br>' + err.map(esc).join('<br>') : ''}
      </p>
      <label style="display:block;margin:10px 0;font-size:12.5px;font-weight:600">
        <input type="checkbox" id="impActPers" checked> Actualizar roles y almacenes de los registros existentes
      </label>
      <div class="grid-wrap" style="max-height:300px">
        <table class="grid">
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Rol</th><th>Almacenes</th><th>Acción</th></tr></thead>
          <tbody>
            ${nuevos.concat(act.map(x => Object.assign({ _esAct: true }, x.nuevo))).map(r => `
              <tr>
                <td><b>${esc(r.nombre)}</b></td>
                <td>${esc(r.cedula)}</td>
                <td>${esc(r.cargo)}</td>
                <td>${(r.tipo || []).join(', ')}</td>
                <td>${(r.almacenes || []).join(', ')}</td>
                <td><span class="est ${r._esAct ? 'est-azul' : 'est-verde'}">${r._esAct ? 'Actualizar' : 'Crear'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `, [
      { t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal },
      { t: 'Confirmar importación', cls: 'btn-verde', fn: () => {
        nuevos.forEach(r => {
          r.id = 'p-' + (DB.personal.length + 1);
          DB.personal.push(r);
        });
        if ($('impActPers') && $('impActPers').checked) {
          act.forEach(({ nuevo, actual }) => {
            actual.nombre = nuevo.nombre;
            if (nuevo.cedula && nuevo.cedula !== 'S/C') actual.cedula = nuevo.cedula;
            if (nuevo.cargo) actual.cargo = nuevo.cargo;
            actual.tipo = [...new Set([...(actual.tipo || []), ...nuevo.tipo])];
            actual.almacenes = [...new Set([...(actual.almacenes || []), ...nuevo.almacenes])];
            if (nuevo.modulo) actual.modulo = nuevo.modulo;
            actual.activo = nuevo.activo;
          });
        }
        bit('IMPORTACIÓN PERSONAL', `${nuevos.length} nuevos, ${act.length} actualizados`);
        guardar();
        cerrarModal();
        toast(`Importación completada: ${nuevos.length} registros agregados, ${act.length} actualizados.`, 'ok');
        ir('aPers');
      } }
    ], true);
  });
}

function leerArchivoTabla(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = e => run(() => {
      let filas;
      if (window.XLSX && !/\.csv$/i.test(f.name)) { const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }); }
      else {
        const txt = /\.csv$/i.test(f.name) ? e.target.result : null; if (txt == null) throw new Error('Sin conexión a la librería de Excel: guarde el archivo como CSV.');
        const lineas = txt.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim()); const sep = lineas[0].includes(';') ? ';' : ',';
        const cab = lineas[0].split(sep).map(x => x.replace(/^"|"$/g, '').trim());
        filas = lineas.slice(1).map(l => { const v = l.split(sep).map(x => x.replace(/^"|"$/g, '').trim()); const o = {}; cab.forEach((c, i) => o[c] = v[i] || ''); return o; });
      }
      cb(filas);
    });
    if (/\.csv$/i.test(f.name) || !window.XLSX) rd.readAsText(f, 'utf-8'); else rd.readAsArrayBuffer(f);
  };
  inp.click();
}
function plantilla(enc, nombre) {
  if (window.XLSX) { const ws = XLSX.utils.aoa_to_sheet([enc]); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Datos'); XLSX.writeFile(wb, nombre + '.xlsx'); }
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + enc.join(';') + '\r\n'], { type: 'text/csv' })); a.download = nombre + '.csv'; a.click(); }
}
