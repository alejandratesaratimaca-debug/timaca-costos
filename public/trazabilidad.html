  }
  const sel = tipoCajaDe(CAJA_LISTA_SEL);
  const planSel = sel ? calcularPlanTipoCaja(sel) : null;

  const catalogoOpciones = (DB.catalogo || [])
    .filter(it => it.mod === 'HERRAMIENTA')
    .map(it => `<option value="${esc(it.cod)}">${esc(it.cod)} · ${esc(it.desc)}</option>`)
    .join('');

  window.seleccionarEspecialidadLista = id => {
    CAJA_LISTA_SEL = id;
    ir(esMaestro ? 'mCajas' : 'cajasTipos', esMaestro ? { tab: 'listas', id } : { id });
  };

  window.cambiarCantHerrCaja = (tipoId, idx, nuevaCant) => {
    const t = tipoCajaDe(tipoId);
    if (!t || !t.items || !t.items[idx]) return;
    const c = Math.max(1, parseInt(nuevaCant) || 1);
    t.items[idx].cantReq = c;
    guardar();
    seleccionarEspecialidadLista(tipoId);
  };

  window.quitarHerrDeCaja = (tipoId, idx) => {
    const t = tipoCajaDe(tipoId);
    if (!t || !t.items || !t.items[idx]) return;
    const h = t.items[idx];
    t.items.splice(idx, 1);
    bit('HERRAMIENTA QUITADA DE CAJA', `${tipoId} · ${h.cod} ${h.desc}`);
    guardar();
    toast(`Se quitó "${h.desc}" de ${t.nombre}.`, 'ok');
    seleccionarEspecialidadLista(tipoId);
  };

  window.eliminarTipoCaja = tipoId => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    confirmar(`¿Está seguro de que desea eliminar permanentemente la caja <b>${esc(t.nombre)}</b> (${esc(t.id)}) con todas sus herramientas asignadas?<br><br><small style="color:var(--rojo)">Esta acción no se puede deshacer.</small>`, () => {
      const idx = (DB.cajasTipos || []).findIndex(x => x.id === tipoId);
      if (idx !== -1) {
        DB.cajasTipos.splice(idx, 1);
        CAJA_LISTA_SEL = DB.cajasTipos[0] ? DB.cajasTipos[0].id : '';
        bit('TIPO DE CAJA ELIMINADO', `${t.id} - ${t.nombre}`);
        guardar();
        toast(`Caja "${t.nombre}" eliminada correctamente.`, 'ok');
        ir(enMaestro() ? 'mCajas' : 'cajasTipos', enMaestro() ? { tab: 'listas' } : {});
      }
    }, 'Eliminar caja');
  };

  window.vaciarListaCaja = tipoId => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    confirmar(`¿Desea vaciar todas las herramientas actuales de <b>${esc(t.nombre)}</b> para cargar su lista desde cero?`, () => {
      t.items = [];
      t.estadoLista = 'PENDIENTE LISTA';
      guardar();
      toast(`Lista de ${t.nombre} vaciada. Ahora puede agregar o importar las herramientas.`, 'ok');
      seleccionarEspecialidadLista(tipoId);
    }, 'Vaciar lista');
  };

  window.marcarEstadoListaCaja = (tipoId, estado) => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    t.estadoLista = estado;
    guardar();
    toast(`Estado de la lista actualizado a: ${estado}`, 'ok');
    seleccionarEspecialidadLista(tipoId);
  };

  window.agregarHerrDirectoACaja = tipoId => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    let cod = ($(' dirInpCod') ? $(' dirInpCod').value : ($('dirInpCod') ? $('dirInpCod').value : '')).trim().toUpperCase();
    let desc = ($('dirInpDesc') ? $('dirInpDesc').value : '').trim();
    let umb = ($('dirInpUmb') ? $('dirInpUmb').value : 'UND').trim().toUpperCase() || 'UND';
    const cant = Math.max(1, parseInt($('dirInpCant') ? $('dirInpCant').value : '1') || 1);

    let itCat = cod ? DB.catalogo.find(c => (c.cod || '').toUpperCase() === cod) : null;
    if (!itCat && desc) {
      itCat = DB.catalogo.find(c => normTexto(c.desc) === normTexto(desc));
      if (itCat && !cod) cod = itCat.cod;
    }

    if (!desc && itCat) desc = itCat.desc;
    if (!desc) return toast('Escriba la descripción de la herramienta o selecciónela del catálogo.', 'err');

    // Si no tiene código o no existe en el catálogo, generamos/registramos automáticamente en el catálogo para mantener trazabilidad
    if (!cod) {
      const nums = DB.catalogo.map(c => { const m = (c.cod || '').match(/^HE(\d+)$/i); return m ? parseInt(m[1]) : 0; });
      const nextNum = Math.max(100230, ...nums) + 1;
      cod = 'HE' + String(nextNum).padStart(6, '0');
    }
    if (!itCat) {
      const maxId = DB.catalogo.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
      itCat = { id: maxId + 1, cod, desc, mod: 'HERRAMIENTA', cat: t.especialidad || 'General', marca: 'ESTÁNDAR', modelo: '', serial: '', umb, costo: 0, tipoA: false, talla: '', vida: 0, activo: true };
      DB.catalogo.push(itCat);
    }

    t.items = t.items || [];
    const existente = t.items.find(x => (x.cod || '').toUpperCase() === cod);
    if (existente) {
      existente.cantReq += cant;
      toast(`Se sumaron ${cant} ${umb} a "${existente.desc}" en ${t.nombre}.`, 'ok');
    } else {
      t.items.push({ cod, desc: itCat.desc || desc, umb: itCat.umb || umb, cantReq: cant });
      toast(`"${desc}" agregada a la lista de ${t.nombre}.`, 'ok');
    }
    guardar();
    seleccionarEspecialidadLista(tipoId);
  };

  $('area').innerHTML = cab(
    '📋 Listas de Herramientas por Especialidad / Oficio',
    'Seleccione un oficio a la izquierda (Mecánico, Tornero, Electricista, Soldador, Montador, Instrumentista) para ver, editar o cargar desde Excel la lista exacta de herramientas que lleva su caja.',

    <div class="f3" style="gap:12px">
      <div class="campo"><label>Código de la caja *</label><input id="tcId" value="${esc(tipo.id)}" placeholder="Ej. CH-MEC, CH-TOR" ${esNuevo ? '' : 'readonly'}></div>

  `;

  abrirModal(
    esNuevo ? 'Nueva Especialidad / Tipo de Caja' : `Editar Especialidad · ${tipo.id}`,
    cuerpo,
    [
      { t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal },
      {
        t: 'Guardar caja',
        cls: 'btn-verde',
        fn: () => run(() => {
          const idVal = ($('tcId').value || '').trim().toUpperCase();
          const espVal = ($('tcEsp').value || '').trim();
          const nomVal = ($('tcNom').value || '').trim();
          const descVal = ($('tcDesc').value || '').trim();

          DB.cajasTipos = DB.cajasTipos || [];
          const dup = DB.cajasTipos.find(x => x.id === idVal && (esNuevo || x.id !== tipo.id));
          if (dup) throw new Error(`Ya existe un tipo de caja con el código "${idVal}".`);

          if (esNuevo) {
            DB.cajasTipos.push({
              id: idVal,
              especialidad: espVal || nomVal,
              icono: '🧰',
              nombre: nomVal,
              desc: descVal,
              estadoLista: 'PENDIENTE LISTA',
              activo: actVal,
              items: []
            });
            CAJA_LISTA_SEL = idVal;
            bit('TIPO DE CAJA CREADO', `${idVal} - ${nomVal}`);
          } else {
            const actual = tipoCajaDe(id);
            if (actual) {
              actual.especialidad = espVal || nomVal;
              actual.nombre = nomVal;
              actual.desc = descVal;
              actual.activo = actVal;
              bit('TIPO DE CAJA EDITADO', `${idVal} - ${nomVal}`);
            }

          guardar();
          cerrarModal();
          toast('Especialidad / caja guardada con éxito.', 'ok');
          refrescar();
        })
      }
    ]
  );
}

function sugerirSiguienteIdTipoCaja() {
  const tipos = DB.cajasTipos || [];
  let maxNum = tipos.length + 1;
  tipos.forEach(t => {
    const m = (t.id || '').match(/CH-(\d+)/i);
    if (m) {
      const num = parseInt(m[1]);
      if (num >= maxNum) maxNum = num + 1;
    }
  });
  return 'CH-' + String(maxNum).padStart(2, '0');
}

// Carga masiva de contenido de caja desde Excel (permite códigos existentes o herramientas nuevas)
function modalImportarContenidoCaja(tipoId) {
  leerArchivoTabla(filas => {
    if (!filas || !filas.length) return toast('El archivo está vacío o no tiene el formato correcto.', 'err');

    const itemsImportados = [];
    let maxId = DB.catalogo.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);

    filas.forEach((f, idx) => {
      let cod = String(f['Codigo'] || f['codigo'] || f['CÓDIGO'] || f['Código'] || '').trim().toUpperCase();
      const cant = Math.max(1, parseInt(f['Cantidad'] || f['cantidad'] || f['Cant'] || f['CANT'] || 1) || 1);
      const descExcel = String(f['Descripcion'] || f['descripcion'] || f['Descripción'] || f['Herramienta'] || f['HERRAMIENTA'] || '').trim();
      const umbExcel = String(f['Unidad'] || f['unidad'] || f['UMB'] || 'UND').trim().toUpperCase() || 'UND';

      if (cod || descExcel) {
        let itCat = cod ? DB.catalogo.find(c => (c.cod || '').toUpperCase() === cod) : null;
        if (!itCat && descExcel) {
          itCat = DB.catalogo.find(c => normTexto(c.desc) === normTexto(descExcel));
          if (itCat && !cod) cod = itCat.cod;
        }
        if (!cod) {
          cod = 'HE' + String(100300 + idx + 1).padStart(6, '0');
        }
        if (!itCat && descExcel) {
          itCat = { id: ++maxId, cod, desc: descExcel, mod: 'HERRAMIENTA', cat: 'General', marca: 'ESTÁNDAR', modelo: '', serial: '', umb: umbExcel, costo: 0, tipoA: false, talla: '', vida: 0, activo: true };
          DB.catalogo.push(itCat);
        }
        itemsImportados.push({
          cod,
          desc: itCat ? itCat.desc : (descExcel || cod),
          umb: itCat ? itCat.umb : umbExcel,
          cantReq: cant
        });
      }
    });

    if (!itemsImportados.length) {
      return toast('No se encontraron líneas válidas con "Codigo" o "Descripcion".', 'err');
    }

    const tipos = DB.cajasTipos || [];
    const selOpc = tipos.map(t => `<option value="${esc(t.id)}" ${t.id === tipoId ? 'selected' : ''}>${esc(t.id)} - ${esc(t.nombre)} (${esc(t.especialidad || '')})</option>`).join('');

    const cuerpo = `
      <p style="font-size:13px;margin:0 0 10px">Se leyeron <b>${itemsImportados.length} herramientas</b> del archivo Excel.</p>
      <div class="campo">
        <label>Asignar esta lista de herramientas a la caja / especialidad:</label>
        <select id="tcImpSel">
          ${selOpc}
          <option value="__NUEVO__">➕ Crear una nueva especialidad / caja con esta lista</option>
        </select>
      </div>
      <div class="campo" style="margin-top:8px">
        <label>Modo de carga:</label>
        <select id="tcImpModo">
          <option value="reemplazar">Reemplazar la lista actual de esa caja por la del archivo</option>
          <option value="sumar">Agregar / combinar con las herramientas que ya tiene la caja</option>
        </select>
      </div>
    `;

    abrirModal('Confirmar importación de lista de herramientas', cuerpo, [
      { t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal },
      {
        t: 'Importar lista',
        cls: 'btn-verde',
        fn: () => run(() => {
          const sel = $('tcImpSel').value;
          const modo = $('tcImpModo').value;
          if (sel === '__NUEVO__') {
            const nextId = sugerirSiguienteIdTipoCaja();
            DB.cajasTipos.push({
              id: nextId,
              especialidad: 'Especialidad ' + nextId,
              icono: '🧰',
              nombre: 'Caja ' + nextId,
              desc: 'Lista importada desde archivo Excel.',
              estadoLista: 'LISTA OFICIAL',
              activo: true,
              items: itemsImportados
            });
            CAJA_LISTA_SEL = nextId;
            bit('CARGA MASIVA TIPO DE CAJA', nextId + ' con ' + itemsImportados.length + ' herramientas');
          } else {
            const dest = tipoCajaDe(sel);
            if (dest) {
              if (modo === 'reemplazar') {
                dest.items = itemsImportados;
              } else {
                dest.items = dest.items || [];
                itemsImportados.forEach(imp => {
                  const ex = dest.items.find(x => x.cod.toUpperCase() === imp.cod.toUpperCase());
                  if (ex) ex.cantReq += imp.cantReq;
                  else dest.items.push(imp);
                });
              }
              dest.estadoLista = 'LISTA OFICIAL';
              CAJA_LISTA_SEL = dest.id;
              bit('CARGA MASIVA CONTENIDO CAJA', dest.id + ' con ' + itemsImportados.length + ' herramientas');
            }
          }
          guardar();
          cerrarModal();
          toast(`Se cargaron ${itemsImportados.length} herramientas con éxito.`, 'ok');
          refrescar();
        })
      }
    ]);
  });
}

function ir(id, param) {
  if (!S.u) return;
  if (typeof guardarEstadoVistaActual === 'function') guardarEstadoVistaActual();
  procesarVencimientos();
  const esMaestro = ['mRes', 'mKpi', 'mComp', 'mExp', 'mTraz', 'mAlert', 'mCajas', 'mCost', 'mAcc'].includes(id);
  if (esMaestro && !enMaestro()) { toast('Esta opción pertenece al Maestro.', 'err'); return; }
  if (!esMaestro && enMaestro() && id !== 'doc') { toast('Esta opción pertenece a los almacenes.', 'err'); return; }
  if (['aUsr', 'aProy', 'aCat', 'aIni', 'aConf', 'aBit', 'aResp'].includes(id) && !esCreadoraAdmin(S.u)) { toast('Solo la supervisora del sistema (Daniela Riveros) tiene acceso al módulo de Administración.', 'err'); return; }
  S.vista = id; S.param = param || null;
  const defMenu = menuDef();
  const grupoDestino = defMenu.find(([g, items]) => items.some(it => it && it[0] === id));
  if (grupoDestino) {
    MENU_GRUPOS_ABIERTOS[grupoDestino[0]] = true;
  }
  pintarMenu();
  $('menu').classList.remove('abierto');
  const fn = VISTAS[id];
  $('area').innerHTML = '';
  if (fn) run(() => fn(param));
  $('area').scrollTop = 0;
}

   (Solicitudes PRH / ASI, Transferencias, Daño, Robo / Extravío)
   ===================================================================== */
let F = null;
const OPC_MOV = () => {
  // Cada formulario muestra solo los movimientos que le corresponden
  if (F.tipo === 'TRF') return [['TRF', 'TRF - Transferencia']];
  if (F.tipo === 'DAN' || F.tipo === 'EXT') return [['DAN', 'DAN - Daño'], ['EXT', 'EXT - Robo / Extravío'], ['DEV', 'DEV - Devolución'], ['PLZ', 'PLZ - Extensión de plazo']];
  return [['PRH', 'PRH - Préstamo temporal'], ['ASI', 'ASI - Asignación']];
};
const RUTA_TIPO = { PRH: 'solNueva', ASI: 'solNueva', TRF: 'trfNueva', DEV: 'dev', DAN: 'mov', EXT: 'mov', PLZ: 'plz' };
function cambiarTipoMov(t) {
  if ((t === 'DAN' || t === 'EXT') && (F.tipo === 'DAN' || F.tipo === 'EXT')) { leerCabecera(); F.tipo = t; F.lineas.forEach(l => { if (t === 'DAN') l.cond = 'DAÑADO'; }); pintarFormulario(); return; }
  if ((t === 'PRH' || t === 'ASI') && (F.tipo === 'PRH' || F.tipo === 'ASI')) { leerCabecera(); F.tipo = t; if (t === 'PRH') F.lineas = F.lineas.filter(l => l.mod !== 'EPP'); pintarFormulario(); return; }
  ir(RUTA_TIPO[t], { tipo: t });
}
function nuevoF(tipo, extra) {
  let defDest = S.ctx;
  if (tipo === 'TRF') {
    defDest = (destinosPermitidos(S.ctx) || [])[0] || 'CENTRAL';
  } else if (tipo === 'PRH' || tipo === 'ASI') {
    const list = destinosParaAlmacen(S.ctx);
    defDest = list.length ? list[0].c : S.ctx;
  }
  return Object.assign({ tipo, num: null, origen: S.ctx, destino: defDest, resp: null, sup: '', proyecto: '', cuenta: '',

  } else {
    F.lineas.push(nueva);
    toast(`Línea agregada (${nueva.cod}).`, 'ok');
  }
  limpiarCaptura(); guardarBorradorFormularioActivo(); pintarLineas(); if ($('cCod')) $('cCod').focus();
}
function cambiarCantLinea(i, val) {
  const l = F.lineas[i];
  if (!l) return;
  const c = parseInt(val, 10);
  let extra = 0;
  if (F.lineasOriginales) {
    const orig = F.lineasOriginales.find(x => x.id === l.id && x.est === l.est);
    if (orig) extra = orig.cant;
  }
  const dispTotal = dispItem(F.origen, l.id, l.est) + (F.lineasOriginales ? extra : l.cant);
  if (isNaN(c) || c <= 0) {
    toast('La cantidad debe ser mayor a 0.', 'err');
    pintarLineas();
    return;
  }
  if (c > dispTotal) {
    toast(`Stock insuficiente en ${almNombre(F.origen)}. Máximo disponible: ${dispTotal} ${l.umb}.`, 'err');
    pintarLineas();
    return;
  }
  l.cant = c;
  guardarBorradorFormularioActivo();
  pintarTotales();
}
function cambiarCondLinea(i, cond) {
  if (F.hecho || F.valeRef) return;
  const l = F.lineas[i];
  if (!l) return;
  l.cond = cond;
  l.est = estDe(l.id ? item(l.id) : l, cond);
  guardarBorradorFormularioActivo();
  pintarTotales();
  toast(`Condición de ${l.cod} actualizada a ${cond}.`, 'ok');
}

function toggleSeleccionarLineaSol(i) {
  if (F.hecho || F.valeRef) return;
  if (F.sel === i) {
    limpiarCaptura();
    pintarLineas();
  } else {
    cargarParaEditarLineaSol(i);
  }
}

function eliminarLineaSeleccionada() {
  if (F.hecho || F.valeRef) return;
  const i = F.sel;
  if (i >= 0 && F.lineas && F.lineas[i]) {
    const l = F.lineas[i];
    F.lineas.splice(i, 1);
    limpiarCaptura();
    guardarBorradorFormularioActivo();
    pintarLineas();
    toast(`Línea eliminada (${l.cod}).`, 'info');
  } else {
    limpiarCaptura();
    toast('Campos limpiados.', 'info');
  }
}

function pintarLineas() {
  const conRef = !!F.valeRef, bloqueado = !!F.hecho;
  let filas;
  if (!F.lineas.length) filas = `<tr><td class="grid-vacio" colspan="${conRef ? 7 : 8}">${conRef ? 'El vale no tiene ítems con saldo pendiente.' : 'Aún no hay ítems. Busque por código o descripción y presione Salvar.'}</td></tr>`;
  else filas = F.lineas.map((l, i) => conRef ? `<tr>
      <td>${esc(l.cod)}</td><td>${esc(l.desc)}</td><td>${esc(limpiaTxt(l.marca || 'SIN MARCA'))} / ${esc(limpiaTxt(l.modelo))}</td><td>${esc(l.serial || '—')}</td><td>${esc(l.umb)}</td>
      <td class="cen">${l.saldo}</td><td class="cen"><input type="number" min="0" max="${l.saldo}" value="${l.cant}" ${bloqueado ? 'disabled' : ''} style="width:70px;padding:4px;text-align:center" onchange="F.lineas[${i}].cant=Math.max(0,Math.min(${l.saldo},Number(this.value)||0));this.value=F.lineas[${i}].cant;pintarTotales()"></td></tr>`
    : `<tr class="${F.sel === i ? 'sel' : ''}" style="cursor:${bloqueado ? 'default' : 'pointer'}" onclick="${bloqueado ? '' : `toggleSeleccionarLineaSol(${i})`}" title="${bloqueado ? '' : 'Haga clic para seleccionar y cargar datos, o deseleccionar'}">
      <td><b>${esc(l.cod)}</b></td><td>${esc(l.desc)}</td><td>${esc(limpiaTxt(l.marca || 'SIN MARCA'))} / ${esc(limpiaTxt(l.modelo))}</td><td>${esc(l.serial || '—')}</td><td>${esc(l.cat)}</td><td>${esc(l.umb)}</td>
      <td class="cen" onclick="event.stopPropagation()">
        ${bloqueado
          ? esc(l.cond)
          : `<select style="padding:2px 4px;font-size:11px;font-weight:700;border-radius:4px" onchange="cambiarCondLinea(${i}, this.value)" title="Cambiar condición de este ítem">${opciones((l.mod === 'CILINDRO' ? ['LLENO', 'VACÍO', 'DAÑADO'] : ['ÓPTIMO', 'NUEVO', 'DAÑADO']), l.cond)}</select>`
        }
      </td>
      <td class="cen" onclick="event.stopPropagation()">${bloqueado || tieneSerial(l.serial) ? `<b>${l.cant}</b>` : `<input type="number" min="1" max="${dispItem(F.origen, l.id, l.est) + (F.lineasOriginales ? ((F.lineasOriginales.find(x => x.id === l.id && x.est === l.est) || {}).cant || l.cant) : l.cant)}" value="${l.cant}" style="width:60px;padding:3px;text-align:center;font-weight:700" onchange="cambiarCantLinea(${i}, this.value)">`}</td>
      </tr>`).join('');
  const th = conRef ? '<th>Código</th><th>Descripción</th><th>Marca / Modelo</th><th>Serial</th><th>Unidad</th><th class="cen">Saldo</th><th class="cen">Cantidad</th>'
    : '<th>Código</th><th>Descripción</th><th>Marca / Modelo</th><th>Serial</th><th>Categoría</th><th>Unidad</th><th>Condición</th><th class="cen">Cantidad</th>';
  $('fLineas').innerHTML = `<div style="overflow:auto"><table class="grid"><thead><tr>${th}</tr></thead><tbody>${filas}</tbody></table></div>`;
  pintarTotales();
}
function pintarTotales() {
  const lin = F.lineas.filter(l => l.cant > 0);
  $('fTotales').innerHTML = `Total de líneas: <b>${lin.length}</b> · Total de unidades: <b>${lin.reduce((a, l) => a + l.cant, 0)}</b>${!F.valeRef && !F.hecho && F.lineas.length ? ' · Puede eliminar o ajustar la cantidad de cualquier ítem' : ''}`;
}
function eliminarLinea(i) {
  const l = F.lineas[i];
  if (!l) return;
  confirmar(`¿Eliminar la línea <b>${esc(l.cod)} · ${esc(l.desc)}</b> (${l.cant} ${esc(l.umb)})?`, () => {
    F.lineas.splice(i, 1);
    F.sel = -1;
    guardarBorradorFormularioActivo();
    pintarLineas();
    if ($('cCod')) $('cCod').focus();

}
function finalizarFormulario(finalizar) {
  leerCabecera();
  run(() => {
    const t = F.tipo;
    if (t === 'PRH' || t === 'ASI') {
      const res = emitirValeDirecto({ num: F.num, tipo: t, origen: F.origen, destino: F.destino, resp: F.resp, sup: F.sup, proyecto: F.proyecto, cuenta: F.cuenta, fechaReq: F.fechaReq, fechaDev: F.fechaDev, fechaAsig: F.fechaAsig, obs: F.obs, lineas: F.lineas });
      toast(`Vale ${res.vale.num} emitido exitosamente. Listo para imprimir y firmar.`, 'ok');
      if (typeof BORRADORES !== 'undefined' && BORRADORES.sol) delete BORRADORES.sol[F.origen || S.ctx];
      try { localStorage.removeItem(draftKeySol(F.origen || S.ctx)); } catch(e) {}
      ir('doc', { num: res.vale.num, alm: res.vale.origen, back: 'sol' });
    } else if (t === 'TRF') {
      if (F.num) {
        const v = actualizarTransferencia(F.num, {
          origen: F.origen,
          destino: F.destino,
          resp: F.resp,
          sup: F.sup,
          proyecto: F.proyecto,
          cuenta: F.cuenta,
          despacha: F.despacha || S.u.nombre,
          salidaTimaca: F.salidaTimaca || '',
          obs: F.obs,
          lineas: F.lineas
        });
        toast(`Transferencia ${v.num} actualizada exitosamente.`, 'ok');
        ir('trfEnv', { sel: v.num });
      } else {
        const v = crearTransferencia({
          origen: F.origen,
          destino: F.destino,
          resp: F.resp,
          sup: F.sup,
          proyecto: F.proyecto,
          cuenta: F.cuenta,
          despacha: F.despacha || S.u.nombre,
          salidaTimaca: F.salidaTimaca || '',
          obs: F.obs,
          lineas: F.lineas
        });
        if (typeof BORRADORES !== 'undefined' && BORRADORES.trf) delete BORRADORES.trf[F.origen || S.ctx];
        try { localStorage.removeItem(draftKeyTrf(F.origen || S.ctx)); } catch(e) {}
        F.hecho = v.num; toast(`Transferencia ${v.num} registrada. Pendiente de recepción en ${almNombre(v.destino)}.`, 'ok'); pintarMenu(); pintarFormulario();
      }
    } else {
      const lineas = F.valeRef ? F.lineas.filter(l => l.cant > 0) : F.lineas;
      if (!F.valeRef && t !== 'TRF' && !F.resp) throw new Error('Seleccione el responsable custodio desde la lista de personal.');
      const v = registrarIncidencia(t, { origen: F.origen, valeRef: F.valeRef, resp: F.resp, sup: F.sup, proyecto: F.proyecto, cuenta: F.cuenta, detalle: F.detalle, malUso: F.malUso, dictamen: F.dictamen, obs: F.obs, lineas });
      F.hecho = v.num; toast(`${TIPOS[t].n} registrado: ${v.num}.`, 'ok'); pintarFormulario();
    }
  });
}

function cambiarTipoSol(t) {

  guardarBorradorSol();
  if (t === 'PRH' && F.lineas.some(l => l.mod === 'EPP')) { F.lineas = F.lineas.filter(l => l.mod !== 'EPP'); toast('Se retiraron las líneas de EPP: el EPP no se presta, se registra como asignación.', 'err'); }

function bindResponsableProyecto() {

    bindAC('fResp', fuentePersonal, p => {
      F.resp = { nombre: p.nombre, cedula: p.cedula, cargo: p.cargo };
      if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
      $('fResp').value = p.nombre;
      if ($('fCed')) $('fCed').value = p.cedula || 'S/C';
      if ($('fCargo')) $('fCargo').value = p.cargo;
    }, { alFoco: true });

    $('fResp').addEventListener('change', () => {
      const val = $('fResp').value.trim();
      if (!val) {
        F.resp = null;
        if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
        if ($('fCed')) $('fCed').value = '';
        if ($('fCargo')) $('fCargo').value = '';
        return;
      }
      const match = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('RESPONSABLE') &&
        (S.ctx === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(S.ctx)) &&
        (normTexto(p.nombre) === normTexto(val) || (digitosCI(val).length >= 5 && digitosCI(p.cedula) === digitosCI(val))));
      if (match) {
        F.resp = { nombre: match.nombre, cedula: match.cedula, cargo: match.cargo };
        if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
        $('fResp').value = match.nombre;
        if ($('fCed')) $('fCed').value = match.cedula || 'S/C';
        if ($('fCargo')) $('fCargo').value = match.cargo;
      } else {
        F.resp = null;
        if ($('fCed')) $('fCed').value = '';
        if ($('fCargo')) $('fCargo').value = '';
        toast(`"${val}" no está registrado como responsable en ${almNombre(S.ctx)}. Seleccione de la lista oficial.`, 'err');
      }
    });

  if ($('fSup')) {
    bindAC('fSup', fuenteSupervisores, p => {
      F.sup = p.nombre;
      if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
      $('fSup').value = p.nombre;
    }, { alFoco: true });

    $('fSup').addEventListener('change', () => {
      const val = $('fSup').value.trim();

        F.sup = '';
        if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();

      }
      const supMatch = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('SUPERVISOR') &&
        (S.ctx === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(S.ctx)) &&
        normTexto(p.nombre) === normTexto(val));
      if (supMatch) {
        F.sup = supMatch.nombre;
        if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
        $('fSup').value = supMatch.nombre;
      } else {
        F.sup = '';
        toast(`"${val}" no es un supervisor autorizado para ${almNombre(S.ctx)}. Seleccione de la lista.`, 'err');
      }
    });

  if ($('fProy')) {
    bindAC('fProy', fuenteProyectos, p => {
      F.proyecto = p.nombre;
      F.cuenta = p.cuenta;
      if (typeof guardarBorradorFormularioActivo === 'function') guardarBorradorFormularioActivo();
      $('fProy').value = p.nombre;
      if ($('fCuenta')) $('fCuenta').value = p.cuenta;

    $('fProy').addEventListener('change', () => {
      const val = $('fProy').value.trim();

      if (p) {

/* =====================================================================
   ENTRADA DE ÍTEMS AL CATÁLOGO DEL ALMACÉN
   ===================================================================== */
let E = null;
function draftKeyEnt(ctx) {
  return 'TIMACA_DRAFT_ENT_' + (ctx || (typeof S !== 'undefined' && S && S.ctx ? S.ctx : 'CENTRAL'));
}

function tieneBorradorEnt(ctx) {
  ctx = ctx || (typeof S !== 'undefined' && S && S.ctx ? S.ctx : 'CENTRAL');
  const mem = BORRADORES.ent[ctx];
  if (mem && ((mem.lineas && mem.lineas.length > 0) || (mem.obs && mem.obs.trim()) || (mem.cap && (mem.cap.cod || mem.cap.desc || mem.cap.serial)))) return true;
  try {
    const s = localStorage.getItem(draftKeyEnt(ctx));
    if (s) {
      const p = JSON.parse(s);
      return (p.lineas && p.lineas.length > 0) || (p.obs && p.obs.trim()) || (p.cap && (p.cap.cod || p.cap.desc || p.cap.serial));
    }
  } catch(e) {}
  return false;
}

function guardarBorradorEntrada() {
  try {
    if (!E || E.hecho) return;
    const ctx = typeof S !== 'undefined' && S && S.ctx ? S.ctx : 'CENTRAL';
    const obs = $('enObs') ? $('enObs').value : (E.obs || '');
    E.obs = obs;
    const cap = {
      cod: $('eCod') ? $('eCod').value.trim() : '',
      desc: $('eDesc') ? $('eDesc').value.trim() : '',
      mod: $('eMod') ? $('eMod').value : 'HERRAMIENTA',
      cat: $('eCat') ? $('eCat').value : 'Herramientas manuales',
      umb: $('eUmb') ? $('eUmb').value : 'UND',
      marca: $('eMarca') ? $('eMarca').value.trim() : '',
      modelo: $('eModelo') ? $('eModelo').value.trim() : '',
      serial: $('eSerial') ? $('eSerial').value.trim() : '',
      cond: $('eCond') ? $('eCond').value : 'ÓPTIMO',
      cant: $('eCant') ? $('eCant').value : '1',
      base: E.base || null,
      editIdx: (typeof E.editIdx === 'number') ? E.editIdx : -1
    };

    const tieneDatos = (E.lineas && E.lineas.length > 0) ||
      obs.trim().length > 0 ||
      cap.cod.length > 0 ||
      cap.desc.length > 0 ||
      cap.serial.length > 0;

    const k = draftKeyEnt(ctx);
    if (tieneDatos) {
      const payload = {
        lineas: E.lineas || [],
        obs: obs,
        cap: cap,
        fecha: nowISO()
      };
      BORRADORES.ent[ctx] = payload;
      localStorage.setItem(k, JSON.stringify(payload));
    } else {
      delete BORRADORES.ent[ctx];
      localStorage.removeItem(k);
    }
  } catch(e) {}
}

function descartarBorradorEntrada() {
  if (!confirm('¿Desea descartar y limpiar todos los datos y líneas de este borrador de entrada?')) return;
  const ctx = typeof S !== 'undefined' && S && S.ctx ? S.ctx : 'CENTRAL';
  delete BORRADORES.ent[ctx];
  try { localStorage.removeItem(draftKeyEnt(ctx)); } catch(e) {}
  E = { lineas: [], obs: '', sel: -1, editIdx: -1, hecho: null, base: null };
  toast('Borrador descartado.', 'info');
  refrescar();
}

VISTAS.ent = () => {
  let draft = null;
  const ctx = typeof S !== 'undefined' && S && S.ctx ? S.ctx : 'CENTRAL';
  if (BORRADORES.ent[ctx]) draft = BORRADORES.ent[ctx];
  else {
    try {
      const dStr = localStorage.getItem(draftKeyEnt(ctx));
      if (dStr) draft = JSON.parse(dStr);
    } catch(e) {}
  }
  if (draft) {
    E = {
      lineas: draft.lineas || [],
      obs: draft.obs || '',
      sel: -1,
      editIdx: (draft.cap && typeof draft.cap.editIdx === 'number') ? draft.cap.editIdx : -1,
      hecho: null,
      base: (draft.cap && draft.cap.base) ? draft.cap.base : null,
      _capDraft: draft.cap || null
    };
  } else {
    E = { lineas: [], obs: '', sel: -1, editIdx: -1, hecho: null, base: null };
  }
  pintarEntrada();
};

function pintarEntrada() {
  const bloq = !!E.hecho, ro = bloq ? 'disabled' : '';
  const umbs = [...new Set(DB.catalogo.map(i => i.umb))].sort();
  const esEdicion = E && E.editIdx >= 0;
  const linEd = esEdicion ? E.lineas[E.editIdx] : null;

  $('area').innerHTML = cab('➕ Entrada de ítems al catálogo', 'Registre herramientas, cilindros o EPP que ingresan al almacén. Si el código ya existe se suma la cantidad; si es nuevo, se crea en el catálogo. Cada vez que inserte un registro, los cuadros se limpian automáticamente para el siguiente.')
    + (E.hecho ? `<div class="franja-est verde"><span>Entrada <b>${E.hecho}</b> registrada. Los ítems ya aparecen en el catálogo de ${esc(almNombre(S.ctx))}.</span><span><button class="btn btn-claro btn-mini" onclick="ir('cCatAlm')">Ver catálogo</button></span></div>` : '')
    + (!E.hecho && tieneBorradorEnt(S.ctx) ? `<div class="franja-est naranja" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between"><span>💾 <b>Borrador protegido:</b> Tiene datos cargados en curso en ${esc(almNombre(S.ctx))}${E.lineas && E.lineas.length ? ` (${E.lineas.length} ítem(s))` : ''}. No se perderán si navega a otros módulos o recarga la página.</span><span><button class="btn btn-claro btn-mini" onclick="descartarBorradorEntrada()">🗑️ Descartar borrador</button></span></div>` : '')
    + `<div class="form-reg"><div class="f3">
      ${campo('Almacén', `<input value="${esc(almNombre(S.ctx))}" readonly>`)}${campo('Fecha', `<input value="${fF(nowISO())}" readonly>`)}${campo('Registrado por', `<input value="${esc(S.u.nombre)}" readonly>`)}
      ${campo('Observación', `<input id="enObs" ${ro} placeholder="Opcional" value="${esc((E && E.obs) || '')}" oninput="if(E){E.obs=this.value;guardarBorradorEntrada();}">`)}
    </div>
    <div class="carga" id="cargaEntrada">
      <div class="carga-h" id="eCargaH">ÍTEM A INGRESAR</div>
      ${bloq ? '' : `<div style="padding:12px;border-bottom:1px solid var(--borde)"><div class="f3" style="grid-template-columns:repeat(6,1fr)">
        <div class="campo" style="position:relative"><label>Código</label><input id="eCod" autocomplete="off" placeholder="Nuevo o existente"></div>
        <div class="campo" style="grid-column:span 2"><label>Descripción</label><input id="eDesc"></div>
        ${campo('Módulo', `<select id="eMod" onchange="cambioModEntrada()">${opciones(Object.entries(MODULOS))}</select>`)}
        ${campo('Categoría', `<select id="eCat" onchange="cambioCatEntrada()">${opciones(CATEGORIAS_OFICIALES, 'Herramientas manuales')}</select>`)}
        ${campo('Unidad', `<select id="eUmb">${opciones(UMBS_OFICIALES, 'UND')}</select>`)}
        ${campo('Marca', `<input id="eMarca" placeholder="Ej. STANLEY (o en blanco para SIN MARCA)">`)}
        ${campo('Modelo', `<input id="eModelo">`)}
        ${campo('Serial (ítem único)', `<input id="eSerial" placeholder="Opcional">`)}
        ${campo('Condición', `<select id="eCond"></select>`)}
        ${campo('Cantidad', `<input id="eCant" type="number" min="1" value="1" style="text-align:center;font-weight:800">`)}
        <div class="campo" style="justify-content:flex-end;gap:8px" id="eBtnArea">
          <label>&nbsp;</label>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-sip-salvar" id="btnSalvarEnt" onclick="salvarLineaEntrada()" title="Salvar nuevo ítem o guardar cambios al seleccionado">Salvar</button>
            <button type="button" class="btn btn-sip-eliminar" id="btnEliminarEnt" onclick="eliminarLineaEntradaSeleccionada()" title="Eliminar ítem seleccionado o limpiar campos">Eliminar</button>
          </div>
        </div>
      </div></div>`}
      <div id="eLineas"></div></div>
    <div class="pie-form"><div class="totales" id="eTot"></div><div class="der">
      ${bloq ? `<button class="btn btn-claro" onclick="ir('ent')">Nueva entrada</button>` : `<button class="btn btn-claro" onclick="ir('cCatAlm')">Cancelar</button><button class="btn btn-verde" onclick="registrarEntradaUI()">✔ Registrar entrada</button>`}
      <button class="btn btn-azul" ${bloq ? '' : 'disabled'} onclick="imprimirVale('${E.hecho || ''}')">🖨 Imprimir vale</button>
    </div></div></div>`;

  if (!bloq) {
    condEntrada();
    bindAC('eCod', q => {
      q = q.trim().toLowerCase();
      if (q.length < 2) return [];
      const g = {};
      const idsAlm = new Set(Object.keys(DB.exi[S.ctx] || {}).map(Number));
      DB.catalogo.filter(i => idsAlm.has(i.id) && (i.cod + ' ' + i.desc).toLowerCase().includes(q)).forEach(i => g[i.cod] = g[i.cod] || i);
      return Object.values(g).slice(0, 15).map(i => ({
        val: i,
        html: `<b>${esc(i.cod)}</b> · ${esc(i.desc)}<small>${esc(MODULOS[i.mod])} · ${esc(i.cat)} · código en ${esc(almNombre(S.ctx))}</small>`
      }));
    }, i => {
      E.base = i;
      $('eCod').value = i.cod;
      $('eDesc').value = i.desc;
      $('eMod').value = i.mod;
      $('eCat').value = i.cat;
      if ($('eUmb')) {
        if (!UMBS_OFICIALES.includes(i.umb)) $('eUmb').innerHTML = opciones(UMBS_OFICIALES.concat([i.umb]), i.umb);
        else $('eUmb').value = i.umb;
      }
      condEntrada();
      $('eMarca').focus();
    });

    $('eCod').addEventListener('input', () => {
      if (E.base) E.base = null;
    });
  }

  if (esEdicion && linEd) {
    $('eCod').value = linEd.cod;
    $('eDesc').value = linEd.desc;
    $('eMod').value = linEd.mod;
    $('eCat').value = linEd.cat;
    $('eUmb').value = linEd.umb;
    $('eMarca').value = linEd.marca;
    $('eModelo').value = linEd.modelo === '—' ? '' : linEd.modelo;
    $('eSerial').value = linEd.serial || '';
    condEntrada();
    $('eCond').value = linEd.cond;
    $('eCant').value = linEd.cant;
  } else if (E && E._capDraft && !bloq) {
    const cd = E._capDraft;
    if (cd.cod && $('eCod')) $('eCod').value = cd.cod;
    if (cd.desc && $('eDesc')) $('eDesc').value = cd.desc;
    if (cd.mod && $('eMod')) $('eMod').value = cd.mod;
    if (cd.cat && $('eCat')) $('eCat').value = cd.cat;
    if (cd.umb && $('eUmb')) $('eUmb').value = cd.umb;
    if (cd.marca && $('eMarca')) $('eMarca').value = cd.marca;
    if (cd.modelo && $('eModelo')) $('eModelo').value = cd.modelo;
    if (cd.serial && $('eSerial')) $('eSerial').value = cd.serial;
    condEntrada();
    if (cd.cond && $('eCond')) $('eCond').value = cd.cond;
    if (cd.cant && $('eCant')) $('eCant').value = cd.cant;
    E._capDraft = null;
  }

  if (!bloq) {
    ['eCod', 'eDesc', 'eMod', 'eCat', 'eUmb', 'eMarca', 'eModelo', 'eSerial', 'eCond', 'eCant', 'enObs'].forEach(id => {
      const el = $(id);
      if (el) {
        el.addEventListener('input', guardarBorradorEntrada);
        el.addEventListener('change', guardarBorradorEntrada);
      }
    });
  }

  pintarLineasEntrada();
}

function condEntrada() {
  if ($('eCond')) {
    const esCil = $('eMod') && $('eMod').value === 'CILINDRO';
    $('eCond').innerHTML = opciones(esCil ? ['LLENO', 'VACÍO'] : ['NUEVO', 'ÓPTIMO']);
  }
}

function cambioCatEntrada() {
  const cat = $('eCat').value;
  if (cat === 'Cilindros y gases') {
    $('eMod').value = 'CILINDRO';
  } else if (cat === 'EPP') {
    $('eMod').value = 'EPP';
  } else if (cat === 'Otros') {
    $('eMod').value = 'MISCELANEO';
  } else {
    $('eMod').value = 'HERRAMIENTA';
  }
  condEntrada();
}

function cambioModEntrada() {
  const mod = $('eMod').value;
  if (mod === 'CILINDRO') {
    $('eCat').value = 'Cilindros y gases';
  } else if (mod === 'EPP') {
    $('eCat').value = 'EPP';
  } else if (mod === 'MISCELANEO') {
    $('eCat').value = 'Otros';
  } else {
    if ($('eCat').value === 'Cilindros y gases' || $('eCat').value === 'EPP' || $('eCat').value === 'Otros') {
      $('eCat').value = 'Herramientas manuales';
    }
  }
  condEntrada();
}

function guardarEntradaDirecta() {
  run(() => {
    const cod = $('eCod').value.trim().toUpperCase(), desc = $('eDesc').value.trim(), serial = $('eSerial').value.trim().toUpperCase(), cant = Number($('eCant').value);
    if (!cod || !desc) throw new Error('Código y descripción son obligatorios.');
    if (!Number.isInteger(cant) || cant <= 0) throw new Error('La cantidad debe ser un número entero mayor que cero.');
    if (tieneSerial(serial) && cant !== 1) throw new Error('Un ítem con serial único solo admite cantidad 1.');

    const l = {
      cod,
      desc,
      mod: $('eMod').value,
      cat: $('eCat').value.trim() || 'Herramientas manuales',
      umb: $('eUmb').value.trim() || 'UND',
      marca: $('eMarca').value.trim().toUpperCase() || 'SIN MARCA',
      modelo: $('eModelo').value.trim() || '—',
      serial: tieneSerial(serial) ? serial : '—',
      cond: $('eCond').value,
      cant
    };

    const v = registrarEntrada({ origen: S.ctx, lineas: [l], obs: $('enObs') ? $('enObs').value.trim() : '' });
    toast(`✅ ${l.cod} registrado en el catálogo de ${almNombre(S.ctx)} (Vale ${v.num}).`, 'ok');
    ir('cCatAlm');
  });
}

function agregarEntrada() {
  run(() => {
    const cod = $('eCod').value.trim().toUpperCase(), desc = $('eDesc').value.trim(), serial = $('eSerial').value.trim().toUpperCase(), cant = Number($('eCant').value);
    if (!cod || !desc) throw new Error('Código y descripción son obligatorios.');
    const idsAlm = new Set(Object.keys(DB.exi[S.ctx] || {}).map(Number));
    const existente = DB.catalogo.find(i => idsAlm.has(i.id) && i.cod === cod);
    if (existente && !E.base && existente.desc.toLowerCase() !== desc.toLowerCase()) {
      // Si el código ya existe en este almacén con otra redacción, sugerir sin bloquear
      if (confirm(`El código ${cod} ya existe en el catálogo de ${almNombre(S.ctx)} como "${existente.desc}".\n\n¿Desea usar esa descripción?\n(Cancelar para conservar su descripción nueva: "${desc}")`)) {
        $('eDesc').value = existente.desc;
      }
    }
    if (!Number.isInteger(cant) || cant <= 0) throw new Error('La cantidad debe ser un número entero mayor que cero.');
    if (tieneSerial(serial)) {
      if (cant !== 1) throw new Error('Un ítem con serial único solo admite cantidad 1.');
      const it = DB.catalogo.find(i => tieneSerial(i.serial) && i.serial.toUpperCase() === serial);
      if (it && DB.almacenes.some(a => DB.exi[a.c] && DB.exi[a.c][it.id] && totalExi(DB.exi[a.c][it.id]) > 0)) throw new Error(`El serial ${serial} ya existe con existencia en el sistema.`);
      if (E.lineas.some(l => tieneSerial(l.serial) && l.serial.toUpperCase() === serial)) throw new Error('Ese serial ya está en la entrada.');
    }
    const base = E.base || existente;
    const l = {
      cod,
      desc: desc || (base ? base.desc : ''),
      mod: $('eMod').value,
      cat: $('eCat').value.trim() || 'Herramientas manuales',
      umb: $('eUmb').value.trim() || 'UND',
      marca: $('eMarca').value.trim().toUpperCase() || 'SIN MARCA',
      modelo: $('eModelo').value.trim() || '—',
      serial: tieneSerial(serial) ? serial : '—',
      cond: $('eCond').value,
      cant
    };
    const dup = E.lineas.find(x => !tieneSerial(x.serial) && !tieneSerial(serial) && x.cod === l.cod && x.marca === l.marca && x.modelo === l.modelo && x.cond === l.cond && x.cat === l.cat);
    if (dup) dup.cant += cant; else E.lineas.push(l);

    limpiarFormularioEntrada();
    guardarBorradorEntrada();
    pintarLineasEntrada();
    toast('Ítem agregado a la entrada.', 'ok');
  });
}

function cargarParaEditarEntrada(i) {
  if (E.hecho) return;
  const l = E.lineas[i];
  if (!l) return;
  E.editIdx = i;
  E.sel = i;

  $('eCod').value = l.cod;
  $('eDesc').value = l.desc;
  $('eMod').value = l.mod;
  $('eCat').value = l.cat;
  $('eUmb').value = l.umb;
  $('eMarca').value = l.marca;
  $('eModelo').value = l.modelo === '—' ? '' : l.modelo;
  $('eSerial').value = l.serial || '';
  condEntrada();
  $('eCond').value = l.cond;
  $('eCant').value = l.cant;

  const h = $('eCargaH');
  if (h) {
    h.textContent = 'ÍTEM A INGRESAR';
    h.style.background = '';
    h.style.color = '';
  }

  const btnArea = $('eBtnArea');
  if (btnArea) {
    btnArea.innerHTML = `<label>&nbsp;</label><div style="display:flex;gap:8px"><button type="button" class="btn btn-sip-salvar" id="btnSalvarEnt" onclick="salvarLineaEntrada()" title="Salvar nuevo ítem o guardar cambios al seleccionado">Salvar</button><button type="button" class="btn btn-sip-eliminar" id="btnEliminarEnt" onclick="eliminarLineaEntradaSeleccionada()" title="Eliminar ítem seleccionado o limpiar campos">Eliminar</button></div>`;
  }

  pintarLineasEntrada();

  const c = $('cargaEntrada');
  if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function guardarEdicionEntrada() {
  run(() => {
    if (E.editIdx < 0 || !E.lineas[E.editIdx]) throw new Error('No hay línea seleccionada para editar.');
    const cod = $('eCod').value.trim().toUpperCase(), desc = $('eDesc').value.trim(), serial = $('eSerial').value.trim().toUpperCase(), cant = Number($('eCant').value);
    if (!cod || !desc) throw new Error('Código y descripción son obligatorios.');
    if (!Number.isInteger(cant) || cant <= 0) throw new Error('La cantidad debe ser un número entero mayor que cero.');

    if (tieneSerial(serial)) {
      if (cant !== 1) throw new Error('Un ítem con serial único solo admite cantidad 1.');
      const it = DB.catalogo.find(i => tieneSerial(i.serial) && i.serial.toUpperCase() === serial);
      if (it && DB.almacenes.some(a => DB.exi[a.c] && DB.exi[a.c][it.id] && totalExi(DB.exi[a.c][it.id]) > 0)) throw new Error(`El serial ${serial} ya existe con existencia en el sistema.`);
      if (E.lineas.some((l, idx) => idx !== E.editIdx && tieneSerial(l.serial) && l.serial.toUpperCase() === serial)) throw new Error('Ese serial ya está en otra línea de la entrada.');
    }

    E.lineas[E.editIdx] = {
      cod,
      desc,
      mod: $('eMod').value,
      cat: $('eCat').value.trim() || 'Herramientas manuales',
      umb: $('eUmb').value.trim() || 'UND',
      marca: $('eMarca').value.trim().toUpperCase() || 'SIN MARCA',
      modelo: $('eModelo').value.trim() || '—',
      serial: tieneSerial(serial) ? serial : '—',
      cond: $('eCond').value,
      cant
    };

    limpiarFormularioEntrada();
    guardarBorradorEntrada();
    pintarLineasEntrada();
    toast('Ítem actualizado con éxito.', 'ok');
  });
}

function cancelarEdicionEntrada() {
  limpiarFormularioEntrada();
  pintarLineasEntrada();
}

function eliminarLineaEntrada(i) {
  if (E.hecho) return;
  E.lineas.splice(i, 1);
  if (E.editIdx === i) limpiarFormularioEntrada();
  else if (E.editIdx > i) E.editIdx--;
  guardarBorradorEntrada();
  pintarLineasEntrada();
  toast('Línea eliminada.', 'info');
}

function limpiarFormularioEntrada() {
  E.editIdx = -1;
  E.sel = -1;
  E.base = null;

  ['eCod', 'eDesc', 'eMarca', 'eModelo', 'eSerial'].forEach(x => { if ($(x)) $(x).value = ''; });
  if ($('eCant')) $('eCant').value = '1';
  if ($('eMod')) $('eMod').value = 'HERRAMIENTA';
  if ($('eCat')) $('eCat').value = 'Herramientas manuales';
  if ($('eUmb')) $('eUmb').value = 'UND';
  condEntrada();

  const h = $('eCargaH');
  if (h) {
    h.textContent = 'ÍTEM A INGRESAR';
    h.style.background = '';
    h.style.color = '';
  }

  const btnArea = $('eBtnArea');
  if (btnArea) {
    btnArea.innerHTML = `<label>&nbsp;</label><div style="display:flex;gap:8px"><button type="button" class="btn btn-sip-salvar" onclick="salvarLineaEntrada()">Salvar</button><button type="button" class="btn btn-sip-eliminar" onclick="eliminarLineaEntradaSeleccionada()">Eliminar</button></div>`;
  }

  if (typeof guardarBorradorEntrada === 'function') guardarBorradorEntrada();
  if ($('eCod')) $('eCod').focus();
}

function toggleSeleccionarLineaEntrada(i) {
  if (E.hecho) return;
  if (E.sel === i) {
    limpiarFormularioEntrada();
    pintarLineasEntrada();
  } else {
    cargarParaEditarEntrada(i);
  }
}

function salvarLineaEntrada() {
  if (E.editIdx >= 0) {
    guardarEdicionEntrada();
  } else {
    agregarEntrada();
  }
}

function eliminarLineaEntradaSeleccionada() {
  if (E.sel >= 0 && E.lineas && E.lineas[E.sel]) {
    eliminarLineaEntrada(E.sel);
  } else {
    limpiarFormularioEntrada();
    toast('Campos limpiados.', 'info');
  }
}

function pintarLineasEntrada() {
  const bloq = !!E.hecho;
  $('eLineas').innerHTML = `<div style="overflow:auto"><table class="grid"><thead><tr>
    <th>Código</th><th>Descripción</th><th>Módulo</th><th>Categoría</th><th>Unidad</th><th>Marca / Modelo</th><th>Serial</th><th>Condición</th><th class="cen">Cantidad</th>
  </tr></thead><tbody>
    ${E.lineas.length ? E.lineas.map((l, i) => `
      <tr class="${E.sel === i ? 'sel' : ''}" style="cursor:${bloq ? 'default' : 'pointer'}" onclick="${bloq ? '' : `toggleSeleccionarLineaEntrada(${i})`}" title="${bloq ? '' : 'Haga clic para seleccionar/cargar datos o deseleccionar'}">
        <td><b>${esc(l.cod)}</b></td>
        <td>${esc(l.desc)}</td>
        <td>${chipMod(l.mod)}</td>
        <td>${esc(l.cat)}</td>
        <td>${esc(l.umb)}</td>
        <td>${esc(limpiaTxt(l.marca || 'SIN MARCA'))} / ${esc(limpiaTxt(l.modelo))}</td>
        <td>${esc(l.serial || '—')}</td>
        <td>${esc(l.cond)}</td>
        <td class="cen"><b>${l.cant}</b></td>
      </tr>`).join('')
      : `<tr><td class="grid-vacio" colspan="9">Agregue los ítems que ingresan al almacén.</td></tr>`}
  </tbody></table></div>`;

  $('eTot').innerHTML = `Total de líneas: <b>${E.lineas.length}</b> · Total de unidades: <b>${E.lineas.reduce((a, l) => a + l.cant, 0)}</b>${E.lineas.length && !bloq ? ' · Haga clic en cualquier registro para editarlo o corregirlo' : ''}`;
}

function registrarEntradaUI() {
  run(() => {
    if (!E.lineas.length && $('eCod') && $('eCod').value.trim() && $('eDesc') && $('eDesc').value.trim()) {
      agregarEntrada();
    }
    if (!E.lineas.length) throw new Error('Agregue al menos un ítem a la entrada.');
    const v = registrarEntrada({ origen: S.ctx, lineas: E.lineas, obs: $('enObs') ? $('enObs').value.trim() : '' });
    if (typeof BORRADORES !== 'undefined' && BORRADORES.ent) delete BORRADORES.ent[S.ctx];
    try { localStorage.removeItem(draftKeyEnt(S.ctx)); } catch(e) {}
    E.hecho = v.num;
    toast(`✅ Entrada ${v.num} registrada en ${almNombre(S.ctx)} con ${v.lineas.length} ítem(s).`, 'ok');
    pintarEntrada();
  });
}

/* =====================================================================
   VISTA DE SOLO LECTURA (igual al formulario) PARA SOLICITUDES Y VALES
   ===================================================================== */
VISTAS.doc = p => {
  const esSol = p.num && p.num.startsWith('SOL-');
  const alm = p.alm || (typeof S !== 'undefined' && S && S.ctx ? S.ctx : null);
  const d = esSol ? solDe(p.num, alm) : (valeDe(p.num, alm, p.sol) || (p.sol ? solDe(p.sol, alm) : null));
  if (!d) { $('area').innerHTML = cab('Documento no encontrado'); return; }
  if (!enMaestro() && !S.u.admin && d.origen !== S.ctx && d.destino !== S.ctx) { $('area').innerHTML = cab('Acceso no permitido') + avisoSinPermiso('Este documento pertenece a otro almacén.'); return; }
  const t = d.tipo, est = esSol ? formatoEstSol(d.estatus) : (t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' ? 'POR ACEPTAR' : estadoVale(d));
  const color = EST_COLOR[est] === 'ambar' ? 'naranja' : (EST_COLOR[est] || 'gris');

  const und = d.lineas.reduce((a, l) => a + l.cant, 0);
  const acciones = accionesDoc(d, esSol, p);
  const nota = esSol ? ((d.estatus === 'FINALIZADO' || d.estatus === 'PENDIENTE DE APROBACIÓN') ? motivoNoAprueba(d) : (d.estatus === 'APROBADO' || d.estatus === 'APROBADA') ? (d.vale ? `Vale ${d.vale} emitido.` : '') : '') : '';
  $('area').innerHTML = cab(esSol ? 'Solicitud ' + d.num : TIPOS[t].titulo.charAt(0) + TIPOS[t].titulo.slice(1).toLowerCase() + ' ' + d.num, 'Vista de solo lectura: muestra exactamente lo registrado.', `<button class="btn btn-claro" onclick="${p.back ? `ir('${p.back}')` : 'history.back()'}">Volver</button>`)
    + `<div class="franja-est ${color}" style="${t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' ? 'flex-wrap:wrap' : ''}"><span>Estatus: ${estB(est)}</span><span>${franjaDer}</span>${t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' ? `<div class="crono-barra"><i data-ini="${d.fecha}" data-vence="${d.vence}"></i></div><span style="font-size:12px;color:var(--texto-2)">${d.destino === S.ctx ? `Si no la acepta o rechaza antes de que el reloj llegue a cero, la transferencia vencerá y el material regresará a ${esc(almNombre(d.origen))}.` : `${esc(almNombre(d.destino))} debe aceptarla antes de que el reloj llegue a cero; si no, el material regresará automáticamente a ${esc(almNombre(d.origen))}.`}</span>` : ''}</div>${nota ? `<div class="franja-est ${(d.estatus === 'APROBADO' || d.estatus === 'APROBADA') ? 'verde' : 'naranja'}"><span>ℹ️ ${esc(nota)}</span></div>` : ''}

    ${esSol && d.vale ? `<div class="franja-est azul"><span>Vale generado al aprobar: <b>${d.vale}</b></span><button class="btn btn-claro btn-mini" onclick="ir('doc',{num:'${d.vale}',back:'${p.back || 'sol'}'})">Ver vale</button></div>` : ''}`;

function aprobadoresDe(alm) { return DB.usuarios.filter(u => u.activo && !u.admin && u.perm.aprobar.includes(alm)).map(u => u.nombre); }
function motivoNoAprueba(s) {
  if (s.estatus !== 'FINALIZADO' && s.estatus !== 'PENDIENTE DE APROBACIÓN') return '';
  const quienes = aprobadoresDe(s.origen); const lista = quienes.length ? quienes.join(', ') : 'un supervisor autorizado';
  if (s.generadoPor.usuario === S.u.usuario) return `Usted generó esta solicitud, por lo que no puede aprobarla. Debe aceptarla: ${lista}.`;
  if (!puede('aprobar', s.origen)) return `Su usuario no tiene permiso de aprobación en ${almNombre(s.origen)}. Puede aceptarla: ${lista}.`;
  return '';
}
function accionesDoc(d, esSol, p) {
  let h = '';
  if (enMaestro()) return esSol ? '' : `<button class="btn btn-ambar" onclick="editarSolicitudVale('${d.solicitud || d.vale || d.num}')">✏️ Editar vale</button><button class="btn btn-azul" onclick="imprimirVale('${d.num}', '${d.origen}')">🖨 Imprimir vale</button>`;
  if (esSol) {
    const esAnuladaDoc = (d.estatus === 'ANULADO' || d.estatus === 'ANULADA');
    if (!esAnuladaDoc && d.origen === S.ctx) {
      h += `<button class="btn btn-rojo" onclick="pedirTexto('Anular solicitud ' + esc('${d.num}'), 'Indique el motivo de la anulación (obligatorio):', v => { anularSolicitud('${d.num}', v, '${d.origen}'); refrescar(); }, 'Anular solicitud', 'btn-rojo', true)">🚫 Anular solicitud</button>`;
    }
    h += `<button class="btn btn-ambar" onclick="editarSolicitudVale('${d.num}', '${d.origen}')">✏️ Editar solicitud / vale</button>`;
    if (d.vale && puedeImprimir()) h += `<button class="btn btn-azul" onclick="imprimirVale('${d.vale}', '${d.origen}')">🖨 Imprimir vale</button>`;
    return h;
  }
  if (d.tipo === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN') {
    if (d.destino === S.ctx && puede('recibir', d.destino)) {
      h += `<button class="btn btn-rojo" onclick="accionRechazarTrf('${d.num}')">Rechazar transferencia</button><button class="btn btn-verde" onclick="accionAceptarTrf('${d.num}')">Aceptar transferencia</button>`;
    }
    if (d.origen === S.ctx && puede('transferir', d.origen)) {
      h += `<button class="btn btn-claro" onclick="editarTransferencia('${d.num}')">✏️ Editar transferencia</button>`;
    }
  }
  if ((d.tipo === 'PRH' || d.tipo === 'ASI') && d.origen === S.ctx) {
    h += `<button class="btn btn-ambar" onclick="editarSolicitudVale('${d.num}', '${d.origen}')">✏️ Editar ${d.tipo === 'ASI' ? 'asignación' : 'préstamo'}</button>`;
    if (saldoVale(d) > 0) {
      h += `<button class="btn btn-claro" onclick="ir('dev',{vale:'${d.num}'})">Registrar devolución</button>`;
      if (d.tipo === 'PRH') h += `<button class="btn btn-claro" onclick="ir('plz',{vale:'${d.num}'})">Extender plazo</button>`;
    }
  }
  if (d.tipo === 'DEVCH' || d.tipo === 'PRHCH' || d.tipo === 'REACH') {
    if (d.cajaId) h += `<button class="btn btn-claro" onclick="ir('cajaFicha',{id:'${d.cajaId}'})">🧰 Ver Ficha de Caja</button>`;
    if (d.tipo === 'DEVCH' && d.novedades) h += `<button class="btn btn-naranja" onclick="abrirModalReponer('${d.cajaId}')">🔧 Reponer caja</button>`;
  }
  return h + (puedeImprimir() ? `<button class="btn btn-azul" onclick="imprimirVale('${d.num}', '${d.origen}')">🖨 Imprimir vale</button>` : '');
}
function timeline(d) {
  return `<div class="timeline">${d.hist.map((h, i) => {
    const prev = i > 0 ? d.hist[0].fecha : null;
    const dur = prev && d.tipo === 'TRF' ? ` · ${num(horasEntre(prev, h.fecha), 1)} h después del envío` : '';
    return `<div class="tl-ev ${h.color || ''}"><div class="tl-t">${esc(h.ev)}</div><div class="tl-d">${fFH(h.fecha)} · ${esc(h.usr)}${dur}${h.det ? '<br>' + esc(h.det) : ''}</div></div>`;
  }).join('')}</div>`;
}

VISTAS.sol = p => {
  const filtro = (p && p.f) || 'TODAS', tab = (p && p.tab) || 'alm';
  let rows = DB.solicitudes.filter(s => s.origen === S.ctx);
  if (tab === 'mias') rows = rows.filter(s => s.generadoPor.usuario === S.u.usuario);
  if (filtro !== 'TODAS') {
    if (filtro === 'FINALIZADA' || filtro === 'APROBADA') rows = rows.filter(s => s.estatus === 'FINALIZADA' || s.estatus === 'FINALIZADO' || s.estatus === 'APROBADO' || s.estatus === 'APROBADA');
    else if (filtro === 'ANULADA') rows = rows.filter(s => s.estatus === 'ANULADO' || s.estatus === 'ANULADA');
    else rows = rows.filter(s => s.estatus === filtro);
  }
  rows.sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.num || '').localeCompare(b.num || ''));
  const cols = [
    { t: 'Número', k: 'num', f: r => {

    }},
    { t: 'Fecha', v: r => fF(r.fecha), s: r => r.fecha },
    { t: 'Movimiento', v: r => `${r.tipo} - ${TIPOS[r.tipo].n}` },
    { t: 'Destino / Área', v: r => r.destino ? almNombre(r.destino) : '—', f: r => `<span class="est est-gris" style="font-size:11px">${esc(almNombre(r.destino || r.origen))}</span>` },
    { t: 'Cuenta auxiliar', v: r => r.cuenta || '—', f: r => r.cuenta ? `<span class="est est-azul" style="font-family:monospace;font-weight:800">${esc(r.cuenta)}</span>` : '—' },
    { t: 'Proyecto / OT', k: 'proyecto', td: 'wrap' },
    { t: 'Solicitado por', v: r => r.resp ? r.resp.nombre : '' },
    { t: 'Generado por', v: r => r.generadoPor.nombre },
    { t: 'Estatus', k: 'estatus', f: r => estB(formatoEstSol(r.estatus)) },
    { t: 'Vale', v: r => r.vale || '', f: r => r.vale ? `<a href="javascript:void(0)" onclick="event.stopPropagation();ir('doc',{num:'${r.vale}',alm:'${r.origen}',back:'sol'})" style="font-weight:800;color:var(--azul)">${esc(r.vale)}</a>` : '—' }
  ];
  $('area').innerHTML = cab('Solicitudes del almacén', 'Préstamos y asignaciones de ' + esc(almNombre(S.ctx)) + '. Al crear una solicitud, se emite de inmediato el vale para imprimir y firmar.')
    + `<div class="tabs"><button class="tab ${tab === 'alm' ? 'activo' : ''}" onclick="ir('sol',{tab:'alm',f:'${filtro}'})">Solicitudes del almacén</button><button class="tab ${tab === 'mias' ? 'activo' : ''}" onclick="ir('sol',{tab:'mias',f:'${filtro}'})">Mis solicitudes</button></div>
    <div class="fila-filtros">${campo('Estatus', `<select onchange="ir('sol',{tab:'${tab}',f:this.value})">${opciones([['TODAS', 'Todas'], ['FINALIZADA', 'Finalizadas (con vale)'], ['ANULADA', 'Anuladas']], filtro)}</select>`)}${buscador('gSol', 'Buscar número, cuenta auxiliar, proyecto, responsable…')}</div>`
    + grid('gSol', cols, rows, { onSel: s => tiraSol(s), pag: 15 })
    + `<div class="sel-strip"><span class="lbl">Solicitud seleccionada</span><span class="box" id="tsNum"></span><span class="box" id="tsCuenta"></span><span class="box" id="tsProy" style="flex:1"></span><span class="box" id="tsResp" style="flex:1"></span></div><div id="tsInfo"></div>
    <div class="barra-btn">
      <button class="btn-sip" onclick="ir('solNueva')">Nueva solicitud</button>
      <button class="btn-sip btn-ambar" id="bEditar" disabled onclick="editarSolicitudVale(selDe('gSol'), S.ctx)">✏️ Editar solicitud / vale</button>
      <button class="btn-sip" id="bVer" disabled onclick="ir('doc',{num:selDe('gSol').vale || selDe('gSol').num,alm:selDe('gSol').origen,sol:selDe('gSol').num,back:'sol'})">Visualizar vale</button>
      <button class="btn-sip" id="bImp" disabled onclick="imprimirVale(selDe('gSol').vale || selDe('gSol').num, selDe('gSol').origen, selDe('gSol').num)">🖨 Imprimir vale</button>

  if (p && p.sel) { const g = GR.gSol; const i = g.vis.findIndex(r => r.num === p.sel); if (i >= 0) selGrid('gSol', i); }

function tiraSol(s) {
  $('tsNum').textContent = s.num;
  if ($('tsCuenta')) $('tsCuenta').textContent = s.cuenta || '—';
  $('tsProy').textContent = s.proyecto;
  $('tsResp').textContent = s.resp ? s.resp.nombre : '';
  const esAnulada = (s.estatus === 'ANULADA' || s.estatus === 'ANULADO');
  if ($('bVer')) $('bVer').disabled = false;
  if ($('bEditar')) $('bEditar').disabled = esAnulada;
  if ($('bImp')) $('bImp').disabled = !(s.vale || s.num);
  if ($('bAnular')) {
    $('bAnular').disabled = esAnulada;
    $('bAnular').title = esAnulada ? 'Esta solicitud ya está anulada' : 'Anular esta solicitud y reintegrar existencias al almacén';
  }
  if (esAnulada) {
    $('tsInfo').innerHTML = `<div class="franja-est rojo" style="margin:10px 0 0"><span>🚫 Solicitud ANULADA${s.motivo ? ` · Motivo: ${esc(s.motivo)}` : ''}${s.procesadoPor ? ` (por ${esc(s.procesadoPor.nombre || s.procesadoPor.usuario)})` : ''}</span></div>`;
  } else {
    const info = s.vale ? `Vale oficial ${s.vale} emitido. Listo para imprimir y firmar.` : 'Solicitud registrada.';
    $('tsInfo').innerHTML = `<div class="franja-est verde" style="margin:10px 0 0"><span>✔ ${esc(info)}</span></div>`;
  }
}

function accionAnularSol() {
  const s = selDe('gSol');
  if (!s) return toast('Seleccione una solicitud en la tabla para anular.', 'err');
  if (s.estatus === 'ANULADA' || s.estatus === 'ANULADO') {
    return toast(`La solicitud ${s.num} ya está anulada.`, 'err');
  }

const COL = { navy: '#020C54', azul: '#2563EB', verde: '#16A34A', ambar: '#D97706', rojo: '#DC2626', naranja: '#EA580C', morado: '#7C3AED', cian: '#0891B2', gris: '#94A3B8', rosa: '#DB2777', celeste: '#0284C7' };
const COL_TIPO = { PRH: COL.ambar, ASI: COL.azul, TRF: COL.navy, DEV: COL.verde, DAN: COL.rojo, EXT: COL.morado, PLZ: COL.cian, ENT: COL.celeste };
function niceMax(m) { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); const f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function corto(v) { const a = Math.abs(v); return a >= 1e6 ? num(v / 1e6, 1) + ' M' : a >= 1e4 ? num(v / 1e3, 0) + ' k' : a >= 1e3 ? num(v / 1e3, 1) + ' k' : num(v, v % 1 ? 1 : 0); }
function etiquetaSVG(t, x, y, max) {
  const pal = String(t).split(' '); const l1 = [], l2 = [];

  return `<text x="${x}" y="${y}" text-anchor="middle" class="g-lbl"><tspan x="${x}" dy="0">${esc(l1.join(' '))}</tspan>${s2 ? `<tspan x="${x}" dy="15">${esc(s2)}</tspan>` : ''}</text>`;
}
/* Dona: datos = [{l, v, c}] */
function gDonut(datos, centro, sub, fmt) {
  fmt = fmt || (v => num(v));
  const tot = datos.reduce((a, d) => a + d.v, 0), R = 70, C = 2 * Math.PI * R; let acc = 0;
  const arcos = tot ? datos.filter(d => d.v > 0).map(d => {
    const len = d.v / tot * C;
    const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${d.c}" stroke-width="28" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></circle>`;
    acc += len; return s;
  }).join('') : `<circle r="${R}" cx="100" cy="100" fill="none" stroke="#E2E8F0" stroke-width="28"/>`;
  const c1 = String(centro);
  return `<div class="g-donut-wrap"><svg viewBox="0 0 200 200" class="g-donut" role="img" aria-label="${esc(sub)}">${arcos}
      <text x="100" y="${c1.length > 8 ? 101 : 104}" text-anchor="middle" class="g-c1 ${c1.length > 8 ? 'chico' : ''}">${esc(c1)}</text><text x="100" y="${c1.length > 8 ? 120 : 124}" text-anchor="middle" class="g-c2">${esc(sub)}</text></svg>
    <div class="g-leyenda">${datos.map(d => `<div class="g-ley"><span class="g-sw" style="background:${d.c}"></span><span>${esc(d.l)}</span><b>${esc(fmt(d.v))}</b><span class="g-pc">${tot ? num(d.v / tot * 100, 1) : '0'} %</span></div>`).join('')}</div></div>`;
}
/* Barras verticales: series = [{n, c | cs:[...], vals:[...]}] */
function gBarras(labels, series, fmt, alto) {
  fmt = fmt || (v => num(v));
  const W = 640, H = alto || 260, pl = 52, pr = 8, pt = 24, pb = 50;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.vals)));
  const ah = H - pt - pb, cw = (W - pl - pr) / Math.max(1, labels.length);
  const bw = Math.min(54, (cw * 0.72) / series.length);
  let g = ''; const nd = Number.isInteger(max) && max <= 5 ? max : 4;
  for (let i = 0; i <= nd; i++) { const v = max * i / nd, y = pt + ah - ah * i / nd; g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="g-ax">${corto(v)}</text>`; }
  labels.forEach((lab, i) => {
    const x0 = pl + i * cw + (cw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.vals[i] || 0, h = v / max * ah, x = x0 + j * bw, y = pt + ah - h, color = s.cs ? s.cs[i] : s.c;
      g += `<rect class="g-bar" x="${x + 2}" y="${y}" width="${bw - 4}" height="${Math.max(h, v ? 2 : 0)}" rx="4" fill="${color}"><title>${esc(lab)} · ${esc(s.n || '')}: ${esc(fmt(v))}</title></rect>`;
      if (series.length <= 2) g += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" class="g-val">${esc(corto(v))}</text>`;
    });
    g += etiquetaSVG(lab, pl + i * cw + cw / 2, pt + ah + 19, Math.max(6, Math.floor(cw / 8.5)));
  });
  const leg = series.length > 1 ? `<div class="g-leg">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="g-svg" role="img">${g}<line x1="${pl}" x2="${W - pr}" y1="${pt + ah}" y2="${pt + ah}" stroke="#CBD5E1"/></svg>${leg}`;
}
/* Líneas: series = [{n, c, vals}] */
function gLinea(labels, series, alto) {
  const W = 640, H = alto || 260, pl = 44, pr = 16, pt = 18, pb = 36;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.vals)));
  const ah = H - pt - pb, step = (W - pl - pr) / Math.max(1, labels.length - 1);
  const X = i => pl + i * step, Y = v => pt + ah - v / max * ah;
  let g = ''; const nd = Number.isInteger(max) && max <= 5 ? max : 4;
  for (let i = 0; i <= nd; i++) { const v = max * i / nd, y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="g-ax">${corto(v)}</text>`; }
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" class="g-lbl">${esc(l)}</text>`);
  series.forEach((s, k) => {
    const pts = s.vals.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    if (k === 0) g += `<polygon points="${X(0)},${pt + ah} ${pts} ${X(s.vals.length - 1)},${pt + ah}" fill="${s.c}" opacity=".08"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="#fff" stroke="${s.c}" stroke-width="2.5"><title>${esc(s.n)} · ${esc(labels[i])}: ${num(v)}</title></circle>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="g-svg" role="img">${g}</svg><div class="g-leg">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;
}
/* Barras horizontales: datos = [{l, v, c}] */

function sumaExi(alms, mod) {
  const t = { disp: 0, prest: 0, asig: 0, dan: 0, rep: 0, ext: 0, vacio: 0, pend: 0, baja: 0, entregado: 0 };
  alms.forEach(a => Object.entries(DB.exi[a] || {}).forEach(([id, e]) => {
    const it = item(+id); if (!it || (mod && it.mod !== mod)) return;
    Object.keys(t).forEach(k => t[k] += e[k] || 0);
  }));
  return t;
}
function prestamosVencidos(alms) {
  return DB.vales.filter(v => v.tipo === 'PRH' && alms.includes(v.origen) && saldoVale(v) > 0 && v.fechaDev < hoy())
    .map(v => ({ v, dias: diasEntre(v.fechaDev, hoy()) })).sort((a, b) => b.dias - a.dias);
}
function entregasEPP(alms) {
  const r = [];
  DB.vales.filter(v => v.tipo === 'ASI' && alms.includes(v.origen)).forEach(v => v.lineas.filter(l => l.consumo).forEach(l => {
    const it = item(l.id); const repo = sumarDias(fechaLocal(new Date(v.fecha)), it.vida || 0);
    r.push({ vale: v.num, alm: v.origen, fecha: v.fecha, cedula: v.resp.cedula, nombre: v.resp.nombre, cargo: v.resp.cargo, id: l.id, cod: l.cod, desc: l.desc, talla: it.talla, cant: l.cant, vida: it.vida, repo, costo: it.costo });
  }));
  // Solo la última entrega por trabajador e ítem define la reposición
  const ult = {}; r.forEach(x => { const k = x.cedula + '|' + x.cod; if (!ult[k] || ult[k].fecha < x.fecha) ult[k] = x; });
  r.forEach(x => { x.ultima = ult[x.cedula + '|' + x.cod] === x; const d = diasEntre(hoy(), x.repo); x.estado = !x.ultima ? 'REEMPLAZADA' : d < 0 ? 'VENCIDA' : d <= 15 ? 'PRÓXIMA' : 'VIGENTE'; x.diasRepo = d; });
  return r;
}
VISTAS.dash = p => {
  const mod = (p && p.mod) || '';
  const c = S.ctx, t = sumaExi([c], mod);
  const total = t.disp + t.prest + t.asig + t.dan + t.rep + t.ext + t.vacio;
  const pendAprob = DB.solicitudes.filter(s => s.origen === c && s.estatus === 'FINALIZADO').length;
  const venc = prestamosVencidos([c]);
  const epp = entregasEPP([c]).filter(x => x.ultima && (x.estado === 'VENCIDA' || x.estado === 'PRÓXIMA'));
  const porAceptar = DB.vales.filter(v => v.tipo === 'TRF' && v.destino === c && v.estatus === 'PENDIENTE DE RECEPCIÓN').sort((a, b) => a.vence.localeCompare(b.vence));
  const envPend = DB.vales.filter(v => v.tipo === 'TRF' && v.origen === c && v.estatus === 'PENDIENTE DE RECEPCIÓN');
  const envRiesgo = envPend.filter(v => (new Date(v.vence) - ahora()) < 2 * 3600000);
  const hace7 = new Date(ahora().getTime() - 7 * 86400000).toISOString();
  const envMal = DB.vales.filter(v => v.tipo === 'TRF' && v.origen === c && (v.estatus === 'RECHAZADA' || v.estatus === 'VENCIDA') && v.procesadoEn >= hace7);
  const vacios = sumaExi([c], 'CILINDRO').vacio;
  const aviso = (n, txt, dest, cls) => `<div class="aviso ${cls || ''}" onclick="ir('${dest[0]}',${dest[1] ? JSON.stringify(dest[1]).replace(/"/g, "'") : 'null'})"><div class="a-num">${n}</div><div class="a-txt">${txt}</div></div>`;
  
  const avisos = [
    aviso(venc.length, venc.length ? `Préstamos vencidos · máximo ${venc[0].dias} día(s) de atraso` : 'Préstamos vencidos', ['cPrest', { est: 'VENCIDO' }], venc.length ? 'rojo' : 'verde'),
    aviso(porAceptar.length, porAceptar.length ? `Transferencias por aceptar · la más próxima vence en ${cronoHTML(porAceptar[0])}` : 'Transferencias por aceptar', ['trfRec'], porAceptar.length ? 'naranja' : 'verde'),
    aviso(envPend.length, `Transferencias enviadas por aceptar · ${envRiesgo.length} vencen en menos de 2 horas`, ['trfEnv', { est: 'PENDIENTE DE RECEPCIÓN' }], envRiesgo.length ? 'rojo' : ''),
    aviso(envMal.length, 'Transferencias enviadas rechazadas o vencidas (últimos 7 días)', ['trfEnv'], envMal.length ? 'rojo' : 'verde'),
    vacios ? aviso(vacios, c === 'CENTRAL' ? 'Cilindros vacíos en Central' : 'Cilindros vacíos por transferir a Central', ['cCil'], 'naranja') : ''
  ].join('');
  // Movimientos de los últimos 30 días por tipo (documentos)
  const desde = new Date(ahora().getTime() - 30 * 86400000).toISOString();
  const docs = {};

  // 1. Contar desde DB.vales (Vales emitidos en origen o transferencias recibidas en destino)
  (DB.vales || []).filter(v => (v.origen === c || (v.tipo === 'TRF' && v.destino === c)) && (v.fecha || '') >= desde && (!mod || getValeMods(v).includes(mod)))
    .forEach(v => {
      docs[v.tipo] = docs[v.tipo] || new Set();
      docs[v.tipo].add(v.num);
    });

  // 2. Contar desde DB.movs (movimientos registrados)
  (DB.movs || []).filter(m => (m.origen === c || m.destino === c) && (m.fecha || '') >= desde && m.tipo !== 'INI' && (!mod || m.mod === mod))
    .forEach(m => {
      docs[m.tipo] = docs[m.tipo] || new Set();
      if (m.doc) docs[m.tipo].add(m.doc);
    });

  // 3. Contar desde DB.incid (incidencias de daño / extravío)
  (DB.incid || []).filter(i => i.alm === c && (i.fecha || '') >= desde && (!mod || ((item(i.id) && item(i.id).mod === mod))))
    .forEach(i => {
      docs[i.tipo] = docs[i.tipo] || new Set();
      if (i.valeRef) docs[i.tipo].add(i.valeRef);
    });
  const tiposMov = ['PRH', 'ASI', 'TRF', 'ENT', 'DEV', 'DAN', 'EXT', 'PLZ'];
  const dona = gDonut([
    { l: 'Disponible', v: t.disp, c: COL.verde }, { l: 'Cilindros vacíos', v: t.vacio, c: COL.cian }, { l: 'En préstamo', v: t.prest, c: COL.ambar },
    { l: 'Asignado', v: t.asig, c: COL.azul }, { l: 'Dañado', v: t.dan, c: COL.rojo }, { l: 'En taller', v: t.rep, c: COL.naranja }, { l: 'Extraviado', v: t.ext, c: COL.morado }
  ].filter(d => d.v > 0 || ['Disponible', 'En préstamo', 'Asignado'].includes(d.l)), num(total), 'ítems en total');
  const corto = { PRH: 'Préstamo', ASI: 'Asignación', TRF: 'Transferencia', ENT: 'Entrada', DEV: 'Devolución', DAN: 'Daño', EXT: 'Robo / extravío', PLZ: 'Ext. plazo' };
  const barrasMov = gBarras(tiposMov.map(k => corto[k]), [{ n: 'Documentos', cs: tiposMov.map(k => COL_TIPO[k]), vals: tiposMov.map(k => docs[k] ? docs[k].size : 0) }]);
  const mods = Object.keys(MODULOS).filter(m => !mod || m === mod);
  const porMod = mods.map(m => sumaExi([c], m));
  const barrasMod = gBarras(mods.map(m => MODULOS[m]), [
    { n: 'Disponible', c: COL.verde, vals: porMod.map(x => x.disp + x.vacio) },
    { n: 'Fuera (préstamo + asignado)', c: COL.ambar, vals: porMod.map(x => x.prest + x.asig) },
    { n: 'Dañado / extraviado', c: COL.rojo, vals: porMod.map(x => x.dan + x.rep + x.ext) }], null, 230);
  $('area').innerHTML = cab('Dashboard operativo', 'Existencias y gestión de ' + esc(almNombre(c)) + ' en tiempo real · actualizado ' + fFH(nowISO()) + '.',
    `<div class="campo" style="margin:0"><select onchange="ir('dash',{mod:this.value})"><option value="">Todos los módulos</option>${opciones(Object.entries(MODULOS), mod)}</select></div><button class="btn btn-navy" onclick="refrescar()">🔄 Actualizar</button>`)
    + `<div class="cards">${cardC('Total de ítems', num(total), '', 'Bajo responsabilidad del almacén')}${cardC('Disponibles', num(t.disp + t.vacio), 'verde', t.vacio ? `${num(t.vacio)} cilindros vacíos` : 'Listos para despachar')}${cardC('En préstamo', num(t.prest), 'ambar', 'Fuera del almacén')}${cardC('Asignados', num(t.asig), 'azul', 'Custodia personal')}${cardC('Dañados', num(t.dan + t.rep), 'rojo', t.rep ? `${num(t.rep)} en taller` : '')}${cardC('Extraviados', num(t.ext), 'morado', 'En investigación')}</div>
    <div class="avisos">${avisos}</div>
    <div class="dos-col">${panelG('Distribución de existencias por estado', dona)}${panelG('Movimientos por tipo', barrasMov, 'Documentos de los últimos 30 días')}</div>
    <div class="dos-col">${panelG('Existencias por módulo', barrasMod)}
      <div class="panel"><div class="panel-h">Préstamos más atrasados<small>Top 10</small></div><div class="panel-b">
        ${grid('gAtr', [{ t: 'Vale', v: r => r.v.num }, { t: 'Responsable', v: r => r.v.resp.nombre }, { t: 'Supervisor', v: r => r.v.sup }, { t: 'Devolución', v: r => fF(r.v.fechaDev) }, { t: 'Atraso', v: r => r.dias + ' días', s: r => r.dias, td: 'col-dan' }],
          venc.slice(0, 10), { onSel: r => ir('doc', { num: r.v.num, back: 'dash' }), sinPie: true, vacio: 'No hay préstamos vencidos. ¡Todo al día!' })}
      </div></div></div>`;
};

VISTAS.cCatAlm = p => {
  p = p || {}; const mod = p.mod || '', cat = p.cat || '', est = p.est || '', todos = !!p.todos;
  let rows = [];
  if (enMaestro()) {
    rows = (DB.catalogo || []).map(it => {
      let r = { it, disp: 0, vacio: 0, prest: 0, asig: 0, dan: 0, rep: 0, ext: 0, pend: 0, total: 0 };
      (DB.almacenes || []).forEach(a => {
        const e = DB.exi && DB.exi[a.c] && DB.exi[a.c][it.id];
        if (e) {
          r.disp += (e.disp || 0);
          r.vacio += (e.vacio || 0);
          r.prest += (e.prest || 0);
          r.asig += (e.asig || 0);
          r.dan += (e.dan || 0);
          r.rep += (e.rep || 0);
          r.ext += (e.ext || 0);
          r.pend += (e.pend || 0);
        }
      });
      r.total = r.disp + r.vacio + r.prest + r.asig + r.dan + r.rep + r.ext + r.pend;
      r.estado = estadoCatalogo(r, r.it);
      return r;
    }).filter(r => (!mod || r.it.mod === mod) && (!cat || r.it.cat === cat));
    if (!todos) rows = rows.filter(r => r.total > 0);
  } else {
    let ids = new Set(Object.keys(DB.exi[S.ctx] || {}).map(Number));
    rows = Array.from(ids).map(id => {
      const it = item(id);
      const e = (DB.exi[S.ctx] && DB.exi[S.ctx][id]) ? Object.assign({}, DB.exi[S.ctx][id]) : { disp: 0, prest: 0, asig: 0, vacio: 0, dan: 0, rep: 0, ext: 0, pend: 0, entregado: 0 };
      const r = Object.assign({ it }, e);
      r.asig = (e.asig || 0);
      r.pend = (e.pend || 0);
      r.total = (r.disp || 0) + (r.vacio || 0) + (r.prest || 0) + (r.asig || 0) + (r.dan || 0) + (r.rep || 0) + (r.ext || 0) + (r.pend || 0);
      r.estado = estadoCatalogo(r, r.it);
      return r;
    }).filter(r => r.it && (!mod || r.it.mod === mod) && (!cat || r.it.cat === cat));
    if (!todos) rows = rows.filter(r => r.total > 0);
  }
  if (est) rows = rows.filter(r => r.estado === est);
  rows.sort((a, b) => a.it.cod.localeCompare(b.it.cod) || (a.it.serial || '').localeCompare(b.it.serial || ''));
  const cols = [
    { t: 'Código', v: r => r.it.cod, f: r => `<b>${esc(r.it.cod)}</b>` },
    { t: 'Descripción', v: r => r.it.desc, td: 'wrap' },
    { t: 'Marca / Modelo', v: r => `${limpiaTxt(r.it.marca || 'SIN MARCA')} / ${limpiaTxt(r.it.modelo)}`, td: 'wrap' },
    { t: 'Serial', v: r => r.it.serial || '' },
    { t: 'Categoría', v: r => r.it.cat, td: 'wrap' },
    { t: 'Unidad', v: r => r.it.umb, cls: 'cen' },
    { t: 'Estado', v: r => r.estado, f: r => estB(r.estado) },
    { t: 'Disponibles', k: 'disp', cls: 'cen', td: 'col-disp', sum: true },
    { t: 'Prestados', k: 'prest', cls: 'cen', td: 'col-prest', sum: true },
    { t: 'Asignados', k: 'asig', cls: 'cen', td: 'col-asig', sum: true },
    { t: 'En transf.', k: 'pend', cls: 'cen', td: 'col-pend', sum: true },
    { t: 'Dañados', k: 'dan', cls: 'cen', td: 'col-dan', sum: true },
    { t: 'En taller', k: 'rep', cls: 'cen', td: 'col-tall', sum: true },
    { t: 'Extraviados', k: 'ext', cls: 'cen', td: 'col-ext', sum: true },
    { t: 'Total', k: 'total', cls: 'cen', td: 'col-total', sum: true }
  ];
  const rec = `ir('cCatAlm',{mod:$('caMod').value,cat:$('caCat').value,est:$('caEst').value,todos:$('caTod').checked})`;
  const pendRec = enMaestro() ? 0 : DB.vales.filter(v => v.tipo === 'TRF' && v.destino === S.ctx && v.estatus === 'PENDIENTE DE RECEPCIÓN').length;
  const titCab = enMaestro() ? '📦 Catálogo consolidado TIMACA' : '📦 Catálogo del almacén';
  const subCab = enMaestro()
    ? 'Existencias consolidadas de todos los 8 almacenes TIMACA en tiempo real.'
    : 'Existencia de cada ítem por estado en ' + esc(almNombre(S.ctx)) + '. Lo recibido por transferencia se agrega automáticamente al aceptarla.';
  $('area').innerHTML = cab(titCab, subCab,
    `${botonesExport('gCatA', 'Catálogo ' + (enMaestro() ? 'Consolidado TIMACA' : almNombre(S.ctx)))} <button class="btn btn-navy btn-mini" onclick="ir('ent')">➕ Entrada de ítems</button>`)
    + (pendRec ? `<div class="franja-est naranja"><span>Tiene <b>${pendRec}</b> transferencia(s) por aceptar. Su material se sumará al catálogo al aceptarlas.</span><button class="btn btn-navy btn-mini" onclick="ir('trfRec')">Ver transferencias recibidas</button></div>` : '')
    + `<div class="fila-filtros">${campo('Módulo', `<select id="caMod" onchange="${rec}"><option value="">Todos</option>${opciones(Object.entries(MODULOS), mod)}</select>`)}
      ${campo('Categoría', `<select id="caCat" onchange="${rec}"><option value="">Todas</option>${opciones(CATEGORIAS_OFICIALES, cat)}</select>`)}
      ${campo('Estado', `<select id="caEst" onchange="${rec}"><option value="">Todos</option>${opciones(['DISPONIBLE', 'VACÍO', 'SIN DISPONIBILIDAD', 'PENDIENTE DE RECEPCIÓN', 'FUERA DE SERVICIO', 'SIN EXISTENCIA'], est)}</select>`)}
      <label style="font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;padding-bottom:9px"><input type="checkbox" id="caTod" ${todos ? 'checked' : ''} onchange="${rec}"> Incluir ítems sin existencia</label>
      ${buscador('gCatA', 'Buscar código, descripción, marca, serial…')}</div>`
    + grid('gCatA', cols, rows, { pag: 50, totales: true, compacto: true, onSel: r => { $('caKdx').disabled = false; if ($('caEdit')) $('caEdit').disabled = false; $('caTit').textContent = `${r.it.cod} · ${r.it.desc} · ${r.it.marca} / ${r.it.modelo}${r.it.serial ? ' · ' + r.it.serial : ''}`; }, vacio: enMaestro() ? 'No hay ítems registrados en el catálogo TIMACA.' : 'No hay ítems con existencia en este almacén.' })
    + `<div class="sel-strip"><span class="lbl">Ítem seleccionado</span><span class="box" id="caTit" style="flex:1"></span></div>
    <div class="barra-btn"><button class="btn-sip" onclick="ir('ent')">➕ Entrada de ítems</button><button class="btn-sip" id="caEdit" disabled onclick="const r=selDe('gCatA');if(r)editarItem(r.it)">✏️ Editar datos / categoría</button><button class="btn-sip" id="caKdx" disabled onclick="const r=selDe('gCatA');ir('cKardex',{q:r.it.serial||r.it.cod})">📜 Ver kardex del ítem</button></div>
    <p class="ayuda-txt" style="margin-top:10px"><b>Estado:</b> Disponible = hay unidades para despachar · En transf. = unidades enviadas pendientes por recibir · Sin disponibilidad = todas están prestadas o asignadas · Fuera de servicio = solo quedan dañadas, en taller o extraviadas. Los totales suman todas las páginas.</p>`;
};
