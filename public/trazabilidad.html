};
function vistaPrestamos(tit, sub, p) {
  if (typeof p === 'string') {
    p = { tipo: arguments[2], est: arguments[3], id: arguments[4] };
  }
  p = p || {};
  const id = p.id || 'cPrest';
  const tipo = p.tipo !== undefined ? p.tipo : '';
  const estado = p.est !== undefined ? p.est : 'ABIERTOS';
  const resp = p.resp || '';
  const ciFiltro = (p.ci || '').trim();
  const alm = p.alm || (enMaestro() ? 'TODOS' : S.ctx);
  const cat = p.cat || '';
  const mod = p.mod || '';
  const proy = p.proy || '';
  const cuenta = p.cuenta || '';
  const desde = p.desde || '';
  const hasta = p.hasta || '';
  const itemFiltro = (p.item || '').trim().toUpperCase();

  let allRows = [];
  (DB.vales || []).forEach(v => {
    // Filtrar por almacén / ubicación
    if (alm && alm !== 'TODOS') {
      if (v.origen !== alm && v.destino !== alm) return;
    }
    // Tipo de movimiento (PRH o ASI)
    if (tipo) {
      if (v.tipo !== tipo) return;
    } else {
      if (v.tipo !== 'PRH' && v.tipo !== 'ASI') return;
    }

    // Responsable y Cédula
    const respNom = v.resp ? (v.resp.nombre || (typeof v.resp === 'string' ? v.resp : 'Sin asignar')) : 'Sin asignar';
    const respCI = (v.resp && v.resp.cedula) ? v.resp.cedula : 'S/C';
    const respCargo = (v.resp && v.resp.cargo) ? v.resp.cargo : 'Trabajador';
    const personaDB = (DB.personal || []).find(x => (x.cedula && respCI !== 'S/C' && digitosCI(x.cedula) === digitosCI(respCI)) || normTexto(x.nombre) === normTexto(respNom));
    const depto = personaDB ? (personaDB.departamento || personaDB.depto || personaDB.cargo || 'Operaciones') : 'Operaciones';
    const ubicacion = v.destino ? formatoDestinoUbicacion(v.destino).replace('Almacén ', '') : almNombre(v.origen).replace('Almacén ', '');

    if (resp && respNom !== resp && respCI !== resp) return;
    if (ciFiltro) {
      const ciNorm = ciFiltro.trim().toUpperCase();
      const ciMatch = respCI.toUpperCase().includes(ciNorm) || respCI.replace(/\D/g, '').includes(ciNorm.replace(/\D/g, ''));
      const nomMatch = normTexto(respNom).includes(normTexto(ciFiltro));
      if (!ciMatch && !nomMatch) return;
    }

    // Cuenta auxiliar
    if (cuenta) {
      if (!(v.cuenta || '').toUpperCase().includes(cuenta.toUpperCase().trim())) return;
    }
    // Rango de fechas
    const fStr = (v.fecha || '').slice(0, 10);
    if (desde && fStr < desde) return;
    if (hasta && fStr > hasta) return;

    // Estado del vale
    const estV = estadoVale(v);
    if (estado === 'ABIERTOS') {
      if (!['VIGENTE', 'VENCIDO', 'DEVOLUCIÓN PARCIAL'].includes(estV) && saldoVale(v) <= 0) return;
    } else if (estado) {
      if (estV !== estado) return;
    }

    // Desglose renglón por renglón (ítem por ítem)
    const lineas = (v.lineas && v.lineas.length) ? v.lineas : [{ cod: '—', desc: v.obs || 'Sin renglones especificados', cant: 1, dev: 0 }];
    lineas.forEach(l => {
      const it = (l.id ? item(l.id) : null) || (l.cod ? DB.catalogo.find(i => i.cod === l.cod) : null) || {};
      const modLinea = l.mod || it.mod || 'HERRAMIENTA';
      const catLinea = l.cat || it.cat || 'General';

      if (mod && modLinea !== mod) return;
      if (cat && catLinea !== cat) return;

      if (itemFiltro) {
        const cM = (l.cod || it.cod || '').toUpperCase().includes(itemFiltro);
        const sM = (l.serial || it.serial || '').toUpperCase().includes(itemFiltro);
        const dM = (it.desc || l.desc || '').toUpperCase().includes(itemFiltro);
        const mM = (it.marca || l.marca || '').toUpperCase().includes(itemFiltro);
        if (!cM && !sM && !dM && !mM) return;
      }

      const cantEntregada = Number(l.cant) || 1;
      const cantDevuelta = Number(l.dev) || 0;
      const saldo = l.consumo ? 0 : Math.max(0, cantEntregada - cantDevuelta);

      const diasEnPoder = diasEntre(v.fecha, hoy());
      const diasAtraso = (v.tipo === 'PRH' && v.fechaDev && v.fechaDev < hoy() && saldo > 0) ? diasEntre(v.fechaDev, hoy()) : 0;

      allRows.push({
        v,
        l,
        it,
        respNom,
        respCI,
        respCargo,
        depto,
        ubicacion,
        mod: modLinea,
        cat: catLinea,
        cantEntregada,
        cantDevuelta,
        saldo,
        diasEnPoder,
        diasAtraso,
        est: estV
      });
    });
  });

  allRows.sort((a, b) => a.v.fecha.localeCompare(b.v.fecha) || (a.v.num || '').localeCompare(b.v.num || '') || a.respNom.localeCompare(b.respNom));
  let rows = proy ? allRows.filter(r => matchProyecto(r.v, proy)) : allRows.slice();

  const cols = [
    { t: 'N° de vale', v: r => r.v.num, f: r => `<b>${esc(r.v.num)}</b>` },
    { t: 'Tipo', v: r => r.v.tipo === 'ASI' ? 'Asignación' : 'Préstamo', f: r => `<span class="est ${r.v.tipo === 'ASI' ? 'est-azul' : 'est-ambar'}">${r.v.tipo === 'ASI' ? 'Asignación' : 'Préstamo'}</span>` },
    { t: 'Fecha y hora', v: r => fFH(r.v.fecha), s: r => r.v.fecha },
    { t: 'Almacén / Ubicación', v: r => r.ubicacion, f: r => `<b>${esc(r.ubicacion)}</b> <small style="color:var(--texto-3)">(${almNombre(r.v.origen).replace('Almacén ', '')})</small>` },

function getValeMods(v) {
  const mods = new Set();
  (v.lineas || []).forEach(l => {
    const it = (l.id ? item(l.id) : null) || (l.cod ? DB.catalogo.find(i => i.cod === l.cod) : null);
    if (it && it.mod) mods.add(it.mod);
    else if (l.mod) mods.add(l.mod);
  });
  if (mods.size) return [...mods];
  if (v.ref) {
    const orig = valeDe(v.ref);
    if (orig) {
      (orig.lineas || []).forEach(l => {
        const it = (l.id ? item(l.id) : null) || (l.cod ? DB.catalogo.find(i => i.cod === l.cod) : null);
        if (it && it.mod) mods.add(it.mod);
      });
    }
  }
  return mods.size ? [...mods] : ['HERRAMIENTA'];
}

function getValeCats(v) {
  const cats = new Set();
  (v.lineas || []).forEach(l => {
    const it = (l.id ? item(l.id) : null) || (l.cod ? DB.catalogo.find(i => i.cod === l.cod) : null);
    if (it && it.cat) cats.add(it.cat);
    else if (l.cat) cats.add(l.cat);
  });
  if (cats.size) return [...cats];
  if (v.ref) {
    const orig = valeDe(v.ref);
    if (orig) {
      (orig.lineas || []).forEach(l => {
        const it = (l.id ? item(l.id) : null) || (l.cod ? DB.catalogo.find(i => i.cod === l.cod) : null);
        if (it && it.cat) cats.add(it.cat);
      });
    }
  }
  return [...cats];
}

function getStatusVale(v) {
  const mods = getValeMods(v);
  if (mods.includes('CILINDRO')) {
    if (v.tipo === 'DEV') return 'DISPONIBLE';
    if (['PRH', 'ASI'].includes(v.tipo)) {
      return saldoVale(v) > 0 ? 'NO DISPONIBLE' : 'DISPONIBLE';
    }
    if (v.tipo === 'TRF') {
      return v.estatus === 'RECIBIDA' ? 'DISPONIBLE' : 'NO DISPONIBLE';
    }
    if (['DAN', 'EXT'].includes(v.tipo)) return 'NO DISPONIBLE';
    if (v.tipo === 'ENT') return 'DISPONIBLE';
  }
  return estadoVale(v);
}

function badgeStatus(v) {
  const st = getStatusVale(v);
  if (st === 'DISPONIBLE') return '<span class="est est-verde" style="font-weight:700">DISPONIBLE</span>';
  if (st === 'NO DISPONIBLE') return '<span class="est est-rojo" style="font-weight:700">NO DISPONIBLE</span>';
  return estB(st);
}

function chipCondicion(c) {
  if (!c || c === '—' || c === 'N/A') return '<span style="color:var(--texto-3)">—</span>';
  const val = String(c).trim().toUpperCase();
  if (['ÓPTIMO', 'OPTIMO', 'BUENO', 'OPERATIVO', 'NUEVO', 'LLENO', 'DEVUELTO (BUENO)'].includes(val)) {
    return `<span class="est est-verde" style="font-weight:700">🟢 ${esc(val)}</span>`;
  }
  if (['REGULAR', 'USADO', 'VACÍO', 'VACIO', 'PENDIENTE', 'POR REVISAR', 'DEV. PARCIAL'].includes(val)) {
    return `<span class="est est-ambar" style="font-weight:700">🟡 ${esc(val)}</span>`;
  }
  if (['DAÑADO', 'DANADO', 'EXTRAVIADO', 'ROBADO', 'INOPERATIVO', 'DEFECTUOSO', 'BAJA', 'EN REVISIÓN'].includes(val)) {
    return `<span class="est est-rojo" style="font-weight:700">🔴 ${esc(val)}</span>`;
  }
  return `<span class="est est-gris" style="font-weight:600">${esc(val)}</span>`;
}

function getCondEntrega(r) {
  if (!r) return '—';
  if (r.l && r.l.condEntrega) return r.l.condEntrega;
  if (r.v && r.v.tipo === 'DAN') return 'DAÑADO';
  if (r.v && r.v.tipo === 'EXT') return 'EXTRAVIADO';
  if (r.v && r.v.tipo === 'DEV') return 'ÓPTIMO';
  if (r.l && (r.l.cond || r.l.condicion)) return r.l.cond || r.l.condicion;
  return (r.mod === 'CILINDRO' ? 'LLENO' : 'ÓPTIMO');
}

function getCondRetorno(r) {
  if (!r) return '—';
  if (r.v && r.v.tipo === 'DEV') {
    return (r.l && (r.l.condRet || r.l.cond || r.l.condicion)) || 'ÓPTIMO';
  }
  if (r.v && (r.v.tipo === 'DAN' || r.v.tipo === 'EXT')) {
    return r.v.tipo === 'DAN' ? 'DAÑADO' : 'EXTRAVIADO';
  }
  if (r.v && ['PRH', 'ASI'].includes(r.v.tipo)) {
    if (r.l && r.l.condRet) return r.l.condRet;
    const cantDev = Number(r.l && r.l.dev) || 0;
    const cantTot = Number(r.l && r.l.cant) || 1;
    if (cantDev > 0) {
      const vDev = (DB.vales || []).find(v => v.tipo === 'DEV' && v.ref === r.v.num && (v.lineas || []).some(ld => ld.id === r.l.id || ld.cod === r.l.cod));

        const ld = vDev.lineas.find(ld => ld.id === r.l.id || ld.cod === r.l.cod);
        if (ld && (ld.condRet || ld.cond || ld.condicion)) return ld.condRet || ld.cond || ld.condicion;
      }
      return cantDev >= cantTot ? 'ÓPTIMO' : 'DEV. PARCIAL';
    }
    return 'PENDIENTE';
  }
  return '—';
}

const MF = { alm: '', mod: '', desde: '', hasta: '' };
function mfIni() { if (!MF.desde) { MF.desde = sumarDias(hoy(), -30); MF.hasta = hoy(); } }
const mfAlms = () => MF.alm ? [MF.alm] : DB.almacenes.map(a => a.c);
const enRango = (iso, d, h) => { const f = fechaLocal(new Date(iso)); return f >= d && f <= h; };
function filtrosMaestro(vista) {
  mfIni();

    ${campo('Desde', `<input type="date" id="mfDesde" value="${MF.desde}" onchange="${rec}">`)}${campo('Hasta', `<input type="date" id="mfHasta" value="${MF.hasta}" onchange="${rec}">`)}
    <button class="btn btn-claro" onclick="refrescar()">Actualizar datos</button><span class="ayuda-txt">Última actualización: ${fFH(nowISO())}</span>
  </div></div></div>`;
}
function valorExi(alms, mod) {
  const v = { total: 0, almacen: 0, fuera: 0, dan: 0, ext: 0 };
  alms.forEach(a => Object.entries(DB.exi[a] || {}).forEach(([id, e]) => {
    const it = item(+id); if (!it || (mod && it.mod !== mod)) return; const c = it.costo || 0;
    v.total += totalExi(e) * c; v.almacen += (e.disp + e.vacio) * c; v.fuera += (e.prest + e.asig) * c; v.dan += (e.dan + e.rep) * c; v.ext += e.ext * c;
  }));
  return v;
}
const movsFiltro = (d, h) => DB.movs.filter(m => m.tipo !== 'INI' && enRango(m.fecha, d, h) && (!MF.mod || m.mod === MF.mod) && (!MF.alm || m.origen === MF.alm || m.destino === MF.alm));
const valorMov = m => m.cant * ((item(m.id) || {}).costo || 0);

/* ---------- KPI ---------- */
function kpis(d, h) {
  const alms = mfAlms(), modOk = l => !MF.mod || l.mod === MF.mod;
  const prh = DB.vales.filter(v => v.tipo === 'PRH' && alms.includes(v.origen));
  const vig = prh.filter(v => saldoVale(v) > 0), venc = vig.filter(v => v.fechaDev < hoy());
  const solP = DB.solicitudes.filter(s => alms.includes(s.origen) && s.procesadoEn && enRango(s.procesadoEn, d, h));
  const apr = solP.filter(s => s.estatus === 'APROBADO');
  const tAprob = apr.length ? apr.reduce((a, s) => a + horasEntre(s.finalizadaEn, s.procesadoEn), 0) / apr.length : null;
  const anul = solP.filter(s => s.estatus === 'ANULADO').length;
  const movs = DB.movs.filter(m => alms.includes(m.origen) && enRango(m.fecha, d, h) && (!MF.mod || m.mod === MF.mod));
  const prestado = movs.filter(m => m.tipo === 'PRH').reduce((a, m) => a + m.cant, 0);
  const inc = DB.incid.filter(i => alms.includes(i.alm) && enRango(i.fecha, d, h) && (!MF.mod || item(i.id).mod === MF.mod));
  const danos = inc.filter(i => i.tipo === 'DAN'), perd = inc.filter(i => i.tipo === 'EXT');
  const val = arr => arr.reduce((a, i) => a + i.cant * item(i.id).costo, 0);
  const extCerr = DB.incid.filter(i => i.tipo === 'EXT' && alms.includes(i.alm) && ['RECUPERADO', 'BAJA'].includes(i.estado) && enRango(i.hist[i.hist.length - 1].fecha, d, h));
  const trf = DB.vales.filter(v => v.tipo === 'TRF' && (alms.includes(v.origen) || alms.includes(v.destino)) && enRango(v.fecha, d, h));
  const trfR = trf.filter(v => v.estatus === 'RECIBIDA');
  const tAcep = trfR.length ? trfR.reduce((a, v) => a + horasEntre(v.fecha, v.procesadoEn), 0) / trfR.length : null;
  const trfCerr = trf.filter(v => v.estatus !== 'PENDIENTE DE RECEPCIÓN');
  const epp = entregasEPP(alms).filter(x => enRango(x.fecha, d, h));
  const eppVenc = entregasEPP(alms).filter(x => x.ultima && x.estado === 'VENCIDA');
  return {
    vencPct: vig.length ? venc.length / vig.length * 100 : 0, atraso: venc.length ? venc.reduce((a, v) => a + diasEntre(v.fechaDev, hoy()), 0) / venc.length : 0,
    tAprob, anulPct: solP.length ? anul / solP.length * 100 : 0, danoIdx: prestado ? danos.reduce((a, i) => a + i.cant, 0) / prestado * 100 : 0, danoVal: val(danos),
    perdIdx: prestado ? perd.reduce((a, i) => a + i.cant, 0) / prestado * 100 : 0, perdVal: val(perd),
    malUsoPct: danos.length ? danos.filter(i => i.malUso === 'SI').length / danos.length * 100 : 0,
    recupPct: extCerr.length ? extCerr.filter(i => i.estado === 'RECUPERADO').length / extCerr.length * 100 : null,
    tAcep, rechPct: trfCerr.length ? trfCerr.filter(v => v.estatus === 'RECHAZADA').length / trfCerr.length * 100 : 0, vencTrfPct: trfCerr.length ? trfCerr.filter(v => v.estatus === 'VENCIDA').length / trfCerr.length * 100 : 0,
    eppCant: epp.reduce((a, x) => a + x.cant, 0), eppVal: epp.reduce((a, x) => a + x.cant * x.costo, 0), eppVenc: new Set(eppVenc.map(x => x.cedula)).size,
    prestado, nTrf: trf.length
  };
}
VISTAS.mKpi = () => {
  mfIni();
  const dias = diasEntre(MF.desde, MF.hasta) + 1;
  const A = kpis(MF.desde, MF.hasta), B = kpis(sumarDias(MF.desde, -dias), sumarDias(MF.desde, -1));
  const k = (t, v, fmt, prev, mejorBaja, expl) => {
    let comp = '<span class="k-c neutro">Sin comparación (indicador del estado actual)</span>';
    if (prev !== undefined && v != null && prev != null) { const dif = v - prev; comp = Math.abs(dif) < 0.0001 ? '<span class="k-c neutro">Igual al período anterior</span>' : `<span class="k-c ${(dif > 0) === mejorBaja ? 'sube' : 'baja'}">${dif > 0 ? '▲' : '▼'} ${fmt(Math.abs(dif))} vs. período anterior (${fmt(prev)})</span>`; }
    return `<div class="kpi"><div class="k-t">${t}</div><div class="k-v">${v == null ? 'Sin datos' : fmt(v)}</div>${comp}<div class="k-e">${expl}</div></div>`;
  };
  const pct = x => num(x, 1) + ' %', hrs = x => num(x, 1) + ' h', dd = x => num(x, 1) + ' días', u = x => usd(x), n0 = x => num(x);
  // Top rotación y sin movimiento
  const alms = mfAlms();
  const rot = {}; DB.movs.filter(m => (m.tipo === 'PRH' || m.tipo === 'ASI') && alms.includes(m.origen) && enRango(m.fecha, MF.desde, MF.hasta) && (!MF.mod || m.mod === MF.mod)).forEach(m => { rot[m.cod] = rot[m.cod] || { cod: m.cod, desc: m.desc, n: 0 }; rot[m.cod].n += m.cant; });
  const top = Object.values(rot).sort((a, b) => b.n - a.n).slice(0, 5);
  const lim = new Date(ahora().getTime() - 90 * 86400000).toISOString();
  const conMov = new Set(DB.movs.filter(m => m.tipo !== 'INI' && m.fecha >= lim).map(m => m.id));
  const sinMov = DB.catalogo.filter(it => (!MF.mod || it.mod === MF.mod) && !conMov.has(it.id) && alms.some(a => DB.exi[a] && DB.exi[a][it.id] && totalExi(DB.exi[a][it.id]) > 0));
  // Tendencia mensual (6 meses)
  const meses = []; for (let i = 5; i >= 0; i--) { const d = ahora(); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(fechaLocal(d).slice(0, 7)); }
  const porMes = meses.map(m => { const ms = DB.movs.filter(x => x.tipo !== 'INI' && alms.includes(x.origen) && fechaLocal(new Date(x.fecha)).slice(0, 7) === m && (!MF.mod || x.mod === MF.mod));
    const porTipo = {}; ms.forEach(x => { porTipo[x.tipo] = porTipo[x.tipo] || new Set(); porTipo[x.tipo].add(x.doc); }); Object.keys(porTipo).forEach(k => porTipo[k] = porTipo[k].size);
    return { m, porTipo, docs: new Set(ms.map(x => x.doc)).size, salida: ms.filter(x => x.tipo === 'PRH' || x.tipo === 'ASI').reduce((a, x) => a + valorMov(x), 0) }; });
    const nomMes = m => ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'][+m.slice(5) - 1] + ' ' + m.slice(2, 4);
  $('area').innerHTML = cab('📈 Indicadores (KPI)', `Período ${fF(MF.desde)} al ${fF(MF.hasta)}, comparado con los ${dias} días anteriores.`) + filtrosMaestro('mKpi')
    + `<div class="kpis">
      ${k('Préstamos vencidos', A.vencPct, pct, undefined, true, 'Préstamos con fecha de devolución vencida ÷ préstamos con saldo pendiente.')}
      ${k('Promedio de días de atraso', A.atraso, dd, undefined, true, 'Promedio de días transcurridos desde la fecha de devolución en los préstamos vencidos.')}
      ${k('Tiempo promedio de aprobación', A.tAprob, hrs, B.tAprob, true, 'Horas entre la finalización de la solicitud y su aprobación por el supervisor.')}
      ${k('Tasa de anulación', A.anulPct, pct, B.anulPct, true, 'Solicitudes anuladas ÷ solicitudes procesadas en el período.')}
      ${k('Índice de daño', A.danoIdx, pct, B.danoIdx, true, `Unidades dañadas ÷ unidades prestadas en el período (${num(A.prestado)}). Valor: ${usd(A.danoVal)}.`)}
      ${k('Índice de pérdida', A.perdIdx, pct, B.perdIdx, true, `Unidades extraviadas ÷ unidades prestadas en el período. Valor: ${usd(A.perdVal)}.`)}
      ${k('Daños por mal uso o negligencia', A.malUsoPct, pct, B.malUsoPct, true, 'Daños marcados como mal uso ÷ total de daños registrados.')}
      ${k('Recuperación de extraviados', A.recupPct, pct, B.recupPct, false, 'Casos cerrados con hallazgo ÷ casos de extravío cerrados en el período.')}
      ${k('Tiempo promedio de aceptación de transferencias', A.tAcep, hrs, B.tAcep, true, 'Horas entre el envío y la aceptación en el almacén destino.')}
      ${k('Transferencias rechazadas', A.rechPct, pct, B.rechPct, true, `Rechazadas ÷ transferencias procesadas (${A.nTrf} creadas en el período).`)}
      ${k('Transferencias vencidas', A.vencTrfPct, pct, B.vencTrfPct, true, `Vencidas sin respuesta en ${DB.config.plazoHoras} h ÷ transferencias procesadas.`)}
      ${k('EPP entregado', A.eppCant, n0, B.eppCant, false, `Unidades de EPP entregadas en asignación. Valor: ${usd(A.eppVal)}.`)}
      ${k('Trabajadores con EPP vencido', A.eppVenc, n0, undefined, true, 'Trabajadores cuya última entrega de algún EPP superó su vida útil.')}
    </div>
    <div class="dos-col">
      ${panelG('Tendencia mensual de movimientos', gLinea(porMes.map(x => nomMes(x.m)), ['PRH', 'TRF', 'DEV', 'ASI'].map(k => ({ n: TIPOS[k].n, c: COL_TIPO[k], vals: porMes.map(x => x.porTipo[k] || 0) }))), 'Documentos por mes')}
      ${panelG('Valor despachado en préstamos y asignaciones', gBarras(porMes.map(x => nomMes(x.m)), [{ n: 'USD', c: COL.verde, vals: porMes.map(x => +x.salida.toFixed(2)) }], usd), 'USD por mes')}
      ${panelG('Herramientas más solicitadas del período', gBarrasH(top.map((x, i) => ({ l: x.cod + ' · ' + x.desc, v: x.n, c: [COL.navy, COL.azul, COL.celeste, COL.cian, COL.verde][i] }))), 'Unidades')}
      <div class="panel"><div class="panel-h">Sin movimiento en los últimos 90 días<small>${sinMov.length} ítems · ${usd(sinMov.reduce((a, r) => a + r.costo, 0))}</small></div><div class="panel-b">${grid('gSinMov', [{ t: 'Código', k: 'cod' }, { t: 'Descripción', k: 'desc' }, { t: 'Serial', k: 'serial' }, { t: 'Valor USD', v: r => usd(r.costo), td: 'col-usd' }], sinMov, { sinPie: true, alto: 280 })}</div></div>
    </div>`;
};

VISTAS.mComp = () => {

  const rows = DB.almacenes.map(a => {

  const cols = [{ t: 'Almacén', v: r => r.a.n, f: r => `<b>${esc(r.a.n)}</b>` }, { t: 'Disponibles', v: r => r.t.disp + r.t.vacio, cls: 'cen', td: 'col-disp' }, { t: 'En préstamo', v: r => r.t.prest, cls: 'cen', td: 'col-prest' }, { t: 'Asignados', v: r => r.t.asig, cls: 'cen', td: 'col-asig' },
    { t: 'Dañados', v: r => r.t.dan + r.t.rep, cls: 'cen', td: 'col-dan' }, { t: 'Extraviados', v: r => r.t.ext, cls: 'cen', td: 'col-ext' }, { t: 'Valor USD', v: r => +r.v.total.toFixed(2), f: r => usd(r.v.total), td: 'col-usd' },

/* ---------- Alertas ---------- */
function listaAlertas() {
  const a = [];
  
  prestamosVencidos(DB.almacenes.map(x => x.c)).forEach(({ v, dias }) => a.push({ p: dias > 7 ? 1 : 2, tipo: 'Préstamo vencido', alm: v.origen, det: `${v.num} · ${v.resp.nombre} · ${dias} día(s) de atraso`, doc: v.num, valor: saldoVale(v) && v.lineas.reduce((x, l) => x + saldoLinea(l) * item(l.id).costo, 0) }));
  DB.solicitudes.filter(s => s.estatus === 'FINALIZADO' && horasEntre(s.finalizadaEn, nowISO()) > 48).forEach(s => a.push({ p: 2, tipo: 'Solicitud sin aprobar (> 48 h)', alm: s.origen, det: `${s.num} · finalizada ${fFH(s.finalizadaEn)}`, doc: s.num, valor: s.lineas.reduce((x, l) => x + l.cant * item(l.id).costo, 0) }));
  DB.vales.filter(v => v.tipo === 'TRF' && v.estatus === 'PENDIENTE DE RECEPCIÓN' && (new Date(v.vence) - ahora()) < 2 * 3600000).forEach(v => a.push({ p: 1, tipo: 'Transferencia próxima a vencer', alm: v.destino, det: `${v.num} · ${almNombre(v.origen)} → ${almNombre(v.destino)} · ${restante(v.vence)}`, doc: v.num, valor: v.lineas.reduce((x, l) => x + l.cant * item(l.id).costo, 0) }));
  DB.incid.filter(i => i.estado === 'EN INVESTIGACIÓN').forEach(i => a.push({ p: i.tipoA ? 1 : 2, tipo: 'Extravío en investigación' + (i.tipoA ? ' (Tipo A)' : ''), alm: i.alm, det: `${i.valeRef} · ${i.cod} ${i.desc}`, doc: i.valeRef, valor: i.cant * item(i.id).costo }));
  DB.incid.filter(i => i.tipo === 'DAN' && i.malUso === 'SI' && i.estado !== 'BAJA').forEach(i => a.push({ p: 2, tipo: 'Daño por mal uso (notificar a RRHH)', alm: i.alm, det: `${i.valeRef} · ${i.cod}`, doc: i.valeRef, valor: i.cant * item(i.id).costo }));
  Object.entries(DB.exi).forEach(([alm, o]) => Object.entries(o).forEach(([id, e]) => { if (Object.values(e).some(x => x < 0)) a.push({ p: 1, tipo: 'Existencia negativa o inconsistente', alm, det: item(+id).cod + ' ' + item(+id).desc, doc: '', valor: 0 }); }));
  DB.catalogo.filter(it => !(it.costo > 0)).forEach(it => a.push({ p: 3, tipo: 'Ítem sin costo registrado', alm: '', det: `${it.cod} ${it.desc} ${it.serial || ''}`, doc: '', valor: 0 }));
  entregasEPP(DB.almacenes.map(x => x.c)).filter(x => x.ultima && x.estado === 'VENCIDA').forEach(x => a.push({ p: 3, tipo: 'EPP con reposición vencida', alm: x.alm, det: `${x.nombre} · ${x.desc} · venció ${fF(x.repo)}`, doc: x.vale, valor: x.cant * x.costo }));
  return a.sort((x, y) => x.p - y.p);
}
function contarAlertas() { return listaAlertas().filter(a => a.p === 1).length; }
VISTAS.mAlert = () => {
  const rows = listaAlertas();
  $('area').innerHTML = cab('Alertas', 'Situaciones que requieren atención, ordenadas por prioridad.', botonesExport('gAl', 'Alertas'))

/* =====================================================================
   CRONÓMETRO DE TRANSFERENCIAS Y ALERTA DE VENCIMIENTO
   ===================================================================== */
const alertaMin = () => Number(DB.config.alertaMin) || 30;
function fmtCrono(ms) { if (ms <= 0) return '00:00:00'; const t = Math.floor(ms / 1000); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`; }
function claseCrono(ms) { return ms <= 5 * 60000 ? 'rojo' : ms <= 30 * 60000 ? 'ambar' : 'verde'; }
/* Reloj en vivo: <span class="crono"> se actualiza cada segundo */
function cronoHTML(v, grande) {
  const ms = new Date(v.vence) - ahora();
  return `<span class="crono ${claseCrono(ms)} ${grande ? 'grande' : ''}" data-vence="${v.vence}" data-ini="${v.fecha}">⏱ ${fmtCrono(ms)}</span>`;
}
const S_ALERTA = { avisados30: new Set(), avisados5: new Set(), ocultos: new Set() };
function pendientesPorAceptar() {
  if (!S.u || enMaestro() || !puede('recibir', S.ctx)) return [];
  return DB.vales.filter(v => v.tipo === 'TRF' && v.destino === S.ctx && v.estatus === 'PENDIENTE DE RECEPCIÓN').sort((a, b) => a.vence.localeCompare(b.vence));
}
function verificarAlertasTransferencias() {
  if (!S.u || enMaestro()) return;
  const pend = pendientesPorAceptar();
  const ahoraMs = ahora().getTime();
  pend.forEach(v => {
    const msRestantes = new Date(v.vence).getTime() - ahoraMs;
    const minRestantes = msRestantes / 60000;

    // 1. Notificación preventiva a los 30 minutos
    if (minRestantes <= 30 && minRestantes > 5 && !S_ALERTA.avisados30.has(v.num)) {
      S_ALERTA.avisados30.add(v.num);
      notificarSistema(
        '⏱ Transferencia por vencer: 30 min restantes',
        `A la transferencia ${v.num} enviada desde ${almNombre(v.origen)} le quedan 30 minutos para ser aceptada en ${almNombre(v.destino)}.`,
        'info',
        { doc: v.num }
      );
    }

    // 2. Notificación crítica y urgente a los 5 minutos
    if (minRestantes <= 5 && minRestantes > 0 && !S_ALERTA.avisados5.has(v.num)) {
      S_ALERTA.avisados5.add(v.num);
      notificarSistema(
        '🚨 ¡URGENTE! Transferencia por vencer en 5 minutos',
        `A la transferencia ${v.num} enviada desde ${almNombre(v.origen)} le quedan solo 5 minutos antes de vencer y retornar al almacén de origen.`,
        'err',
        { doc: v.num }
      );
      if ($('modalFondo').style.display !== 'flex' && $('vistaImpresion').style.display !== 'block') {
        abrirModal('🚨 Transferencia por vencer en 5 minutos', `<div class="franja-est rojo" style="justify-content:center">${cronoHTML(v, true)}</div>
          <p class="ayuda-txt">A la transferencia <b>${v.num}</b> enviada por <b>${esc(almNombre(v.origen))}</b> le quedan <b>menos de 5 minutos</b> para ser aceptada en ${esc(almNombre(v.destino))}.</p>
          <p class="ayuda-txt" style="margin-top:8px">Si el reloj llega a 00:00:00, la transferencia <b>vencerá automáticamente</b>: el material no ingresará al inventario y regresará a ${esc(almNombre(v.origen))}.</p>`,
          [{ t: 'Recordarme después', cls: 'btn-claro', fn: cerrarModal }, { t: 'Ver y aceptar ahora', cls: 'btn-verde', fn: () => { cerrarModal(); ir('doc', { num: v.num, back: 'trfRec' }); } }]);
      }
    }
  });
}
function tickCronos() {
  if (!S.u) return;
  let vencio = false;
  document.querySelectorAll('.crono').forEach(el => {
    const ms = new Date(el.dataset.vence) - ahora();
    if (ms <= 0) vencio = true;
    el.textContent = ms > 0 ? '⏱ ' + fmtCrono(ms) : '⏱ Vencida';
    el.className = `crono ${claseCrono(ms)}${el.classList.contains('grande') ? ' grande' : ''}`;
  });
  document.querySelectorAll('.crono-barra i').forEach(el => {
    const ini = new Date(el.dataset.ini), fin = new Date(el.dataset.vence);
    const pct = Math.max(0, Math.min(100, (fin - ahora()) / (fin - ini) * 100));
    el.style.width = pct + '%'; el.style.background = pct * (fin - ini) / 100 <= 5 * 60000 ? 'var(--rojo)' : pct * (fin - ini) / 100 <= 30 * 60000 ? 'var(--ambar)' : 'var(--verde)';
  });
  if (vencio && procesarVencimientos()) { toast('Una transferencia venció sin ser aceptada y su material regresó al almacén de origen.', 'err'); pintarMenu(); refrescar(); }
  verificarAlertasTransferencias();
  pintarBannerAlerta();
}
/* Aviso flotante cuando quedan pocos minutos para aceptar */
function pintarBannerAlerta() {
  const caja = $('bannerTrf'); if (!caja) return;
  const enPantalla = S.vista === 'doc' && S.param ? S.param.num : null;
  const urg = pendientesPorAceptar().filter(v => (new Date(v.vence) - ahora()) <= 30 * 60000 && !S_ALERTA.ocultos.has(v.num) && v.num !== enPantalla);
  if (!urg.length) { caja.style.display = 'none'; caja.innerHTML = ''; return; }
  const firma = urg.map(v => v.num).join('|');
  if (caja.dataset.firma !== firma) {
    caja.dataset.firma = firma;
    caja.innerHTML = `<div class="bt-h">⚠️ ¡Le queda poco tiempo para aceptar!<button onclick="urgOcultar()" title="Ocultar">×</button></div>` + urg.map(v => `<div class="bt-it">
      <div><b>${v.num}</b> desde ${esc(almNombre(v.origen))} · ${v.lineas.reduce((a, l) => a + l.cant, 0)} unidades</div>

      <button class="btn btn-navy btn-mini" onclick="ir('doc',{num:'${v.num}',back:'trfRec'})">Ver y aceptar ahora</button></div>`).join('');
  }
  caja.style.display = 'block';
}

  if (!clave) throw new Error('La contraseña no puede quedar vacía.');
  const u = nuevo ? { usuario, activo: true, perm: {} } : userDe(usr);
  const antes = JSON.stringify({ admin: u.admin, maestro: u.maestro, editaCostos: u.editaCostos, almacenes: u.almacenes, perm: u.perm, clave: u.clave });
  const m = { acc: [], aprobar: [], transferir: [], recibir: [] };

  Object.assign(u, { nombre: $('euN').value.trim(), cargo: $('euCa').value.trim(), admin: $('euAdm').checked, maestro: $('euMae').checked, editaCostos: $('euCos').checked,
    almacenes: m.acc, perm: { aprobar: m.aprobar, transferir: m.transferir, recibir: m.recibir }, clave });
  if (DB.intentos) delete DB.intentos[usuario]; // Desbloquear de inmediato cualquier bloqueo por intentos fallidos

  bit(nuevo ? 'USUARIO CREADO' : 'PERMISOS MODIFICADOS', `${usuario} · Antes: ${nuevo ? '—' : antes} · Después: ${despues}`);

function eliminarRegistroPersonal(p) {
  if (!p) return toast('Seleccione una persona para eliminar.', 'err');
  confirmar(`¿Está seguro de que desea eliminar permanentemente a <b>${esc(p.nombre)}</b> (${esc(p.cedula || 'S/C')}) de la lista de responsables y supervisores?<br><br><small style="color:var(--rojo)">Esta persona dejará de aparecer en las listas oficiales y en la creación de vales.</small>`, () => {
    const idx = DB.personal.findIndex(x => (x.cedula && p.cedula && x.cedula !== 'S/C' && x.cedula === p.cedula) || normTexto(x.nombre) === normTexto(p.nombre));
    if (idx !== -1) {
      const eliminado = DB.personal.splice(idx, 1)[0];
      DB.personalEliminado = DB.personalEliminado || [];
      const claveDel = (eliminado.cedula && eliminado.cedula !== 'S/C') ? digitosCI(eliminado.cedula) : normTexto(eliminado.nombre);
      if (!DB.personalEliminado.includes(claveDel)) DB.personalEliminado.push(claveDel);
      bit('PERSONAL ELIMINADO', `${eliminado.nombre} (${eliminado.cedula || 'S/C'})`);
      guardar();
      toast(`"${p.nombre}" fue eliminado de la lista correctamente.`, 'ok');
      ir('aPers');
    }
  }, 'Eliminar persona');
}

function toggleActivoPersonal(p) {
  if (!p) return;
  p.activo = (p.activo === false ? true : false);
  bit('PERSONAL ' + (p.activo ? 'ACTIVADO' : 'DESACTIVADO'), `${p.nombre} (${p.cedula})`);
  guardar();
  toast(`Persona ${p.activo ? 'activada' : 'desactivada'} correctamente.`, 'ok');
  ir('aPers');
}

        <div style="font-size:11.5px">

        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--fondo-gris,#f8fafc);border-radius:6px;border:1px solid var(--borde)">
        ${listaAlms.map(c => `
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
            <input type="checkbox" class="mpAlmChk" value="${c}" ${(alms.includes('TODOS') || alms.includes(c)) ? 'checked' : ''}>
            <span>${esc(almNombre(c))}</span>

        `).join('')}

    </div>
    <div class="f3" style="margin-top:14px">

      <div></div>

  abrirModal(esEdicion ? 'Editar responsable / supervisor' : 'Nuevo responsable o supervisor', cuerpo, [

    { t: 'Guardar', cls: 'btn-verde', fn: () => run(() => {
      const nom = $('mpNom').value.trim();
      let ced = $('mpCed').value.trim();
      const cargo = $('mpCargo').value.trim();
      const esResp = $('mpRolResp').checked;
      const esSup = $('mpRolSup').checked;
      const almsSel = [...document.querySelectorAll('.mpAlmChk:checked')].map(c => c.value);
      const mod = $('mpMod').value;
      const act = $('mpAct').value === '1';

      if (!nom) throw new Error('Indique el nombre completo de la persona.');
      if (!cargo) throw new Error('Indique el cargo de la persona.');
      if (!esResp && !esSup) throw new Error('Debe marcar al menos un rol: Responsable o Supervisor.');

      if (esSup) tipoArr.push('SUPERVISOR');

        depto: almsSel[0] || 'CENTRAL',

        modulo: mod,

      cerrarModal();

function descargarPlantillaPersonal() {

  plantilla(enc, 'Plantilla_responsables_supervisores');
}

function importarPersonalExcel() {
  leerArchivoTabla(filas => {
    const nuevos = [], act = [], err = [];

    filas.forEach((f, i) => {
      const g = (...ks) => { for (const k of ks) if (f[k] != null && String(f[k]).trim()) return String(f[k]).trim(); return ''; };
      const nombre = g('Nombre', 'NOMBRE', 'Nombre completo');
      let cedula = g('Cédula', 'Cedula', 'CEDULA', 'CI');
      const cargo = g('Cargo', 'CARGO');
      const rolStr = g('Rol', 'ROL', 'Tipo', 'TIPO').toUpperCase();
      const almStr = g('Almacenes', 'ALMACENES', 'Almacén', 'ALMACEN', 'Departamento');
      const modStr = g('Módulo', 'MODULO', 'Modulo').toUpperCase() || 'TODOS';
      const estStr = g('Estado', 'ESTADO').toUpperCase();

      if (!nombre) return err.push(`Fila ${i + 2}: falta Nombre`);
      if (!cargo) return err.push(`Fila ${i + 2}: falta Cargo para ${nombre}`);

      if (!cedula || /S\/C/i.test(cedula) || digitosCI(cedula).length < 5) return err.push(`Fila ${i + 2}: falta Cédula para ${nombre} (todo el personal debe tener cédula obligatoriamente)`);
      cedula = formatCedula(cedula);

      const tipo = [];
      if (rolStr.includes('RESP') || rolStr.includes('AMB')) tipo.push('RESPONSABLE');
      if (rolStr.includes('SUP') || rolStr.includes('AMB')) tipo.push('SUPERVISOR');
      if (!tipo.length) tipo.push('RESPONSABLE');

      let almacenes = [];
      if (almStr) {
        almacenes = almStr.split(/[,;\/]+/).map(a => a.trim().toUpperCase()).filter(Boolean);
      }
      const defAlmImp = (!enMaestro() && typeof S !== 'undefined' && S && S.ctx) ? S.ctx : 'CENTRAL';
      if (!almacenes.length) almacenes = [defAlmImp];
      almacenes = almacenes.map(a => {
        const found = DB.almacenes.find(x => normTexto(x.c) === normTexto(a) || normTexto(x.n).includes(normTexto(a)));
        return found ? found.c : a;
      });

      const activo = estStr !== 'INACTIVO';

      const registro = {
        nombre,
        cedula,
        cargo,
        depto: almacenes[0] || 'CENTRAL',
        tipo,
        almacenes,
        modulo: modStr || 'TODOS',
        activo
      };

      const dig = digitosCI(cedula);
      const ex = DB.personal.find(p => (dig.length >= 5 && p.cedula && digitosCI(p.cedula) === dig) || normTexto(p.nombre) === normTexto(nombre));
      if (ex) {
        act.push({ nuevo: registro, actual: ex });
      } else {
        nuevos.push(registro);
      }
    });

    abrirModal('Vista previa de importación de Personal', `
      <p class="ayuda-txt">
        Nuevos a ingresar: <b>${nuevos.length}</b> · Ya existentes (coincidencia por CI o nombre): <b>${act.length}</b>
        ${err.length ? '<br><b style="color:var(--rojo)">Errores u omisiones:</b><br>' + err.map(esc).join('<br>') : ''}
      </p>
      <label style="display:block;margin:10px 0;font-size:12.5px;font-weight:600">
        <input type="checkbox" id="impActPers" checked> Actualizar roles y almacenes de los registros existentes
      </label>
      <div class="grid-wrap" style="max-height:300px">
        <table class="grid">
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Rol</th><th>Almacenes</th><th>Acción</th></tr></thead>
          <tbody>
            ${nuevos.concat(act.map(x => Object.assign({ _esAct: true }, x.nuevo))).map(r => `
              <tr>
                <td><b>${esc(r.nombre)}</b></td>
                <td>${esc(r.cedula)}</td>
                <td>${esc(r.cargo)}</td>
                <td>${(r.tipo || []).join(', ')}</td>
                <td>${(r.almacenes || []).join(', ')}</td>
                <td><span class="est ${r._esAct ? 'est-azul' : 'est-verde'}">${r._esAct ? 'Actualizar' : 'Crear'}</span></td>
              </tr>
            `).join('')}

function leerArchivoTabla(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';

    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = e => run(() => {
      let filas;
      if (window.XLSX && !/\.csv$/i.test(f.name)) { const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }); }
      else {
        const txt = /\.csv$/i.test(f.name) ? e.target.result : null; if (txt == null) throw new Error('Sin conexión a la librería de Excel: guarde el archivo como CSV.');
        const lineas = txt.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim()); const sep = lineas[0].includes(';') ? ';' : ',';
        const cab = lineas[0].split(sep).map(x => x.replace(/^"|"$/g, '').trim());
        filas = lineas.slice(1).map(l => { const v = l.split(sep).map(x => x.replace(/^"|"$/g, '').trim()); const o = {}; cab.forEach((c, i) => o[c] = v[i] || ''); return o; });
      }
      cb(filas);
    });
    if (/\.csv$/i.test(f.name) || !window.XLSX) rd.readAsText(f, 'utf-8'); else rd.readAsArrayBuffer(f);
  };
  inp.click();
}
function plantilla(enc, nombre) {

}

function cargarParaEditarIni(movNum) {
  const m = DB.movs.find(x => x.n === movNum && x.tipo === 'INI');

  }, 100);
}

function cancelarEdicionIni() {
  window.__iniEditMov = null;
  window.__iniItem = null;
  refrescar();
}

function eliminarCargaIni(movNum) {
  const m = DB.movs.find(x => x.n === movNum && x.tipo === 'INI');
  if (!m) return toast('No se encontró el registro.', 'err');
  const it = item(m.id);
  const nombreIt = it ? `${it.cod} - ${it.desc}` : `Ítem #${m.id}`;
  if (!confirm(`¿Desea revertir y eliminar la carga inicial de ${m.cant} unidad(es) de ${nombreIt} en ${almNombre(m.origen)}?`)) return;

  run(() => {
    const e = exi(m.origen, m.id);
    const esVacio = m.estNue === 'VACÍO' || m.estNue === 'VACIO';
    if (esVacio) {
      if (e.vacio < m.cant) throw new Error(`No se puede revertir: solo quedan ${e.vacio} vacíos disponibles en el almacén.`);
      e.vacio -= m.cant;
    } else {
      if (e.disp < m.cant) throw new Error(`No se puede revertir: solo quedan ${e.disp} disponibles en el almacén (las demás pueden estar prestadas o transferidas).`);
      e.disp -= m.cant;
    }
    const idx = DB.movs.indexOf(m);
    if (idx !== -1) DB.movs.splice(idx, 1);
    bit('CARGA INICIAL REVERTIDA', `${m.origen} · ${nombreIt} x${m.cant}`);
    guardar();
    toast('Carga inicial revertida y eliminada del inventario.', 'ok');
    if (window.__iniEditMov === m) {
      window.__iniEditMov = null;
      window.__iniItem = null;
    }
    refrescar();
  });
}

function accionIni() {
  run(() => {
    let it = window.__iniItem;
    if (!it && $('iniIt') && $('iniIt').value.trim()) {
      const q = $('iniIt').value.trim().toUpperCase();
      it = DB.catalogo.find(x => x.cod === q || (x.serial || '').toUpperCase() === q);
      if (!it) {
        const catSel = $('iniCat') ? $('iniCat').value.trim() : 'Herramientas manuales';
        const mod = (catSel === 'Cilindros y gases' ? 'CILINDRO' : (catSel === 'EPP' ? 'EPP' : 'HERRAMIENTA'));
        it = {
          id: Math.max(0, ...DB.catalogo.map(x => x.id)) + 1,
          cod: q,
          desc: q,
          mod: mod,
          cat: catSel,
          marca: 'SIN MARCA',
          modelo: '—',
          serial: '',
          umb: 'UND',
          costo: 0,
          tipoA: false,
          talla: '',
          vida: 0,
          activo: true
        };
        DB.catalogo.push(it);
      }
    }
    if (!it) throw new Error('Seleccione o ingrese el código del ítem.');
    const alm = $('iniAlm').value;
    const cant = Number($('iniCant').value);
    const esVacio = $('iniEst').value === '1';
    const catSel = $('iniCat') ? $('iniCat').value.trim() : (it.cat || 'Herramientas manuales');

    if (isNaN(cant) || cant <= 0) throw new Error('La cantidad debe ser mayor a 0.');

    // Si se cambió la categoría en el selector, actualizarla en el catálogo
    if (catSel && it.cat !== catSel) {
      it.cat = catSel;
      it.mod = (catSel === 'Cilindros y gases' ? 'CILINDRO' : (catSel === 'EPP' ? 'EPP' : (catSel === 'Otros' ? 'MISCELANEO' : 'HERRAMIENTA')));
    }

    if (window.__iniEditMov) {
      // MODO CORRECCIÓN
      const m = window.__iniEditMov;
      const cantAnt = m.cant;
      const almAnt = m.origen;
      const eAnt = exi(almAnt, m.id);
      const estAntVacio = m.estNue === 'VACÍO' || m.estNue === 'VACIO';

      // 1. Revertir saldo anterior
      if (estAntVacio) eAnt.vacio = Math.max(0, eAnt.vacio - cantAnt);
      else eAnt.disp = Math.max(0, eAnt.disp - cantAnt);

      // 2. Aplicar nuevo saldo
      const eNue = exi(alm, it.id);
      if (esVacio) eNue.vacio += cant;
      else eNue.disp += cant;

      // 3. Actualizar registro en DB.movs
      m.id = it.id;
      m.cod = it.cod;
      m.desc = it.desc;
      m.cat = it.cat;
      m.mod = it.mod;
      m.serial = it.serial || '';
      m.cant = cant;
      m.origen = alm;
      m.destino = alm;
      m.estNue = esVacio ? 'VACÍO' : 'DISPONIBLE';
      m.obs = 'Inventario inicial (corregido)';

      bit('CARGA INICIAL CORREGIDA', `${alm} · ${it.cod} x${cant} (antes ${almAnt} x${cantAnt})`);
      guardar();
      window.__iniEditMov = null;
      window.__iniItem = null;
      toast('Corrección guardada con éxito.', 'ok');
      refrescar();
      return;
    }

    // MODO NUEVO REGISTRO

function imprimirVale(n, alm, solNum) {
  if (!n && !solNum) return toast('El vale aún no tiene número asignado.', 'err');
  let v = valeDe(n, alm, solNum);
  if (!v && String(n).startsWith('SOL-')) {
    const s = solDe(n, alm);
    if (s && s.vale) v = valeDe(s.vale, alm || s.origen, s.num);
  }
  if (!v) return toast('Vale no encontrado.', 'err');
  const t = v.tipo, esTrf = t === 'TRF', esEnt = t === 'ENT';

  if (!puedeImprimir()) return toast('La impresión del vale corresponde al personal del almacén. El supervisor solo aprueba.', 'err');

  const reimpresion = (v.impresiones || 0) > 0;
  v.impresiones = (v.impresiones || 0) + 1;
  bit(reimpresion ? 'REIMPRESIÓN DE VALE' : 'IMPRESIÓN DE VALE', n); guardar();

  const izq = esEnt
    ? `<div><b>Realizado por:</b> ${esc(v.realizadoPor.nombre)}</div><div><b>Cédula:</b> ${esc(v.realizadoPor.cedula)}</div><div><b>Cargo:</b> ${esc(v.realizadoPor.cargo)}</div>`

    ? `<div><b>Realizado por:</b> ${esc(v.realizadoPor.nombre)}</div><div><b>Despachado por:</b> ${esc(v.despacha || v.realizadoPor.nombre)}</div>${v.resp ? `<div><b>Responsable / Custodio:</b> ${esc(v.resp.nombre)} (C.I. ${esc(v.resp.cedula)})</div><div><b>Cargo:</b> ${esc(v.resp.cargo)}</div>` : ''}`
    : `<div><b>Responsable:</b> ${esc(v.resp ? v.resp.nombre : '')}</div><div><b>Cédula:</b> ${esc(v.resp ? v.resp.cedula : '')}</div><div><b>Cargo / Supervisor:</b> ${esc(v.resp ? v.resp.cargo : '')} / ${esc(v.sup)}</div><div><b>Cuenta Auxiliar:</b> ${esc(v.cuenta)}</div>`;

  const der = esEnt
    ? `<div><b>Almacén:</b> ${esc(almNombre(v.origen))}</div>`

  let extra = '';
  if (t === 'PRH') extra = `<b>Fecha requerida:</b> ${fF(v.fechaReq)} &nbsp;·&nbsp; <b>Fecha de devolución:</b> ${fF(v.fechaDev)}${v.extensiones ? ` &nbsp;·&nbsp; <b>Extensiones:</b> ${v.extensiones}` : ''}`;

            let u = (l.umb || it.umb || 'UND').trim().toUpperCase();
            if (u === 'JGO') u = 'JG';
            const m = limpiaTxt(l.marca || it.marca || 'SIN MARCA');
            const mod = limpiaTxt(l.modelo || it.modelo || '—');
            return `<tr>
              <td><b>${esc(l.cod)}</b></td>
              <td>${esc(l.desc)}</td>
              <td class="c"><b>${l.cant || 1}</b></td>
              <td class="c"><b>${esc(u)}</b></td>
              <td>${esc(m)} / ${esc(mod)}</td>

  $('hojaImpresion').innerHTML = `
    <div class="vale-enc">
      <img src="${LOGO}" alt="TIMACA">

      <div class="vale-tit"><div class="t">${esc(TIPOS[t].titulo)}</div>Fecha: ${fF(v.fecha)}<br><span class="n">N° Vale: ${esc(v.num)}</span></div>

  abrirImpresion();
}

const SUPABASE_URL = 'https://whbicbjvasvjufgjexxa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IVbzFr2TLWjMHKLogd4qzw_WU2ZwbNv';
const SYNC_DOC_ID = 'TIMACA_TRAZABILIDAD_V1_SYNC';
const REINICIO_ID = 'TIMACA_FORCE_RESTORE_V24';

let supabaseClient = null;
let cloudSyncEnProgreso = false;
let cloudDebounceTimer = null;
let cloudSuscripcionActiva = false;

function iniciarSupabaseCloud() {
  try {
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  } catch (e) {

    actualizarIndicadorCloud('error');
  }
}

async function sincronizarConNube(forzar = false) {
  if (!supabaseClient || cloudSyncEnProgreso) return;
  cloudSyncEnProgreso = true;
  actualizarIndicadorCloud('sincronizando');

  try {
    const { data, error } = await supabaseClient
      .from('herramientas_vales')
      .select('fecha, lineas, observaciones')
      .eq('numero', SYNC_DOC_ID)
      .maybeSingle();

    if (error) {
      console.warn('Error consultando Supabase:', error);
      actualizarIndicadorCloud('error');
      cloudSyncEnProgreso = false;
      return;
    }

    const cloudData = data && data.lineas && typeof data.lineas === 'object' ? data.lineas : null;
    const cloudFecha = data && data.fecha ? new Date(data.fecha).getTime() : 0;
    const localFecha = DB && DB._actualizadoEn ? new Date(DB._actualizadoEn).getTime() : 0;

    // 1. REGLA SUPREMA: Si la nube tiene el reinicio oficial a cero y el equipo local no lo tiene aplicado,
    // se descarta la memoria local vieja (65 ítems) y se adopta el cero limpio de la nube.
    if (cloudData && cloudData._reinicioId === REINICIO_ID && DB._reinicioId !== REINICIO_ID) {
      console.log('🔄 Aplicando reinicio oficial a cero desde Supabase...');
      descargarDeNube(cloudData);
    }
    // 2. Si la nube tiene cambios más recientes que este equipo:
    else if (cloudData && cloudFecha > localFecha) {
      descargarDeNube(cloudData);
    }
    // 3. Si este equipo tiene cambios locales nuevos (localFecha más reciente o forzado):
    else if (forzar || (localFecha > cloudFecha)) {
      await subirANube();
    }
    // 4. Si el equipo local está recién abierto o sin fecha:
    else if (cloudData && (!localFecha || localFecha === 0)) {
      descargarDeNube(cloudData);
    }
    // 5. Si no hay nada en la nube pero el local ya está en el REINICIO_ID:
    else if (DB && DB._reinicioId === REINICIO_ID && !cloudData) {
      await subirANube();
    }

    actualizarIndicadorCloud('ok');
  } catch (err) {
    console.error('Error en sincronización con la nube:', err);
    actualizarIndicadorCloud('error');
  } finally {
    cloudSyncEnProgreso = false;
  }
}

async function subirANube() {
  if (!supabaseClient || !DB) return;
  try {
    DB._actualizadoEn = new Date().toISOString();
    DB._actualizadoPor = (typeof S !== 'undefined' && S && S.u) ? S.u.usuario : 'SISTEMA';
    DB._reinicioId = REINICIO_ID;

    const payload = {
      numero: SYNC_DOC_ID,
      tipo: 'SYNC',
      fecha: DB._actualizadoEn,
      origen: (typeof S !== 'undefined' && S && S.ctx) ? S.ctx : 'CENTRAL',
      destino: (typeof S !== 'undefined' && S && S.ctx) ? S.ctx : 'CENTRAL',
      estatus: 'ACTIVO',
      observaciones: `Sincronizado por ${DB._actualizadoPor} (${(DB.catalogo||[]).length} ítems)`,
      lineas: DB
    };

    const { error } = await supabaseClient
      .from('herramientas_vales')
      .upsert([payload], { onConflict: 'numero' });

    if (error) {
      console.warn('Error subiendo a Supabase:', error);
      actualizarIndicadorCloud('error');
    } else {
      console.log(`☁️ Subida completada: ${(DB.catalogo||[]).length} ítems en Supabase Cloud.`);
      actualizarIndicadorCloud('ok');
    }
  } catch (e) {
    console.warn('Excepción al subir a la nube:', e);
    actualizarIndicadorCloud('error');
  }
}

function subirANubeDebounced() {
  if (cloudDebounceTimer) clearTimeout(cloudDebounceTimer);
  cloudDebounceTimer = setTimeout(() => {
    subirANube();
  }, 1200);
}

function descargarDeNube(cloudDB) {
  if (!cloudDB || typeof cloudDB !== 'object') return;
  cloudDB = deepCleanDB(cloudDB);
  const base = semilla();
  DB = Object.assign({}, base, cloudDB);

  // Garantizar que almacenes, usuarios, personal y proyectos oficiales NUNCA desaparezcan ni queden vacíos
  if (!Array.isArray(DB.almacenes) || DB.almacenes.length === 0) DB.almacenes = base.almacenes;
  if (!Array.isArray(DB.usuarios) || DB.usuarios.length === 0) DB.usuarios = base.usuarios;
  if (!Array.isArray(DB.personal) || DB.personal.length === 0) DB.personal = base.personal;
  if (!Array.isArray(DB.proyectos) || DB.proyectos.length === 0) DB.proyectos = base.proyectos;
  if (!DB.exi || typeof DB.exi !== 'object') DB.exi = {};
  if (!Array.isArray(DB.catalogo)) DB.catalogo = [];
  if (!Array.isArray(DB.movs)) DB.movs = [];
  if (!Array.isArray(DB.vales)) DB.vales = [];
  if (!Array.isArray(DB.solicitudes)) DB.solicitudes = [];

  DB._reinicioId = cloudDB._reinicioId || REINICIO_ID;

  asegurarProduccionLimpia();
  asegurarUsuariosClave();
  asegurarPersonalOficial();
  if (typeof asegurarProyectosOficiales === 'function') asegurarProyectosOficiales();
  asegurarCategoriasOficiales();
  asegurarEstatusSolicitudes();
  if (typeof reconciliarStockAlmacen === 'function') reconciliarStockAlmacen('TODOS');
  guardarLocalSolo();

  if (typeof refrescar === 'function' && typeof S !== 'undefined' && S && S.u) {
    const hayBorradorActivo = (S.vista === 'ent' && typeof tieneBorradorEnt === 'function' && tieneBorradorEnt(S.ctx)) ||
      (S.vista === 'solNueva' && typeof tieneBorradorSol === 'function' && tieneBorradorSol(S.ctx)) ||
      (S.vista === 'trfNueva' && typeof tieneBorradorTrf === 'function' && tieneBorradorTrf(S.ctx));
    if (hayBorradorActivo) {
      console.log('☁️ Sincronización en segundo plano: se preserva la vista y el borrador en curso.');
      return;
    }
    refrescar();
  }
  if (typeof actualizarAccesosLogin === 'function' && $('lgUsuario')) actualizarAccesosLogin();
  console.log(`☁️ Sincronizados ${(DB.catalogo||[]).length} ítems desde Supabase Cloud.`);
}

function activarRealtimeSupabase() {
  if (!supabaseClient || cloudSuscripcionActiva) return;
  cloudSuscripcionActiva = true;

  try {
    supabaseClient
      .channel('cambios-trazabilidad-timaca')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'herramientas_vales',
        filter: `numero=eq.${SYNC_DOC_ID}`
      }, payload => {
        if (payload.new && payload.new.lineas && !cloudSyncEnProgreso) {
          const cloudFecha = new Date(payload.new.fecha || 0).getTime();
          const localFecha = DB && DB._actualizadoEn ? new Date(DB._actualizadoEn).getTime() : 0;
          if (cloudFecha > localFecha || (payload.new.lineas._reinicioId === REINICIO_ID && DB._reinicioId !== REINICIO_ID)) {
            console.log('⚡ Actualización en tiempo real recibida desde la nube.');
            descargarDeNube(payload.new.lineas);
            toast('☁️ Sincronizado en tiempo real con los demás almacenes.', 'ok');
          }
        }
      })
      .subscribe();
  } catch (e) {
    console.warn('Realtime subscription error:', e);
  }

  // Sondeo de respaldo cada 15 segundos para asegurar que todos los equipos vean los cambios
  setInterval(() => {
    if (!cloudSyncEnProgreso) sincronizarConNube();
  }, 15000);
}

    btn.style.borderColor = 'rgba(59,130,246,0.4)';
    btn.style.color = '#2563eb';
    btn.style.background = 'rgba(59,130,246,0.12)';
    dot.style.background = '#2563eb';
    txt.textContent = '🔄 Sincronizando...';
  } else if (estado === 'ok') {
    btn.style.borderColor = 'rgba(16,185,129,0.3)';
    btn.style.color = '#10b981';
    btn.style.background = 'rgba(16,185,129,0.12)';
    dot.style.background = '#10b981';
    const numIt = (DB && Array.isArray(DB.catalogo)) ? DB.catalogo.length : 0;
    txt.textContent = '☁️ Nube conectada';
  } else if (estado === 'error') {
    btn.style.borderColor = 'rgba(239,68,68,0.4)';
    btn.style.color = '#ef4444';
    btn.style.background = 'rgba(239,68,68,0.12)';
    dot.style.background = '#ef4444';
    txt.textContent = '⚠️ Sin conexión a la nube';
  } else {
    btn.style.borderColor = 'rgba(100,116,139,0.3)';
    btn.style.color = '#64748b';
    btn.style.background = 'rgba(100,116,139,0.1)';
    dot.style.background = '#64748b';
    txt.textContent = 'Modo local (offline)';
  }
}

async function forzarSincronizacionNube() {
  toast('Sincronizando con la nube de TIMACA...', 'info');
  await sincronizarConNube(true);
  if (typeof refrescar === 'function') refrescar();
  toast('Sincronización completada.', 'ok');
}

function iniciar() {
  try {
    document.querySelectorAll('img[data-logo]').forEach(i => {
      if (!i.src || i.src.endsWith('/')) i.src = '/timaca-logo.png';
      i.onerror = () => { if (typeof LOGO !== 'undefined') i.src = LOGO; };
    });
  } catch (e) { }
  try { cargarDatos(); } catch (e) { console.error('Error cargarDatos:', e); }
  try { iniciarSupabaseCloud(); } catch (e) { console.error('Error iniciarSupabaseCloud:', e); }
  try { procesarVencimientos(); } catch (e) { console.error('Error procesarVencimientos:', e); }
  try { pintarUsuariosDemo(); } catch (e) { console.error('Error pintarUsuariosDemo:', e); }
  try { actualizarAccesosLogin(); } catch (e) { }
  setTimeout(actualizarAccesosLogin, 100);
  setTimeout(actualizarAccesosLogin, 300);
  setTimeout(actualizarAccesosLogin, 700);
  setTimeout(actualizarAccesosLogin, 1500);
  try {
    setInterval(() => {
      if ($('pantallaLogin') && $('pantallaLogin').style.display !== 'none') {
        const uVal = $('lgUsuario') ? $('lgUsuario').value.trim() : '';
        if (uVal && $('lgAcceso') && $('lgAcceso').options.length <= 1) {
          actualizarAccesosLogin();
        }
      }
    }, 250);
  } catch (e) { }
  try { actualizarCampanaNotif(); } catch (e) { }
  // Revisión periódica de vencimientos (en el servidor: APScheduler)
  try { setInterval(tickCronos, 1000); } catch (e) { }
  try { setInterval(() => { if (procesarVencimientos() && S.u) { toast('Una transferencia venció y su material regresó al almacén de origen.'); pintarMenu(); } }, 60000); } catch (e) { }
  try { document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('vistaImpresion').style.display === 'block') cerrarImpresion(); else cerrarModal(); } }); } catch (e) { }
  try { window.addEventListener('beforeunload', () => { if (typeof guardarEstadoVistaActual === 'function') guardarEstadoVistaActual(); }); } catch (e) { }
}
iniciar();

</script>
