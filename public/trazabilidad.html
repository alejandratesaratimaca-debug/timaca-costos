// Disponibilidad acumulada en Central agrupada por código (suma todas las marcas, modelos y seriales)
function disponibleCentralPorCodigo(cod) {
  if (!cod || !DB || !DB.catalogo || !DB.exi || !DB.exi['CENTRAL']) return 0;
  const cUpper = String(cod).trim().toUpperCase();
  const items = DB.catalogo.filter(it => (it.cod || '').toUpperCase() === cUpper);
  if (!items.length) return 0;
  return items.reduce((sum, it) => {
    const e = DB.exi['CENTRAL'][it.id];
    return sum + (e ? (e.disp || 0) : 0);
  }, 0);
}

// Cálculo del plan de armado para un tipo de caja
function calcularPlanTipoCaja(tipo) {
  const items = (tipo.items || []).map(linea => {
    const codUpper = String(linea.cod || '').trim().toUpperCase();
    const itCat = DB.catalogo.find(c => (c.cod || '').toUpperCase() === codUpper);
    const disp = disponibleCentralPorCodigo(codUpper);
    const cantReq = Math.max(1, Number(linea.cantReq) || 1);
    const noExiste = !itCat;
    const rinde = noExiste ? 0 : Math.floor(disp / cantReq);
    const costoUnit = itCat ? (itCat.costo || 0) : 0;
    return {
      cod: linea.cod,
      desc: linea.desc || (itCat ? itCat.desc : 'No existe en el catálogo'),
      umb: linea.umb || (itCat ? itCat.umb : 'UND'),
      marca: itCat ? (itCat.marca || '—') : '—',
      cantReq,
      disp,
      rinde,
      costoUnit,
      noExiste
    };
  });

  const cajasPosibles = items.length ? Math.min(...items.map(it => it.rinde)) : 0;

  items.forEach(it => {
    if (it.noExiste) {
      it.estado = 'NO EXISTE';
      it.esLimitante = true;
    } else if (it.disp === 0) {
      it.estado = 'SIN EXISTENCIA';
      it.esLimitante = (cajasPosibles === 0);
    } else if (it.rinde === cajasPosibles) {
      it.estado = 'LIMITANTE';
      it.esLimitante = true;
    } else {
      it.estado = 'SUFICIENTE';
      it.esLimitante = false;
    }
  });

  const limitantes = items.filter(it => it.esLimitante);
  const piezasPorCaja = items.reduce((acc, it) => acc + it.cantReq, 0);
  const costoPorCaja = items.reduce((acc, it) => acc + (it.cantReq * it.costoUnit), 0);

  return {
    tipo,
    items,
    cajasPosibles,
    limitantes,
    piezasPorCaja,
    costoPorCaja
  };
}

VISTAS.cajasPlan = p => {
  const esMaestro = enMaestro();
  const tipos = (DB.cajasTipos || []).filter(t => t.activo !== false);
  inicializarMetasCaja(tipos);
  const planes = tipos.map(t => calcularPlanTipoCaja(t));

  // Filtrado por buscador
  const q = normTexto(PLAN_FILTRO_Q || '');
  const planesFiltrados = planes.filter(pl => {
    if (!q) return true;
    const matchId = normTexto(pl.tipo.id).includes(q);
    const matchEsp = normTexto(pl.tipo.especialidad || '').includes(q);
    const matchNom = normTexto(pl.tipo.nombre).includes(q);
    const matchHerr = (pl.items || []).some(h => normTexto(h.cod).includes(q) || normTexto(h.desc).includes(q));
    return matchId || matchEsp || matchNom || matchHerr;
  });

  // Demanda consolidada según las cajas que el usuario colocó en la columna "¿Cuántas cajas necesitas armar?"
  const demandaConsolidada = {};
  let totCajasMeta = 0;
  planes.forEach(pl => {
    const cantCajas = Math.max(0, parseInt(PLAN_METAS_CAJA[pl.tipo.id]) || 0);
    totCajasMeta += cantCajas;
    if (cantCajas > 0) {
      pl.items.forEach(it => {
        const cod = it.cod.toUpperCase();
        if (!demandaConsolidada[cod]) {
          demandaConsolidada[cod] = {
            cod: it.cod,
            desc: it.desc,
            umb: it.umb,
            cantReq: 0,
            disp: it.disp,
            costoUnit: it.costoUnit,
            usadoEn: []
          };
        }
        demandaConsolidada[cod].cantReq += cantCajas * it.cantReq;
        demandaConsolidada[cod].usadoEn.push(`${pl.tipo.especialidad || pl.tipo.nombre} (${cantCajas * it.cantReq})`);
      });
    }
  });

  const listaDemanda = Object.values(demandaConsolidada).map(d => {
    const faltante = Math.max(0, d.cantReq - d.disp);
    return {
      ...d,
      faltante,
      costoFaltante: faltante * d.costoUnit
    };
  }).sort((a, b) => b.faltante - a.faltante || a.desc.localeCompare(b.desc));

  const listaFaltantesMeta = listaDemanda.filter(d => d.faltante > 0);
  const totPiezasFaltantesMeta = listaFaltantesMeta.reduce((acc, d) => acc + d.faltante, 0);
  const totCostoFaltantesMeta = listaFaltantesMeta.reduce((acc, d) => acc + d.costoFaltante, 0);

function exportarConsolidadoPlanExcel() {
  const esMaestro = enMaestro();
  const tipos = (DB.cajasTipos || []).filter(t => t.activo !== false);
  const planes = tipos.map(t => calcularPlanTipoCaja(t));
  const demanda = {};
  planes.forEach(pl => {
    const n = Math.max(0, parseInt(PLAN_METAS_CAJA[pl.tipo.id]) || 0);
    if (n > 0) {
      pl.items.forEach(it => {
        const cod = it.cod.toUpperCase();
        if (!demanda[cod]) {
          demanda[cod] = { cod: it.cod, desc: it.desc, umb: it.umb, cantReq: 0, disp: it.disp, costoUnit: it.costoUnit, cajas: [] };
        }
        demanda[cod].cantReq += n * it.cantReq;
        demanda[cod].cajas.push(`${pl.tipo.nombre} (${n * it.cantReq})`);
      });
    }
  });
  const filas = Object.values(demanda).map(d => {
    const falt = Math.max(0, d.cantReq - d.disp);
    const r = {
      'Código': d.cod,
      'Herramienta': d.desc,
      'Especialidades': d.cajas.join(' + '),
      'Unidad': d.umb,
      'Total Requerido': d.cantReq,
      'Disponible Central': d.disp,
      'Faltante': falt
    };
    if (esMaestro) {
      r['Costo Unit USD'] = d.costoUnit;
      r['Costo Faltante USD'] = +(falt * d.costoUnit).toFixed(2);
    }
    return r;
  });
  if (!filas.length) return toast('No hay cajas seleccionadas para exportar.', 'err');
  exportarExcel(filas, 'Planificacion_Cajas_Herramientas_TIMACA');
}

  planes.forEach(pl => {
    const n = Math.max(0, parseInt(PLAN_METAS_CAJA[pl.tipo.id]) || 0);
    if (n > 0) {
      resumenCajas.push(`${n}x ${pl.tipo.nombre} (${pl.tipo.id})`);
      pl.items.forEach(it => {
        const cod = it.cod.toUpperCase();

          demanda[cod] = { cod: it.cod, desc: it.desc, umb: it.umb, cantReq: 0, disp: it.disp, costoUnit: it.costoUnit, cajas: [] };

        demanda[cod].cantReq += n * it.cantReq;

// Copiar lista de faltantes formateada al portapapeles
function copiarFaltantesAlPortapapeles(tipoId, deseadas) {
  const tipo = tipoCajaDe(tipoId);
  const plan = calcularPlanTipoCaja(tipo);
  const faltantes = plan.items.map(it => ({
    ...it,
    req: deseadas * it.cantReq,
    falt: Math.max(0, (deseadas * it.cantReq) - it.disp)
  })).filter(x => x.falt > 0);

  let texto = 'SOLICITUD DE REPOSICIÓN / COMPRA PARA ARMADO DE CAJAS\n';
  texto += 'Empresa: ' + DB.config.empresa + '\n';
  texto += 'Almacén Central · Fecha: ' + fFH(nowISO()) + '\n';
  texto += 'Caja / Especialidad: ' + tipo.id + ' - ' + tipo.nombre + '\n';
  texto += 'Cantidad requerida: ' + deseadas + ' caja(s)\n';
  texto += '------------------------------------------------------------\n';
  faltantes.forEach((f, i) => {
    texto += (i + 1) + '. [' + f.cod + '] ' + f.desc + ' · Faltante: ' + f.falt + ' ' + f.umb + ' (Req: ' + f.req + ', Disp Central: ' + f.disp + ')\n';
  });
  texto += '------------------------------------------------------------\n';
  texto += 'Total ítems con faltante: ' + faltantes.length + '\n';

  navigator.clipboard.writeText(texto).then(() => {
    toast('Lista de faltantes copiada al portapapeles.', 'ok');
  }).catch(() => {
    pedirTexto('Copie el siguiente texto:', 'Lista de faltantes', () => {}, 'Cerrar', texto);
  });
}

// Exportar faltantes a Excel
function exportarFaltantesExcel(tipoId, deseadas) {
  const tipo = tipoCajaDe(tipoId);
  const plan = calcularPlanTipoCaja(tipo);
  const esMaestro = enMaestro();
  const faltantes = plan.items.map(it => ({
    ...it,
    req: deseadas * it.cantReq,
    falt: Math.max(0, (deseadas * it.cantReq) - it.disp)
  })).filter(x => x.falt > 0);

  const datos = faltantes.map(f => {
    const r = {
      'Código': f.cod,
      'Descripción': f.desc,
      'Unidad': f.umb,
      'Por Caja': f.cantReq,
      'Req Total': f.req,
      'Disponible Central': f.disp,
      'Faltante': f.falt
    };
    if (esMaestro) {
      r['Costo Unit USD'] = f.costoUnit;
      r['Costo Faltante USD'] = f.falt * f.costoUnit;
    }
    return r;
  });

  exportarExcel(datos, 'Faltantes_' + tipo.id + '_' + deseadas + '_cajas');
}

VISTAS.cajasTipos = p => {

  if (p && p.id) CAJA_LISTA_SEL = p.id;
  if (!CAJA_LISTA_SEL || !tipoCajaDe(CAJA_LISTA_SEL)) {
    CAJA_LISTA_SEL = tipos[0] ? tipos[0].id : '';
  }
  const sel = tipoCajaDe(CAJA_LISTA_SEL);
  const planSel = sel ? calcularPlanTipoCaja(sel) : null;

  const catalogoOpciones = (DB.catalogo || [])
    .filter(it => it.mod === 'HERRAMIENTA')
    .map(it => `<option value="${esc(it.cod)}">${esc(it.cod)} · ${esc(it.desc)}</option>`)
    .join('');

  window.seleccionarEspecialidadLista = id => {
    CAJA_LISTA_SEL = id;
    ir(esMaestro ? 'mCajas' : 'cajasTipos', esMaestro ? { tab: 'listas', id } : { id });
  };

  window.cambiarCantHerrCaja = (tipoId, idx, nuevaCant) => {
    const t = tipoCajaDe(tipoId);
    if (!t || !t.items || !t.items[idx]) return;
    const c = Math.max(1, parseInt(nuevaCant) || 1);
    t.items[idx].cantReq = c;
    guardar();
    seleccionarEspecialidadLista(tipoId);
  };

  window.quitarHerrDeCaja = (tipoId, idx) => {
    const t = tipoCajaDe(tipoId);
    if (!t || !t.items || !t.items[idx]) return;
    const h = t.items[idx];
    t.items.splice(idx, 1);
    bit('HERRAMIENTA QUITADA DE CAJA', `${tipoId} · ${h.cod} ${h.desc}`);
    guardar();
    toast(`Se quitó "${h.desc}" de ${t.nombre}.`, 'ok');
    seleccionarEspecialidadLista(tipoId);
  };

  window.vaciarListaCaja = tipoId => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    confirmar(`¿Desea vaciar todas las herramientas actuales de <b>${esc(t.nombre)}</b> para cargar su lista desde cero?`, () => {
      t.items = [];
      t.estadoLista = 'PENDIENTE LISTA';
      guardar();
      toast(`Lista de ${t.nombre} vaciada. Ahora puede agregar o importar las herramientas.`, 'ok');
      seleccionarEspecialidadLista(tipoId);
    }, 'Vaciar lista');
  };

  window.marcarEstadoListaCaja = (tipoId, estado) => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    t.estadoLista = estado;
    guardar();
    toast(`Estado de la lista actualizado a: ${estado}`, 'ok');
    seleccionarEspecialidadLista(tipoId);
  };

  window.agregarHerrDirectoACaja = tipoId => {
    const t = tipoCajaDe(tipoId);
    if (!t) return;
    let cod = ($(' dirInpCod') ? $(' dirInpCod').value : ($('dirInpCod') ? $('dirInpCod').value : '')).trim().toUpperCase();
    let desc = ($('dirInpDesc') ? $('dirInpDesc').value : '').trim();
    let umb = ($('dirInpUmb') ? $('dirInpUmb').value : 'UND').trim().toUpperCase() || 'UND';
    const cant = Math.max(1, parseInt($('dirInpCant') ? $('dirInpCant').value : '1') || 1);

    let itCat = cod ? DB.catalogo.find(c => (c.cod || '').toUpperCase() === cod) : null;
    if (!itCat && desc) {
      itCat = DB.catalogo.find(c => normTexto(c.desc) === normTexto(desc));
      if (itCat && !cod) cod = itCat.cod;
    }

    if (!desc && itCat) desc = itCat.desc;
    if (!desc) return toast('Escriba la descripción de la herramienta o selecciónela del catálogo.', 'err');

    // Si no tiene código o no existe en el catálogo, generamos/registramos automáticamente en el catálogo para mantener trazabilidad
    if (!cod) {
      const nums = DB.catalogo.map(c => { const m = (c.cod || '').match(/^HE(\d+)$/i); return m ? parseInt(m[1]) : 0; });
      const nextNum = Math.max(100230, ...nums) + 1;
      cod = 'HE' + String(nextNum).padStart(6, '0');
    }
    if (!itCat) {
      const maxId = DB.catalogo.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
      itCat = { id: maxId + 1, cod, desc, mod: 'HERRAMIENTA', cat: t.especialidad || 'General', marca: 'ESTÁNDAR', modelo: '', serial: '', umb, costo: 0, tipoA: false, talla: '', vida: 0, activo: true };
      DB.catalogo.push(itCat);
    }

    t.items = t.items || [];
    const existente = t.items.find(x => (x.cod || '').toUpperCase() === cod);
    if (existente) {
      existente.cantReq += cant;
      toast(`Se sumaron ${cant} ${umb} a "${existente.desc}" en ${t.nombre}.`, 'ok');
    } else {
      t.items.push({ cod, desc: itCat.desc || desc, umb: itCat.umb || umb, cantReq: cant });
      toast(`"${desc}" agregada a la lista de ${t.nombre}.`, 'ok');
    }
    guardar();
    seleccionarEspecialidadLista(tipoId);
  };

  $('area').innerHTML = cab(
    '📋 Listas de Herramientas por Especialidad / Oficio',
    'Seleccione un oficio a la izquierda (Mecánico, Tornero, Electricista, Soldador, Montador, Instrumentista) para ver, editar o cargar desde Excel la lista exacta de herramientas que lleva su caja.',

      <button class="btn btn-verde btn-mini" onclick="modalEditarTipoCaja()">➕ Nueva especialidad / caja</button>
    </div>`
  )
  + navTabsCajas('listas')
  + `<div style="display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start">

  abrirModal(
    esNuevo ? 'Nueva Especialidad / Tipo de Caja' : `Editar Especialidad · ${tipo.id}`,
    cuerpo,
    [
      { t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal },
      {
        t: 'Guardar caja',

          const idVal = ($('tcId').value || '').trim().toUpperCase();

          const descVal = ($('tcDesc').value || '').trim();

          DB.cajasTipos = DB.cajasTipos || [];

          if (dup) throw new Error(`Ya existe un tipo de caja con el código "${idVal}".`);

          if (esNuevo) {
            DB.cajasTipos.push({
              id: idVal,
              especialidad: espVal || nomVal,
              icono: '🧰',
              nombre: nomVal,
              desc: descVal,
              estadoLista: 'PENDIENTE LISTA',
              activo: actVal,
              items: []
            });
            CAJA_LISTA_SEL = idVal;
            bit('TIPO DE CAJA CREADO', `${idVal} - ${nomVal}`);

            const actual = tipoCajaDe(id);
            if (actual) {
              actual.especialidad = espVal || nomVal;
              actual.nombre = nomVal;

              actual.activo = actVal;

            }

          guardar();
          cerrarModal();
          toast('Especialidad / caja guardada con éxito.', 'ok');
          refrescar();

function sugerirSiguienteIdTipoCaja() {
  const tipos = DB.cajasTipos || [];
  let maxNum = tipos.length + 1;
  tipos.forEach(t => {
    const m = (t.id || '').match(/CH-(\d+)/i);
    if (m) {
      const num = parseInt(m[1]);
      if (num >= maxNum) maxNum = num + 1;
    }
  });
  return 'CH-' + String(maxNum).padStart(2, '0');
}

// Carga masiva de contenido de caja desde Excel (permite códigos existentes o herramientas nuevas)
function modalImportarContenidoCaja(tipoId) {
  leerArchivoTabla(filas => {
    if (!filas || !filas.length) return toast('El archivo está vacío o no tiene el formato correcto.', 'err');

    const itemsImportados = [];
    let maxId = DB.catalogo.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);

    filas.forEach((f, idx) => {
      let cod = String(f['Codigo'] || f['codigo'] || f['CÓDIGO'] || f['Código'] || '').trim().toUpperCase();
      const cant = Math.max(1, parseInt(f['Cantidad'] || f['cantidad'] || f['Cant'] || f['CANT'] || 1) || 1);
      const descExcel = String(f['Descripcion'] || f['descripcion'] || f['Descripción'] || f['Herramienta'] || f['HERRAMIENTA'] || '').trim();
      const umbExcel = String(f['Unidad'] || f['unidad'] || f['UMB'] || 'UND').trim().toUpperCase() || 'UND';

      if (cod || descExcel) {
        let itCat = cod ? DB.catalogo.find(c => (c.cod || '').toUpperCase() === cod) : null;
        if (!itCat && descExcel) {
          itCat = DB.catalogo.find(c => normTexto(c.desc) === normTexto(descExcel));
          if (itCat && !cod) cod = itCat.cod;
        }
        if (!cod) {
          cod = 'HE' + String(100300 + idx + 1).padStart(6, '0');
        }
        if (!itCat && descExcel) {
          itCat = { id: ++maxId, cod, desc: descExcel, mod: 'HERRAMIENTA', cat: 'General', marca: 'ESTÁNDAR', modelo: '', serial: '', umb: umbExcel, costo: 0, tipoA: false, talla: '', vida: 0, activo: true };
          DB.catalogo.push(itCat);
        }
        itemsImportados.push({
          cod,
          desc: itCat ? itCat.desc : (descExcel || cod),
          umb: itCat ? itCat.umb : umbExcel,
          cantReq: cant
        });
      }
    });

    if (!itemsImportados.length) {
      return toast('No se encontraron líneas válidas con "Codigo" o "Descripcion".', 'err');
    }

    const tipos = DB.cajasTipos || [];
    const selOpc = tipos.map(t => `<option value="${esc(t.id)}" ${t.id === tipoId ? 'selected' : ''}>${esc(t.id)} - ${esc(t.nombre)} (${esc(t.especialidad || '')})</option>`).join('');

    const cuerpo = `
      <p style="font-size:13px;margin:0 0 10px">Se leyeron <b>${itemsImportados.length} herramientas</b> del archivo Excel.</p>
      <div class="campo">
        <label>Asignar esta lista de herramientas a la caja / especialidad:</label>
        <select id="tcImpSel">
          ${selOpc}
          <option value="__NUEVO__">➕ Crear una nueva especialidad / caja con esta lista</option>
        </select>
      </div>
      <div class="campo" style="margin-top:8px">
        <label>Modo de carga:</label>
        <select id="tcImpModo">
          <option value="reemplazar">Reemplazar la lista actual de esa caja por la del archivo</option>
          <option value="sumar">Agregar / combinar con las herramientas que ya tiene la caja</option>
        </select>
      </div>
    `;

    abrirModal('Confirmar importación de lista de herramientas', cuerpo, [
      { t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal },
      {
        t: 'Importar lista',
        cls: 'btn-verde',
        fn: () => run(() => {
          const sel = $('tcImpSel').value;
          const modo = $('tcImpModo').value;
          if (sel === '__NUEVO__') {
            const nextId = sugerirSiguienteIdTipoCaja();
            DB.cajasTipos.push({
              id: nextId,
              especialidad: 'Especialidad ' + nextId,
              icono: '🧰',
              nombre: 'Caja ' + nextId,
              desc: 'Lista importada desde archivo Excel.',
              estadoLista: 'LISTA OFICIAL',
              activo: true,
              items: itemsImportados
            });
            CAJA_LISTA_SEL = nextId;
            bit('CARGA MASIVA TIPO DE CAJA', nextId + ' con ' + itemsImportados.length + ' herramientas');
          } else {
            const dest = tipoCajaDe(sel);
            if (dest) {
              if (modo === 'reemplazar') {
                dest.items = itemsImportados;
              } else {
                dest.items = dest.items || [];
                itemsImportados.forEach(imp => {
                  const ex = dest.items.find(x => x.cod.toUpperCase() === imp.cod.toUpperCase());
                  if (ex) ex.cantReq += imp.cantReq;
                  else dest.items.push(imp);
                });
              }
              dest.estadoLista = 'LISTA OFICIAL';
              CAJA_LISTA_SEL = dest.id;
              bit('CARGA MASIVA CONTENIDO CAJA', dest.id + ' con ' + itemsImportados.length + ' herramientas');
            }
          }
          guardar();
          cerrarModal();
          toast(`Se cargaron ${itemsImportados.length} herramientas con éxito.`, 'ok');
          refrescar();
        })
      }
    ]);
  });
}

function ir(id, param) {
  if (!S.u) return;
  procesarVencimientos();
  const esMaestro = ['mRes', 'mKpi', 'mComp', 'mExp', 'mTraz', 'mAlert', 'mCajas', 'mCost', 'mAcc'].includes(id);
  if (esMaestro && !enMaestro()) { toast('Esta opción pertenece al Maestro.', 'err'); return; }
  if (!esMaestro && enMaestro() && id !== 'doc') { toast('Esta opción pertenece a los almacenes.', 'err'); return; }
  if (['aUsr', 'aPers', 'aProy', 'aCat', 'aIni', 'aConf', 'aBit', 'aResp'].includes(id) && !S.u.admin) { toast('Solo el administrador puede ingresar a esta opción.', 'err'); return; }
  S.vista = id; S.param = param || null;
  const defMenu = menuDef();
  const grupoDestino = defMenu.find(([g, items]) => items.some(it => it && it[0] === id));
  if (grupoDestino) {
    MENU_GRUPOS_ABIERTOS[grupoDestino[0]] = true;
  }
  pintarMenu();
  $('menu').classList.remove('abierto');
  const fn = VISTAS[id];
  $('area').innerHTML = '';
  if (fn) run(() => fn(param));
  $('area').scrollTop = 0;
}

   (Solicitudes PRH / ASI, Transferencias, Daño, Robo / Extravío)
   ===================================================================== */
let F = null;
const OPC_MOV = () => {
  // Cada formulario muestra solo los movimientos que le corresponden
  if (F.tipo === 'TRF') return [['TRF', 'TRF - Transferencia']];
  if (F.tipo === 'DAN' || F.tipo === 'EXT') return [['DAN', 'DAN - Daño'], ['EXT', 'EXT - Robo / Extravío'], ['DEV', 'DEV - Devolución'], ['PLZ', 'PLZ - Extensión de plazo']];
  return [['PRH', 'PRH - Préstamo temporal'], ['ASI', 'ASI - Asignación']];
};
const RUTA_TIPO = { PRH: 'solNueva', ASI: 'solNueva', TRF: 'trfNueva', DEV: 'dev', DAN: 'mov', EXT: 'mov', PLZ: 'plz' };
function cambiarTipoMov(t) {
  if ((t === 'DAN' || t === 'EXT') && (F.tipo === 'DAN' || F.tipo === 'EXT')) { leerCabecera(); F.tipo = t; F.lineas.forEach(l => { if (t === 'DAN') l.cond = 'DAÑADO'; }); pintarFormulario(); return; }
  if ((t === 'PRH' || t === 'ASI') && (F.tipo === 'PRH' || F.tipo === 'ASI')) { leerCabecera(); F.tipo = t; if (t === 'PRH') F.lineas = F.lineas.filter(l => l.mod !== 'EPP'); pintarFormulario(); return; }
  ir(RUTA_TIPO[t], { tipo: t });
}
function nuevoF(tipo, extra) {
  return Object.assign({ tipo, num: null, origen: S.ctx, destino: tipo === 'TRF' ? destinosPermitidos(S.ctx)[0] : S.ctx, resp: null, sup: '', proyecto: '', cuenta: '',
    fechaReq: hoy(), fechaDev: sumarDias(hoy(), 7), fechaAsig: hoy(), obs: '', lineas: [], sel: -1, cap: null, valeRef: '', detalle: '', malUso: 'NO', dictamen: 'POR EVALUAR', hecho: null }, extra || {});
}
VISTAS.solNueva = p => {
  if (p && p.num) {
    const s = solDe(p.num);
    if (!s) return ir('sol');
    if (s.estatus === 'APROBADO') {
      toast(`La solicitud ${s.num} ya fue APROBADA (Vale ${s.vale || ''}). Por norma de control interno, las asignaciones y préstamos aprobados no se pueden editar.`, 'err');
      return ir('sol', { sel: s.num });
    }
    if (s.estatus === 'ANULADO') {
      toast(`La solicitud ${s.num} está ANULADA y no se puede editar.`, 'err');
      return ir('sol', { sel: s.num });
    }
    F = nuevoF(s.tipo, { num: s.num, destino: s.destino, resp: s.resp, sup: s.sup, proyecto: s.proyecto, cuenta: s.cuenta, fechaReq: s.fechaReq || hoy(), fechaDev: s.fechaDev || sumarDias(hoy(), 7), fechaAsig: s.fechaAsig || hoy(), obs: s.obs, lineas: s.lineas.map(l => Object.assign({}, l)) });
  } else F = nuevoF(p && p.tipo === 'ASI' ? 'ASI' : 'PRH');
  pintarSolicitud();
};

  if (!puede('transferir', S.ctx)) { $('area').innerHTML = cab('Nueva transferencia') + avisoSinPermiso('Su usuario no tiene permiso para registrar transferencias desde este almacén.'); return; }
  F = nuevoF('TRF'); pintarFormulario();
};

function dispItem(alm, id, est) { const e = exi(alm, id); return est === 'VACIO' ? e.vacio : e.disp; }
const estDe = (it, cond) => it.mod === 'CILINDRO' && cond === 'VACÍO' ? 'VACIO' : 'DISP';
function dispCaptura(it, cond) {

/* Agrupa por código: una opción por código con el total disponible y sus variantes (marcas / seriales) */
function gruposDisponibles(q) {
  q = String(q || '').trim().toLowerCase();
  const g = {};
  itemsBuscables().forEach(it => {
    if (q && !(`${it.cod} ${it.desc} ${it.marca} ${it.modelo} ${it.serial} ${it.cat}`.toLowerCase().includes(q))) return;
    g[it.cod] = g[it.cod] || { cod: it.cod, desc: it.desc, cat: it.cat, mod: it.mod, umb: it.umb, disp: 0, variantes: 0, marcas: new Set() };
    g[it.cod].disp += dispTotalItem(it); g[it.cod].variantes++; g[it.cod].marcas.add(it.marca);
  });

    html: `<span class="disp">Stock ${x.disp}</span><b>${esc(x.cod)}</b> · ${esc(x.desc)}<small>${esc(MODULOS[x.mod])} · ${esc(x.cat)} · ${x.variantes} variante(s): ${esc([...x.marcas].join(', '))}</small>` }));
}
let AC_COD = null;
function bindCaptura() {

  bindAC('cDesc', (q, foco) => gruposDisponibles(foco && F.cap ? '' : q), cod => elegirGrupo(cod), { alFoco: true });

function buscarPorCodigo() {
  const q = $('cCod').value.trim().toUpperCase(); if (!q) return;
  const disp = itemsBuscables();
  const porSerial = disp.find(it => it.serial && it.serial.toUpperCase() === q);
  if (porSerial) return elegirGrupo(porSerial.cod, porSerial.id);
  if (disp.some(it => it.cod.toUpperCase() === q)) return elegirGrupo(disp.find(it => it.cod.toUpperCase() === q).cod);
  const parciales = gruposDisponibles(q);
  if (parciales.length) return AC_COD.mostrar(parciales);
  const enCat = DB.catalogo.find(it => it.cod.toUpperCase() === q);

/* Al elegir un código: se cargan las marcas / modelos y seriales disponibles */
function elegirGrupo(cod, idPreferido) {

function salvarLinea(confirmado) {
  const it = F.cap; if (!it) { toast('Busque un ítem por código (Enter) o haga clic en la descripción para elegirlo.', 'err'); $('cCod').focus(); return; }
  const cond = $('cCond').value; const cant = Number($('cCant').value);
  if (!Number.isInteger(cant) || cant <= 0) return toast('La cantidad debe ser un número entero mayor que cero.', 'err');
  if (it.serial && cant !== 1) return toast('Los ítems con serial único solo permiten cantidad 1.', 'err');
  const disp = dispCaptura(it, cond);
  const est = estDe(it, cond);
  const existente = F.lineas.find(l => l.id === it.id && l.est === est);
  if (cant > disp) return toast(`La cantidad supera el stock disponible (${disp}).`, 'err');
  if (cond === 'DAÑADO' && F.tipo !== 'DAN' && !confirmado) return confirmar(`Va a agregar <b>${esc(it.cod)} · ${esc(it.desc)}</b> con condición <b>DAÑADO</b>. ¿Desea continuar?`, () => salvarLinea(true), 'Agregar línea');
  if (existente && confirmado !== 'sumar') {
    if (it.serial) return toast('Este ítem con serial ya está en la grilla.', 'err');
    return confirmar(`El ítem <b>${esc(it.cod)}</b> (${esc(it.marca)} / ${esc(it.modelo)}) ya está en la grilla con ${existente.cant} ${esc(it.umb)}. ¿Desea sumar ${cant} a esa línea?`, () => { existente.cant += cant; existente.cond = cond; limpiarCaptura(); pintarLineas(); $('cCod').focus(); }, 'Sumar cantidad');

function cambiarCantLinea(i, val) {

  if (isNaN(c) || c <= 0) {

  if (c > dispTotal) {

  const lin = F.lineas.filter(l => l.cant > 0);
  $('fTotales').innerHTML = `Total de líneas: <b>${lin.length}</b> · Total de unidades: <b>${lin.reduce((a, l) => a + l.cant, 0)}</b>${!F.valeRef && !F.hecho && F.lineas.length ? ' · Puede eliminar o ajustar la cantidad de cualquier ítem' : ''}`;
}
function eliminarLinea(i) {
  const l = F.lineas[i];
  if (!l) return;
  confirmar(`¿Eliminar la línea <b>${esc(l.cod)} · ${esc(l.desc)}</b> (${l.cant} ${esc(l.umb)})?`, () => {
    F.lineas.splice(i, 1);
    F.sel = -1;
    pintarLineas();
    if ($('cCod')) $('cCod').focus();
    toast('Ítem eliminado de la solicitud.', 'ok');
  }, 'Eliminar ítem');
}
function finalizarFormulario(finalizar) {
  leerCabecera();
  run(() => {
    const t = F.tipo;
    if (t === 'PRH' || t === 'ASI') {
      const s = guardarSolicitud({ num: F.num, tipo: t, origen: F.origen, destino: F.destino, resp: F.resp, sup: F.sup, proyecto: F.proyecto, cuenta: F.cuenta, fechaReq: F.fechaReq, fechaDev: F.fechaDev, fechaAsig: F.fechaAsig, obs: F.obs, lineas: F.lineas }, finalizar);
      toast(finalizar ? `Solicitud ${s.num} finalizada y enviada a aprobación de: ${aprobadoresDe(s.origen).join(', ') || 'supervisor autorizado'}.` : `Solicitud ${s.num} guardada como NO FINALIZADO.`, 'ok');
      ir('sol', { sel: s.num });
    } else if (t === 'TRF') {
      const v = crearTransferencia({
        origen: F.origen,
        destino: F.destino,
        resp: F.resp,
        sup: F.sup,
        proyecto: F.proyecto,
        cuenta: F.cuenta,
        despacha: F.despacha || S.u.nombre,
        salidaTimaca: F.salidaTimaca || '',
        obs: F.obs,
        lineas: F.lineas
      });
      F.hecho = v.num; toast(`Transferencia ${v.num} registrada. Pendiente de recepción en ${almNombre(v.destino)}.`, 'ok'); pintarMenu(); pintarFormulario();
    } else {
      const lineas = F.valeRef ? F.lineas.filter(l => l.cant > 0) : F.lineas;
      if (!F.valeRef && t !== 'TRF' && !F.resp) throw new Error('Seleccione el responsable custodio desde la lista de personal.');
      const v = registrarIncidencia(t, { origen: F.origen, valeRef: F.valeRef, resp: F.resp, sup: F.sup, proyecto: F.proyecto, cuenta: F.cuenta, detalle: F.detalle, malUso: F.malUso, dictamen: F.dictamen, obs: F.obs, lineas });
      F.hecho = v.num; toast(`${TIPOS[t].n} registrado: ${v.num}.`, 'ok'); pintarFormulario();
    }
  });
}

      ${L('Número')}<div class="vl"><input id="sNum" value="${esc(F.num || '')}" placeholder="Se asigna al salvar" readonly></div>

      ${L('Tipo de asignación')}<div class="vl"><select id="fTA" onchange="cambiarTipoSol(this.value === 'DEF' ? 'PRH' : 'ASI')">${opciones([['DEF', 'TIEMPO DEFINIDO'], ['IND', 'TIEMPO INDEFINIDO']], t === 'PRH' ? 'DEF' : 'IND')}</select></div>

function cambiarTipoSol(t) {
  leerCabecera(); F.tipo = t;
  if (t === 'PRH' && F.lineas.some(l => l.mod === 'EPP')) { F.lineas = F.lineas.filter(l => l.mod !== 'EPP'); toast('Se retiraron las líneas de EPP: el EPP no se presta, se asigna como dotación.', 'err'); }
  pintarSolicitud();
}
function salvarSolicitud() {
  leerCabecera();
  run(() => {
    const s = guardarSolicitud({ num: F.num, tipo: F.tipo, origen: F.origen, destino: F.destino, resp: F.resp, sup: F.sup, proyecto: F.proyecto, cuenta: F.cuenta, fechaReq: F.fechaReq, fechaDev: F.fechaDev, fechaAsig: F.fechaAsig, obs: F.obs, lineas: F.lineas }, false);
    F.num = s.num; $('sNum').value = s.num; toast(`Solicitud ${s.num} guardada (NO FINALIZADO). Puede seguir editándola.`, 'ok');
  });
}
function bindResponsableProyecto() {
  if ($('fResp')) {
    bindAC('fResp', fuentePersonal, p => {
      F.resp = { nombre: p.nombre, cedula: p.cedula, cargo: p.cargo };
      $('fResp').value = p.nombre;
      if ($('fCed')) $('fCed').value = p.cedula || 'S/C';
      if ($('fCargo')) $('fCargo').value = p.cargo;
    }, { alFoco: true });

    $('fResp').addEventListener('change', () => {
      const val = $('fResp').value.trim();
      if (!val) {
        F.resp = null;
        if ($('fCed')) $('fCed').value = '';
        if ($('fCargo')) $('fCargo').value = '';
        return;
      }
      const match = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('RESPONSABLE') &&
        (S.ctx === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(S.ctx)) &&
        (normTexto(p.nombre) === normTexto(val) || (digitosCI(val).length >= 5 && digitosCI(p.cedula) === digitosCI(val))));
      if (match) {
        F.resp = { nombre: match.nombre, cedula: match.cedula, cargo: match.cargo };
        $('fResp').value = match.nombre;
        if ($('fCed')) $('fCed').value = match.cedula || 'S/C';
        if ($('fCargo')) $('fCargo').value = match.cargo;
      } else {
        F.resp = null;
        if ($('fCed')) $('fCed').value = '';
        if ($('fCargo')) $('fCargo').value = '';
        toast(`"${val}" no está registrado como responsable en ${almNombre(S.ctx)}. Seleccione de la lista oficial.`, 'err');
      }
    });
  }

  if ($('fSup')) {
    bindAC('fSup', fuenteSupervisores, p => {
      F.sup = p.nombre;
      $('fSup').value = p.nombre;
    }, { alFoco: true });

    $('fSup').addEventListener('change', () => {
      const val = $('fSup').value.trim();
      if (!val) {
        F.sup = '';
        return;
      }
      const supMatch = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('SUPERVISOR') &&
        (S.ctx === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(S.ctx)) &&
        normTexto(p.nombre) === normTexto(val));
      if (supMatch) {
        F.sup = supMatch.nombre;
        $('fSup').value = supMatch.nombre;
      } else {
        F.sup = '';
        toast(`"${val}" no es un supervisor autorizado para ${almNombre(S.ctx)}. Seleccione de la lista.`, 'err');
      }
    });
  }

  if ($('fProy')) {
    bindAC('fProy', fuenteProyectos, p => {
      F.proyecto = p.nombre;
      F.cuenta = p.cuenta;
      $('fProy').value = p.nombre;
      if ($('fCuenta')) $('fCuenta').value = p.cuenta;
    }, { alFoco: true });

    $('fProy').addEventListener('change', () => {
      const val = $('fProy').value.trim();
      if (F.proyecto && F.cuenta && normTexto(F.proyecto) === normTexto(val)) {
        if ($('fCuenta')) $('fCuenta').value = F.cuenta;
        return;
      }
      const p = DB.proyectos.find(x => normTexto(x.cuenta) === normTexto(val)) || DB.proyectos.find(x => normTexto(x.nombre) === normTexto(val));
      if (p) {
        F.proyecto = p.nombre;
        F.cuenta = p.cuenta;
        $('fProy').value = p.nombre;
      } else {
        F.proyecto = '';
        F.cuenta = '';
        if (val) toast('Seleccione un proyecto o cuenta auxiliar registrada de la lista.', 'err');
      }
      if ($('fCuenta')) $('fCuenta').value = F.cuenta;
    });
  }
}

/* =====================================================================
   ENTRADA DE ÍTEMS AL CATÁLOGO DEL ALMACÉN
   ===================================================================== */
let E = null;
VISTAS.ent = () => {
  E = { lineas: [], sel: -1, hecho: null, base: null };
  pintarEntrada();
};
function pintarEntrada() {
  const bloq = !!E.hecho, ro = bloq ? 'disabled' : '';
  const umbs = [...new Set(DB.catalogo.map(i => i.umb))].sort();
  $('area').innerHTML = cab('➕ Entrada de ítems al catálogo', 'Registre herramientas, cilindros o EPP que ingresan al almacén. Si el código ya existe se suma la cantidad; si es nuevo, se crea en el catálogo. Lo recibido por transferencia entra solo al aceptarla.')
    + (E.hecho ? `<div class="franja-est verde"><span>Entrada <b>${E.hecho}</b> registrada. Los ítems ya aparecen en el catálogo de ${esc(almNombre(S.ctx))}.</span><span><button class="btn btn-claro btn-mini" onclick="ir('cCatAlm')">Ver catálogo</button></span></div>` : '')
    + `<div class="form-reg"><div class="f3">
      ${campo('Almacén', `<input value="${esc(almNombre(S.ctx))}" readonly>`)}${campo('Fecha', `<input value="${fF(nowISO())}" readonly>`)}${campo('Registrado por', `<input value="${esc(S.u.nombre)}" readonly>`)}
      ${campo('Observación', `<input id="enObs" ${ro} placeholder="Opcional">`)}
    </div>
    <div class="carga"><div class="carga-h">ÍTEM A INGRESAR</div>
      ${bloq ? '' : `<div style="padding:12px;border-bottom:1px solid var(--borde)"><div class="f3" style="grid-template-columns:repeat(6,1fr)">
        <div class="campo" style="position:relative"><label>Código</label><input id="eCod" autocomplete="off" placeholder="Nuevo o existente"></div>
        <div class="campo" style="grid-column:span 2"><label>Descripción</label><input id="eDesc"></div>
        ${campo('Módulo', `<select id="eMod" onchange="condEntrada()">${opciones(Object.entries(MODULOS))}</select>`)}
        ${campo('Categoría', `<select id="eCat">${opciones(CATEGORIAS_OFICIALES, 'Herramientas manuales')}</select>`)}${campo('Unidad', `<input id="eUmb" list="dlUmb" value="UND">`)}
        ${campo('Marca', `<input id="eMarca" placeholder="Ej. STANLEY">`)}${campo('Modelo', `<input id="eModelo">`)}${campo('Serial (ítem único)', `<input id="eSerial" placeholder="Opcional">`)}
        ${campo('Condición', `<select id="eCond"></select>`)}${campo('Cantidad', `<input id="eCant" type="number" min="1" value="1" style="text-align:center;font-weight:800">`)}
        <div class="campo" style="justify-content:flex-end"><label>&nbsp;</label><button class="btn-salvar" onclick="agregarEntrada()">Agregar ítem</button></div>
      </div></div>`}
      <div id="eLineas"></div></div>
    <div class="pie-form"><div class="totales" id="eTot"></div><div class="der">
      ${bloq ? `<button class="btn btn-claro" onclick="ir('ent')">Nueva entrada</button>` : `<button class="btn btn-claro" onclick="ir('cCatAlm')">Cancelar</button><button class="btn btn-verde" onclick="registrarEntradaUI()">✔ Registrar entrada</button>`}
      <button class="btn btn-azul" ${bloq ? '' : 'disabled'} onclick="imprimirVale('${E.hecho || ''}')">🖨 Imprimir vale</button>
    </div></div></div>
    <datalist id="dlUmb">${umbs.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
  if (!bloq) {
    condEntrada();
    bindAC('eCod', q => { q = q.trim().toLowerCase(); if (q.length < 2) return []; const g = {}; DB.catalogo.filter(i => (i.cod + ' ' + i.desc).toLowerCase().includes(q)).forEach(i => g[i.cod] = g[i.cod] || i); return Object.values(g).slice(0, 15).map(i => ({ val: i, html: `<b>${esc(i.cod)}</b> · ${esc(i.desc)}<small>${esc(MODULOS[i.mod])} · ${esc(i.cat)} · código existente</small>` })); },
      i => { E.base = i; $('eCod').value = i.cod; $('eDesc').value = i.desc; $('eMod').value = i.mod; $('eCat').value = i.cat; $('eUmb').value = i.umb; ['eDesc', 'eMod', 'eCat', 'eUmb'].forEach(x => $(x).disabled = true); condEntrada(); $('eMarca').focus(); });
    $('eCod').addEventListener('input', () => { if (E.base) { E.base = null; ['eDesc', 'eMod', 'eCat', 'eUmb'].forEach(x => $(x).disabled = false); } });
  }
  pintarLineasEntrada();
}
function condEntrada() { if ($('eCond')) $('eCond').innerHTML = opciones($('eMod').value === 'CILINDRO' ? ['LLENO', 'VACÍO'] : ['NUEVO', 'ÓPTIMO']); }
function agregarEntrada() {
  run(() => {
    const cod = $('eCod').value.trim().toUpperCase(), desc = $('eDesc').value.trim(), serial = $('eSerial').value.trim().toUpperCase(), cant = Number($('eCant').value);
    if (!cod || !desc) throw new Error('Código y descripción son obligatorios.');
    const existente = DB.catalogo.find(i => i.cod === cod);
    if (existente && !E.base && existente.desc.toLowerCase() !== desc.toLowerCase()) throw new Error(`El código ${cod} ya existe como "${existente.desc}". Selecciónelo de la lista o use otro código.`);
    if (!Number.isInteger(cant) || cant <= 0) throw new Error('La cantidad debe ser un número entero mayor que cero.');
    if (serial) {
      if (cant !== 1) throw new Error('Un ítem con serial único solo admite cantidad 1.');
      const it = DB.catalogo.find(i => (i.serial || '').toUpperCase() === serial);
      if (it && DB.almacenes.some(a => DB.exi[a.c] && DB.exi[a.c][it.id] && totalExi(DB.exi[a.c][it.id]) > 0)) throw new Error(`El serial ${serial} ya existe con existencia en el sistema.`);
      if (E.lineas.some(l => l.serial === serial)) throw new Error('Ese serial ya está en la entrada.');
    }
    const base = E.base || existente;
    const l = { cod, desc: base ? base.desc : desc, mod: base ? base.mod : $('eMod').value, cat: base ? base.cat : ($('eCat').value.trim() || 'General'), umb: base ? base.umb : ($('eUmb').value.trim() || 'UND'),
      marca: $('eMarca').value.trim().toUpperCase() || 'GENÉRICA', modelo: $('eModelo').value.trim() || '—', serial, cond: $('eCond').value, cant };
    const dup = E.lineas.find(x => !serial && x.cod === l.cod && x.marca === l.marca && x.modelo === l.modelo && x.cond === l.cond);
    if (dup) dup.cant += cant; else E.lineas.push(l);
    ['eSerial', 'eModelo'].forEach(x => $(x).value = ''); $('eCant').value = 1;
    pintarLineasEntrada(); $('eSerial').focus();
  });
}
function pintarLineasEntrada() {
  const bloq = !!E.hecho;
  $('eLineas').innerHTML = `<div style="overflow:auto"><table class="grid"><thead><tr><th>Código</th><th>Descripción</th><th>Módulo</th><th>Categoría</th><th>Unidad</th><th>Marca / Modelo</th><th>Serial</th><th>Condición</th><th class="cen">Cantidad</th><th class="cen">Acción</th></tr></thead><tbody>
    ${E.lineas.length ? E.lineas.map((l, i) => `<tr class="${E.sel === i ? 'sel' : ''}" onclick="${bloq ? '' : `E.sel=${i};pintarLineasEntrada()`}"><td>${esc(l.cod)}</td><td>${esc(l.desc)}</td><td>${chipMod(l.mod)}</td><td>${esc(l.cat)}</td><td>${esc(l.umb)}</td><td>${esc(l.marca)} / ${esc(l.modelo)}</td><td>${esc(l.serial || '—')}</td><td>${esc(l.cond)}</td><td class="cen"><b>${l.cant}</b></td>
      <td class="cen">${bloq ? '' : `<button class="btn btn-rojo btn-mini" ${E.sel === i ? '' : 'disabled'} onclick="event.stopPropagation();E.lineas.splice(${i},1);E.sel=-1;pintarLineasEntrada()">Eliminar</button>`}</td></tr>`).join('')
      : `<tr><td class="grid-vacio" colspan="10">Agregue los ítems que ingresan al almacén.</td></tr>`}</tbody></table></div>`;
  $('eTot').innerHTML = `Total de líneas: <b>${E.lineas.length}</b> · Total de unidades: <b>${E.lineas.reduce((a, l) => a + l.cant, 0)}</b>${E.lineas.length && !bloq ? ' · Seleccione una línea para eliminarla' : ''}`;
}
function registrarEntradaUI() {
  run(() => { const v = registrarEntrada({ origen: S.ctx, lineas: E.lineas, obs: $('enObs') ? $('enObs').value.trim() : '' });
    E.hecho = v.num; toast(`Entrada ${v.num} registrada.`, 'ok'); pintarEntrada(); });
}

/* =====================================================================
   VISTA DE SOLO LECTURA (igual al formulario) PARA SOLICITUDES Y VALES

VISTAS.doc = p => {
  const esSol = p.num.startsWith('SOL-');

  if (!d) { $('area').innerHTML = cab('Documento no encontrado'); return; }
  if (!enMaestro() && !S.u.admin && d.origen !== S.ctx && d.destino !== S.ctx) { $('area').innerHTML = cab('Acceso no permitido') + avisoSinPermiso('Este documento pertenece a otro almacén.'); return; }
  const t = d.tipo, est = esSol ? d.estatus : estadoVale(d);
  const color = EST_COLOR[est] === 'ambar' ? 'naranja' : (EST_COLOR[est] || 'gris');
  let franjaDer = '';
  if (t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN') franjaDer = `<span style="display:flex;align-items:center;gap:10px">Tiempo restante para aceptar: ${cronoHTML(d, true)}</span>`;
  else if (d.procesadoEn) franjaDer = `${est === 'APROBADO' ? 'Aprobada' : est === 'ANULADO' ? 'Anulada' : 'Procesada'} por <b>${esc(d.procesadoPor.nombre)}</b> el ${fFH(d.procesadoEn)}${d.motivo ? ' · Motivo: ' + esc(d.motivo) : ''}`;
  else if (esSol && est === 'FINALIZADO') franjaDer = 'Pendiente de aprobación del supervisor de ' + esc(almNombre(d.origen));
  const R = (lbl, v) => campo(lbl, `<input value="${esc(v ?? '')}" readonly>`);
  let c = R('Tipo de movimiento', `${t} - ${TIPOS[t].n}`) + R('N° ' + (esSol ? 'solicitud' : 'vale'), d.num) + R('Fecha y hora', fFH(d.fecha))
    + R('Almacén origen', almNombre(d.origen)) + R('Almacén destino', almNombre(d.destino));
  if (t === 'TRF') {
    c += R('Realizado por', d.realizadoPor.nombre) + R('Cédula', d.realizadoPor.cedula) + R('Cargo', d.realizadoPor.cargo);
    if (d.despacha) c += R('Quién despacha', d.despacha);
    if (d.resp) c += R('Responsable custodio', d.resp.nombre) + R('Cédula', d.resp.cedula) + R('Cargo', d.resp.cargo);
    if (d.cuenta) c += R('Cuenta auxiliar', d.cuenta);
    if (d.proyecto) c += R('Proyecto / OT', d.proyecto);
    if (d.sup) c += R('Supervisor autoriza', d.sup);
  }
  else if (t === 'ENT') c += R('Registrado por', d.realizadoPor.nombre) + (d.obs ? R('Observación', d.obs) : '');
  else if (t === 'DEVCH') {
    c += R('Caja de herramientas', `${d.cajaId} · ${d.cajaNombre || ''}`)
      + R('Responsable que devuelve', d.resp ? d.resp.nombre : '—')

  else if (t === 'PRHCH') {

      + R('Nueva fecha dev. prevista', fF(d.fechaDevPrev))

  }
  else {
    c += R(esSol ? 'Generado por' : 'Registrado por', esSol ? d.generadoPor.nombre : d.realizadoPor.nombre);

  const extraTxt = (d.extra && (d.extra.detalle || d.extra.motivo)) ? campo(t === 'PLZ' ? 'Motivo' : 'Descripción', `<textarea rows="2" readonly>${esc(d.extra.detalle || d.extra.motivo)}</textarea>`) : '';
  const conSaldo = !esSol && (t === 'PRH' || t === 'ASI');

        <td class="cen">${l.danRef ? `<span class="est est-rojo">${esc(l.danRef)}</span> ` : ''}${l.extRef ? `<span class="est est-naranja">${esc(l.extRef)}</span>` : ''}${(!l.danRef && !l.extRef) ? '—' : ''}</td>
      </tr>`).join('')
    : d.lineas.map(l => `<tr><td>${esc(l.cod)}</td><td>${esc(l.desc)}</td><td>${esc(l.marca)} / ${esc(l.modelo)}</td><td>${esc(l.serial || '—')}</td><td>${esc(l.cat)}</td><td>${esc(l.umb)}</td><td>${esc(l.cond)}</td><td class="cen"><b>${l.cant}</b></td>${conSaldo ? `<td class="cen">${l.consumo ? 'Dotación' : (l.dev || 0)}</td><td class="cen">${saldoLinea(l)}</td>` : ''}</tr>`).join('');
  const und = d.lineas.reduce((a, l) => a + l.cant, 0);
  const acciones = accionesDoc(d, esSol, p);
  const nota = esSol ? (d.estatus === 'FINALIZADO' ? motivoNoAprueba(d) : d.estatus === 'NO FINALIZADO' ? 'La solicitud aún no está finalizada. Ábrala desde "Solicitudes del almacén" con "Editar solicitud" y presione "Finalizar solicitud".' : d.estatus === 'APROBADO' ? (puedeImprimir() ? 'Solicitud aprobada: ya puede imprimir el vale ' + d.vale + '.' : 'Solicitud aprobada. El personal del almacén imprimirá el vale ' + d.vale + '.') : '') : '';
  $('area').innerHTML = cab(esSol ? 'Solicitud ' + d.num : TIPOS[t].titulo.charAt(0) + TIPOS[t].titulo.slice(1).toLowerCase() + ' ' + d.num, 'Vista de solo lectura: muestra exactamente lo registrado.', `<button class="btn btn-claro" onclick="${p.back ? `ir('${p.back}')` : 'history.back()'}">Volver</button>`)
    + `<div class="franja-est ${color}" style="${t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' ? 'flex-wrap:wrap' : ''}"><span>Estatus: ${estB(est)}</span><span>${franjaDer}</span>${t === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' ? `<div class="crono-barra"><i data-ini="${d.fecha}" data-vence="${d.vence}"></i></div><span style="font-size:12px;color:var(--texto-2)">${d.destino === S.ctx ? `Si no la acepta o rechaza antes de que el reloj llegue a cero, la transferencia vencerá y el material regresará a ${esc(almNombre(d.origen))}.` : `${esc(almNombre(d.destino))} debe aceptarla antes de que el reloj llegue a cero; si no, el material regresará automáticamente a ${esc(almNombre(d.origen))}.`}</span>` : ''}</div>${nota ? `<div class="franja-est ${d.estatus === 'APROBADO' ? 'verde' : 'naranja'}"><span>ℹ️ ${esc(nota)}</span></div>` : ''}
    <div class="form-reg"><div class="f3">${c}</div>${extraTxt}${d.obs ? campo('Observación', `<input value="${esc(d.obs)}" readonly>`) : ''}
      <div class="carga"><div class="carga-h">CARGA DE MATERIAL</div>
        <div style="overflow:auto"><table class="grid"><thead>${esDevch ? '<tr><th>Código</th><th>Descripción</th><th>Marca / Modelo</th><th>Serial</th><th>Categoría</th><th class="cen">Entregado</th><th class="cen">Recibido</th><th class="cen">Diferencia</th><th class="cen">Condición</th><th class="cen">Reportes Incidentes</th></tr>' : '<tr><th>Código</th><th>Descripción</th><th>Marca / Modelo</th><th>Serial</th><th>Categoría</th><th>Unidad</th><th>Condición</th><th class="cen">Cantidad</th>' + (conSaldo ? '<th class="cen">Devuelto</th><th class="cen">Saldo</th>' : '') + '</tr>'}</thead><tbody>${filas}</tbody></table></div>
      </div>
      <div class="pie-form"><div class="totales">Total de líneas: <b>${d.lineas.length}</b> · Total de unidades: <b>${und}</b></div><div class="der">${acciones}</div></div>
    </div>
    ${!esSol && d.hist && d.hist.length ? `<div class="panel"><div class="panel-h">Historial del documento</div><div class="panel-b">${timeline(d)}</div></div>` : ''}
    ${esSol && d.vale ? `<div class="franja-est azul"><span>Vale generado al aprobar: <b>${d.vale}</b></span><button class="btn btn-claro btn-mini" onclick="ir('doc',{num:'${d.vale}',back:'${p.back || 'sol'}'})">Ver vale</button></div>` : ''}`;

function aprobadoresDe(alm) { return DB.usuarios.filter(u => u.activo && !u.admin && u.perm.aprobar.includes(alm)).map(u => u.nombre); }
function motivoNoAprueba(s) {
  if (s.estatus !== 'FINALIZADO') return '';
  const quienes = aprobadoresDe(s.origen); const lista = quienes.length ? quienes.join(', ') : 'un supervisor autorizado';
  if (s.generadoPor.usuario === S.u.usuario) return `Usted generó esta solicitud, por lo que no puede aprobarla. Debe aceptarla: ${lista}.`;
  if (!puede('aprobar', s.origen)) return `Su usuario no tiene permiso de aprobación en ${almNombre(s.origen)}. Puede aceptarla: ${lista}.`;
  return '';
}
function accionesDoc(d, esSol, p) {
  let h = '';
  if (enMaestro()) return esSol ? '' : `<button class="btn btn-azul" onclick="imprimirVale('${d.num}')">🖨 Imprimir vale</button>`;
  if (esSol) {
    if (d.estatus === 'FINALIZADO' && d.origen === S.ctx) {
      const ok = puede('aprobar', d.origen) && d.generadoPor.usuario !== S.u.usuario;
      h += `<button class="btn btn-rojo" ${ok ? '' : 'disabled'} onclick="accionAnular('${d.num}')">Anular solicitud</button><button class="btn btn-verde" ${ok ? '' : 'disabled'} onclick="accionAprobar('${d.num}')">Aceptar solicitud</button>`;
    }
    if (d.vale && puedeImprimir()) h += `<button class="btn btn-azul" onclick="imprimirVale('${d.vale}')">🖨 Imprimir vale</button>`;
    return h;
  }
  if (d.tipo === 'TRF' && d.estatus === 'PENDIENTE DE RECEPCIÓN' && d.destino === S.ctx && puede('recibir', d.destino)) {
    h += `<button class="btn btn-rojo" onclick="accionRechazarTrf('${d.num}')">Rechazar transferencia</button><button class="btn btn-verde" onclick="accionAceptarTrf('${d.num}')">Aceptar transferencia</button>`;
  }
  if ((d.tipo === 'PRH' || d.tipo === 'ASI') && saldoVale(d) > 0 && d.origen === S.ctx) {
    h += `<button class="btn btn-claro" onclick="ir('dev',{vale:'${d.num}'})">Registrar devolución</button>`;
    if (d.tipo === 'PRH') h += `<button class="btn btn-claro" onclick="ir('plz',{vale:'${d.num}'})">Extender plazo</button>`;
  }
  if (d.tipo === 'DEVCH' || d.tipo === 'PRHCH' || d.tipo === 'REACH') {
    if (d.cajaId) h += `<button class="btn btn-claro" onclick="ir('cajaFicha',{id:'${d.cajaId}'})">🧰 Ver Ficha de Caja</button>`;
    if (d.tipo === 'DEVCH' && d.novedades) h += `<button class="btn btn-naranja" onclick="abrirModalReponer('${d.cajaId}')">🔧 Reponer caja</button>`;
  }
  return h + (puedeImprimir() ? `<button class="btn btn-azul" onclick="imprimirVale('${d.num}')">🖨 Imprimir vale</button>` : '');
}
function timeline(d) {
  return `<div class="timeline">${d.hist.map((h, i) => {
    const prev = i > 0 ? d.hist[0].fecha : null;
    const dur = prev && d.tipo === 'TRF' ? ` · ${num(horasEntre(prev, h.fecha), 1)} h después del envío` : '';
    return `<div class="tl-ev ${h.color || ''}"><div class="tl-t">${esc(h.ev)}</div><div class="tl-d">${fFH(h.fecha)} · ${esc(h.usr)}${dur}${h.det ? '<br>' + esc(h.det) : ''}</div></div>`;
  }).join('')}</div>`;
}

function tiraSol(s) {
  $('tsNum').textContent = s.num;

  $('tsProy').textContent = s.proyecto;

function accionAprobar(n) {
  const s = solDe(n);
  const tipoA = s.lineas.filter(l => item(l.id).tipoA);
  const despues = v => { cerrarModal(); toast(`Solicitud ${n} aprobada. Vale ${v.num} generado.`, 'ok'); pintarMenu(); abrirModal('Solicitud aprobada', `<p class="ayuda-txt">La solicitud <b>${n}</b> quedó aprobada y se generó el vale <b>${v.num}</b>. Las existencias de ${esc(almNombre(v.origen))} fueron actualizadas.<br><br>El personal del almacén verá la solicitud como <b>APROBADO</b> en "Solicitudes del almacén" y desde allí imprimirá el vale original para las firmas.</p>`, [{ t: 'Entendido', cls: 'btn-navy', fn: () => { cerrarModal(); refrescar(); } }]); };
  if (tipoA.length) {
    abrirModal('Aprobación de Gerencia requerida', `<p class="ayuda-txt" style="margin-bottom:10px">La solicitud contiene ítems Tipo A: <b>${tipoA.map(l => esc(l.cod + ' · ' + l.desc)).join(', ')}</b>. Indique el número de aprobación de Gerencia para continuar.</p>${campo('N° de aprobación de Gerencia', '<input id="mdGer">')}`,
      [{ t: 'Cancelar', cls: 'btn-claro', fn: cerrarModal }, { t: 'Aceptar solicitud', cls: 'btn-verde', fn: () => run(() => despues(aprobarSolicitud(n, $('mdGer').value))) }]);
  } else confirmar(`¿Aceptar la solicitud <b>${n}</b>? Se generará el vale ${s.tipo}- y se descontarán las existencias.`, () => despues(aprobarSolicitud(n)), 'Aceptar solicitud');
}

VISTAS.trfEnv = p => {

      <tbody>${v.lineas.map((l, i) => saldoLinea(l) > 0 ? `<tr><td>${esc(l.cod)}</td><td>${esc(l.desc)}</td><td>${esc(l.marca)} / ${esc(l.modelo)}</td><td>${esc(l.serial || '—')}</td><td class="cen">${l.cant}</td><td class="cen">${l.dev || 0}</td><td class="cen"><b>${saldoLinea(l)}</b></td>
