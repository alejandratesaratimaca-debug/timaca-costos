<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIMACA · Sistema de Trazabilidad</title>
<!-- Librería para exportar a Excel (si no hay internet, el sistema exporta en CSV, que también abre en Excel) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#020C54; --navy-h:#0C1B7A;
  --fondo-menu:#F0F4F9;
  --borde:#CBD5E1; --borde-suave:#E2E8F0;
  --texto:#1E293B; --texto-2:#475569; --texto-3:#64748B;
  --verde:#16A34A; --verde-osc:#15803D; --verde-bg:#DCFCE7; --verde-tx:#166534;
  --rojo:#DC2626; --rojo-bg:#FEE2E2; --rojo-tx:#991B1B;
  --ambar:#D97706; --ambar-bg:#FEF3C7; --ambar-tx:#92400E;
  --azul:#2563EB; --azul-bg:#DBEAFE; --azul-tx:#1E40AF;
  --morado:#7C3AED; --cian:#0891B2; --naranja:#EA580C;
  --gris-bg:#E5E7EB; --gris-tx:#374151;
  --naranja-bg:#FFEDD5; --naranja-tx:#9A3412;
  --print-azul:#0E7490;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:var(--texto);background:#F8FAFC}
button,input,select,textarea{font-family:inherit;font-size:12.5px}
:focus-visible{outline:2px solid #2563EB;outline-offset:1px}

/* ================= LOGIN ================= */
#pantallaLogin{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:96px 24px 24px;
  background:linear-gradient(180deg,var(--navy) 0,var(--navy) 230px,#F8FAFC 230px)}
.login-wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:1000px}
.login-card{background:#fff;border:1px solid var(--borde);border-radius:10px;width:410px;max-width:100%;box-shadow:0 14px 34px rgba(2,12,84,.18);overflow:hidden}
.login-card .lc-logo{padding:28px 28px 18px;text-align:center;border-bottom:1px solid var(--borde-suave)}
.login-card .lc-logo img{max-width:300px;width:100%}
.login-card .lc-logo p{margin-top:12px;color:var(--texto-2);font-size:13px;font-weight:600}
.login-card .lc-body{padding:22px 28px 28px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;position:relative}
.campo label{font-size:11px;font-weight:800;color:var(--texto-2);text-transform:uppercase;letter-spacing:.2px}
.campo input,.campo select,.campo textarea{padding:8px 10px;border:1px solid var(--borde);border-radius:6px;background:#fff;color:var(--texto);width:100%}
.campo input[readonly],.campo select:disabled,.campo input:disabled,.campo textarea[readonly]{background:#F1F5F9;color:#334155}
.login-err{background:var(--rojo-bg);color:var(--rojo-tx);border:1px solid #FCA5A5;padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:12px;display:none}
.btn-entrar{width:100%;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:11px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-entrar:hover{background:var(--navy-h)}
.demo-card{background:#fff;border:1px solid var(--borde);border-radius:10px;width:540px;max-width:100%;box-shadow:0 14px 34px rgba(2,12,84,.12);overflow:hidden}
.demo-card h3{font-size:14px;font-weight:900;color:var(--navy);padding:14px 16px;border-bottom:1px solid var(--borde-suave)}
.demo-card .nota{padding:10px 16px;font-size:11.5px;color:var(--texto-3);border-top:1px solid var(--borde-suave)}
.demo-card table{width:100%;border-collapse:collapse;font-size:11.5px}
.demo-card td,.demo-card th{padding:6px 10px;border-bottom:1px solid #F1F5F9;text-align:left}
.demo-card th{background:#F8FAFC;color:var(--texto-2)}
.demo-card tr.clic{cursor:pointer}
.demo-card tr.clic:hover td{background:#EFF6FF}

/* ================= APP ================= */
#pantallaApp{display:none;min-height:100vh;flex-direction:column}
header.topbar{background:var(--navy);color:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:100}
.tb-izq{display:flex;align-items:center;gap:14px;min-width:0}
.tb-logo{background:#fff;border-radius:6px;padding:5px 10px;display:flex;align-items:center;height:40px}
.tb-logo img{height:28px}
.tb-sistema{font-weight:900;font-size:18px;white-space:nowrap;letter-spacing:.2px}
.tb-ctx{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:5px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
.tb-ctx:hover{background:rgba(255,255,255,.25)}
.tb-ctx.maestro{background:#FBBF24;color:#422006;border-color:#F59E0B}
.tb-der{display:flex;gap:10px;align-items:center}
.tb-bienv{font-size:13px;white-space:nowrap}
.tb-bienv b{font-weight:800}
.btn-tb{border:1px solid rgba(255,255,255,.4);color:#fff;background:#1E293B;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:800;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-tb.azul{background:#0284C7;border-color:#0369A1}.btn-tb.azul:hover{background:#0369A1}
.btn-tb.rojo{background:#991B1B;border-color:#7F1D1D}.btn-tb.rojo:hover{background:#7F1D1D}
.cuerpo{display:flex;flex:1;min-height:0}
aside.menu{width:256px;flex-shrink:0;background:var(--fondo-menu);border-right:1px solid var(--borde);overflow-y:auto;padding:14px 10px 30px}
.m-mod-bloque{margin-bottom:3px}
.m-mod-header{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:7px 9px;font-size:12px;font-weight:800;color:var(--navy);cursor:pointer;margin-bottom:2px;transition:all .15s;user-select:none}
.m-mod-header:hover{background:#E2E8F0;color:#0F172A}
.m-mod-header.abierto{background:#F1F5F9}
.m-mod-header.tiene-activo{background:#EEF2F6;border-left:3px solid var(--navy);padding-left:7px}
.m-mod-tit{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.m-mod-tit .mod-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.m-mod-tit .mod-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.m-mod-der{display:flex;align-items:center;gap:6px;flex-shrink:0}
.m-mod-der .flecha{font-size:9px;color:var(--texto-3);transition:transform .2s ease;display:inline-block}
.m-mod-header.abierto .flecha{transform:rotate(90deg)}
.m-mod-sub{display:none;margin-left:14px;padding-left:8px;border-left:2px solid #CBD5E1;margin-top:2px;margin-bottom:4px}
.m-mod-sub.abierto{display:block}
.m-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600;color:#334155;cursor:pointer;margin-bottom:2px;transition:background .15s}
.m-item:hover{background:#E2E8F0;color:#0F172A}
.m-item.activo{background:var(--navy);color:#fff;font-weight:700}
.m-item .ico{width:18px;text-align:center;flex-shrink:0;font-size:13px}
.m-item .cnt{margin-left:auto;background:var(--navy);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;line-height:16px;font-weight:800}
.m-item.activo .cnt{background:#fff;color:var(--navy)}
.m-item .cnt.rojo{background:var(--rojo);color:#fff}
main#area{flex:1;min-width:0;overflow:auto;padding:24px 30px 44px;background:#fff}

/* ================= COMPONENTES ================= */
.v-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--borde);padding-bottom:12px;margin-bottom:20px}
.v-tit{font-size:22px;font-weight:900;color:var(--navy);letter-spacing:-.2px}
.v-sub{font-size:13px;color:var(--texto-3);margin-top:4px}
.chip-v{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:900;border:1px solid;white-space:nowrap;align-self:center}
.chip-v.verde{background:var(--verde-bg);color:var(--verde-tx);border-color:#86EFAC}
.chip-v.ambar{background:var(--ambar-bg);color:var(--ambar-tx);border-color:#FCD34D}
.sec-tit{font-size:15px;font-weight:900;color:var(--navy);margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-tit small{font-size:12px;font-weight:600;color:var(--texto-3)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--borde);color:#334155;padding:8px 14px;font-weight:700;font-size:12px;border-radius:6px;cursor:pointer}
.tab:hover{background:#F1F5F9}
.tab.activo{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{border:1px solid var(--borde);border-radius:10px;background:#fff;margin-bottom:16px;overflow:hidden}
.panel-h{background:#fff;border-bottom:1px solid var(--borde-suave);padding:12px 16px;font-weight:900;font-size:14px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h small{font-weight:600;color:var(--texto-3);font-size:12px}
.panel-b{padding:16px}
.fila-filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fila-filtros .campo{margin-bottom:0;min-width:150px}

/* Tablas */
.grid-wrap{border:1px solid var(--borde);border-radius:8px;overflow:auto;background:#fff}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{background:#F8FAFC;color:var(--texto-2);font-weight:800;text-align:left;padding:10px 10px;border-bottom:2px solid var(--borde);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
table.grid th .ord{color:var(--navy);margin-left:4px}
table.grid td{padding:9px 10px;border-bottom:1px solid #F1F5F9;white-space:nowrap}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:#F8FAFC}
table.grid tbody tr.sel td{background:#DBEAFE!important}
table.grid td.num,table.grid th.num{text-align:right}
table.grid td.cen,table.grid th.cen{text-align:center}
td.col-disp{background:#F0FDF4;color:#166534;font-weight:800;text-align:center!important}
td.col-cajas{background:#F5F3FF;color:#6D28D9;font-weight:800;text-align:center!important}
td.col-vac{background:#ECFEFF;color:#0E7490;font-weight:800;text-align:center!important}
td.col-prest{background:#FFFBEB;color:#B45309;font-weight:800;text-align:center!important}
td.col-asig{background:#EFF6FF;color:#1D4ED8;font-weight:800;text-align:center!important}
td.col-dan{background:#FEF2F2;color:#B91C1C;font-weight:800;text-align:center!important}
td.col-tall{background:#FFF7ED;color:#C2410C;font-weight:800;text-align:center!important}
td.col-ext{background:#FAF5FF;color:#6B21A8;font-weight:800;text-align:center!important}
td.col-baja{background:#F8FAFC;color:#94A3B8;font-weight:700;text-align:center!important}
td.col-total{font-weight:900;color:var(--navy);text-align:center!important}
table.grid.compacto th,table.grid.compacto td{padding:7px 7px;font-size:11.5px}
table.grid td.wrap{white-space:normal;min-width:95px;max-width:240px}
table.grid tfoot td{background:#F1F5F9;border-top:2px solid var(--borde);font-weight:900;position:sticky;bottom:0}
td.col-usd{font-weight:800;color:#0F172A;text-align:right!important}
.grid-vacio{text-align:center;color:var(--texto-3);padding:28px!important;cursor:default;font-style:italic}
.grid-pie{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;font-size:11.5px;color:var(--texto-2);flex-wrap:wrap;gap:8px}
.pag button{background:#fff;border:1px solid var(--borde);border-radius:4px;padding:2px 9px;cursor:pointer;margin-left:3px}
.pag button:disabled{opacity:.45;cursor:default}
.buscar-grid{padding:8px 10px;border:1px solid var(--borde);border-radius:6px;min-width:230px}
.chip-mod{padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:800;display:inline-block}
.chip-mod.m-HERRAMIENTA{background:#E0F2FE;color:#0369A1}
.chip-mod.m-CILINDRO{background:#CFFAFE;color:#0E7490}
.chip-mod.m-EPP{background:#DCFCE7;color:#166534}

/* Barra de selección y botones */
.sel-strip{display:flex;align-items:center;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.sel-strip .lbl{font-size:11px;font-weight:800;color:var(--texto-2);text-transform:uppercase;margin-right:4px}
.sel-strip .box{background:#F1F5F9;border:1px solid var(--borde-suave);border-radius:6px;padding:7px 10px;min-width:120px;min-height:32px;font-size:12px;font-weight:600}
.barra-btn{display:flex;gap:8px;flex-wrap:wrap;padding:14px;margin-top:12px;background:#F8FAFC;border:1px solid var(--borde-suave);border-radius:10px;align-items:center}
.btn-sip{background:#fff;border:1px solid var(--borde);color:#334155;font-weight:700;padding:9px 16px;cursor:pointer;border-radius:6px;font-size:12px}
.btn-sip:hover:not(:disabled){background:#F1F5F9;border-color:#94A3B8}
.btn-sip:first-child{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-sip:first-child:hover:not(:disabled){background:var(--navy-h)}
.btn-sip:disabled{opacity:.45;cursor:not-allowed}
.btn-ayuda{color:var(--azul);font-weight:800;margin-left:auto;cursor:pointer;background:none;border:none;font-size:12.5px}
.btn{border:none;border-radius:6px;padding:9px 18px;font-weight:800;cursor:pointer;color:#fff;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-verde{background:#0E8A5F} .btn-verde:hover:not(:disabled){background:#0B7350}
.btn-azul{background:var(--print-azul)} .btn-azul:hover:not(:disabled){background:#155E75}
.btn-rojo{background:var(--rojo)} .btn-rojo:hover:not(:disabled){background:#B91C1C}
.btn-navy{background:var(--navy)} .btn-navy:hover:not(:disabled){background:var(--navy-h)}
.btn-claro{background:#fff;color:var(--texto);border:1px solid var(--borde)} .btn-claro:hover:not(:disabled){background:#F1F5F9}
.btn-mini{padding:6px 11px;font-size:11.5px;border-radius:5px}

/* Estatus */
.est{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.est-gris{background:var(--gris-bg);color:var(--gris-tx)}
.est-azul{background:var(--azul-bg);color:var(--azul-tx)}
.est-verde{background:var(--verde-bg);color:var(--verde-tx)}
.est-rojo{background:var(--rojo-bg);color:var(--rojo-tx)}
.est-naranja{background:var(--naranja-bg);color:var(--naranja-tx)}
.est-ambar{background:var(--ambar-bg);color:var(--ambar-tx)}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{border:1px solid var(--borde);border-radius:10px;padding:15px 14px;background:#fff;border-top:4px solid var(--navy);text-align:center}
.card-click{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.card-click:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card-click.activa{box-shadow:0 0 0 2px var(--navy);border-color:var(--navy);background:#F8FAFC}
.tl-ev.azul::before{background:var(--azul);box-shadow:0 0 0 1px var(--azul)}
.tl-ev.gris::before{background:#94A3B8;box-shadow:0 0 0 1px #94A3B8}
.card .c-lbl{font-size:11px;color:var(--texto-3);font-weight:800;text-transform:uppercase;letter-spacing:.2px}
.card .c-num{font-size:30px;font-weight:900;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.card .c-sub{font-size:11px;color:var(--texto-3);margin-top:4px}
.card.verde{border-top-color:var(--verde)} .card.verde .c-num{color:var(--verde)}
.card.ambar{border-top-color:var(--ambar)} .card.ambar .c-num{color:var(--ambar)}
.card.azul{border-top-color:var(--azul)} .card.azul .c-num{color:var(--azul)}
.card.rojo,.card.alerta{border-top-color:var(--rojo)} .card.rojo .c-num,.card.alerta .c-num{color:var(--rojo)}
.card.morado{border-top-color:var(--morado)} .card.morado .c-num{color:var(--morado)}
.card.naranja{border-top-color:var(--naranja)} .card.naranja .c-num{color:var(--naranja)}
.card.cian{border-top-color:var(--cian)} .card.cian .c-num{color:var(--cian)}
.card.gris{border-top-color:#94A3B8} .card.gris .c-num{color:#64748B}
.card.dinero .c-num{font-size:24px}
.avisos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:18px}
.aviso{border:1px solid var(--borde);border-left:5px solid var(--navy);border-radius:8px;padding:11px 14px;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:center}
.aviso:hover{background:#F8FAFC}
.aviso .a-num{font-size:24px;font-weight:900;color:var(--navy);min-width:34px;text-align:center}
.aviso .a-txt{font-size:12px;color:var(--texto-2);font-weight:600}
.aviso.rojo{border-left-color:var(--rojo);background:#FFFBFB} .aviso.rojo .a-num{color:var(--rojo)}
.aviso.naranja{border-left-color:var(--naranja);background:#FFFCF8} .aviso.naranja .a-num{color:var(--naranja)}
.aviso.verde{border-left-color:var(--verde)} .aviso.verde .a-num{color:var(--verde)}
.dos-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tres-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.barras .b-fila{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;font-weight:600}
.barras .b-pista{background:#EEF2F7;border-radius:5px;height:18px;overflow:hidden}
.barras .b-relleno{background:var(--navy);height:100%;border-radius:5px}
.barras .b-val{text-align:right;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}

/* Gráficos */
.g-donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.g-donut{width:200px;height:200px;flex-shrink:0}
.g-c1{font-size:24px;font-weight:900;fill:var(--navy)}
.g-c1.chico{font-size:15px}
.g-c2{font-size:11px;fill:#64748B;font-weight:700}
.g-leyenda{flex:1;min-width:200px}
.g-ley{display:grid;grid-template-columns:12px 1fr auto 52px;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--borde-suave)}
.g-ley:last-child{border-bottom:none}
.g-sw{width:12px;height:12px;border-radius:3px}
.g-ley b{font-weight:900;color:#0F172A}
.g-pc{color:var(--texto-3);text-align:right;font-size:11.5px;font-weight:700}
svg.g-svg{width:100%;height:auto;display:block;overflow:visible}
.g-ax{font-size:13px;fill:#94A3B8;font-weight:600}
.g-lbl{font-size:13.5px;fill:#334155;font-weight:700}
.g-val{font-size:13.5px;fill:#0F172A;font-weight:900}
.g-bar{transform-box:fill-box;transform-origin:bottom;animation:gCrecer .7s ease-out both}
@keyframes gCrecer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.g-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:8px;justify-content:center;font-weight:700;color:#334155}
.g-leg span{display:inline-flex;align-items:center;gap:6px}
.g-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.g-vacio{color:var(--texto-3);font-style:italic;text-align:center;padding:30px}

/* ================= FORMULARIO DE REGISTRO ================= */
.form-reg{border:1px solid var(--borde);border-radius:10px;background:#fff;padding:20px;margin-bottom:16px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px}
.f3 .campo label{font-size:11px}
.franja-est{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:12.5px;border:1px solid}
.franja-est.gris{background:#F8FAFC;border-color:#CBD5E1}
.franja-est.verde{background:#F0FDF4;border-color:#BBF7D0;color:#166534}
.franja-est.rojo{background:#FEF2F2;border-color:#FECACA}
.franja-est.naranja{background:#FFF7ED;border-color:#FED7AA}
.franja-est.azul{background:#EFF6FF;border-color:#BFDBFE}
.carga{border:1px solid var(--borde);border-radius:10px;overflow:visible;margin-top:8px}
.carga-h{background:#E2E8F0;padding:11px 16px;font-weight:900;font-size:13px;color:#1E293B;border-radius:10px 10px 0 0}
.captura{display:grid;grid-template-columns:130px minmax(190px,2fr) 1.3fr 1fr .9fr .6fr .65fr 1.05fr 80px auto;gap:8px;padding:10px 12px;align-items:end;border-bottom:1px solid var(--borde)}
.captura .campo{margin:0;position:relative}
.captura .campo label{font-size:10.5px;text-transform:none}
.captura input.ro{background:#E9EDF2;text-align:center;color:#475569}
.captura input.cant{text-align:center;font-weight:800}
.captura input.cant[readonly]{background:#E9EDF2}
.btn-salvar{background:#1E88B4;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-weight:800;cursor:pointer;height:35px}
.btn-salvar:hover{background:#17709A}
.pie-form{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--borde-suave)}
.pie-form .der{display:flex;gap:8px;flex-wrap:wrap}
.totales{font-size:12px;color:var(--texto-2)}
.totales b{color:var(--navy)}

/* Formulario de solicitud estilo SIP */
.sipf{display:grid;grid-template-columns:160px 1fr 160px 1fr 160px 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.sipf .lb{border:1px solid var(--borde);border-radius:6px;padding:8px 12px;font-weight:800;font-size:12px;color:#1E293B;background:#F8FAFC;display:flex;align-items:center}
.sipf .vl{display:flex;align-items:center;gap:8px;position:relative}
.sipf .vl input,.sipf .vl select,.sipf .vl textarea{width:100%;padding:8px 10px;border:1px solid var(--borde);border-radius:6px;background:#fff}
.sipf .vl .ro,.sipf .vl input[readonly]{background:#E9EDF2;font-weight:700;color:#334155}
.sipf .s5{grid-column:span 5}
.sipf .vacio{grid-column:span 2}
@media (max-width:1150px){.sipf{grid-template-columns:150px 1fr 150px 1fr}.sipf .s5{grid-column:span 3}}
@media (max-width:700px){.sipf{grid-template-columns:120px 1fr}.sipf .s5{grid-column:span 1}.sipf .vacio{display:none}}

/* Cronómetro de transferencias */
.crono{display:inline-block;font-family:Consolas,"Courier New",monospace;font-weight:900;padding:3px 8px;border-radius:5px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
.crono.verde{background:#DCFCE7;color:#166534}.crono.ambar{background:#FEF3C7;color:#92400E}.crono.rojo{background:#FEE2E2;color:#B91C1C;animation:latido 1.2s ease-in-out infinite}
.crono.grande{font-size:22px;padding:6px 14px}
@keyframes latido{50%{box-shadow:0 0 0 4px rgba(220,38,38,.18)}}
.crono-barra{height:8px;background:#E2E8F0;border-radius:5px;overflow:hidden;margin-top:8px;width:100%}
.crono-barra i{display:block;height:100%;border-radius:5px;transition:width 1s linear}
.banner-trf{position:fixed;bottom:22px;right:22px;width:430px;max-width:calc(100% - 44px);z-index:850;background:#fff;border:2px solid var(--rojo);border-radius:10px;box-shadow:0 14px 34px rgba(185,28,28,.25);overflow:hidden}
.banner-trf .bt-h{background:var(--rojo);color:#fff;font-weight:900;padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
.banner-trf .bt-h button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.banner-trf .bt-it{padding:12px 14px;border-bottom:1px solid var(--borde-suave);font-size:12.5px;display:flex;flex-direction:column;gap:7px}
.banner-trf .bt-txt{color:var(--texto-2);font-size:12px}

/* Autocompletado */
.ac-lista{position:absolute;top:100%;left:0;z-index:50;background:#fff;border:1px solid var(--borde);border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.14);max-height:260px;overflow:auto;min-width:100%;width:max-content;max-width:620px;margin-top:2px}
.ac-op{padding:7px 10px;cursor:pointer;border-bottom:1px solid #F1F5F9;font-size:12px}
.ac-op:hover,.ac-op.foco{background:#EAF1FB}
.ac-op small{display:block;color:var(--texto-3);font-size:11px}
.ac-op .disp{float:right;margin-left:14px;font-weight:800;color:var(--verde-tx)}

/* Modales */
.modal-fondo{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:8px;width:640px;max-width:100%;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden}
.modal.ancho{width:980px}
.modal-h{background:var(--navy);color:#fff;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal-h .x{cursor:pointer;font-size:20px;line-height:1;background:none;border:none;color:#fff}
.modal-b{padding:18px}
.modal-p{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#F8FAFC;border-top:1px solid var(--borde-suave)}

/* Mensajes */
#toast{position:fixed;top:74px;right:22px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:#1F2937;color:#fff;padding:11px 15px;border-radius:7px;font-size:12.5px;box-shadow:0 8px 18px rgba(0,0,0,.2);max-width:380px;font-weight:600}
.toast.ok{background:#15803D}.toast.err{background:#B91C1C}

/* Línea de tiempo */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--borde)}
.tl-ev{position:relative;margin-bottom:12px}
.tl-ev::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid #fff;box-shadow:0 0 0 1px var(--navy)}
.tl-ev.verde::before{background:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.tl-ev.rojo::before{background:var(--rojo);box-shadow:0 0 0 1px var(--rojo)}
.tl-ev.naranja::before{background:var(--naranja);box-shadow:0 0 0 1px var(--naranja)}
.tl-ev .tl-t{font-weight:800;font-size:12.5px}
.tl-ev .tl-d{font-size:11.5px;color:var(--texto-2)}
.kpi{border:1px solid var(--borde);border-radius:10px;padding:14px 16px;background:#fff;border-left:5px solid var(--navy)}
.kpi .k-t{font-size:11.5px;font-weight:800;color:var(--texto-3);text-transform:uppercase}
.kpi .k-v{font-size:26px;font-weight:900;color:var(--navy);margin:4px 0;font-variant-numeric:tabular-nums}
.kpi .k-c{font-size:11.5px;font-weight:700}
.kpi .k-c.sube{color:var(--rojo-tx)} .kpi .k-c.baja{color:var(--verde-tx)} .kpi .k-c.neutro{color:var(--texto-3);font-weight:600}
.kpi .k-e{font-size:11px;color:var(--texto-3);margin-top:8px;border-top:1px dashed var(--borde-suave);padding-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.matriz td,.matriz th{padding:6px 8px;border-bottom:1px solid #EEF0F3;font-size:12px;text-align:center}
.matriz th{background:#F8FAFC}
.matriz td:first-child,.matriz th:first-child{text-align:left}
.ayuda-txt{font-size:12.5px;color:var(--texto-2);line-height:1.55}
.chip-demo{background:var(--ambar-bg);color:var(--ambar-tx);border:1px solid #FCD34D;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800}

/* ================= IMPRESIÓN ================= */
#vistaImpresion{display:none;position:fixed;inset:0;background:#E5E7EB;z-index:1500;overflow:auto}
#vistaImpresion .vi-barra{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--borde);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#hojaImpresion{background:#fff;width:216mm;min-height:279mm;margin:18px auto;padding:14mm 13mm;box-shadow:0 6px 20px rgba(0,0,0,.15);color:#111}
.vale-enc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding-bottom:10px}
.vale-enc img{height:42px}
.vale-emp{font-size:10px;line-height:1.35}
.vale-emp b{font-size:11.5px;display:block}
.vale-tit{text-align:right;font-size:10.5px;line-height:1.5}
.vale-tit .t{font-size:14px;font-weight:800;color:#0F172A;max-width:220px;margin-left:auto;line-height:1.2;margin-bottom:4px}
.vale-tit .n{font-family:Consolas,"Courier New",monospace;font-size:11.5px}
.vale-copia{display:inline-block;border:2px solid #B91C1C;color:#B91C1C;font-weight:800;padding:1px 10px;font-size:12px;margin-top:4px;letter-spacing:2px}
.vale-datos{border:1px solid #CBD5E1;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding:12px 16px;font-size:11px;margin:8px 0 14px}
.vale-datos div{padding:2px 0}
.vale-datos b{font-weight:700}
.vale-items{width:100%;border-collapse:collapse;font-size:11px}
.vale-items th{color:#64748B;font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid #CBD5E1;border-top:1px solid #CBD5E1}
.vale-items td{padding:9px 6px;border-bottom:1px solid #E5E7EB}
.vale-items .c{text-align:center}
.vale-extra{font-size:11px;margin-top:12px;border:1px dashed #CBD5E1;border-radius:6px;padding:8px 12px;line-height:1.6}
.vale-firmas{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:70px;font-size:11px;text-align:center}
.vale-firmas div{border-top:1.5px solid #111;padding-top:6px}
.vale-firmas b{display:block}
.vale-firmas span{color:#475569;font-size:10px}
.vale-firmas .nom{display:block;margin-top:3px;font-size:10px;color:#111}
.rep-tabla{width:100%;border-collapse:collapse;font-size:10px}
.rep-tabla th{background:#EEF2F7;text-align:left;padding:5px;border:1px solid #CBD5E1}
.rep-tabla td{padding:4px 5px;border:1px solid #E2E8F0}

@media print{
  @page{size:letter portrait;margin:0}
  body *{visibility:hidden}
  #hojaImpresion,#hojaImpresion *{visibility:visible}
  #vistaImpresion{position:absolute;inset:0;background:#fff;display:block!important;overflow:visible}
  #hojaImpresion{position:absolute;left:0;top:0;margin:0;box-shadow:none;width:100%}
  .vi-barra{display:none!important}
}
@media (max-width:1100px){.captura{grid-template-columns:repeat(4,1fr)}.captura .c-desc{grid-column:span 3}}
@media (max-width:1200px){.tres-col{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.tres-col{grid-template-columns:1fr}.tb-bienv{display:none}
  aside.menu{position:fixed;left:-262px;top:62px;bottom:0;z-index:300;transition:left .2s}
  aside.menu.abierto{left:0;box-shadow:6px 0 18px rgba(0,0,0,.15)}
  #btnMenuMovil{display:inline-block!important}
  .tb-sistema{display:none}
  .f3{grid-template-columns:1fr 1fr}.dos-col{grid-template-columns:1fr}
}
@media (max-width:600px){.f3{grid-template-columns:1fr}.captura{grid-template-columns:1fr 1fr}.captura .c-desc{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- ====================== INICIO DE SESIÓN ====================== -->
<section id="pantallaLogin">
  <div class="login-wrap">
    <div class="login-card">
      <div class="lc-logo">
        <img data-logo src="/timaca-logo.png" alt="TIMACA" onerror="if(typeof LOGO!=='undefined')this.src=LOGO" style="max-height:55px;object-fit:contain">
        <p>Sistema de Trazabilidad de Herramientas, Cilindros y EPP</p>
      </div>
      <div class="lc-body">
        <div class="login-err" id="loginErr"></div>
        <div class="campo"><label for="lgUsuario">Usuario</label>
          <input id="lgUsuario" autocomplete="username" placeholder="drivero (o su correo)" oninput="actualizarAccesosLogin()"></div>
        <div class="campo"><label for="lgClave">Clave</label>
          <input id="lgClave" type="password" autocomplete="current-password" placeholder="1234" onkeydown="if(event.key==='Enter')iniciarSesion()"></div>
        <div class="campo"><label for="lgAcceso">Acceso</label>
          <select id="lgAcceso"><option value="">Escriba su usuario para ver sus accesos</option></select></div>
        <button class="btn-entrar" onclick="iniciarSesion()">Ingresar</button>
      </div>
    </div>
    <div class="demo-card">
      <h3>Usuarios de prueba <span class="chip-demo">SOLO DEMOSTRACIÓN</span></h3>
      <table><thead><tr><th>Usuario</th><th>Clave</th><th>Perfil</th></tr></thead><tbody id="tablaDemoUsuarios"></tbody></table>
      <div class="nota">Haga clic en un usuario para llenar los datos automáticamente. Clave general de prueba: <b>1234</b>.</div>
    </div>
  </div>
</section>

<!-- ====================== APLICACIÓN ====================== -->
<section id="pantallaApp">
  <header class="topbar">
    <div class="tb-izq">
      <button class="btn-tb" id="btnMenuMovil" style="display:none" onclick="document.getElementById('menu').classList.toggle('abierto')">☰</button>
      <div class="tb-logo"><img data-logo src="/timaca-logo.png" alt="TIMACA" onerror="if(typeof LOGO!=='undefined')this.src=LOGO" style="max-height:36px;object-fit:contain"></div>
      <span class="tb-sistema">Sistema de Trazabilidad</span>
      <span class="tb-ctx" id="tbCtx" onclick="abrirCambioAcceso()" title="Cambiar de almacén"></span>
    </div>
    <div class="tb-der">
      <span class="tb-bienv">Bienvenido, <b id="tbUsuario"></b> <span id="tbRol"></span></span>
      <button class="btn-tb" id="btnNotif" onclick="abrirPanelNotificaciones()" style="position:relative;background:#0f172a;border-color:#334155;cursor:pointer" title="Notificaciones del Sistema">
        🔔 <span id="badgeNotif" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:900">0</span>
      </button>
      <button class="btn-tb azul" onclick="abrirCambioAcceso()">🔄 Cambiar almacén</button>
      <button class="btn-tb rojo" onclick="cerrarSesion()">🚪 Salir</button>
    </div>
  </header>
  <div class="cuerpo">
    <aside class="menu" id="menu"></aside>
    <main id="area"></main>
  </div>
</section>

<!-- Modal genérico -->
<div class="modal-fondo" id="modalFondo">
  <div class="modal" id="modalCaja">
    <div class="modal-h"><span id="modalTit"></span><button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>
    <div class="modal-b" id="modalCuerpo"></div>
    <div class="modal-p" id="modalPie"></div>
  </div>
</div>

<!-- Vista de impresión -->
<div id="vistaImpresion">
  <div class="vi-barra">
    <b style="color:var(--navy)">Vista previa de impresión</b>
    <div style="display:flex;gap:8px">
      <button class="btn btn-azul" onclick="window.print()">Imprimir / Guardar PDF</button>
      <button class="btn btn-claro" onclick="cerrarImpresion()">Cerrar</button>
    </div>
  </div>
  <div id="hojaImpresion"></div>
</div>

<div id="toast"></div>

const pad = n => String(n).padStart(2, '0');
const ahora = () => (NOW_FIX ? new Date(NOW_FIX) : new Date());
const nowISO = () => ahora().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function aFecha(v) { if (!v) return null; return new Date(v.length === 10 ? v + 'T00:00:00' : v); }
function fF(v) { const d = aFecha(v); return d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : ''; }
function fFH(v) { const d = aFecha(v); return d ? `${fF(v)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : ''; }
function fechaLocal(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function hoy() { return fechaLocal(ahora()); }
function sumarDias(fechaStr, n) { const d = aFecha(fechaStr); d.setDate(d.getDate() + n); return fechaLocal(d); }
function diasEntre(a, b) { return Math.round((aFecha(b) - aFecha(a)) / 86400000); }
function horasEntre(a, b) { return (new Date(b) - new Date(a)) / 3600000; }
function num(n, dec = 0) { return Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function usd(n) { return 'USD ' + num(n, 2); }
function restante(isoLimite) {
  const ms = new Date(isoLimite) - ahora();
  if (ms <= 0) return 'Vencido';
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return `${h} h ${pad(m)} min`;
}

function solicitarPermisoNotificaciones() {
  if ('Notification' in window) {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        toast('🔔 Notificaciones de escritorio de Windows activadas con éxito.', 'ok');
      }
      actualizarCampanaNotif();
    });
  }
}

function notificarSistema(titulo, cuerpo, tipo, data) {
  if (!DB) return;
  DB.notificaciones = DB.notificaciones || [];
  const notif = {
    id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
    fecha: nowISO(),
    titulo,
    cuerpo,
    tipo: tipo || 'info',
    leida: false,
    alm: S.ctx || 'CENTRAL',
    data: data || {}
  };
  DB.notificaciones.unshift(notif);
  if (DB.notificaciones.length > 50) DB.notificaciones.length = 50;
  guardar();

  // 1. Notificación nativa en el sistema operativo Windows
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(`TIMACA: ${titulo}`, {
        body: cuerpo,
        icon: '/timaca-favicon.png',
        tag: notif.id
      });
    } catch (e) {
      console.warn('Aviso de notificación:', e);
    }
  }

  // 2. Notificación en pantalla (Toast flotante)
  toast(`<b>${titulo}</b><br><span style="font-size:11.5px">${cuerpo}</span>`, tipo === 'err' ? 'err' : 'ok');

  // 3. Actualizar campana y menú
  actualizarCampanaNotif();
  if (typeof pintarMenu === 'function') pintarMenu();
}

function actualizarCampanaNotif() {
  const badge = $('badgeNotif');
  if (!badge || !DB) return;
  DB.notificaciones = DB.notificaciones || [];
  const noLeidas = DB.notificaciones.filter(n => !n.leida).length;
  if (noLeidas > 0) {
    badge.textContent = noLeidas > 9 ? '9+' : String(noLeidas);
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }
}

function limpiarModuloCajasViejo() {
  if (!DB) return;
  // 1. Revertir existencias retenidas en "cajas" devolviéndolas a disponible en Almacén Central
  if (DB.exi) {
    Object.keys(DB.exi).forEach(alm => {
      Object.keys(DB.exi[alm]).forEach(id => {
        const e = DB.exi[alm][id];
        if (e.cajas) {
          e.disp = (e.disp || 0) + (e.cajas || 0);
        }
        delete e.cajas;
      });
    });
  }
  // 2. Limpiar movimientos de Kardex generados para demostración de cajas operativas
  if (DB.movs) {
    DB.movs = DB.movs.filter(m => {
      if (m.cajaId) return false;
      if (['REPCH', 'ARMADO'].includes(m.tipo)) return false;
      if (m.doc && (m.doc.startsWith('PRHCH-') || m.doc.startsWith('DEVCH-') || m.doc.startsWith('REACH-') || m.doc.startsWith('CH-'))) return false;
      return true;
    });
  }
  // 3. Limpiar vales de cajas anteriores
  if (DB.vales) {
    DB.vales = DB.vales.filter(v => {
      if (v.cajaId) return false;
      if (['REPCH'].includes(v.tipo)) return false;
      if (v.num && (v.num.startsWith('PRHCH-') || v.num.startsWith('DEVCH-') || v.num.startsWith('REACH-'))) return false;
      return true;
    });
  }
  // 4. Limpiar incidencias generadas por devolución de cajas de demo
  if (DB.incid) {
    DB.incid = DB.incid.filter(i => !(i.valeRef && (i.valeRef.startsWith('DEVCH-') || i.valeRef.startsWith('PRHCH-'))));
  }
  // 5. Eliminar entidades obsoletas
  delete DB.cajas;
  delete DB.frentes;
  delete DB.cuadrillas;
  if (DB.corr) {
    delete DB.corr.CH;
    delete DB.corr.PRHCH;
    delete DB.corr.DEVCH;
    delete DB.corr.REACH;
    delete DB.corr.REPCH;
  }
}

  if (!u) return false; if (u.admin) return true;
  return u.perm.transferir.includes(alm) || u.perm.recibir.includes(alm) || ((u.almacenes || []).includes(alm) && !u.perm.aprobar.includes(alm));
}
const puedeImprimir = () => S.ctx === 'MAESTRO' || esPersonalAlmacen(S.u, S.ctx);
const puedeMaestro = u => !!u && (u.admin || u.maestro);
const enMaestro = () => S.ctx === 'MAESTRO';

/* ----------------------------- Registro ----------------------------- */
function bit(acc, det, usr) { DB.bit.push({ fecha: nowISO(), usr: usr || (S.u ? S.u.usuario : 'SISTEMA'), acc, det: det || '' }); }
function mov(m) {
  DB.seq.mov++;
  const it = item(m.id) || {};
  DB.movs.push(Object.assign({ n: DB.seq.mov, fecha: nowISO(), usr: S.u ? S.u.usuario : 'SISTEMA', cod: it.cod, desc: it.desc, serial: it.serial || '', mod: it.mod }, m));
}

/* ----------------------------- Líneas ----------------------------- */
function lineaDe(it, cant, cond) {
  const est = (it.mod === 'CILINDRO' && cond === 'VACÍO') ? 'VACIO' : 'DISP';
  return { id: it.id, cod: it.cod, desc: it.desc, marca: it.marca, modelo: it.modelo, serial: it.serial || '', cat: it.cat, umb: it.umb, mod: it.mod, cond, est, cant: Number(cant), dev: 0 };
}
const nomBucket = { DISP: 'DISPONIBLE', VACIO: 'VACÍO' };
function validarStock(alm, lineas) {
  const req = {};
  lineas.forEach(l => { const k = l.id + '|' + l.est; req[k] = (req[k] || 0) + Number(l.cant); });
  Object.keys(req).forEach(k => {
    const [id, est] = k.split('|'); const e = exi(alm, +id); const it = item(+id);
    const d = est === 'VACIO' ? e.vacio : e.disp;
    if (req[k] > d) throw new Error(`Existencia insuficiente en ${almNombre(alm)} para ${it.cod} · ${it.desc}${it.serial ? ' (' + it.serial + ')' : ''}: disponible ${d}, requerido ${req[k]}.`);
  });
}
function saldoLinea(l) { return l.consumo ? 0 : (l.cant - (l.dev || 0)); }
function estadoVale(v) {
  if (v.tipo === 'TRF') return v.estatus;
  if (v.tipo !== 'PRH' && v.tipo !== 'ASI') return 'REGISTRADO';
  const lineasControl = v.lineas.filter(l => !l.consumo);
  if (!lineasControl.length) return 'ENTREGADO';
  const saldo = lineasControl.reduce((a, l) => a + saldoLinea(l), 0);
  if (saldo === 0) return 'CERRADO';
  if (v.tipo === 'PRH' && v.fechaDev && v.fechaDev < hoy()) return 'VENCIDO';
  if (lineasControl.some(l => l.dev > 0)) return 'DEVOLUCIÓN PARCIAL';
  return 'VIGENTE';
}
function saldoVale(v) { return v.lineas.reduce((a, l) => a + saldoLinea(l), 0); }
function nuevoVale(tipo, datos) {
  const v = Object.assign({
    num: sigNum(tipo), tipo, fecha: nowISO(), origen: '', destino: '', resp: null, sup: '', proyecto: '', cuenta: '', obs: '',
    lineas: [], realizadoPor: quien(), aprobadoPor: null, estatus: null, extensiones: 0, aprobGer: '', ref: '', extra: {}, hist: [], impresiones: 0
  }, datos);
  DB.vales.push(v);
  return v;
}

/* ----------------------------- Normalización y Cédula ----------------------------- */
function normTexto(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}
function digitosCI(s) {
  return String(s || '').replace(/\D/g, '');
}
function formatCedula(ci) {
  if (!ci) return 'S/C';
  let clean = String(ci).trim();
  if (/no tiene|s\/c/i.test(clean)) return 'S/C';
  let prefix = 'V-';
  if (/^E[\.-]/i.test(clean)) {
    prefix = 'E-';
    clean = clean.replace(/^E[\.-]/i, '');
  } else if (/^V[\.-]/i.test(clean)) {
    prefix = 'V-';
    clean = clean.replace(/^V[\.-]/i, '');
  }
  let digits = clean.replace(/\D/g, '');
  if (!digits) return clean;
  let formattedDigits = Number(digits).toLocaleString('es-VE');
  return prefix + formattedDigits;
}

function validarResponsable(resp, alm) {
  if (!resp || !resp.nombre) throw new Error('Seleccione el responsable custodio desde la lista oficial de personal.');
  const respMatch = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('RESPONSABLE') &&
    (alm === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(alm)) &&
    (normTexto(p.nombre) === normTexto(resp.nombre) || (resp.cedula && resp.cedula !== 'S/C' && digitosCI(p.cedula) === digitosCI(resp.cedula))));
  if (!respMatch) throw new Error(`El responsable custodio "${resp.nombre}" no pertenece al personal autorizado de ${almNombre(alm)}. Debe seleccionarlo de la lista oficial.`);
  return respMatch;
}

function validarSupervisor(sup, alm) {
  if (!sup || !sup.trim()) throw new Error('Indique el supervisor que autoriza.');
  const supMatch = DB.personal.find(p => p.activo !== false && (p.tipo || []).includes('SUPERVISOR') &&
    (alm === 'MAESTRO' || (p.almacenes || []).includes('TODOS') || (p.almacenes || []).includes(alm)) &&
    normTexto(p.nombre) === normTexto(sup));
  if (!supMatch) throw new Error(`El supervisor "${sup}" no está registrado como supervisor autorizado para ${almNombre(alm)}. Seleccione de la lista oficial.`);
  return supMatch;
}

/* ---------- Solicitudes (solo PRH y ASI) ---------- */
function validarSolicitud(d, finalizar) {
  if (!['PRH', 'ASI'].includes(d.tipo)) throw new Error('Las solicitudes solo aplican a préstamos (PRH) y asignaciones (ASI).');
  if (!finalizar) return;
  if (!d.resp || !d.resp.nombre) throw new Error('Seleccione el responsable custodio desde la lista oficial de personal.');
  validarResponsable(d.resp, d.origen);
  if (!d.sup) throw new Error('Indique el supervisor que autoriza.');
  validarSupervisor(d.sup, d.origen);
  if (!d.proyecto) throw new Error('Seleccione el proyecto u orden de trabajo.');
  if (!d.lineas.length) throw new Error('Agregue al menos un ítem en la carga de material.');
  if (d.tipo === 'PRH') {
    if (!d.fechaReq || !d.fechaDev) throw new Error('El préstamo requiere fecha requerida y fecha de devolución.');
    if (d.fechaDev < d.fechaReq) throw new Error('La fecha de devolución no puede ser anterior a la fecha requerida.');
    if (d.lineas.some(l => l.mod === 'EPP')) throw new Error('El EPP no se presta: regístrelo como asignación (dotación).');
  } else if (!d.fechaAsig) throw new Error('Indique la fecha de asignación.');
  validarStock(d.origen, d.lineas);
}
function guardarSolicitud(d, finalizar) {
  validarSolicitud(d, finalizar);
  let s = d.num ? solDe(d.num) : null;
  if (s) {
    if (s.estatus === 'APROBADO') throw new Error(`Esta solicitud ya fue aprobada y tiene vale emitido (${s.vale || 'VALE'}). Por regla estricta de trazabilidad y control, las asignaciones y préstamos aprobados NO pueden ser editados.`);
    if (s.estatus === 'ANULADO') throw new Error('No se pueden modificar solicitudes anuladas.');
  }
  const editando = !!s;
  if (!s) {
    s = { num: sigNum('SOL'), fecha: nowISO(), generadoPor: quien(), estatus: 'NO FINALIZADO' };
    DB.solicitudes.push(s);
    bit('SOLICITUD CREADA', s.num);
  }
  Object.assign(s, {
    tipo: d.tipo, origen: d.origen, destino: d.destino, resp: d.resp, sup: d.sup, proyecto: d.proyecto, cuenta: d.cuenta,
    fechaReq: d.tipo === 'PRH' ? d.fechaReq : '', fechaDev: d.tipo === 'PRH' ? d.fechaDev : '', fechaAsig: d.tipo === 'ASI' ? d.fechaAsig : '',
    obs: d.obs || '', lineas: d.lineas.map(l => Object.assign({}, l))
  });
  if (finalizar) {
    s.estatus = 'FINALIZADO';
    s.finalizadaEn = nowISO();
    bit(editando ? 'SOLICITUD EDITADA Y FINALIZADA' : 'SOLICITUD FINALIZADA', s.num);
    notificarSistema(editando ? 'Solicitud actualizada' : 'Nueva solicitud generada', `Se actualizó la solicitud ${s.num} (${s.tipo}) para ${s.resp ? s.resp.nombre : 'custodio'} en ${almNombre(s.origen)}. Pendiente de aprobación por supervisión.`, 'info', { doc: s.num });
  } else {
    s.estatus = 'NO FINALIZADO';
    if (editando) bit('SOLICITUD MODIFICADA', s.num);
  }
  guardar();
  return s;
}
function eliminarSolicitud(numSol) {
  const s = solDe(numSol);
  if (!s) return;
  if (s.estatus === 'APROBADO') throw new Error(`No se puede eliminar una solicitud APROBADA con vale emitido (${s.vale}).`);
  if (s.estatus !== 'NO FINALIZADO' && s.estatus !== 'FINALIZADO') throw new Error('Solo se pueden eliminar solicitudes no aprobadas.');
  if (!S.u.admin && s.generadoPor.usuario !== S.u.usuario) throw new Error('Solo quien generó la solicitud puede eliminarla.');
  DB.solicitudes = DB.solicitudes.filter(x => x.num !== numSol);
  bit('SOLICITUD ELIMINADA', numSol); guardar();
}
function aprobarSolicitud(numSol, aprobGer) {
  const s = solDe(numSol);
  if (!s || s.estatus !== 'FINALIZADO') throw new Error('Solo se aprueban solicitudes FINALIZADAS.');
  if (!puede('aprobar', s.origen)) throw new Error('No tiene permiso para aprobar solicitudes de ' + almNombre(s.origen) + '.');
  if (s.generadoPor.usuario === S.u.usuario) throw new Error('No puede aprobar una solicitud generada por usted.');
  const tipoA = s.lineas.some(l => item(l.id).tipoA);
  if (tipoA && !String(aprobGer || '').trim()) throw new Error('La solicitud contiene ítems Tipo A: indique el N° de aprobación de Gerencia.');
  validarStock(s.origen, s.lineas);
  const lineas = s.lineas.map(l => Object.assign({}, l, { dev: 0 }));
  const v = nuevoVale(s.tipo, {
    origen: s.origen, destino: s.destino, resp: s.resp, sup: s.sup, proyecto: s.proyecto, cuenta: s.cuenta, obs: s.obs,
    lineas, fechaReq: s.fechaReq, fechaDev: s.fechaDev, fechaAsig: s.fechaAsig, solicitud: s.num, aprobGer: tipoA ? aprobGer : '',
    realizadoPor: s.generadoPor, aprobadoPor: quien()
  });
  lineas.forEach(l => {
    const e = exi(s.origen, l.id);
    e.disp -= l.cant;
    let destinoEst;
    if (s.tipo === 'ASI' && l.mod === 'EPP') { e.entregado += l.cant; l.consumo = true; destinoEst = 'ENTREGADO (DOTACIÓN)'; }
    else if (s.tipo === 'PRH') { e.prest += l.cant; destinoEst = 'EN PRÉSTAMO'; }
    else { e.asig += l.cant; destinoEst = 'ASIGNADO'; }
    mov({ doc: v.num, tipo: s.tipo, id: l.id, cant: l.cant, origen: s.origen, destino: s.destino, estAnt: 'DISPONIBLE', estNue: destinoEst, resp: s.resp.nombre, cedula: s.resp.cedula, obs: s.proyecto });
  });
  v.hist.push({ ev: 'Solicitud ' + s.num + ' aprobada', fecha: nowISO(), usr: S.u.nombre, color: 'verde' });
  Object.assign(s, { estatus: 'APROBADO', procesadoPor: quien(), procesadoEn: nowISO(), vale: v.num, aprobGer: tipoA ? aprobGer : '' });
  bit('SOLICITUD APROBADA', `${s.num} → ${v.num}`); guardar();
  notificarSistema('Solicitud aprobada', `La solicitud ${s.num} en ${almNombre(s.origen)} fue APROBADA por ${S.u.nombre}. Se generó el vale ${v.num}.`, 'ok', { doc: v.num });
  return v;
}
function anularSolicitud(numSol, motivo) {
  const s = solDe(numSol);
  if (!s || s.estatus !== 'FINALIZADO') throw new Error('Solo se anulan solicitudes FINALIZADAS.');
  if (!puede('aprobar', s.origen)) throw new Error('No tiene permiso para anular solicitudes de ' + almNombre(s.origen) + '.');
  if (s.generadoPor.usuario === S.u.usuario) throw new Error('No puede anular una solicitud generada por usted.');
  if (!String(motivo || '').trim()) throw new Error('El motivo de anulación es obligatorio.');
  Object.assign(s, { estatus: 'ANULADO', procesadoPor: quien(), procesadoEn: nowISO(), motivo });
  bit('SOLICITUD ANULADA', `${s.num}: ${motivo}`); guardar();
  notificarSistema('Solicitud anulada', `La solicitud ${s.num} en ${almNombre(s.origen)} fue ANULADA por ${S.u.nombre}. Motivo: ${motivo}.`, 'err', { doc: s.num });
}

/* ---------- Transferencias ---------- */
function destinosPermitidos(origen) { return origen === 'CENTRAL' ? DB.almacenes.filter(a => a.c !== 'CENTRAL').map(a => a.c) : ['CENTRAL']; }
function crearTransferencia(d) {
  if (!puede('transferir', d.origen)) throw new Error('No tiene permiso para transferir desde ' + almNombre(d.origen) + '.');
  if (!destinosPermitidos(d.origen).includes(d.destino)) throw new Error('Destino no permitido. Central transfiere a los satélites y los satélites solo transfieren a Central.');
  if (!d.lineas.length) throw new Error('Agregue al menos un ítem en la carga de material.');
  validarStock(d.origen, d.lineas);
  const lineas = d.lineas.map(l => Object.assign({}, l));
  const v = nuevoVale('TRF', {
    origen: d.origen,
    destino: d.destino,
    resp: d.resp || null,
    sup: d.sup || '',
    proyecto: d.proyecto || '',
    cuenta: d.cuenta || '',
    despacha: d.despacha || S.u.nombre,
    salidaTimaca: d.salidaTimaca || '',
    obs: d.obs || '',
    lineas,
    estatus: 'PENDIENTE DE RECEPCIÓN'
  });
  v.vence = new Date(new Date(v.fecha).getTime() + DB.config.plazoHoras * 3600000).toISOString();
  lineas.forEach(l => {
    const e = exi(d.origen, l.id);
    if (l.est === 'VACIO') e.vacio -= l.cant; else e.disp -= l.cant;
    e.pend += l.cant;
    mov({ doc: v.num, tipo: 'TRF', id: l.id, cant: l.cant, origen: d.origen, destino: d.destino, estAnt: nomBucket[l.est], estNue: 'PENDIENTE DE RECEPCIÓN', resp: (d.resp ? d.resp.nombre : S.u.nombre), cedula: (d.resp ? d.resp.cedula : S.u.cedula), obs: (d.proyecto ? 'Proyecto: ' + d.proyecto : 'Transferencia creada') });
  });
  v.hist.push({ ev: 'Creada', fecha: v.fecha, usr: S.u.nombre, det: `Enviada a ${almNombre(d.destino)}`, color: '' });
  bit('TRANSFERENCIA CREADA', `${v.num} ${d.origen} → ${d.destino}`); guardar();
  notificarSistema('Nueva transferencia enviada', `Transferencia ${v.num} enviada desde ${almNombre(v.origen)} hacia ${almNombre(v.destino)} por ${v.realizadoPor.nombre}. Esperando recepción.`, 'info', { doc: v.num });
  return v;
}
function cerrarTransferencia(v, aceptar, motivo, sistema, fechaEv) {
  const fecha = fechaEv || nowISO();
  v.lineas.forEach(l => {
    const eo = exi(v.origen, l.id); eo.pend -= l.cant;
    const alm = aceptar ? v.destino : v.origen;
    const e = exi(alm, l.id);
    if (l.est === 'VACIO') e.vacio += l.cant; else e.disp += l.cant;
    mov({ fecha, doc: v.num, tipo: 'TRF', id: l.id, cant: l.cant, origen: v.origen, destino: v.destino, estAnt: 'PENDIENTE DE RECEPCIÓN',
      estNue: (aceptar ? 'RECIBIDO EN ' + almNombre(v.destino) : 'REINTEGRADO A ' + almNombre(v.origen)) + (l.est === 'VACIO' ? ' (VACÍO)' : ''),
      resp: sistema ? 'SISTEMA' : S.u.nombre, cedula: sistema ? '' : S.u.cedula, usr: sistema ? 'SISTEMA' : S.u.usuario,
      obs: aceptar ? 'Transferencia aceptada' : (sistema ? 'Vencida: sin respuesta en ' + DB.config.plazoHoras + ' h' : 'Rechazada: ' + motivo) });
  });
  v.procesadoPor = sistema ? { usuario: 'SISTEMA', nombre: 'SISTEMA' } : quien();
  v.procesadoEn = fecha;
  if (aceptar) {
    v.estatus = 'RECIBIDA';
    v.hist.push({ ev: 'Aceptada', fecha, usr: S.u.nombre, color: 'verde' });
    notificarSistema('Transferencia Aceptada', `La transferencia ${v.num} (${almNombre(v.origen)} → ${almNombre(v.destino)}) fue ACEPTADA y recibida por ${S.u.nombre}.`, 'ok', { doc: v.num });
  } else if (sistema) {
    v.estatus = 'VENCIDA';
    v.hist.push({ ev: 'Vencida', fecha, usr: 'SISTEMA', det: `Sin respuesta en ${DB.config.plazoHoras} h. Material reintegrado a ${almNombre(v.origen)}.`, color: 'naranja' });
    notificarSistema('Transferencia Vencida', `La transferencia ${v.num} (${almNombre(v.origen)} → ${almNombre(v.destino)}) HA VENCIDO sin respuesta en ${DB.config.plazoHoras} h. El material regresó a ${almNombre(v.origen)}.`, 'err', { doc: v.num });
  } else {
    v.estatus = 'RECHAZADA';
    v.motivo = motivo;
    v.hist.push({ ev: 'Rechazada', fecha, usr: S.u.nombre, det: motivo, color: 'rojo' });
    notificarSistema('Transferencia Rechazada', `La transferencia ${v.num} (${almNombre(v.origen)} → ${almNombre(v.destino)}) fue RECHAZADA por ${S.u.nombre}. Motivo: ${motivo}.`, 'err', { doc: v.num });
  }
}
function aceptarTransferencia(n) {
  const v = valeDe(n);
  if (!v || v.estatus !== 'PENDIENTE DE RECEPCIÓN') throw new Error('La transferencia ya no está pendiente.');
  if (!puede('recibir', v.destino)) throw new Error('No tiene permiso para recibir transferencias en ' + almNombre(v.destino) + '.');
  cerrarTransferencia(v, true); bit('TRANSFERENCIA ACEPTADA', v.num); guardar();
}
function rechazarTransferencia(n, motivo) {
  const v = valeDe(n);
  if (!v || v.estatus !== 'PENDIENTE DE RECEPCIÓN') throw new Error('La transferencia ya no está pendiente.');
  if (!puede('recibir', v.destino)) throw new Error('No tiene permiso para recibir transferencias en ' + almNombre(v.destino) + '.');
  if (!String(motivo || '').trim()) throw new Error('El motivo de rechazo es obligatorio.');
  cerrarTransferencia(v, false, motivo); bit('TRANSFERENCIA RECHAZADA', `${v.num}: ${motivo}`); guardar();
}
/* Tarea programada: en el servidor la ejecuta APScheduler cada pocos minutos y al iniciar */
function procesarVencimientos() {
  if (!DB || !Array.isArray(DB.vales)) return 0;
  let n = 0;
  DB.vales.filter(v => v && v.tipo === 'TRF' && v.estatus === 'PENDIENTE DE RECEPCIÓN' && v.vence && new Date(v.vence) <= ahora()).forEach(v => {
    cerrarTransferencia(v, false, '', true, v.vence);
    if (!Array.isArray(DB.bit)) DB.bit = [];
    DB.bit.push({ fecha: v.vence, usr: 'SISTEMA', acc: 'TRANSFERENCIA VENCIDA', det: v.num });
    n++;
  });
  // Vencimiento automático de cajas de herramientas en custodia
  const h = hoy();
  (DB.cajas || []).forEach(cx => {
    if (cx && cx.estatus === 'EN CUSTODIA' && cx.fechaDevPrev && cx.fechaDevPrev < h) {
      cx.estatus = 'VENCIDA';
      n++;
    } else if (cx && cx.estatus === 'VENCIDA' && cx.fechaDevPrev && cx.fechaDevPrev >= h) {
      cx.estatus = 'EN CUSTODIA';
      n++;
    }
  });
  if (n) guardar();
  return n;
}

/* ---------- Devoluciones (persona → almacén que prestó) ---------- */
function registrarDevolucion(valeNum, items, recibe, obs, salidaTimaca) {
  const v = valeDe(valeNum);
  if (!v || !['PRH', 'ASI'].includes(v.tipo)) throw new Error('Indique un vale de préstamo o asignación válido.');
  if (v.origen !== S.ctx && !S.u.admin) throw new Error('La devolución se registra en el almacén que realizó el préstamo: ' + almNombre(v.origen) + '.');
  const sel = items.filter(x => Number(x.cant) > 0);
  if (!sel.length) throw new Error('Indique al menos una cantidad a devolver.');
  if (!recibe) throw new Error('Indique quién recibe la devolución.');
  const lineasDev = [];
  sel.forEach(x => {
    const l = v.lineas[x.i]; const c = Number(x.cant);
    if (c > saldoLinea(l)) throw new Error(`La cantidad a devolver de ${l.cod} supera el saldo pendiente (${saldoLinea(l)}).`);
  });
  const dv = nuevoVale('DEV', { origen: v.origen, destino: v.origen, resp: v.resp, sup: v.sup, proyecto: v.proyecto, cuenta: v.cuenta, ref: v.num, obs: obs || '', extra: { recibe }, salidaTimaca: salidaTimaca || '' });
  sel.forEach(x => {
    const l = v.lineas[x.i]; const c = Number(x.cant); const cond = x.cond;
    const e = exi(v.origen, l.id);
    e[v.tipo === 'PRH' ? 'prest' : 'asig'] -= c;
    l.dev = (l.dev || 0) + c;
    let estNue = 'DISPONIBLE';
    if (cond === 'VACÍO') { e.vacio += c; estNue = 'VACÍO'; }
    else if (cond === 'DAÑADO') { e.dan += c; estNue = 'DAÑADO'; nuevaIncidencia('DAN', v.origen, l, c, 'DAÑADO', { valeRef: dv.num, detalle: 'Devuelto con daño (' + v.num + ')' }); }
    else if (cond === 'EXTRAVIADO') { e.ext += c; estNue = 'EXTRAVIADO'; nuevaIncidencia('EXT', v.origen, l, c, 'EN INVESTIGACIÓN', { valeRef: dv.num, detalle: 'Reportado extraviado en devolución (' + v.num + ')' }); }
    else { e.disp += c; }
    const ld = Object.assign({}, l, { cant: c, dev: 0, cond, condRet: cond });
    delete ld.consumo;
    dv.lineas.push(ld);
    mov({ doc: dv.num, tipo: 'DEV', id: l.id, cant: c, origen: v.origen, destino: v.origen, estAnt: v.tipo === 'PRH' ? 'EN PRÉSTAMO' : 'ASIGNADO', estNue, resp: v.resp.nombre, cedula: v.resp.cedula, obs: 'Ref. ' + v.num });
  });
  v.hist.push({ ev: 'Devolución ' + dv.num, fecha: nowISO(), usr: S.u.nombre, color: 'verde' });
  bit('DEVOLUCIÓN REGISTRADA', `${dv.num} ref. ${v.num}`); guardar();
  return dv;
}

/* ---------- Daño y Robo / Extravío ---------- */
function nuevaIncidencia(tipo, alm, l, cant, estado, extra) {
  DB.seq.inc++;
  const inc = Object.assign({ n: DB.seq.inc, tipo, fecha: nowISO(), alm, id: l.id, cod: l.cod, desc: l.desc, serial: l.serial, cant, estado, hist: [{ ev: estado, fecha: nowISO(), usr: S.u ? S.u.nombre : 'SISTEMA' }] }, extra || {});
  DB.incid.push(inc);
  return inc;
}
function registrarIncidencia(tipo, d) {
  if (!d.lineas.length) throw new Error('Agregue al menos un ítem.');
  if (!String(d.detalle || '').trim()) throw new Error(tipo === 'DAN' ? 'Describa el daño.' : 'Describa la incidencia.');
  let vRef = null;
  if (d.valeRef) {
    vRef = valeDe(d.valeRef);
    d.lineas.forEach(l => { if (l.cant > saldoLinea(vRef.lineas[l.idx])) throw new Error(`La cantidad de ${l.cod} supera el saldo del vale ${vRef.num}.`); });
  } else validarStock(d.origen, d.lineas);
  const dictamen = tipo === 'DAN' ? (d.dictamen || 'POR EVALUAR') : '';
  const v = nuevoVale(tipo, {
    origen: d.origen, destino: d.origen, resp: d.resp, sup: d.sup, proyecto: d.proyecto, cuenta: d.cuenta, ref: d.valeRef || '',
    obs: d.obs || '', lineas: d.lineas.map(l => { const c = Object.assign({}, l); delete c.idx; return c; }),
    extra: { detalle: d.detalle, malUso: d.malUso || 'NO', dictamen }
  });
  d.lineas.forEach(l => {
    const e = exi(d.origen, l.id);
    let estAnt;
    if (vRef) { const lv = vRef.lineas[l.idx]; lv.dev = (lv.dev || 0) + l.cant; e[vRef.tipo === 'PRH' ? 'prest' : 'asig'] -= l.cant; estAnt = vRef.tipo === 'PRH' ? 'EN PRÉSTAMO' : 'ASIGNADO'; }
    else { if (l.est === 'VACIO') e.vacio -= l.cant; else e.disp -= l.cant; estAnt = nomBucket[l.est]; }
    let estado, estNue;
    if (tipo === 'EXT') { e.ext += l.cant; estado = 'EN INVESTIGACIÓN'; estNue = 'EXTRAVIADO'; }
    else if (dictamen === 'REPARABLE') { e.rep += l.cant; estado = 'EN TALLER'; estNue = 'EN TALLER'; }
    else if (dictamen === 'NO REPARABLE') { e.baja += l.cant; estado = 'BAJA'; estNue = 'BAJA'; }
    else { e.dan += l.cant; estado = 'DAÑADO'; estNue = 'DAÑADO'; }
    nuevaIncidencia(tipo, d.origen, l, l.cant, estado, { valeRef: v.num, detalle: d.detalle, malUso: d.malUso || 'NO', tipoA: !!item(l.id).tipoA, resp: d.resp ? d.resp.nombre : '' });
    mov({ doc: v.num, tipo, id: l.id, cant: l.cant, origen: d.origen, destino: d.origen, estAnt, estNue, resp: d.resp ? d.resp.nombre : '', cedula: d.resp ? d.resp.cedula : '', obs: d.detalle });
  });
  if (vRef) vRef.hist.push({ ev: TIPOS[tipo].n + ' ' + v.num, fecha: nowISO(), usr: S.u.nombre, color: 'rojo' });
  bit(tipo === 'DAN' ? 'DAÑO REGISTRADO' : 'ROBO/EXTRAVÍO REGISTRADO', v.num); guardar();
  return v;
}
function accionIncidencia(nInc, accion, nota) {
  const inc = DB.incid.find(x => x.n === nInc); if (!inc) throw new Error('Incidencia no encontrada.');
  const e = exi(inc.alm, inc.id); let de, a, estado;
  if (accion === 'REPARABLE' && inc.estado === 'DAÑADO') { de = 'dan'; a = 'rep'; estado = 'EN TALLER'; }
  else if (accion === 'BAJA' && (inc.estado === 'DAÑADO' || inc.estado === 'EN TALLER')) { de = inc.estado === 'DAÑADO' ? 'dan' : 'rep'; a = 'baja'; estado = 'BAJA'; }
  else if (accion === 'REPARADO' && inc.estado === 'EN TALLER') { de = 'rep'; a = 'disp'; estado = 'REPARADO'; }
  else if (accion === 'RECUPERADO' && inc.estado === 'EN INVESTIGACIÓN') { de = 'ext'; a = 'disp'; estado = 'RECUPERADO'; }
  else if (accion === 'BAJA' && inc.estado === 'EN INVESTIGACIÓN') { de = 'ext'; a = 'baja'; estado = 'BAJA'; }
  else throw new Error('Acción no válida para el estado actual.');
  e[de] -= inc.cant; e[a] += inc.cant;
  const ant = inc.estado; inc.estado = estado;
  inc.hist.push({ ev: estado, fecha: nowISO(), usr: S.u.nombre, det: nota || '' });
  mov({ doc: inc.valeRef, tipo: inc.tipo, id: inc.id, cant: inc.cant, origen: inc.alm, destino: inc.alm, estAnt: ant, estNue: estado === 'REPARADO' || estado === 'RECUPERADO' ? 'DISPONIBLE' : estado, resp: S.u.nombre, cedula: S.u.cedula, obs: nota || estado });
  bit('INCIDENCIA ' + estado, inc.valeRef + ' · ' + inc.cod); guardar();
}

/* ---------- Extensión de plazo ---------- */
function extenderPlazo(valeNum, nueva, sup, motivo) {
  const v = valeDe(valeNum);
  if (!v || v.tipo !== 'PRH' || saldoVale(v) === 0) throw new Error('Seleccione un préstamo con saldo pendiente.');
  if (v.origen !== S.ctx && !S.u.admin) throw new Error('La extensión se registra en el almacén que prestó.');
  if (!nueva || nueva <= v.fechaDev) throw new Error('La nueva fecha debe ser posterior a la fecha de devolución actual (' + fF(v.fechaDev) + ').');
  if (!sup) throw new Error('Indique el supervisor que autoriza la extensión.');
  validarSupervisor(sup, v.origen);
  const p = nuevoVale('PLZ', { origen: v.origen, destino: v.destino, resp: v.resp, sup, proyecto: v.proyecto, cuenta: v.cuenta, ref: v.num,
    lineas: v.lineas.filter(l => saldoLinea(l) > 0).map(l => Object.assign({}, l, { cant: saldoLinea(l), dev: 0 })),
    extra: { anterior: v.fechaDev, nueva, motivo: motivo || '' } });
  v.extensiones = (v.extensiones || 0) + 1;
  v.hist.push({ ev: `Extensión de plazo ${p.num}`, fecha: nowISO(), usr: S.u.nombre, det: `${fF(v.fechaDev)} → ${fF(nueva)}`, color: '' });
  v.fechaDev = nueva;
  p.lineas.forEach(l => mov({ doc: p.num, tipo: 'PLZ', id: l.id, cant: l.cant, origen: v.origen, destino: v.destino, estAnt: 'EN PRÉSTAMO', estNue: 'EN PRÉSTAMO', resp: v.resp.nombre, cedula: v.resp.cedula, obs: `Nueva fecha ${fF(nueva)} (ref. ${v.num})` }));
  bit('EXTENSIÓN DE PLAZO', `${p.num} ref. ${v.num}`); guardar();
  notificarSistema('Extensión de plazo procesada', `Se registró la extensión ${p.num} para el vale ${v.num}. Nueva fecha: ${fF(nueva)}.`, 'ok', { doc: p.num });
  return p;
}

function solicitarExtension(valeNum, nueva, sup, motivo) {
  const v = valeDe(valeNum);
  if (!v || v.tipo !== 'PRH' || saldoVale(v) === 0) throw new Error('Seleccione un préstamo con saldo pendiente.');
  if (v.origen !== S.ctx && !S.u.admin) throw new Error('La extensión se solicita en el almacén que prestó.');
  if (!nueva || nueva <= v.fechaDev) throw new Error('La nueva fecha debe ser posterior a la fecha de devolución actual (' + fF(v.fechaDev) + ').');
  if (!sup) throw new Error('Indique el supervisor que autorizará la extensión.');
  validarSupervisor(sup, v.origen);

  DB.extSol = DB.extSol || [];
  const existente = DB.extSol.find(x => x.valeRef === valeNum && x.estatus === 'PENDIENTE');
  if (existente) throw new Error('Ya existe una solicitud de extensión pendiente para este vale.');

  const ext = {
    id: 'EXTSOL-' + String(DB.extSol.length + 1).padStart(4, '0'),
    valeRef: v.num,
    alm: v.origen,
    solicitadoPor: quien(),
    fechaSol: nowISO(),
    fechaDevActual: v.fechaDev,
    nuevaFecha: nueva,
    supervisor: sup,
    motivo: motivo || 'Extensión de plazo de herramientas en obra',
    estatus: 'PENDIENTE',
    procesadoPor: null,
    procesadoEn: null
  };
  DB.extSol.push(ext);
  bit('SOLICITUD EXTENSIÓN CREADA', `${ext.id} para ${v.num}`);
  guardar();

  notificarSistema('Solicitud de extensión de plazo', `Se solicitó prorrogar el vale ${v.num} hasta el ${fF(nueva)} para ${v.resp.nombre}. Requiere aprobación de supervisión.`, 'info', { doc: v.num, extId: ext.id });
  return ext;
}

function aprobarExtension(extId) {
  DB.extSol = DB.extSol || [];
  const ext = DB.extSol.find(x => x.id === extId);
  if (!ext || ext.estatus !== 'PENDIENTE') throw new Error('La solicitud de extensión ya no está pendiente.');
  if (!puede('aprobar', ext.alm) && !S.u.admin) throw new Error('No tiene permiso para aprobar extensiones en ' + almNombre(ext.alm) + '.');

  const p = extenderPlazo(ext.valeRef, ext.nuevaFecha, S.u.nombre, ext.motivo);
  ext.estatus = 'APROBADA';
  ext.procesadoPor = quien();
  ext.procesadoEn = nowISO();
  ext.valeExt = p.num;
  bit('EXTENSIÓN APROBADA', `${ext.id} → ${p.num}`);
  guardar();

  notificarSistema('Extensión aprobada', `La solicitud de prórroga para el vale ${ext.valeRef} fue APROBADA por el supervisor ${S.u.nombre}. Nueva fecha: ${fF(ext.nuevaFecha)}.`, 'ok', { doc: p.num });
  return p;
}

function rechazarExtension(extId, motivo) {
  DB.extSol = DB.extSol || [];
  const ext = DB.extSol.find(x => x.id === extId);
  if (!ext || ext.estatus !== 'PENDIENTE') throw new Error('La solicitud de extensión ya no está pendiente.');
  if (!puede('aprobar', ext.alm) && !S.u.admin) throw new Error('No tiene permiso para rechazar extensiones en ' + almNombre(ext.alm) + '.');
  if (!String(motivo || '').trim()) throw new Error('Indique el motivo del rechazo de la extensión.');

  ext.estatus = 'RECHAZADA';
  ext.motivoRechazo = motivo;
  ext.procesadoPor = quien();
  ext.procesadoEn = nowISO();
  bit('EXTENSIÓN RECHAZADA', `${ext.id}: ${motivo}`);
  guardar();

  notificarSistema('Extensión rechazada', `La solicitud de prórroga para el vale ${ext.valeRef} fue RECHAZADA por el supervisor ${S.u.nombre}. Motivo: ${motivo}.`, 'err', { doc: ext.valeRef });
}

/* ---------- Entrada de ítems al catálogo del almacén ---------- */
function registrarEntrada(d) {
  if (!(S.u.admin || puede('transferir', d.origen) || puede('recibir', d.origen))) throw new Error('Su usuario no tiene permiso para registrar entradas en ' + almNombre(d.origen) + '.');
  if (!d.lineas.length) throw new Error('Agregue al menos un ítem a la entrada.');
  const v = nuevoVale('ENT', { origen: d.origen, destino: d.origen, obs: d.obs || '', ref: '', extra: { obs: d.obs || '' }, lineas: [] });
  d.lineas.forEach(l => {
    let it = DB.catalogo.find(x => x.cod === l.cod && x.marca === l.marca && x.modelo === l.modelo && (x.serial || '') === (l.serial || ''));
    if (!it) {
      it = { id: Math.max(0, ...DB.catalogo.map(x => x.id)) + 1, cod: l.cod, desc: l.desc, mod: l.mod, cat: l.cat, marca: l.marca, modelo: l.modelo, serial: l.serial || '', umb: l.umb, costo: 0, tipoA: false, talla: l.talla || '', vida: Number(l.vida) || 0, activo: true };
      DB.catalogo.push(it);
    }
    const e = exi(d.origen, it.id);
    if (l.mod === 'CILINDRO' && l.cond === 'VACÍO') e.vacio += l.cant; else e.disp += l.cant;
    v.lineas.push(Object.assign(lineaDe(it, l.cant, l.cond)));
    mov({ doc: v.num, tipo: 'ENT', id: it.id, cant: l.cant, origen: d.origen, destino: d.origen, estAnt: 'ENTRADA', estNue: l.mod === 'CILINDRO' && l.cond === 'VACÍO' ? 'VACÍO' : 'DISPONIBLE', resp: S.u.nombre, cedula: S.u.cedula, obs: 'Entrada al catálogo' });
  });
  v.hist.push({ ev: 'Entrada registrada', fecha: v.fecha, usr: S.u.nombre, det: '', color: 'verde' });
  bit('ENTRADA REGISTRADA', `${v.num} · ${d.lineas.length} línea(s)`); guardar();
  notificarSistema('Entrada registrada', `Se registraron ${d.lineas.length} ítems en el catálogo de ${almNombre(d.origen)} bajo el vale ${v.num}.`, 'ok', { doc: v.num });
  return v;
}
/* Estado operativo de un ítem en el catálogo del almacén */
function estadoCatalogo(e, it) {
  if (it && !it.activo) return 'INACTIVO';
  if (e.disp > 0) return 'DISPONIBLE';
  if (e.vacio > 0) return 'VACÍO';
  if (e.prest + e.asig + (e.cajas || 0) > 0) return 'SIN DISPONIBILIDAD';
  if (e.dan + e.rep + e.ext > 0) return 'FUERA DE SERVICIO';
  return 'SIN EXISTENCIA';
}

/* ---------- Inventario inicial ---------- */
function cargaInicial(alm, id, cant, vacio) {
  cant = Number(cant); if (!(cant > 0)) throw new Error('Cantidad inválida.');
  const e = exi(alm, id); if (vacio) e.vacio += cant; else e.disp += cant;
  if (!DB.corr.INI) DB.corr.INI = 0;
  mov({ doc: 'INICIAL', tipo: 'INI', id, cant, origen: alm, destino: alm, estAnt: '', estNue: vacio ? 'VACÍO' : 'DISPONIBLE', resp: S.u ? S.u.nombre : 'SISTEMA', cedula: '', obs: 'Inventario inicial' });
}

/* ---------- Costos (solo Maestro) ---------- */
function cambiarCosto(id, costo, origenCambio) {
  if (!enMaestro()) throw new Error('Los costos solo se gestionan desde el Maestro.');
  if (!(S.u.admin || S.u.editaCostos)) throw new Error('No tiene permiso para editar costos.');
  costo = Number(costo); if (isNaN(costo) || costo < 0) throw new Error('Costo inválido.');
  const it = item(id); const ant = it.costo;
  if (ant === costo) return false;
  it.costo = costo;
  DB.costosHist.push({ fecha: nowISO(), id, cod: it.cod, serial: it.serial || '', ant, nuevo: costo, usr: S.u.usuario, origen: origenCambio || 'Edición individual' });
  bit('CAMBIO DE COSTO', `${it.cod}${it.serial ? ' ' + it.serial : ''}: ${ant} → ${costo}`);
  return true;
}

function asegurarPersonalOficial() {
  if (!DB || !Array.isArray(DB.personal)) DB.personal = [];
  const esLegacy = DB.personal.length === 0 || DB.personal.some(p => !p.tipo || !p.almacenes || p.nombre === 'Carlos Mendoza');
  if (esLegacy) {
    DB.personal = JSON.parse(JSON.stringify(PERSONAL_OFICIAL));
  } else {
    PERSONAL_OFICIAL.forEach(oficial => {
      const ex = DB.personal.find(p => (p.cedula && oficial.cedula && p.cedula !== 'S/C' && digitosCI(p.cedula) === digitosCI(oficial.cedula)) || normTexto(p.nombre) === normTexto(oficial.nombre));
      if (!ex) {

function asegurarProyectosOficiales() {
  if (!DB || !Array.isArray(DB.proyectos)) DB.proyectos = [];
  const esLegacy = DB.proyectos.length === 0 || DB.proyectos.some(p => /^OT-\d+/i.test(p.nombre) || p.cuenta === 'ADM-G-0001');
  if (esLegacy) {
    const personalizados = DB.proyectos.filter(p => !(/^OT-\d+/i.test(p.nombre) || p.cuenta === 'ADM-G-0001'));
    DB.proyectos = JSON.parse(JSON.stringify(PROYECTOS_OFICIALES));
    personalizados.forEach(pers => {
      if (!DB.proyectos.some(x => x.cuenta.toUpperCase() === (pers.cuenta || '').toUpperCase())) {
        DB.proyectos.push(pers);
      }
    });
  } else {
    PROYECTOS_OFICIALES.forEach(ofic => {
      const ex = DB.proyectos.find(p => (p.cuenta || '').toUpperCase() === ofic.cuenta.toUpperCase());
      if (!ex) {
        DB.proyectos.push(JSON.parse(JSON.stringify(ofic)));
      } else {
        ex.nombre = ofic.nombre;
        if (ex.activo === undefined) ex.activo = true;
      }
    });
  }

  // Migrar solicitudes, vales e incidencias previas en localStorage que aún tengan nombres demo antiguos (OT-3xx/4xx)
  const mapaDemo = {
    'TTE-C-0001': { cuenta: 'TTE-C-0681', nombre: 'Adicionales Proyecto 2da linea de Planta de Pellas (VISCO ORINOCO)' },
    'TTE-C-0002': { cuenta: 'TTE-C-0693', nombre: 'Trabajos para parada de Planta de Briquetas FMO (VISCO ORINOCO)' },

    'TTE-C-0005': { cuenta: 'TT-A-C-505', nombre: 'Departamento de Fabricación' },
    'TTE-C-0006': { cuenta: 'TTE-C-0691', nombre: 'Reparacion de la Grua #1 en la estacion de transferencia de Boca Grande II (VISCO ORINOCO)' },
    'TTE-C-0007': { cuenta: 'EE-A-C-510', nombre: 'Sección Mantenimiento Mecánico' },
    'TTE-C-0009': { cuenta: 'EE-A-C-509', nombre: 'Sección Servicios Generales' },
    'ADM-G-0001': { cuenta: 'TT-A-C-502', nombre: 'Coordinación de Operaciones' }
  };
  const normalizarDocProy = doc => {
    if (!doc) return;
    const cta = String(doc.cuenta || '').trim().toUpperCase();
    const nom = String(doc.proyecto || '').trim();
    if (mapaDemo[cta] && (/^OT-\d+/i.test(nom) || cta === 'ADM-G-0001')) {
      doc.cuenta = mapaDemo[cta].cuenta;
      doc.proyecto = mapaDemo[cta].nombre;
      return;
    }
    if (/^OT-301/i.test(nom)) { doc.cuenta = 'TTE-C-0681'; doc.proyecto = mapaDemo['TTE-C-0001'].nombre; return; }
    if (/^OT-315/i.test(nom)) { doc.cuenta = 'TTE-C-0693'; doc.proyecto = mapaDemo['TTE-C-0002'].nombre; return; }
    if (/^OT-342/i.test(nom)) { doc.cuenta = 'TTE-C-0655'; doc.proyecto = mapaDemo['TTE-C-0003'].nombre; return; }
    if (/^OT-377/i.test(nom)) { doc.cuenta = 'TTE-C-0640'; doc.proyecto = mapaDemo['TTE-C-0004'].nombre; return; }
    if (/^OT-401/i.test(nom)) { doc.cuenta = 'TT-A-C-505'; doc.proyecto = mapaDemo['TTE-C-0005'].nombre; return; }
    if (/^OT-418/i.test(nom)) { doc.cuenta = 'TTE-C-0691'; doc.proyecto = mapaDemo['TTE-C-0006'].nombre; return; }
    if (/^OT-430/i.test(nom)) { doc.cuenta = 'EE-A-C-510'; doc.proyecto = mapaDemo['TTE-C-0007'].nombre; return; }
    if (/^OT-455/i.test(nom)) { doc.cuenta = 'TTE-C-0008'; doc.proyecto = 'Venprecar: Rep. Motores Hagglunds.'; return; }
    if (/^OT-490/i.test(nom)) { doc.cuenta = 'EE-A-C-509'; doc.proyecto = mapaDemo['TTE-C-0009'].nombre; return; }
    const oficPorCta = PROYECTOS_OFICIALES.find(p => p.cuenta.toUpperCase() === cta);
    if (oficPorCta && (!nom || /^OT-\d+/i.test(nom))) {
      doc.proyecto = oficPorCta.nombre;
    } else if (!cta && nom) {
      const oficPorNom = PROYECTOS_OFICIALES.find(p => p.nombre.toLowerCase() === nom.toLowerCase());
      if (oficPorNom) doc.cuenta = oficPorNom.cuenta;
    }
  };
  (DB.solicitudes || []).forEach(normalizarDocProy);
  (DB.vales || []).forEach(normalizarDocProy);
  (DB.incid || []).forEach(normalizarDocProy);
}

const GR = {};

  if (o.selKey && prev && prev.sel) { GR[id].sel = rows.find(r => r[o.selKey] === prev.sel[o.selKey]) || null; }
  return `<div id="gw_${id}">${gridHTML(id)}</div>`;
}

const sortVal = (c, r) => { const v = c.s ? c.s(r) : valCol(c, r); return typeof v === 'number' ? v : String(v ?? '').toLowerCase(); };
function gridHTML(id) {
  const g = GR[id]; let rows = g.rows.slice();
  if (g.q) { const q = g.q.toLowerCase(); rows = rows.filter(r => g.cols.some(c => String(valCol(c, r) ?? '').toLowerCase().includes(q))); }
  if (g.sort != null) { const c = g.cols[g.sort]; rows.sort((a, b) => { const x = sortVal(c, a), y = sortVal(c, b); return (x > y ? 1 : x < y ? -1 : 0) * g.dir; }); }
  g.vis = rows;
  const tp = g.o.pag || 0; let pr = rows, pagHTML = '';
  if (tp) {
    const np = Math.max(1, Math.ceil(rows.length / tp)); g.pag = Math.min(g.pag, np - 1);
    pr = rows.slice(g.pag * tp, (g.pag + 1) * tp);
    pagHTML = `<span class="pag">Página ${g.pag + 1} de ${np}<button ${g.pag === 0 ? 'disabled' : ''} onclick="pagGrid('${id}',-1)">‹</button><button ${g.pag >= np - 1 ? 'disabled' : ''} onclick="pagGrid('${id}',1)">›</button></span>`;
  }
  const off = tp ? g.pag * tp : 0;
  const th = g.cols.map((c, i) => `<th class="${c.cls || ''}" onclick="ordGrid('${id}',${i})">${esc(c.t)}${g.sort === i ? `<span class="ord">${g.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('');
  const tb = pr.length ? pr.map((r, i) => `<tr class="${g.sel === r ? 'sel' : ''}" onclick="selGrid('${id}',${off + i})">${g.cols.map(c => `<td class="${c.cls || ''} ${c.td || ''}">${c.f ? c.f(r) : esc(valCol(c, r))}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="grid-vacio" colspan="${g.cols.length}">${esc(g.o.vacio || 'No hay registros para mostrar.')}</td></tr>`;
  const tf = g.o.totales ? `<tfoot><tr>${g.cols.map((c, i) => `<td class="${c.cls || ''} ${c.sum ? (c.td || '') : ''}">${i === 0 ? '<b>TOTALES</b>' : c.sum ? `<b>${num(rows.reduce((a, r) => a + (Number(valCol(c, r)) || 0), 0))}</b>` : ''}</td>`).join('')}</tr></tfoot>` : '';
  const pie = g.o.sinPie ? '' : `<div class="grid-pie"><span>${rows.length} registro(s)${g.o.pie ? ' · ' + g.o.pie(rows) : ''}</span>${pagHTML}</div>`;
  return `<div class="grid-wrap" style="${g.o.alto ? 'max-height:' + g.o.alto + 'px' : ''}"><table class="grid ${g.o.compacto ? 'compacto' : ''}"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${tf}</table></div>${pie}`;
}

/* ---------- Autocompletado ---------- */
function bindAC(inputId, fuente, onPick, opts) {
  opts = opts || {};
  const inp = $(inputId); if (!inp) return null;
  let lista = null, ops = [], foco = -1;
  const cerrar = () => { if (lista) { lista.remove(); lista = null; } foco = -1; };
  const marcar = () => lista && [...lista.children].forEach((c, i) => c.classList.toggle('foco', i === foco));
  const elegir = i => { const o = ops[i]; cerrar(); if (o) onPick(o.val); };
  const mostrar = arr => {
    cerrar(); ops = arr || []; if (!ops.length) return;
    lista = document.createElement('div'); lista.className = 'ac-lista';
    lista.innerHTML = ops.map((o, i) => `<div class="ac-op" data-i="${i}">${o.html}</div>`).join('');
    lista.addEventListener('mousedown', ev => { const d = ev.target.closest('.ac-op'); if (d) { ev.preventDefault(); elegir(+d.dataset.i); } });
    inp.parentElement.appendChild(lista);
  };
  if (fuente) inp.addEventListener('input', () => mostrar(fuente(inp.value)));
  if (fuente && opts.alFoco) { inp.addEventListener('focus', () => mostrar(fuente(inp.value, true))); inp.addEventListener('click', () => { if (!lista) mostrar(fuente(inp.value, true)); }); }
  inp.addEventListener('blur', () => setTimeout(cerrar, 150));
  inp.addEventListener('keydown', ev => {
    if (lista && ev.key === 'ArrowDown') { foco = Math.min(foco + 1, ops.length - 1); marcar(); ev.preventDefault(); }
    else if (lista && ev.key === 'ArrowUp') { foco = Math.max(foco - 1, 0); marcar(); ev.preventDefault(); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (lista && foco >= 0) elegir(foco);
      else if (lista && ops.length === 1) elegir(0);
      else if (opts.enter) { cerrar(); opts.enter(); }
    } else if (ev.key === 'Escape') cerrar();
  });
  return { mostrar, cerrar };
}
