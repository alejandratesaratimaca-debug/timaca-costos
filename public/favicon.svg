<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TIMACA · Sistema de Control de Costos & Auditoría (Modelo Estrella) -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07182e"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#133e75"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado Corporativo TIMACA -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Símbolo Central: Monograma Industrial TIMACA (T + M) -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Barra Superior de la "T" -->
    <path d="M 24 40 L 360 40 L 360 110 L 24 110 Z" fill="url(#metalGrad)" rx="12"/>
    
    <!-- Tronco Central de la "T" / Fusión "M" -->
    <path d="M 148 110 L 236 110 L 236 310 L 148 310 Z" fill="url(#metalGrad)" rx="8"/>
    
    <!-- Patas Laterales que forman la "M" de Metalúrgico -->
    <path d="M 40 110 L 116 110 L 116 310 L 40 310 Z" fill="url(#metalGrad)" rx="8"/>
    <path d="M 268 110 L 344 110 L 344 310 L 268 310 Z" fill="url(#metalGrad)" rx="8"/>

    <!-- Barras de Gráficas de Costos / Finanzas (Badge de Control de Gestión) -->
    <rect x="62" y="210" width="32" height="80" rx="6" fill="url(#cyanGrad)"/>
    <rect x="176" y="170" width="32" height="120" rx="6" fill="url(#cyanGrad)"/>
    <rect x="290" y="130" width="32" height="160" rx="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Puntos Indicadores de Auditoría -->
  <circle cx="256" cy="428" r="14" fill="#10b981"/>
</svg>
